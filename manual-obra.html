</style></head><body>
<header class="top">
  <div class="marca" onclick="ir('')"><img src="belfast-isotipo.png" alt=""><div><b>BELFAST</b><small>Manual de obra</small></div></div>
  <div class="ib"><button class="ibtn vid" onclick="ir('buscar')" aria-label="Buscar" id="b-buscar"></button><button class="ibtn vid" onclick="tema()" aria-label="Claro u oscuro" id="b-tema"></button></div>
</header>
<main id="app"></main>
<nav class="bottom" aria-label="Secciones"><div class="in" id="nav"></div></nav>
<script>
let OBRA={};
const API_F='/api/manual-fotos';
window.addEventListener('DOMContentLoaded',()=>fetch(API_F+'?accion=lista',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.fotos){OBRA=d.fotos;pintar()}}).catch(()=>{}));
function bloqueObra(k,s){const ob=OBRA[k]||[];const re=(s.reales||[]).map(u=>({u,fija:1}));const todas=ob.concat(re);
 return `<div class="bloque vid obra">${todas.length?`<h3>${svg('mat')} Fotos de obra Belfast <span class="prog">${todas.length}</span></h3>`:''}
 ${todas.length?`<div class="tira">${todas.map(f=>`<div class="tf"><img src="${f.u}" loading="lazy" onclick="verFoto('${f.u}')" alt="">${f.fija?'':`<button class="tx" title="Quitar" onclick="borrarFoto('${k}','${f.path}')">×</button>`}${f.nota?`<small>${esc(f.nota)}</small>`:''}</div>`).join('')}</div>`:''}
 <label class="chip vid subir"><input type="file" accept="image/*" multiple hidden onchange="subirFotos('${k}',this)">＋ Cargar foto de obra</label>
 <span class="estado" id="est-f"></span></div>`}
function achicar(file){return new Promise((ok,mal)=>{const img=new Image();img.onload=()=>{const m=1600,e=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',.82))};img.onerror=()=>mal(new Error('No se pudo leer la foto'));img.src=URL.createObjectURL(file)})}
async function subirFotos(k,inp){const fs=[...inp.files];if(!fs.length)return;const est=document.getElementById('est-f');
 const nota=prompt('Obra o comentario (opcional):','')||'';
 for(let i=0;i<fs.length;i++){est.textContent='Subiendo '+(i+1)+' de '+fs.length+'…';
  try{const img=await achicar(fs[i]);const r=await fetch(API_F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'subir',k,img,nota})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');OBRA[k]=d.fotos}
  catch(e){est.textContent='No se pudo subir: '+e.message;return}}
 const y=window.scrollY;pintar();window.scrollTo(0,y);const e2=document.getElementById('est-f');if(e2)e2.textContent='Listo, foto cargada.'}
async function borrarFoto(k,path){if(!confirm('¿Quitar esta foto del manual?'))return;
 try{const r=await fetch(API_F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'borrar',k,path})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');if(d.fotos.length)OBRA[k]=d.fotos;else delete OBRA[k];const y=window.scrollY;pintar();window.scrollTo(0,y)}catch(e){alert('No se pudo quitar: '+e.message)}}
</script>
<script>
const M=[{"id": "principios", "t": "Principios Belfast", "ico": "estrella", "d": "Cómo se trabaja en todas las obras, sin excepción.", "s": [{"id": "reglas", "t": "Las reglas de oro", "tags": "manual regla orden calidad plano", "que": "Este manual es la forma única de construir de Belfast. Todas las obras se hacen igual: mismo criterio, misma secuencia, mismos controles. Si algo no está en el manual o el plano dice otra cosa, se consulta a la Dirección de obra antes de ejecutar; nadie resuelve \"a su manera\".", "mat": ["Plano aprobado y vigente (última revisión) en obra", "Este manual en el celular o impreso en la oficina técnica", "Nivel láser, manguera de nivel, plomada, escuadra, cinta, hilo"], "pasos": ["Manda el plano. Si el plano no lo define, manda este manual. Si el manual no lo cubre, se consulta a Dirección de obra por escrito (NEXO) y se espera la respuesta.", "Nada se tapa sin control: antes de hormigonar, revocar, cerrar un contrapiso o una placa, el jefe de obra revisa y saca fotos.", "Cada tarea arranca con el replanteo verificado y termina con su control de calidad firmado.", "Los materiales se usan como dice el fabricante (dosis, tiempos, temperaturas). Si el fabricante dice algo más exigente que este manual, se sigue al fabricante.", "Obra limpia y ordenada todos los días: lo que no se usa, al acopio; los residuos, al volquete.", "Todo cambio respecto del plano se registra en la bitácora de NEXO con foto, antes de ejecutarlo."], "ctrl": ["Plano vigente en obra (no copias viejas)", "Tarea anterior controlada y fotografiada", "Materiales correctos y en buen estado", "Herramientas de medición calibradas (láser verificado)"], "err": ["Ejecutar \"como siempre lo hice\" en vez de como dice el manual", "Tapar instalaciones sin foto ni control", "Cambiar un detalle sin aviso a Dirección de obra", "Usar materiales vencidos, húmedos o mal acopiados"], "ref": "Los valores de este manual son de referencia para vivienda de alta gama en Argentina. El cálculo estructural, el proyecto de instalaciones y las especificaciones del fabricante siempre prevalecen.", "reales": [], "malas": [], "foto": "belfast-obra/ob-01.jpg", "fr": 1}, {"id": "roles", "t": "Quién hace y quién controla", "tags": "roles jefe de obra capataz director control firma", "que": "Cada tarea tiene un responsable de ejecutar y otro de controlar. Nadie controla su propio trabajo.", "mat": [], "pasos": ["Dirección de obra: define, aprueba cambios, libera hormigonados y tapados críticos.", "Jefe de obra: planifica la semana, replantea, controla cada etapa, carga avances, fotos y pedidos en NEXO.", "Capataz: organiza la cuadrilla, ejecuta según manual, avisa con 48 h lo que falta (materiales, definiciones).", "Contratistas (sanitario, eléctrico, gas, etc.): ejecutan con matriculado cuando corresponde y entregan pruebas firmadas.", "Ningún gremio empieza si el anterior no entregó su control aprobado."], "ctrl": ["Responsable de la tarea asignado en NEXO", "Control de la tarea anterior aprobado", "Pedidos de material cargados con anticipación"], "err": ["Empezar una tarea sin que el gremio anterior haya terminado y entregado", "Pedir material el mismo día que se necesita"], "ref": "", "reales": [], "malas": [], "foto": "belfast-obra/ob-05.jpg", "fr": 1}, {"id": "registro", "t": "Fotos y registro en NEXO", "tags": "fotos bitácora registro nexo documentación tapado", "que": "Lo que no está registrado no existe. El registro protege a la obra, al cliente y a Belfast.", "mat": [], "pasos": ["Foto antes de tapar: armaduras antes de hormigonar, cañerías antes de cerrar, impermeabilizaciones antes de cubrir, instalaciones dentro de tabiques.", "Cada foto con referencia: ambiente, eje o nivel, y cinta métrica visible cuando importa la medida.", "Bitácora diaria: qué se hizo, quién, clima, novedades, visitas.", "Pruebas (hidráulicas, eléctricas, estanqueidad, probetas) cargadas con fecha, resultado y firma.", "Cambios y definiciones del estudio o el propietario: siempre por escrito en NEXO."], "ctrl": ["Fotos de todo lo que se tapa", "Bitácora del día cargada", "Pruebas con resultado y firma"], "err": ["Tapar sin foto", "Aceptar cambios de palabra"], "ref": "", "reales": ["manual-reales/planos-obrador.jpg"], "malas": [], "foto": "belfast-obra/ob-07.jpg", "fr": 1}]}, {"id": "obrador", "t": "Obrador, seguridad y acopio", "ico": "casco", "d": "Cerco, obrador, acopio, seguridad e higiene.", "s": [{"id": "cerco", "t": "Cerco y obrador", "tags": "cerco obrador baño vestuario comedor oficina técnica cartel", "que": "La obra Belfast se reconoce por su obrador: cerrado, pintado, ordenado y señalizado. Es la primera imagen para el cliente y el barrio.", "mat": ["Cerco perimetral de placas fenólicas o chapa, pintado (verde Belfast) con postes cada 2,40 m", "Vallado amarillo Belfast para sectores", "Oficina técnica (contenedor) con planos, manual y botiquín", "Baño químico o baño de obra, vestuario y comedor techado", "Matafuegos ABC de 5 kg señalizados", "Cartel de obra reglamentario (profesionales, permisos)"], "pasos": ["Antes de cualquier trabajo: cerco completo, accesos con candado y cartel de obra.", "Ubicar obrador, acopio y volquete fuera de la huella de la casa y sin bloquear accesos ni futuros trabajos.", "Comedor y vestuario con piso firme, techados y limpios. Agua potable disponible.", "Tablero de obra con disyuntor diferencial y puesta a tierra, cables aéreos o protegidos.", "Matafuegos en obrador, tablero y sectores con soldadura o membranas."], "ctrl": ["Cerco cerrado y sin huecos", "Cartel de obra colocado", "Tablero con diferencial probado (botón de test)", "Matafuegos con carga vigente", "Botiquín completo"], "err": ["Cables por el piso o empalmes con cinta", "Obrador ubicado donde después molesta", "Comida en sectores de trabajo"], "ref": "Ley 19.587 de Higiene y Seguridad y Decreto 911/96 (construcción). Reglamento del barrio privado.", "reales": ["manual-reales/obrador-aire.jpg"], "malas": [], "foto": "belfast-obra/ob-13.jpg", "fr": 1}, {"id": "acopio", "t": "Acopio de materiales", "tags": "acopio cemento cal hierro ladrillos arena pallets", "que": "Un material mal acopiado es material perdido. Todo se guarda sobre tarimas, protegido y ordenado por tipo.", "mat": ["Pallets o tarimas", "Nylon/lona para cubrir", "Caballetes para hierros (amarillo Belfast)", "Bolsones para áridos"], "pasos": ["Cemento y cal: bajo techo, sobre pallets, separados del piso y de la pared, en pilas de hasta 10 bolsas. Primero en entrar, primero en salir.", "Hierros: sobre caballetes, separados del suelo, ordenados por diámetro y con etiqueta. Nunca en contacto con tierra.", "Ladrillos y bloques: en pallets, cubiertos con nylon; no mojarlos de más.", "Arena y piedra: en bolsones o boxes con base firme, sin mezclar con tierra.", "Adhesivos, pastinas, pinturas y químicos: bajo techo, con su ficha técnica a mano, protegidos del sol y la helada.", "Placas, perfiles, aberturas y porcelanatos: bajo techo, apoyados planos o en caballetes según fabricante."], "ctrl": ["Cemento sin grumos ni bolsas rotas", "Hierros sin óxido suelto ni barro", "Áridos limpios y separados", "Fechas de vencimiento visibles"], "err": ["Bolsas de cemento sobre el piso o a la intemperie", "Hierros en el barro", "Arena contaminada con tierra o restos"], "ref": "", "reales": [], "malas": [], "foto": "belfast-obra/ob-11.jpg", "fr": 1}, {"id": "seguridad", "t": "Seguridad en obra", "tags": "seguridad epp casco arnés andamio excavación", "que": "Ningún avance justifica un accidente. Si una tarea no es segura, se para.", "mat": ["EPP: casco, calzado de seguridad, guantes, anteojos, protector auditivo, chaleco Belfast", "Arnés con línea de vida para trabajos en altura (más de 2 m)", "Andamios certificados con barandas, rodapié y plataforma completa"], "pasos": ["Charla de seguridad de 5 minutos cada lunes y al empezar tareas nuevas.", "Excavaciones de más de 1,20 m: taludes o apuntalamiento, nadie trabaja solo dentro de la zanja.", "Bordes de losa y aberturas en piso: baranda o tapa firme y señalizada.", "Herramientas eléctricas con enchufe y cable en buen estado, siempre en tablero con diferencial.", "Orden y limpieza al final de cada día: sin clavos, puntas de hierro ni tablas sueltas."], "ctrl": ["EPP en uso por todo el personal", "Barandas en bordes de losa", "Puntas de hierro protegidas con capuchones", "Andamios armados completos"], "err": ["Trabajar en altura sin arnés", "Hierros de espera sin protección", "Escaleras improvisadas"], "ref": "", "reales": [], "malas": [], "foto": "belfast-obra/ob-12.jpg", "fr": 1}]}, {"id": "replanteo", "t": "Replanteo y niveles", "ico": "nivel", "d": "Punto fijo, ejes, nivel 0,00 y tolerancias.", "s": [{"id": "puntofijo", "t": "Punto fijo y cota de proyecto", "tags": "punto fijo cota nivel 0,00 cero láser terreno vereda", "que": "Todo se mide desde un único punto fijo. Si dos personas usan referencias distintas, la obra sale torcida.", "mat": ["Estaca de hierro hormigonada o marca en elemento existente que no se mueva", "Nivel láser rotativo con trípode y receptor", "Nivel óptico o manguera de nivel para verificar"], "pasos": ["Definir con Dirección de obra la cota ±0,00 (nivel de piso terminado de planta baja) respecto del punto fijo del barrio o del cordón.", "Materializar el punto fijo lejos de la excavación y protegerlo. Dejar uno de respaldo.", "Marcar la cota de referencia (por ejemplo +1,00 sobre el ±0,00) en estacas, caballetes y después en columnas y muros.", "Verificar el láser al inicio de cada jornada contra el punto fijo.", "Todas las cotas del plano (fundación, subsuelo, losas, pisos) se toman desde el ±0,00."], "ctrl": ["Punto fijo protegido y con respaldo", "Cota ±0,00 aprobada por Dirección de obra", "Láser verificado en el día"], "err": ["Medir \"desde el piso\" cuando el piso todavía no está terminado", "Mover el punto fijo", "Usar el nivel de la vereda o del vecino sin aprobación"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/replanteo-puntofijo.jpg", "fr": 0}, {"id": "ejes", "t": "Replanteo de ejes", "tags": "replanteo ejes caballetes hilo escuadra 3-4-5 diagonales", "que": "Los ejes se materializan con caballetes fuera de la zona de excavación, para poder reponer los hilos en cualquier momento.", "mat": ["Caballetes de madera firmes, a 1,50–2 m del borde de excavación", "Clavos en el caballete para cada eje", "Hilo de nylon, plomada, cinta de 30 m"], "pasos": ["Replantear desde las líneas de referencia del lote (amojonamiento y retiros del barrio).", "Marcar los ejes principales y verificar la escuadra con el método 3-4-5 (o múltiplos 6-8-10).", "Controlar diagonales: en rectángulos las dos diagonales deben medir igual.", "Clavar en los caballetes un clavo por eje y numerarlos según el plano.", "Bajar los ejes al terreno con plomada para marcar fundaciones.", "Dirección de obra verifica el replanteo antes de excavar."], "ctrl": ["Diferencia de diagonales ≤ 1 cm en 10 m", "Retiros del barrio verificados", "Ejes numerados como el plano"], "err": ["Caballetes dentro de la excavación", "Replantear sin verificar diagonales", "Medir de a tramos acumulando error (medir siempre desde el origen)"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/replanteo-ejes.jpg", "fr": 0}, {"id": "tolerancias", "t": "Tolerancias de obra", "tags": "tolerancias plomo nivel planeidad desvío milímetros", "que": "Las tolerancias Belfast son las de una obra de alta gama: lo que excede, se corrige antes de seguir.", "mat": [], "pasos": ["Ejes y replanteo: ±5 mm.", "Plomo de columnas y tabiques: 5 mm por piso (3 m), máximo 1 cm en toda la altura.", "Nivel de losas y vigas: ±1 cm respecto de la cota de proyecto.", "Planeidad de mampostería: desvío máximo 5 mm bajo regla de 2 m.", "Planeidad de revoque terminado: 3 mm bajo regla de 2 m. Aristas rectas y a plomo.", "Carpetas y pisos: 2 mm bajo regla de 2 m (porcelanato grande: lo que pida el fabricante).", "Escuadras de ambientes: diferencia de diagonales ≤ 5 mm."], "ctrl": ["Control con regla de aluminio de 2 m", "Plomada o láser para verticales", "Registro del desvío en NEXO si se corrige"], "err": ["Aceptar desvíos \"porque después lo tapa el revoque\""], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/replanteo-tolerancias.jpg", "fr": 0}]}, {"id": "suelos", "t": "Movimiento de suelos", "ico": "pala", "d": "Limpieza, excavación, rellenos y compactación.", "s": [{"id": "estudio", "t": "Estudio de suelos", "tags": "estudio de suelos geotécnico napa tensión admisible", "que": "Ninguna obra arranca sin estudio de suelos. Define el tipo de fundación, la profundidad de apoyo, la napa y cómo tratar los rellenos.", "mat": ["Informe geotécnico firmado (sondeos, perfil, napa, tensión admisible, recomendaciones)"], "pasos": ["Pedir el estudio antes del cálculo estructural.", "Leer las recomendaciones: cota de fundación, suelos a remover, nivel de napa y su variación.", "Si hay subsuelo: confirmar nivel freático máximo esperable y si hace falta depresión de napa.", "Cualquier diferencia entre lo que aparece al excavar y el estudio se informa al calculista antes de seguir."], "ctrl": ["Estudio en obra", "Cota de fundación definida", "Napa conocida"], "err": ["Fundar sobre relleno o suelo orgánico", "Excavar el subsuelo sin conocer la napa"], "ref": "Ley de ejercicio profesional; CIRSOC 201 para fundaciones de hormigón.", "reales": [], "malas": [], "foto": "manual-fotos/suelos-estudio.jpg", "fr": 0}, {"id": "limpieza", "t": "Limpieza y desmonte", "tags": "limpieza desmonte capa vegetal raíces tosca", "que": "Se retira toda la capa vegetal y cualquier suelo orgánico o relleno no controlado bajo la huella de la casa y 1 m alrededor.", "mat": ["Retroexcavadora o minicargadora", "Camiones para retiro"], "pasos": ["Retirar la capa vegetal (normalmente 20 a 40 cm, lo que indique el estudio) y raíces.", "Guardar la tierra negra aparte si se reutiliza en el parque; nunca debajo de la casa.", "Retirar escombros, rellenos viejos y suelos blandos hasta encontrar suelo firme.", "Perfilar el fondo y compactarlo antes de rellenar."], "ctrl": ["Sin raíces ni materia orgánica bajo la huella", "Fondo firme y compactado"], "err": ["Rellenar sobre tierra negra", "Dejar raíces o restos de obra"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/suelos-limpieza.jpg", "fr": 0}, {"id": "excavacion", "t": "Excavación de subsuelo y zanjas", "tags": "excavación subsuelo taludes submuración bombeo napa zanja", "que": "La excavación se hace por etapas, cuidando taludes y medianeras, sin dejar el fondo expuesto al agua.", "mat": ["Máquina adecuada a la profundidad", "Bombas de achique y depresión de napa (well-points) si el estudio lo indica", "Puntales y tablestacas si hay medianeras o taludes inestables"], "pasos": ["Si la napa queda arriba del fondo: deprimirla antes de excavar y mantenerla deprimida hasta que la estructura pese lo suficiente (lo define el calculista).", "Excavar dejando taludes estables o submurando por tramos alternados junto a construcciones vecinas.", "Dejar los últimos 10–20 cm para terminar a mano o con balde de limpieza, para no aflojar el fondo.", "Si llueve, achicar de inmediato; el fondo embarrado se retira y se reemplaza.", "Hormigón de limpieza sobre el fondo apenas se termina cada sector."], "ctrl": ["Fondo a la cota del plano (±2 cm)", "Fondo seco y sin barro", "Taludes estables", "Bombas funcionando y con respaldo"], "err": ["Excavar todo de una vez junto a medianeras", "Dejar el fondo abierto días con lluvia", "Apagar la depresión de napa antes de tiempo (la estructura puede flotar)"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/suelos-excavacion.jpg", "fr": 0}, {"id": "rellenos", "t": "Rellenos y compactación", "tags": "relleno compactación capas tosca suelo cal proctor humedad óptima densidad", "que": "Un relleno mal compactado se asienta y fisura contrapisos, pisos y veredas. Se rellena en capas finas, con humedad correcta y se controla.", "mat": ["Suelo seleccionado o tosca, sin materia orgánica ni escombros", "Suelo-cal si lo indica el estudio (típicamente 3 a 5% de cal)", "Pisón vibrante (canguro) o plancha vibratoria; rodillo en grandes superficies", "Agua para humedecer"], "pasos": ["Rellenar en capas de 15 a 20 cm de espesor suelto (con canguro, 15 cm).", "Llevar cada capa a la humedad óptima: el suelo apretado en la mano forma una bola que no chorrea agua ni se desarma.", "Compactar cada capa con varias pasadas cruzadas hasta que el equipo no deje huella.", "Exigencia: 95% del Proctor (densidad máxima del ensayo de laboratorio) bajo pisos y contrapisos; 98% si es soporte de estructura.", "Controlar con ensayo de densidad en obra (cono de arena) cada 200–300 m² y por capa en sectores críticos.", "Junto a tabiques de subsuelo: compactar con equipo liviano para no dañar la impermeabilización, y solo cuando el tabique ya tiene su protección."], "ctrl": ["Capas de 15–20 cm, nunca más", "Humedad óptima", "Densidad ≥ 95% Proctor (ensayo)", "Superficie final a la cota, sin huellas"], "err": ["Volcar el relleno de una vez y compactar solo arriba", "Compactar suelo seco o embarrado", "Rellenar con escombros o tierra negra"], "ref": "Ensayo Proctor (IRAM/ASTM D698) y densidad in situ por cono de arena (ASTM D1556).", "reales": [], "malas": [], "foto": "manual-fotos/suelos-rellenos.jpg", "fr": 0}]}, {"id": "fundaciones", "t": "Fundaciones y platea", "ico": "platea", "d": "Platea, vigas de fundación, zapatas y pilotes.", "s": [{"id": "platea", "t": "Platea de fundación", "tags": "platea nylon polietileno 200 micrones hormigón de limpieza separadores", "que": "La platea apoya sobre suelo compactado, una barrera de vapor y hormigón de limpieza. Sin esa secuencia la humedad sube por el piso.", "mat": ["Film de polietileno de 200 micrones (mínimo) como barrera de vapor", "Hormigón de limpieza H-8 a H-13, 5 cm", "Separadores plásticos o de mortero (\"galletas\") y caballetes de armadura superior", "Hormigón elaborado según cálculo (H-25/H-30 típico)"], "pasos": ["Terreno compactado y a nivel (ver Rellenos).", "Hormigón de limpieza de 5 cm para tener una base limpia y plana (si el calculista lo indica bajo el film o sobre él, seguir el plano).", "Extender el film de 200 µ con solapes de 20 cm encintados, subiendo por los bordes. Sin roturas; las que haya se parchean.", "Colocar armadura inferior sobre separadores con el recubrimiento del plano; armadura superior sobre caballetes firmes.", "Dejar pases de instalaciones (cloacas, pluviales, agua, eléctricos) con camisa antes de hormigonar. Nada se pica después.", "Dirección de obra libera la armadura (foto) y recién ahí se pide el hormigón.", "Hormigonar de corrido, vibrar, reglear a la cota y curar."], "ctrl": ["Film sano, solapado y encintado", "Recubrimientos medidos en varios puntos", "Pases de instalaciones colocados y fotografiados", "Cota superior marcada con láser"], "err": ["Romper el film caminando sin tablones", "Armadura apoyada en el piso o sobre ladrillos", "Picar la platea después para pasar caños"], "ref": "CIRSOC 201 (estructuras de hormigón). Recubrimientos: los del cálculo.", "reales": [], "malas": [], "foto": "manual-fotos/fundaciones-platea.jpg", "fr": 0}, {"id": "recubrimientos", "t": "Recubrimientos y separadores", "tags": "recubrimiento separadores galletas armadura óxido", "que": "El recubrimiento protege al hierro de la corrosión y del fuego. Lo fija el calculista; acá van valores típicos de referencia.", "mat": ["Separadores plásticos de la medida exacta", "Galletas de mortero con alambre (misma resistencia que el hormigón)"], "pasos": ["Usar siempre separadores del espesor indicado; cada 80–100 cm en ambas direcciones.", "Referencia típica (manda el plano): hormigón colado contra el suelo 5 a 7,5 cm; elementos expuestos a tierra o intemperie 4 a 5 cm; vigas y columnas interiores 3 a 4 cm; losas interiores 2 a 2,5 cm.", "Atar los separadores para que no se muevan al vibrar.", "Revisar recubrimientos justo antes de hormigonar y durante el colado."], "ctrl": ["Separadores en toda la armadura", "Medida verificada con cinta"], "err": ["Usar piedras, ladrillos o maderas como separadores", "Hierros tocando el encofrado"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/fundaciones-recubrimientos.jpg", "fr": 0}, {"id": "vigasfund", "t": "Vigas de fundación, zapatas y pilotes", "tags": "vigas de fundación zapatas pilotes cabezales", "que": "Se ejecutan según el cálculo. Lo crítico es el apoyo, la limpieza del fondo y las esperas de columnas bien ubicadas.", "mat": [], "pasos": ["Fondo de excavación limpio, firme y con hormigón de limpieza.", "Pilotes: verificar profundidad, verticalidad y limpieza del fondo antes de colar; colar sin interrupciones.", "Esperas de columnas atadas y aplomadas con plantilla; verificar ubicación con los ejes antes de hormigonar.", "Descabezar pilotes hasta hormigón sano y dejar las armaduras de anclaje en el cabezal."], "ctrl": ["Ubicación de esperas ±1 cm", "Fondos limpios", "Probetas tomadas"], "err": ["Esperas fuera de eje corregidas doblando el hierro en caliente"], "ref": "", "reales": [], "malas": [], "foto": "belfast-obra/ob-09.jpg", "fr": 1}]}, {"id": "subsuelos", "t": "Subsuelos e impermeabilización enterrada", "ico": "subsuelo", "d": "Tabiques contra tierra, drenaje, pendientes y bombeo.", "s": [{"id": "tabiques", "t": "Tabiques de subsuelo", "tags": "tabiques subsuelo hormigón contra tierra junta hidroexpansiva waterstop protex xypex hidro-swell", "que": "El subsuelo seco empieza en el hormigón: compacto, bien vibrado y con las juntas resueltas. La impermeabilización es la segunda defensa, no la única.", "mat": ["Hormigón H-30 de baja relación agua/cemento con Xypex Admix C-1000 o Protex Hidro (definir con Dirección de obra)", "Protex Hidro-Swell P en juntas de hormigonado, o Junta PVC (waterstop) donde haya más exigencia", "Concretex / Protex Rep para nidos y pasadores; Protex Tap si hay agua corriendo"], "pasos": ["Junta platea-tabique: pegar Protex Hidro-Swell P centrado sobre la platea (con PU 40 C o cemento de contacto), con recubrimiento ≥ 4 cm a cada cara, antes de hormigonar el tabique. Ver capítulo Protex.", "Hormigonar en capas de 40–50 cm, vibrando cada capa; sin caídas libres de más de 1,5 m (usar tubo).", "Tapar los agujeros de pasadores de ambos lados con Concretex.", "Reparar nidos de abeja picando hasta hormigón sano y rellenando con Concretex.", "Pases de caños con camisa y Hidro-Swell P alrededor."], "ctrl": ["Juntas con su sello colocado (foto)", "Sin nidos ni fisuras abiertas", "Pasadores sellados"], "err": ["Hormigón bombeado con agua agregada en obra", "Juntas sin sello", "Dejar los pasadores abiertos"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": ["manual-reales/junta-hidroexpansiva.jpg", "manual-reales/tabique-armadura.jpg"], "malas": [], "foto": "belfast-obra/ob-02.jpg", "fr": 1}, {"id": "impermeab", "t": "Impermeabilización de tabiques que quedan contra tierra", "tags": "impermeabilización tabique subsuelo membrana asfáltica pintura asfáltica geotextil placa drenante tierra protex seal 77", "que": "Todo tabique que después se tapa con tierra se impermeabiliza antes de rellenar. Una vez enterrado no se repara: se hace bien una sola vez. Sistema Belfast: Protex Seal 77 (3 manos) del lado de la tierra, más protección con placa drenante.", "mat": ["Protex Seal 77 (≈ 3 kg/m² en 3 manos) — sistema principal Belfast", "Alternativa: Xypex Concentrado (cristalizante) si el hormigón lleva o no Admix, según Dirección de obra", "Concretex y Protex Tap para reparar antes", "Placa drenante de polietileno nodulado (con geotextil) como protección mecánica", "Geotextil y piedra partida para el drenaje"], "pasos": ["Hormigón limpio, sin rebabas ni desmoldante; pasadores sellados y nidos reparados con Concretex.", "Media caña con mortero de reparación en el encuentro tabique-platea (radio ≥ 5 cm).", "Humedecer el tabique hasta saturar (sin agua superficial).", "Aplicar Protex Seal 77: 3 manos cruzadas, ≈ 1 kg/m² por mano, 6 h mínimo entre manos. Ver capítulo Protex.", "Subir la impermeabilización al menos 15–20 cm por encima del nivel de terreno terminado.", "Curar y esperar 72 h antes de colocar la protección.", "Proteger con placa drenante nodulada (nódulos contra el tabique, geotextil hacia la tierra), fijada solo en el borde superior.", "Recién entonces rellenar en capas, compactando con equipo liviano y sin golpear la protección.", "Si el tabique no se puede trabajar desde afuera (pantallas, medianeras): Seal 77 del lado interior, que aguanta presión negativa."], "ctrl": ["Media caña ejecutada", "3 manos de Seal 77 con foto y fecha de cada una", "Consumo ≈ 3 kg/m²", "Remate por arriba del terreno", "Placa drenante colocada antes de rellenar"], "err": ["Rellenar sin protección mecánica", "Dar 1 o 2 manos", "Aplicar Seal 77 sobre hormigón seco", "Pintar solo con asfalto y dar por impermeabilizado"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": ["manual-reales/revoque-subsuelo.jpg"], "malas": [], "foto": "manual-fotos/subsuelos-impermeab.jpg", "fr": 0}, {"id": "drenaje", "t": "Drenaje perimetral", "tags": "drenaje perimetral caño ranurado geotextil piedra pozo de bombeo napa", "que": "El drenaje saca el agua antes de que empuje contra el tabique. Va al pie del tabique, por fuera, y descarga en un pozo de bombeo o pluvial.", "mat": ["Caño de drenaje ranurado de 110 mm (corrugado o PVC) con media de geotextil", "Piedra partida lavada 10–30 mm", "Geotextil no tejido envolviendo todo el filtro", "Cámaras de inspección en los cambios de dirección"], "pasos": ["Al pie del tabique, por fuera y por debajo del nivel de platea, cama de piedra de 10 cm.", "Colocar el caño ranurado con pendiente continua ≥ 0,5% hacia la cámara de to llaneado hormigón visto", "que": "En subsuelos con riesgo de humedad conviene que el piso sea la misma platea llaneada (o con endurecedor) en vez de contrapiso + cerámico: menos capas, menos juntas y nada que se despegue.", "mat": [], "pasos": ["Cocheras y salas técnicas: platea con pendiente y terminación llaneada mecánica con endurecedor superficial.", "Si el proyecto pide revestimiento (porcelanato) en un subsuelo habitable: impermeabilización bajo carpeta, adhesivo cementicio flexible y juntas de dilatación.", "No usar contrapisos alivianados en subsuelos con riesgo de agua (absorben y pierden resistencia).", "Cualquier piso de subsuelo se decide con Dirección de obra según el uso."], "ctrl": ["Decisión registrada en NEXO"], "err": ["Cerámico sobre contrapiso húmedo (se despega y eflorece)"], "ref": "", "reales": ["manual-reales/contrapiso-subsuelo-1.jpg", "manual-reales/contrapiso-subsuelo-2.jpg"], "malas": [], "foto": "manual-fotos/subsuelos-contrapisosub.jpg", "fr": 0}]}, {"id": "estructura", "t": "Estructura de hormigón armado", "ico": "viga", "d": "Encofrados, armaduras, hormigonado, curado y desencofrado.", "s": [{"id": "encofrados", "t": "Encofrados", "tags": "encofrado fenólico desencofrante puntales apuntalamiento contraflecha estanqueidad", "que": "El encofrado da la forma final. En una obra Belfast el hormigón visto es una terminación: el encofrado tiene que ser limpio, estanco y a plomo.", "mat": ["Placas fenólicas en buen estado (sin hinchazón ni bordes rotos)", "Vigas y puntales metálicos o de madera dura", "Desencofrante adecuado (no gasoil)", "Cinta o burlete para estanqueidad de juntas", "Pasadores con conos"], "pasos": ["Armar sobre base firme: puntales sobre tablones o calzas, nunca sobre tierra floja.", "Aplomar y nivelar con láser; arriostrar en dos direcciones.", "Contraflecha en losas y vigas de luces grandes según el calculista (habitual L/500 a L/300).", "Sellar juntas entre placas para que no escape la lechada (si escapa, aparecen nidos y manchas).", "Aplicar desencofrante en capa fina y pareja antes de colocar las armaduras.", "Revisión del encofrado (cotas, plomos, medidas, firmeza) por el jefe de obra antes de armar."], "ctrl": ["Medidas interiores según plano (±5 mm)", "Plomo y nivel verificados", "Juntas estancas", "Puntales firmes y arriostrados"], "err": ["Placas viejas en hormigón visto", "Desencofrante en exceso o sobre armaduras", "Puntales apoyados en tierra floja"], "ref": "", "reales": [], "malas": [], "foto": "belfast-obra/ob-04.jpg", "fr": 1}, {"id": "armaduras", "t": "Armaduras", "tags": "armaduras hierro estribos empalmes anclaje doblado atado ADN 420", "que": "La armadura se arma tal cual la planilla de doblado. Nada se improvisa: diámetros, separaciones, empalmes y anclajes los fija el calculista.", "mat": ["Acero ADN 420 (barras) y mallas ADM 420, con certificado", "Alambre de atar recocido", "Separadores y caballetes"], "pasos": ["Cortar y doblar en frío según planilla; radios de doblado del reglamento. Nunca calentar el hierro.", "Respetar separaciones de estribos (más cerrados en los extremos de vigas y columnas según plano).", "Empalmes por yuxtaposición con la longitud del plano, alternados; nunca todos en la misma sección.", "Atar todos los cruces en bordes y en forma alternada en el resto; armadura firme que no se mueva al caminar.", "Esperas de columnas y tabiques del piso siguiente, aplomadas y protegidas.", "Control de armaduras con planilla y fotos; Dirección de obra libera el hormigonado."], "ctrl": ["Diámetros y cantidades según planilla", "Estribos cerrados con ganchos a 135°", "Empalmes y anclajes medidos", "Hierro limpio (sin barro, grasa ni óxido suelto)"], "err": ["Doblar hierros con calor", "Cambiar diámetros sin aviso", "Empalmar todos los hierros en el mismo lugar"], "ref": "CIRSOC 201. Acero IRAM-IAS U500-528 (barras) y U500-06 (mallas).", "reales": ["manual-reales/tabique-armadura.jpg"], "malas": [], "foto": "belfast-obra/ob-08.jpg", "fr": 1}, {"id": "hormigonado", "t": "Hormigonado", "tags": "hormigonado hormigón elaborado asentamiento vibrado juntas probetas bomba", "que": "Hormigonar es una operación planificada: hormigón pedido con tiempo, equipo listo, cuadrilla completa y sin agregar agua en obra.", "mat": ["Hormigón elaborado con la resistencia del plano (H-25/H-30) y asentamiento acordado", "Vibradores de inmersión (uno de respaldo)", "Moldes de probetas", "Reglas, fratachos, llana mecánica si corresponde"], "pasos": ["Verificar remito: resistencia, asentamiento, tamaño de árido y hora de carga (descargar antes de 90 minutos desde la carga).", "Medir asentamiento con cono de Abrams al llegar; si no cumple, se rechaza. No agregar agua en obra.", "Colar en capas de 30–50 cm; vibrar cada capa introduciendo el vibrador vertical cada 40–50 cm, sin tocar armaduras ni encofrado, hasta que deje de salir aire.", "No dejar caer el hormigón desde más de 1,5 m.", "Juntas de hormigonado solo donde lo indica el calculista; antes de continuar, picar, limpiar y humedecer la junta.", "Probetas: mínimo un juego (2–3 probetas) por cada camión o cada 30 m³, identificadas por elemento.", "No hormigonar con lluvia fuerte, helada prevista o calor extremo sin medidas especiales."], "ctrl": ["Remito y asentamiento registrados", "Vibrado completo", "Probetas moldeadas e identificadas", "Juntas en los lugares previstos"], "err": ["Agregar agua al mixer", "Vibrar arrastrando el hormigón con el vibrador", "Hormigonar sin probetas"], "ref": "CIRSOC 201; ensayos IRAM 1546 (asentamiento) e IRAM 1524/1534 (probetas).", "reales": ["manual-reales/hormigonado-losa.jpg", "manual-reales/probetas.jpg"], "malas": [], "foto": "belfast-obra/ob-06.jpg", "fr": 1}, {"id": "calor", "t": "Hormigonado con calor (y con frío)", "tags": "hormigon calor tiempo caluroso temperatura verano evaporacion fisuras plasticas retardador hielo curado frio helada", "que": "Con calor, sol y viento el hormigón pierde agua antes de fraguar: se fisura en la superficie, pierde resistencia y es difícil de terminar. Se planifica el colado para que el hormigón llegue y se coloque fresco, y se cura enseguida.", "mat": ["Hormigón pedido a planta con aditivo retardador de fraguado (indicar en el pedido que es para clima caluroso)", "Agua fría o hielo en planta si hace falta (lo resuelve la hormigonera)", "Fibras plásticas antifisura en losas y contrapisos expuestos, si lo aprueba el calculista", "Antisol (compuesto de curado blanco), arpillera, film de polietileno, aspersores o niebla", "Termómetro de punzón para medir el hormigón del camión"], "pasos": ["Se considera tiempo caluroso cuando hay más de 25–30 °C, sol fuerte, viento o baja humedad. Con pronóstico de 32 °C o más, se reprograma o se cuela de madrugada.", "Horario: empezar a primera hora (6–7 h) o colar de noche con iluminación. Nunca al mediodía.", "Temperatura del hormigón al llegar: medirla en cada camión; máximo 30–32 °C. Si llega más caliente, avisar a planta y a Dirección de obra antes de colocar.", "Tiempo desde la carga en planta hasta terminar la descarga: máximo 90 minutos (con calor, apuntar a 60 minutos). Coordinar los camiones para que no esperen al sol.", "Nunca agregar agua en obra para \"ablandar\" el hormigón. Si falta trabajabilidad, la corrige la planta con aditivo.", "Mojar encofrados, armaduras y base con agua fría antes de colar, sin dejar charcos.", "Cuadrilla y equipos completos (vibradores de reserva) para colocar, vibrar y terminar sin demoras. Pantallas contra el viento si sopla fuerte.", "Entre el enrasado y el fratasado, rociar con niebla fina o cubrir con film si se ve que la superficie se seca (que se pone mate).", "Curado inmediato apenas terminada la superficie: Antisol en una mano pareja, o arpillera mojada y film. Mantener húmedo como mínimo 7 días (losas y tabiques), sin dejar que se seque entre riegos.", "El agua de curado no debe estar mucho más fría que el hormigón (no más de 11 °C de diferencia).", "Con frío: no colar si se esperan menos da 2–3 hiladas (o los que pida el plano).", "Altura máxima por jornada: 1,50 m para que el mortero tome.", "Dejar las canaletas de instalaciones previstas o hacerlas después con amoladora, nunca a maza."], "ctrl": ["Plomo ±5 mm por piso", "Planeidad 5 mm en regla de 2 m", "Juntas parejas y llenas", "Anclajes a columnas colocados"], "err": ["Muros sin traba (juntas verticales alineadas)", "Levantar todo un muro alto en un día", "Canaletas a maza que rompen el muro"], "ref": "", "reales": ["manual-reales/obra-belfast-equipo.jpg", "manual-reales/capa-aisladora-muros.jpg"], "malas": [], "foto": "manual-fotos/mamposteria-muros.jpg", "fr": 0}, {"id": "encadenados", "t": "Encadenados y dinteles", "tags": "encadenado dintel viga de borde riostra vanos", "que": "Los encadenados atan los muros; los dinteles toman la carga sobre los vanos. Van según el plano estructural.", "mat": ["Hormigón H-20 o el del plano", "Armadura según plano (típico 4 Ø 8 con estribos Ø 4,2 c/15–20 cm para encadenados)"], "pasos": ["Encadenado inferior y superior continuo en todo el muro portante.", "Dinteles: apoyo mínimo de 20 cm a cada lado del vano (o lo que indique el plano).", "Columnas de encadenado en esquinas, encuentros y cada 4 m de muro libre si el plano lo indica.", "Vibrar o picar bien el hormigón en secciones chicas."], "ctrl": ["Apoyos de dintel ≥ 20 cm", "Encadenados continuos"], "err": ["Dinteles de ladrillo sin armar en vanos de más de 1 m"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/mamposteria-encadenados.jpg", "fr": 0}, {"id": "canaletas", "t": "Canaletas para instalaciones: reglas y lo que NO se acepta", "tags": "canaletas picado cañerias cajon hidrofugo capa aisladora fajas ceresita mala ejecucion diagonal cruzar pared", "que": "Las canaletas se planifican antes de picar. Un picado mal hecho rompe la capa aisladora, el cajón hidrófugo o las fajas, y genera humedad y fisuras que aparecen meses después. Las fotos de este tema son ejemplos reales de lo que no se hace.", "mat": ["Amoladora con disco diamantado (corte de los dos bordes) y cortafierro solo para vaciar", "Mortero de reparación; Protex 1 o Seal 77 si hay que rehacer el cajón hidrófugo", "Malla soldada para tapar canaletas"], "pasos": ["Nunca picar la capa aisladora ni el cajón hidrófugo para pasar cañerías. Los caños que van por el piso pasan por el contrapiso, por encima de la capa aisladora, y suben por el muro desde ahí.", "Si por excepción hubo que cortar el cajón: avisar a Dirección de obra, rehacer la capa aisladora y el cajón hidrófugo completos en esa zona (con Protex 1 / Seal 77, solapando 20 cm con lo existente) y registrarlo con foto en NEXO antes de tapar. Se controla uno por uno.", "Canaletas siempre rectas: verticales hacia el techo (o hacia el piso) desde la caja o el artefacto. Nunca en diagonal.", "Nunca una cañería cruzando una pared de punta a punta en horizontal. Los recorridos horizontales van por la losa, el cielorraso o el contrapiso; en el muro solo tramos horizontales cortos a la altura de artefactos, según plano.", "Marcar todas las canaletas con tiza o láser y que las apruebe el capataz antes de picar.", "Cortar con amoladora los dos bordes (canaleta prolija del ancho justo), no a maza.", "Si las fajas del revoque ya están hechas, no se pican. Las instalaciones se hacen antes de las fajas; si falta algo, se consulta a Dirección de obra.", "En baños y locales húmedos, el salpicado y las fajas suelen tener hidrófugo (Ceresita): no se pican; si se rompen, se rehace la capa hidrófuga completa en la zona.", "No picar el revoque terminado para agregar cajas o caños; cualquier agregado se aprueba y se repara con el mismo material y malla.", "Caños de desagüe o pluviales a la vista sobre revoque: solo si el proyecto lo indica; si no, van embutidos o en plenos.", "Tapar las canaletas con mortero y malla (15 cm a cada lado), recién con la prueba de la instalación aprobada."], "ctrl": ["Canaletas marcadas y aprobadas antes de picar", "Capa aisladora y cajón hidrófugo sin cortes (foto)", "Todas las canaletas verticales o según plano, sin diagonales", "Ninguna cañería cruzando la pared en horizontal", "Fajas y revoque hidrófugo sin picar", "Si hubo corte del cajón: reparación registrada en NEXO"], "err": ["Picar el cajón hidrófugo o la capa aisladora", "Canaletas en diagonal", "Caños cruzando toda la pared", "Picar fajas o revoque ya hecho", "Picar a maza sin cortar los bordes", "Tapar sin probar la instalación"], "ref": "Criterio de obra Belfast. Fotos: ejemplos reales de mala ejecución en obras.", "reales": [], "malas": ["manual-reales/mal-cajon-picado-1.jpg", "manual-reales/mal-cajon-picado-2.jpg", "manual-reales/mal-sanitaria-faja.jpg", "manual-reales/mal-canaleta-diagonal.jpg", "manual-reales/mal-canaleta-cruza-1.jpg", "manual-reales/mal-canaleta-cruza-2.jpg", "manual-reales/mal-picado-revoque.jpg", "manual-reales/mal-tablero-canaletas.jpg", "manual-reales/mal-canos-sobre-revoque.jpg", "manual-reales/mal-bajada-exterior.jpg"], "foto": "manual-reales/mal-cajon-picado-1.jpg", "fr": 0}]}, {"id": "sanitaria", "t": "Instalación sanitaria", "ico": "gota", "d": "Agua fría y caliente, desagües cloacales y pluviales.", "s": [{"id": "agua", "t": "Agua fría y caliente", "tags": "agua fría caliente termofusión ppr presión prueba hidráulica colector llaves de paso", "que": "Cañerías de polipropileno por termofusión, trazado prolijo, llaves de paso por ambiente y prueba hidráulica antes de tapar.", "mat": ["Caño y accesorios de polipropileno copolímero random (PP-R) para termofusión, de una misma marca", "Termofusora con boquillas en buen estado, a temperatura (≈260 °C)", "Aislación térmica en agua caliente", "Llaves de paso de buena calidad"], "pasos": ["Trazado por paredes en vertical y horizontal (nunca en diagonal), a la altura indicada; respetar 60 cm de separación de cloaca en paralelo con el agua arriba.", "Termofusión: cortar a 90°, limpiar, calentar caño y accesorio el tiempo que indica el fabricante para cad
