<style>
:root{color-scheme:dark;--bg:#0d0e10;--fg:#ece8e1;--muted:#a29d95;--soft:#c9c4bb;--gold:#d8b077;--bf:#E2C200;--rojo:#ff7d70;--verde:#74d394;
--g-a:rgba(255,255,255,.17);--g-b:rgba(255,255,255,.035);--g-c:rgba(255,255,255,.075);--g-rim:rgba(255,255,255,.55);--g-edge:rgba(255,255,255,.26);--g-low:rgba(0,0,0,.22);--g-fx:blur(18px) saturate(1.9);--gl-sh:rgba(0,0,0,.5);--gl-bar:rgba(18,19,23,.74);
--glint:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.17) 41%,rgba(255,255,255,.04) 50%,transparent 58%);

--g-a:rgba(255,255,255,.80);--g-b:rgba(255,255,255,.22);--g-c:rgba(255,255,255,.40);--g-rim:#fff;--g-edge:rgba(255,255,255,.95);--g-low:rgba(60,70,120,.14);--gl-sh:rgba(40,40,70,.18);--gl-bar:rgba(244,245,250,.72);

--amb:radial-gradient(1100px 700px at 12% 8%,rgba(214,175,110,.22),transparent 60%),radial-gradient(1000px 650px at 88% 28%,rgba(120,150,220,.22),transparent 62%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--amb),var(--bg);background-attachment:fixed;color:var(--fg);font:16px/1.55 "Playfair Display",Georgia,serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
.vid{background:var(--glint),linear-gradient(158deg,var(--g-a) 0%,var(--g-b) 42%,var(--g-c) 100%);-webkit-backdrop-filter:var(--g-fx);backdrop-filter:var(--g-fx);box-shadow:inset 0 2px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge),inset 0 -12px 22px var(--g-low),0 14px 28px -12px var(--gl-sh);border-radius:22px}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,4vw) 12px;background:linear-gradient(158deg,var(--g-a),var(--g-b)),var(--gl-bar);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 -1px 0 var(--g-edge),0 14px 30px -18px var(--gl-sh)}
.marca{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.marca img{width:34px;height:34px;object-fit:contain}
:root[data-tema="claro"] .marca img{filter:invert(1)}
.marca b{display:block;letter-spacing:.22em;font-size:15px;font-weight:700}
.marca small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:1180px;margin:0 auto;padding:18px max(16px,4vw)}

.sub{color:var(--soft);margin:0 0 18px;max-width:760px}

.sug{display:flex;gap:8px;flex-wrap:wrap;margin:-10px 0 22px}

.cap{padding:18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;border:0;text-align:left;width:100%;transition:transform .15s}

.cap span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}

.num{font-size:12px;color:var(--muted)}

.lista{display:flex;flex-direction:column;gap:10px}

.fila b{display:block;font-size:16.5px}.fila span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.fila .go{margin-left:auto;color:var(--gold);flex-shrink:0}.fila .go svg{width:18px;height:18px}
.fila .n{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(216,176,119,.55)}
.bloque{padding:20px 22px;margin-bottom:14px}
.bloque h3{margin:0 0 10px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:9px}

.que{font-size:18px;line-height:1.55}
.mat{display:flex;flex-wrap:wrap;gap:8px}.mat span{font-size:14px;padding:7px 13px;border-radius:14px;background:linear-gradient(158deg,var(--g-b),var(--g-c));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.3),inset 0 0 0 1px var(--g-edge)}
ol.pasos{list-style:none;margin:0;padding:0;counter-reset:p}
ol.pasos li{counter-increment:p;position:relative;padding:10px 0 10px 46px;border-top:1px solid rgba(127,127,127,.18)}
ol.pasos li:first-child{border-top:0}
ol.pasos li:before{content:counter(p);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#2a1c05;background:linear-gradient(180deg,rgba(244,218,160,.95),rgba(199,156,85,.8));box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8)}

.ctrl .prog{font-size:13px;color:var(--muted);margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}

.bloque.mal{background:var(--glint),linear-gradient(158deg,rgba(255,125,112,.22),rgba(255,125,112,.04) 50%,var(--g-c));box-shadow:inset 0 2px 1px var(--g-rim),inset 0 0 0 1px rgba(255,125,112,.45),0 14px 28px -12px var(--gl-sh)}
.bloque.mal h3{color:var(--rojo)}
.ref{font-size:14px;color:var(--muted)}
.acc{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.res mark{background:rgba(226,194,0,.35);color:inherit;border-radius:3px;padding:0 2px}
.vacio{color:var(--muted);text-align:center;padding:30px 10px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none;display:flex;justify-content:center}
nav.bottom .in{pointer-events:auto;width:100%;max-width:820px;display:flex;gap:2px;padding:6px;border-radius:999px;background:linear-gradient(158deg,var(--g-a),var(--g-b)),var(--gl-bar);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1.5px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge),0 14px 30px -10px var(--gl-sh)}
nav.bottom button{flex:1;border:0;background:none;padding:7px 2px 6px;border-radius:999px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg);cursor:pointer;min-width:0}

nav.bottom button[aria-current=page]{color:var(--gold);background:var(--glint),linear-gradient(158deg,var(--g-a) 0%,var(--g-b) 42%,var(--g-c) 100%);box-shadow:inset 0 2px 1px var(--g-rim),inset 0 0 0 1px var(--g-edge),inset 0 -12px 22px var(--g-low),0 0 18px -6px rgba(255,255,255,.25),0 14px 28px -12px var(--gl-sh)}
nav.bottom button[aria-current=page] .o{display:none}nav.bottom button[aria-current=page] .l{display:block}
.pie{color:var(--muted);font-size:12.5px;margin:26px 0 0;line-height:1.5}
@media (max-width:620px){.grid{grid-template-columns:1fr}.bloque{padding:18px}.que{font-size:17px}.cap{padding:16px}}
@media print{header.top,nav.bottom,.acc,.volver,.busca{display:none!important}body{background:#fff!important;color:#000;padding:0}.vid,.bloque{box-shadow:none!important;background:none!important;border:1px solid #ccc}.bloque h3{color:#7a5a20}}

<script>
const M=[{"id": "principios", "t": "Principios Belfast", "ico": "estrella", "d": "Cómo se trabaja en todas las obras, sin excepción.", "s": [{"id": "reglas", "t": "Las reglas de oro", "tags": "manual regla orden calidad plano", "que": "Este manual es la forma única de construir de Belfast. Todas las obras se hacen igual: mismo criterio, misma secuencia, mismos controles. Si algo no está en el manual o el plano dice otra cosa, se consulta a la Dirección de obra antes de ejecutar; nadie resuelve \"a su manera\".", "mat": ["Plano aprobado y vigente (última revisión) en obra", "Este manual en el celular o impreso en la oficina técnica", "Nivel láser, manguera de nivel, plomada, escuadra, cinta, hilo"], "pasos": ["Manda el plano. Si el plano no lo define, manda este manual. Si el manual no lo cubre, se consulta a Dirección de obra por escrito (NEXO) y se espera la respuesta.", "Nada se tapa sin control: antes de hormigonar, revocar, cerrar un contrapiso o una placa, el jefe de obra revisa y saca fotos.", "Cada tarea arranca con el replanteo verificado y termina con su control de calidad firmado.", "Los materiales se usan como dice el fabricante (dosis, tiempos, temperaturas). Si el fabricante dice algo más exigente que este manual, se sigue al fabricante.", "Obra limpia y ordenada todos los días: lo que no se usa, al acopio; los residuos, al volquete.", "Todo cambio respecto del plano se registra en la bitácora de NEXO con foto, antes de ejecutarlo."], "ctrl": ["Plano vigente en obra (no copias viejas)", "Tarea anterior controlada y fotografiada", "Materiales correctos y en buen estado", "Herramientas de medición calibradas (láser verificado)"], "err": ["Ejecutar \"como siempre lo hice\" en vez de como dice el manual", "Tapar instalaciones sin foto ni control", "Cambiar un detalle sin aviso a Dirección de obra", "Usar materiales vencidos, húmedos o mal acopiados"], "ref": "Los valores de este manual son de referencia para vivienda de alta gama en Argentina. El cálculo estructural, el proyecto de instalaciones y las especificaciones del fabricante siempre prevalecen."}, {"id": "roles", "t": "Quién hace y quién controla", "tags": "roles jefe de obra capataz director control firma", "que": "Cada tarea tiene un responsable de ejecutar y otro de controlar. Nadie controla su propio trabajo.", "mat": [], "pasos": ["Dirección de obra: define, aprueba cambios, libera hormigonados y tapados críticos.", "Jefe de obra: planifica la semana, replantea, controla cada etapa, carga avances, fotos y pedidos en NEXO.", "Capataz: organiza la cuadrilla, ejecuta según manual, avisa con 48 h lo que falta (materiales, definiciones).", "Contratistas (sanitario, eléctrico, gas, etc.): ejecutan con matriculado cuando corresponde y entregan pruebas firmadas.", "Ningún gremio empieza si el anterior no entregó su control aprobado."], "ctrl": ["Responsable de la tarea asignado en NEXO", "Control de la tarea anterior aprobado", "Pedidos de material cargados con anticipación"], "err": ["Empezar una tarea sin que el gremio anterior haya terminado y entregado", "Pedir material el mismo día que se necesita"], "ref": ""}, {"id": "registro", "t": "Fotos y registro en NEXO", "tags": "fotos bitácora registro nexo documentación tapado", "que": "Lo que no está registrado no existe. El registro protege a la obra, al cliente y a Belfast.", "mat": [], "pasos": ["Foto antes de tapar: armaduras antes de hormigonar, cañerías antes de cerrar, impermeabilizaciones antes de cubrir, instalaciones dentro de tabiques.", "Cada foto con referencia: ambiente, eje o nivel, y cinta métrica visible cuando importa la medida.", "Bitácora diaria: qué se hizo, quién, clima, novedades, visitas.", "Pruebas (hidráulicas, eléctricas, estanqueidad, probetas) cargadas con fecha, resultado y firma.", "Cambios y definiciones del estudio o el propietario: siempre por escrito en NEXO."], "ctrl": ["Fotos de todo lo que se tapa", "Bitácora del día cargada", "Pruebas con resultado y firma"], "err": ["Tapar sin foto", "Aceptar cambios de palabra"], "ref": ""}]}, {"id": "obrador", "t": "Obrador, seguridad y acopio", "ico": "casco", "d": "Cerco, obrador, acopio, seguridad e higiene.", "s": [{"id": "cerco", "t": "Cerco y obrador", "tags": "cerco obrador baño vestuario comedor oficina técnica cartel", "que": "La obra Belfast se reconoce por su obrador: cerrado, pintado, ordenado y señalizado. Es la primera imagen para el cliente y el barrio.", "mat": ["Cerco perimetral de placas fenólicas o chapa, pintado (verde Belfast) con postes cada 2,40 m", "Vallado amarillo Belfast para sectores", "Oficina técnica (contenedor) con planos, manual y botiquín", "Baño químico o baño de obra, vestuario y comedor techado", "Matafuegos ABC de 5 kg señalizados", "Cartel de obra reglamentario (profesionales, permisos)"], "pasos": ["Antes de cualquier trabajo: cerco completo, accesos con candado y cartel de obra.", "Ubicar obrador, acopio y volquete fuera de la huella de la casa y sin bloquear accesos ni futuros trabajos.", "Comedor y vestuario con piso firme, techados y limpios. Agua potable disponible.", "Tablero de obra con disyuntor diferencial y puesta a tierra, cables aéreos o protegidos.", "Matafuegos en obrador, tablero y sectores con soldadura o membranas."], "ctrl": ["Cerco cerrado y sin huecos", "Cartel de obra colocado", "Tablero con diferencial probado (botón de test)", "Matafuegos con carga vigente", "Botiquín completo"], "err": ["Cables por el piso o empalmes con cinta", "Obrador ubicado donde después molesta", "Comida en sectores de trabajo"], "ref": "Ley 19.587 de Higiene y Seguridad y Decreto 911/96 (construcción). Reglamento del barrio privado."}, {"id": "acopio", "t": "Acopio de materiales", "tags": "acopio cemento cal hierro ladrillos arena pallets", "que": "Un material mal acopiado es material perdido. Todo se guarda sobre tarimas, protegido y ordenado por tipo.", "mat": ["Pallets o tarimas", "Nylon/lona para cubrir", "Caballetes para hierros (amarillo Belfast)", "Bolsones para áridos"], "pasos": ["Cemento y cal: bajo techo, sobre pallets, separados del piso y de la pared, en pilas de hasta 10 bolsas. Primero en entrar, primero en salir.", "Hierros: sobre caballetes, separados del suelo, ordenados por diámetro y con etiqueta. Nunca en contacto con tierra.", "Ladrillos y bloques: en pallets, cubiertos con nylon; no mojarlos de más.", "Arena y piedra: en bolsones o boxes con base firme, sin mezclar con tierra.", "Adhesivos, pastinas, pinturas y químicos: bajo techo, con su ficha técnica a mano, protegidos del sol y la helada.", "Placas, perfiles, aberturas y porcelanatos: bajo techo, apoyados planos o en caballetes según fabricante."], "ctrl": ["Cemento sin grumos ni bolsas rotas", "Hierros sin óxido suelto ni barro", "Áridos limpios y separados", "Fechas de vencimiento visibles"], "err": ["Bolsas de cemento sobre el piso o a la intemperie", "Hierros en el barro", "Arena contaminada con tierra o restos"], "ref": ""}, {"id": "seguridad", "t": "Seguridad en obra", "tags": "seguridad epp casco arnés andamio excavación", "que": "Ningún avance justifica un accidente. Si una tarea no es segura, se para.", "mat": ["EPP: casco, calzado de seguridad, guantes, anteojos, protector auditivo, chaleco Belfast", "Arnés con línea de vida para trabajos en altura (más de 2 m)", "Andamios certificados con barandas, rodapié y plataforma completa"], "pasos": ["Charla de seguridad de 5 minutos cada lunes y al empezar tareas nuevas.", "Excavaciones de más de 1,20 m: taludes o apuntalamiento, nadie trabaja solo dentro de la zanja.", "Bordes de losa y aberturas en piso: baranda o tapa firme y señalizada.", "Herramientas eléctricas con enchufe y cable en buen estado, siempre en tablero con diferencial.", "Orden y limpieza al final de cada día: sin clavos, puntas de hierro ni tablas sueltas."], "ctrl": ["EPP en uso por todo el personal", "Barandas en bordes de losa", "Puntas de hierro protegidas con capuchones", "Andamios armados completos"], "err": ["Trabajar en altura sin arnés", "Hierros de espera sin protección", "Escaleras improvisadas"], "ref": ""}]}, {"id": "replanteo", "t": "Replanteo y niveles", "ico": "nivel", "d": "Punto fijo, ejes, nivel 0,00 y tolerancias.", "s": [{"id": "puntofijo", "t": "Punto fijo y cota de proyecto", "tags": "punto fijo cota nivel 0,00 cero láser terreno vereda", "que": "Todo se mide desde un único punto fijo. Si dos personas usan referencias distintas, la obra sale torcida.", "mat": ["Estaca de hierro hormigonada o marca en elemento existente que no se mueva", "Nivel láser rotativo con trípode y receptor", "Nivel óptico o manguera de nivel para verificar"], "pasos": ["Definir con Dirección de obra la cota ±0,00 (nivel de piso terminado de planta baja) respecto del punto fijo del barrio o del cordón.", "Materializar el punto fijo lejos de la excavación y protegerlo. Dejar uno de respaldo.", "Marcar la cota de referencia (por ejemplo +1,00 sobre el ±0,00) en estacas, caballetes y después en columnas y muros.", "Verificar el láser al inicio de cada jornada contra el punto fijo.", "Todas las cotas del plano (fundación, subsuelo, losas, pisos) se toman desde el ±0,00."], "ctrl": ["Punto fijo protegido y con respaldo", "Cota ±0,00 aprobada por Dirección de obra", "Láser verificado en el día"], "err": ["Medir \"desde el piso\" cuando el piso todavía no está terminado", "Mover el punto fijo", "Usar el nivel de la vereda o del vecino sin aprobación"], "ref": ""}, {"id": "ejes", "t": "Replanteo de ejes", "tags": "replanteo ejes caballetes hilo escuadra 3-4-5 diagonales", "que": "Los ejes se materializan con caballetes fuera de la zona de excavación, para poder reponer los hilos en cualquier momento.", "mat": ["Caballetes de madera firmes, a 1,50–2 m del borde de excavación", "Clavos en el caballete para cada eje", "Hilo de nylon, plomada, cinta de 30 m"], "pasos": ["Replantear desde las líneas de referencia del lote (amojonamiento y retiros del barrio).", "Marcar los ejes principales y verificar la escuadra con el método 3-4-5 (o múltiplos 6-8-10).", "Controlar diagonales: en rectángulos las dos diagonales deben medir igual.", "Clavar en los caballetes un clavo por eje y numerarlos según el plano.", "Bajar los ejes al terreno con plomada para marcar fundaciones.", "Dirección de obra verifica el replanteo antes de excavar."], "ctrl": ["Diferencia de diagonales ≤ 1 cm en 10 m", "Retiros del barrio verificados", "Ejes numerados como el plano"], "err": ["Caballetes dentro de la excavación", "Replantear sin verificar diagonales", "Medir de a tramos acumulando error (medir siempre desde el origen)"], "ref": ""}, {"id": "tolerancias", "t": "Tolerancias de obra", "tags": "tolerancias plomo nivel planeidad desvío milímetros", "que": "Las tolerancias Belfast son las de una obra de alta gama: lo que excede, se corrige antes de seguir.", "mat": [], "pasos": ["Ejes y replanteo: ±5 mm.", "Plomo de columnas y tabiques: 5 mm por piso (3 m), máximo 1 cm en toda la altura.", "Nivel de losas y vigas: ±1 cm respecto de la cota de proyecto.", "Planeidad de mampostería: desvío máximo 5 mm bajo regla de 2 m.", "Planeidad de revoque terminado: 3 mm bajo regla de 2 m. Aristas rectas y a plomo.", "Carpetas y pisos: 2 mm bajo regla de 2 m (porcelanato grande: lo que pida el fabricante).", "Escuadras de ambientes: diferencia de diagonales ≤ 5 mm."], "ctrl": ["Control con regla de aluminio de 2 m", "Plomada o láser para verticales", "Registro del desvío en NEXO si se corrige"], "err": ["Aceptar desvíos \"porque después lo tapa el revoque\""], "ref": ""}]}, {"id": "suelos", "t": "Movimiento de suelos", "ico": "pala", "d": "Limpieza, excavación, rellenos y compactación.", "s": [{"id": "estudio", "t": "Estudio de suelos", "tags": "estudio de suelos geotécnico napa tensión admisible", "que": "Ninguna obra arranca sin estudio de suelos. Define el tipo de fundación, la profundidad de apoyo, la napa y cómo tratar los rellenos.", "mat": ["Informe geotécnico firmado (sondeos, perfil, napa, tensión admisible, recomendaciones)"], "pasos": ["Pedir el estudio antes del cálculo estructural.", "Leer las recomendaciones: cota de fundación, suelos a remover, nivel de napa y su variación.", "Si hay subsuelo: confirmar nivel freático máximo esperable y si hace falta depresión de napa.", "Cualquier diferencia entre lo que aparece al excavar y el estudio se informa al calculista antes de seguir."], "ctrl": ["Estudio en obra", "Cota de fundación definida", "Napa conocida"], "err": ["Fundar sobre relleno o suelo orgánico", "Excavar el subsuelo sin conocer la napa"], "ref": "Ley de ejercicio profesional; CIRSOC 201 para fundaciones de hormigón."}, {"id": "limpieza", "t": "Limpieza y desmonte", "tags": "limpieza desmonte capa vegetal raíces tosca", "que": "Se retira toda la capa vegetal y cualquier suelo orgánico o relleno no controlado bajo la huella de la casa y 1 m alrededor.", "mat": ["Retroexcavadora o minicargadora", "Camiones para retiro"], "pasos": ["Retirar la capa vegetal (normalmente 20 a 40 cm, lo que indique el estudio) y raíces.", "Guardar la tierra negra aparte si se reutiliza en el parque; nunca debajo de la casa.", "Retirar escombros, rellenos viejos y suelos blandos hasta encontrar suelo firme.", "Perfilar el fondo y compactarlo antes de rellenar."], "ctrl": ["Sin raíces ni materia orgánica bajo la huella", "Fondo firme y compactado"], "err": ["Rellenar sobre tierra negra", "Dejar raíces o restos de obra"], "ref": ""}, {"id": "excavacion", "t": "Excavación de subsuelo y zanjas", "tags": "excavación subsuelo taludes submuración bombeo napa zanja", "que": "La excavación se hace por etapas, cuidando taludes y medianeras, sin dejar el fondo expuesto al agua.", "mat": ["Máquina adecuada a la profundidad", "Bombas de achique y depresión de napa (well-points) si el estudio lo indica", "Puntales y tablestacas si hay medianeras o taludes inestables"], "pasos": ["Si la napa queda arriba del fondo: deprimirla antes de excavar y mantenerla deprimida hasta que la estructura pese lo suficiente (lo define el calculista).", "Excavar dejando taludes estables o submurando por tramos alternados junto a construcciones vecinas.", "Dejar los últimos 10–20 cm para terminar a mano o con balde de limpieza, para no aflojar el fondo.", "Si llueve, achicar de inmediato; el fondo embarrado se retira y se reemplaza.", "Hormigón de limpieza sobre el fondo apenas se termina cada sector."], "ctrl": ["Fondo a la cota del plano (±2 cm)", "Fondo seco y sin barro", "Taludes estables", "Bombas funcionando y con respaldo"], "err": ["Excavar todo de una vez junto a medianeras", "Dejar el fondo abierto días con lluvia", "Apagar la depresión de napa antes de tiempo (la estructura puede flotar)"], "ref": ""}, {"id": "rellenos", "t": "Rellenos y compactación", "tags": "relleno compactación capas tosca suelo cal proctor humedad óptima densidad", "que": "Un relleno mal compactado se asienta y fisura contrapisos, pisos y veredas. Se rellena en capas finas, con humedad correcta y se controla.", "mat": ["Suelo seleccionado o tosca, sin materia orgánica ni escombros", "Suelo-cal si lo indica el estudio (típicamente 3 a 5% de cal)", "Pisón vibrante (canguro) o plancha vibratoria; rodillo en grandes superficies", "Agua para humedecer"], "pasos": ["Rellenar en capas de 15 a 20 cm de espesor suelto (con canguro, 15 cm).", "Llevar cada capa a la humedad óptima: el suelo apretado en la mano forma una bola que no chorrea agua ni se desarma.", "Compactar cada capa con varias pasadas cruzadas hasta que el equipo no deje huella.", "Exigencia: 95% del Proctor (densidad máxima del ensayo de laboratorio) bajo pisos y contrapisos; 98% si es soporte de estructura.", "Controlar con ensayo de densidad en obra (cono de arena) cada 200–300 m² y por capa en sectores críticos.", "Junto a tabiques de subsuelo: compactar con equipo liviano para no dañar la impermeabilización, y solo cuando el tabique ya tiene su protección."], "ctrl": ["Capas de 15–20 cm, nunca más", "Humedad óptima", "Densidad ≥ 95% Proctor (ensayo)", "Superficie final a la cota, sin huellas"], "err": ["Volcar el relleno de una vez y compactar solo arriba", "Compactar suelo seco o embarrado", "Rellenar con escombros o tierra negra"], "ref": "Ensayo Proctor (IRAM/ASTM D698) y densidad in situ por cono de arena (ASTM D1556)."}]}, {"id": "fundaciones", "t": "Fundaciones y platea", "ico": "platea", "d": "Platea, vigas de fundación, zapatas y pilotes.", "s": [{"id": "platea", "t": "Platea de fundación", "tags": "platea nylon polietileno 200 micrones hormigón de limpieza separadores", "que": "La platea apoya sobre suelo compactado, una barrera de vapor y hormigón de limpieza. Sin esa secuencia la humedad sube por el piso.", "mat": ["Film de polietileno de 200 micrones (mínimo) como barrera de vapor", "Hormigón de limpieza H-8 a H-13, 5 cm", "Separadores plásticos o de mortero (\"galletas\") y caballetes de armadura superior", "Hormigón elaborado según cálculo (H-25/H-30 típico)"], "pasos": ["Terreno compactado y a nivel (ver Rellenos).", "Hormigón de limpieza de 5 cm para tener una base limpia y plana (si el calculista lo indica bajo el film o sobre él, seguir el plano).", "Extender el film de 200 µ con solapes de 20 cm encintados, subiendo por los bordes. Sin roturas; las que haya se parchean.", "Colocar armadura inferior sobre separadores con el recubrimiento del plano; armadura superior sobre caballetes firmes.", "Dejar pases de instalaciones (cloacas, pluviales, agua, eléctricos) con camisa antes de hormigonar. Nada se pica después.", "Dirección de obra libera la armadura (foto) y recién ahí se pide el hormigón.", "Hormigonar de corrido, vibrar, reglear a la cota y curar."], "ctrl": ["Film sano, solapado y encintado", "Recubrimientos medidos en varios puntos", "Pases de instalaciones colocados y fotografiados", "Cota superior marcada con láser"], "err": ["Romper el film caminando sin tablones", "Armadura apoyada en el piso o sobre ladrillos", "Picar la platea después para pasar caños"], "ref": "CIRSOC 201 (estructuras de hormigón). Recubrimientos: los del cálculo."}, {"id": "recubrimientos", "t": "Recubrimientos y separadores", "tags": "recubrimiento separadores galletas armadura óxido", "que": "El recubrimiento protege al hierro de la corrosión y del fuego. Lo fija el calculista; acá van valores típicos de referencia.", "mat": ["Separadores plásticos de la medida exacta", "Galletas de mortero con alambre (misma resistencia que el hormigón)"], "pasos": ["Usar siempre separadores del espesor indicado; cada 80–100 cm en ambas direcciones.", "Referencia típica (manda el plano): hormigón colado contra el suelo 5 a 7,5 cm; elementos expuestos a tierra o intemperie 4 a 5 cm; vigas y columnas interiores 3 a 4 cm; losas interiores 2 a 2,5 cm.", "Atar los separadores para que no se muevan al vibrar.", "Revisar recubrimientos justo antes de hormigonar y durante el colado."], "ctrl": ["Separadores en toda la armadura", "Medida verificada con cinta"], "err": ["Usar piedras, ladrillos o maderas como separadores", "Hierros tocando el encofrado"], "ref": ""}, {"id": "vigasfund", "t": "Vigas de fundación, zapatas y pilotes", "tags": "vigas de fundación zapatas pilotes cabezales", "que": "Se ejecutan según el cálculo. Lo crítico es el apoyo, la limpieza del fondo y las esperas de columnas bien ubicadas.", "mat": [], "pasos": ["Fondo de excavación limpio, firme y con hormigón de limpieza.", "Pilotes: verificar profundidad, verticalidad y limpieza del fondo antes de colar; colar sin interrupciones.", "Esperas de columnas atadas y aplomadas con plantilla; verificar ubicación con los ejes antes de hormigonar.", "Descabezar pilotes hasta hormigón sano y dejar las armaduras de anclaje en el cabezal."], "ctrl": ["Ubicación de esperas ±1 cm", "Fondos limpios", "Probetas tomadas"], "err": ["Esperas fuera de eje corregidas doblando el hierro en caliente"], "ref": ""}]}, {"id": "subsuelos", "t": "Subsuelos e impermeabilización enterrada", "ico": "subsuelo", "d": "Tabiques contra tierra, drenaje, pendientes y bombeo.", "s": [{"id": "tabiques", "t": "Tabiques de subsuelo", "tags": "tabiques subsuelo hormigón contra tierra junta hidroexpansiva waterstop", "que": "El subsuelo seco empieza en el hormigón: compacto, bien vibrado y con las juntas resueltas. La impermeabilización es la segunda defensa, no la única.", "mat": ["Hormigón H-30 con baja relación agua/cemento e hidrófugo o cristalizante si lo indica el proyecto", "Cordón hidroexpansivo (bentonita o similar) o waterstop de PVC en juntas de hormigonado", "Pasadores de encofrado con cono y tapón, o sellados con mortero de reparación"], "pasos": ["Junta platea-tabique: colocar el cordón hidroexpansivo o waterstop centrado, antes de hormigonar el tabique.", "Hormigonar en capas de 40–50 cm, vibrando cada capa; sin caídas libres de más de 1,5 m (usar tubo).", "Tapar los agujeros de pasadores de ambos lados con mortero de reparación sin contracción.", "Reparar nidos de abeja picando hasta hormigón sano y rellenando con mortero de reparación.", "Pases de caños con camisa y sello hidroexpansivo alrededor."], "ctrl": ["Juntas con su sello colocado (foto)", "Sin nidos ni fisuras abiertas", "Pasadores sellados"], "err": ["Hormigón bombeado con agua agregada en obra", "Juntas sin sello", "Dejar los pasadores abiertos"], "ref": ""}, {"id": "impermeab", "t": "Impermeabilización de tabiques que quedan contra tierra", "tags": "impermeabilización tabique subsuelo membrana asfáltica pintura asfáltica geotextil placa drenante tierra", "que": "Todo tabique que después se tapa con tierra se impermeabiliza del lado exterior antes de rellenar. Una vez enterrado no se repara: se hace bien una sola vez.", "mat": ["Pintura asfáltica (base solvente) o emulsión asfáltica como imprimación (≈0,5 l/m² en 2 manos)", "Membrana asfáltica para fundaciones de 4 mm con armadura de poliéster, sin aluminio (no queda a la vista)", "Alternativas según proyecto: membrana líquida de poliuretano o poliurea, o cementicio cristalizante", "Placa drenante de polietileno nodulado (con geotextil) como protección mecánica", "Geotextil y piedra partida para el drenaje"], "pasos": ["Hormigón seco, limpio, sin rebabas; redondear con mortero la media caña en el encuentro tabique-platea (radio ≥ 5 cm).", "Imprimar todo el paramento con pintura o emulsión asfáltica y dejar secar según fabricante.", "Colocar la membrana soldada a soplete, de abajo hacia arriba, con solapes de 8–10 cm (15 cm en los extremos de rollo). Doble membrana en la media caña y en esquinas.", "Subir la impermeabilización al menos 15–20 cm por encima del nivel de terreno terminado y rematarla con perfil o babeta.", "Proteger con placa drenante nodulada (nódulos contra el tabique, geotextil hacia la tierra), fijada solo en el borde superior.", "Recién entonces rellenar en capas, compactando con equipo liviano y sin golpear la protección."], "ctrl": ["Media caña ejecutada", "Solapes soldados sin bolsas ni arrugas (foto de todo el paramento)", "Remate superior por arriba del terreno", "Placa drenante colocada antes de rellenar"], "err": ["Rellenar sin protección mecánica (las piedras rompen la membrana)", "Usar membrana con aluminio enterrada", "Cortar la membrana en la media caña", "Pintar solo con asfalto y dar por impermeabilizado"], "ref": "Fichas técnicas del fabricante de la membrana (imprimación, solapes y temperaturas: entre 10 y 30 °C, sin lluvia)."}, {"id": "drenaje", "t": "Drenaje perimetral", "tags": "drenaje perimetral caño ranurado geotextil piedra pozo de bombeo napa", "que": "El drenaje saca el agua antes de que empuje contra el tabique. Va al pie del tabique, por fuera, y descarga en un pozo de bombeo o pluvial.", "mat": ["Caño de drenaje ranurado de 110 mm (corrugado o PVC) con media de geotextil", "Piedra partida lavada 10–30 mm", "Geotextil no tejido envolviendo todo el filtro", "Cámaras de inspección en los cambios de dirección"], "pasos": ["Al pie del tabique, por fuera y por debajo del nivel de platea, cama de piedra de 10 cm.", "Colocar el caño ranurado con pendiente continua ≥ 0,5% hacia la cámara de descarga.", "Envolver caño y piedra (20–30 cm de espesor) con geotextil para que la tierra no lo tape.", "Cámaras de inspección en esquinas y cada 20–25 m; descarga a pozo de bombeo.", "Probar con agua antes de rellenar."], "ctrl": ["Pendiente verificada con nivel", "Geotextil cerrado arriba", "Cámaras accesibles", "Prueba con agua OK"], "err": ["Caño sin geotextil (se tapa en meses)", "Drenaje con contrapendientes", "Descargar el drenaje a la cloaca"], "ref": ""}, {"id": "pisosubsuelo", "t": "Piso y pendientes del subsuelo", "tags": "piso subsuelo pendiente pozo de bombeo rejilla contrapiso cocheras", "que": "El piso del subsuelo lleva pendiente hacia rejillas y un pozo de bombeo, para que cualquier agua (lavado, filtraciones, autos) salga sola.", "mat": ["Pozo de bombeo con 2 bombas sumergibles (una de reserva) con flotante y alarma", "Rejillas lineales o puntuales", "Hormigón para contrapiso o piso de hormigón llaneado"], "pasos": ["Pendiente mínima de 1% (1 cm por metro) hacia las rejillas; en cocheras 1,5–2%.", "Definir en plano la ubicación de rejillas y pozo antes de hormigonar la platea; los desagües quedan embutidos.", "Si el piso final es la platea llaneada, la pendiente se da en la misma platea. Si lleva contrapiso, se arma con pendiente y juntas.", "Pozo de bombeo con ventilación propia, tapa estanca y descarga con válvula de retención al pluvial.", "Probar las bombas (arranque, corte y alarma) antes de entregar."], "ctrl": ["Pendientes verificadas con agua", "2 bombas con alternancia y alarma", "Retención en la descarga"], "err": ["Piso horizontal sin rejillas", "Una sola bomba sin reserva", "Descarga sin válvula de retención (vuelve el agua)"], "ref": ""}, {"id": "contrapisosub", "t": "¿Contrapiso en subsuelo? ¿Con cerámico o sin?", "tags": "contrapiso subsuelo cerámico porcelanato llaneado hormigón visto", "que": "En subsuelos con riesgo de humedad conviene que el piso sea la misma platea llaneada (o con endurecedor) en vez de contrapiso + cerámico: menos capas, menos juntas y nada que se despegue.", "mat": [], "pasos": ["Cocheras y salas técnicas: platea con pendiente y terminación llaneada mecánica con endurecedor superficial.", "Si el proyecto pide revestimiento (porcelanato) en un subsuelo habitable: impermeabilización bajo carpeta, adhesivo cementicio flexible y juntas de dilatación.", "No usar contrapisos alivianados en subsuelos con riesgo de agua (absorben y pierden resistencia).", "Cualquier piso de subsuelo se decide con Dirección de obra según el uso."], "ctrl": ["Decisión registrada en NEXO"], "err": ["Cerámico sobre contrapiso húmedo (se despega y eflorece)"], "ref": ""}]}, {"id": "estructura", "t": "Estructura de hormigón armado", "ico": "viga", "d": "Encofrados, armaduras, hormigonado, curado y desencofrado.", "s": [{"id": "encofrados", "t": "Encofrados", "tags": "encofrado fenólico desencofrante puntales apuntalamiento contraflecha estanqueidad", "que": "El encofrado da la forma final. En una obra Belfast el hormigón visto es una terminación: el encofrado tiene que ser limpio, estanco y a plomo.", "mat": ["Placas fenólicas en buen estado (sin hinchazón ni bordes rotos)", "Vigas y puntales metálicos o de madera dura", "Desencofrante adecuado (no gasoil)", "Cinta o burlete para estanqueidad de juntas", "Pasadores con conos"], "pasos": ["Armar sobre base firme: puntales sobre tablones o calzas, nunca sobre tierra floja.", "Aplomar y nivelar con láser; arriostrar en dos direcciones.", "Contraflecha en losas y vigas de luces grandes según el calculista (habitual L/500 a L/300).", "Sellar juntas entre placas para que no escape la lechada (si escapa, aparecen nidos y manchas).", "Aplicar desencofrante en capa fina y pareja antes de colocar las armaduras.", "Revisión del encofrado (cotas, plomos, medidas, firmeza) por el jefe de obra antes de armar."], "ctrl": ["Medidas interiores según plano (±5 mm)", "Plomo y nivel verificados", "Juntas estancas", "Puntales firmes y arriostrados"], "err": ["Placas viejas en hormigón visto", "Desencofrante en exceso o sobre armaduras", "Puntales apoyados en tierra floja"], "ref": ""}, {"id": "armaduras", "t": "Armaduras", "tags": "armaduras hierro estribos empalmes anclaje doblado atado ADN 420", "que": "La armadura se arma tal cual la planilla de doblado. Nada se improvisa: diámetros, separaciones, empalmes y anclajes los fija el calculista.", "mat": ["Acero ADN 420 (barras) y mallas ADM 420, con certificado", "Alambre de atar recocido", "Separadores y caballetes"], "pasos": ["Cortar y doblar en frío según planilla; radios de doblado del reglamento. Nunca calentar el hierro.", "Respetar separaciones de estribos (más cerrados en los extremos de vigas y columnas según plano).", "Empalmes por yuxtaposición con la longitud del plano, alternados; nunca todos en la misma sección.", "Atar todos los cruces en bordes y en forma alternada en el resto; armadura firme que no se mueva al caminar.", "Esperas de columnas y tabiques del piso siguiente, aplomadas y protegidas.", "Control de armaduras con planilla y fotos; Dirección de obra libera el hormigonado."], "ctrl": ["Diámetros y cantidades según planilla", "Estribos cerrados con ganchos a 135°", "Empalmes y anclajes medidos", "Hierro limpio (sin barro, grasa ni óxido suelto)"], "err": ["Doblar hierros con calor", "Cambiar diámetros sin aviso", "Empalmar todos los hierros en el mismo lugar"], "ref": "CIRSOC 201. Acero IRAM-IAS U500-528 (barras) y U500-06 (mallas)."}, {"id": "hormigonado", "t": "Hormigonado", "tags": "hormigonado hormigón elaborado asentamiento vibrado juntas probetas bomba", "que": "Hormigonar es una operación planificada: hormigón pedido con tiempo, equipo listo, cuadrilla completa y sin agregar agua en obra.", "mat": ["Hormigón elaborado con la resistencia del plano (H-25/H-30) y asentamiento acordado", "Vibradores de inmersión (uno de respaldo)", "Moldes de probetas", "Reglas, fratachos, llana mecánica si corresponde"], "pasos": ["Verificar remito: resistencia, asentamiento, tamaño de árido y hora de carga (descargar antes de 90 minutos desde la carga).", "Medir asentamiento con cono de Abrams al llegar; si no cumple, se rechaza. No agregar agua en obra.", "Colar en capas de 30–50 cm; vibrar cada capa introduciendo el vibrador vertical cada 40–50 cm, sin tocar armaduras ni encofrado, hasta que deje de salir aire.", "No dejar caer el hormigón desde más de 1,5 m.", "Juntas de hormigonado solo donde lo indica el calculista; antes de continuar, picar, limpiar y humedecer la junta.", "Probetas: mínimo un juego (2–3 probetas) por cada camión o cada 30 m³, identificadas por elemento.", "No hormigonar con lluvia fuerte, helada prevista o calor extremo sin medidas especiales."], "ctrl": ["Remito y asentamiento registrados", "Vibrado completo", "Probetas moldeadas e identificadas", "Juntas en los lugares previstos"], "err": ["Agregar agua al mixer", "Vibrar arrastrando el hormigón con el vibrador", "Hormigonar sin probetas"], "ref": "CIRSOC 201; ensayos IRAM 1546 (asentamiento) e IRAM 1524/1534 (probetas)."}, {"id": "curado", "t": "Curado y desencofrado", "tags": "curado desencofrado tiempos losas vigas laterales puntales", "que": "El curado decide la resistencia y las fisuras del hormigón. Se cura siempre, aunque esté nublado.", "mat": ["Agua, arpillera húmeda o film, o membrana de curado", "Puntales de reapuntalamiento"], "pasos": ["Empezar el curado apenas el hormigón lo permite: mantener húmedo como mínimo 7 días (más en tiempo frío o con cementos lentos).", "En calor y viento: proteger del secado desde el primer momento (riesgo de fisuras plásticas).", "Laterales de vigas, columnas y tabiques: se pueden retirar a partir de 2–3 días si no se dañan las aristas.", "Fondos de losas y vigas: no antes de lo que indique el calculista (orientativo 14 a 21 días según luz, temperatura y cemento), dejando puntales de seguridad.", "Nunca cargar una losa recién desencofrada con acopios pesados."], "ctrl": ["Curado registrado día por día", "Desencofrado autorizado por Dirección de obra", "Puntales de seguridad colocados"], "err": ["No curar", "Desencofrar fondos para reutilizar placas antes de tiempo", "Acopiar ladrillos sobre losas jóvenes"], "ref": ""}, {"id": "visto", "t": "Hormigón visto", "tags": "hormigón visto terminación nidos manchas reparación tablas", "que": "El hormigón visto Belfast no se revoca ni se pinta: tiene que salir bien de una vez.", "mat": ["Encofrado de tablas o fenólico según diseño, siempre nuevo o en excelente estado", "Mismo proveedor y dosificación en todo el elemento"], "pasos": ["Modular las placas o tablas según el despiece del plano; los pasadores, en la grilla prevista.", "Chaflanes en aristas si lo pide el diseño.", "Vibrado especialmente cuidadoso junto al encofrado.", "Reparaciones solo con mortero de reparación del mismo tono, aprobadas por Dirección de obra.", "Proteger aristas y superficies hasta el final de la obra."], "ctrl": ["Despiece según plano", "Sin nidos ni manchas", "Aristas protegidas"], "err": ["Usar placas con marcas", "Revocar o pintar para tapar defectos"], "ref": ""}]}, {"id": "mamposteria", "t": "Mampostería", "ico": "ladrillo", "d": "Capa aisladora, ladrillos, trabas, encadenados y dinteles.", "s": [{"id": "capaaisladora", "t": "Capa aisladora horizontal (cajón hidrófugo)", "tags": "capa aisladora horizontal cajón hidrófugo humedad de cimientos", "que": "Corta la humedad que sube del suelo por los muros. Sin capa aisladora continua, aparece humedad en zócalos y revoques.", "mat": ["Mortero de cemento y arena 1:3 con hidrófugo inorgánico (dosis del fabricante, en el agua de amasado)", "Pintura asfáltica opcional sobre la capa"], "pasos": ["Dos capas horizontales: una a 5 cm sobre el nivel del terreno exterior y otra a nivel del contrapiso interior, unidas por dos verticales (cajón).", "Espesor 1,5–2 cm, continua, sin interrupciones en esquinas, vanos de puertas ni encuentros.", "La vertical del cajón se une al azotado hidrófugo del revoque exterior y al del interior hasta el piso.", "Fratasar y dejar fraguar antes de seguir levantando."], "ctrl": ["Continua en todo el perímetro (foto)", "Unida a contrapiso y revoques", "Espesor ≥ 1,5 cm"], "err": ["Cortarla en los vanos de puertas", "Hacerla con mortero común sin hidrófugo", "Taparla con revoque que \"puentea\" la humedad"], "ref": ""}, {"id": "muros", "t": "Levantamiento de muros", "tags": "mampostería ladrillo hueco cerámico común trabas plomo nivel junta mortero", "que": "Muros a plomo, a nivel y trabados. La junta es parte del muro: pareja, llena y del espesor correcto.", "mat": ["Ladrillo cerámico hueco (portante o no, según plano) o ladrillo común", "Mortero de asiento: cemento-cal-arena (típico 1/4:1:4) o mortero predosificado", "Escantillón (regla con hiladas marcadas), hilo, nivel, plomada"], "pasos": ["Mojar los ladrillos comunes antes de colocar (los cerámicos huecos, solo humedecer si hace calor).", "Escantillones en esquinas y a cada lado de los vanos; hilo por cada hilada.", "Juntas horizontales y verticales de 1 a 1,5 cm, llenas.", "Traba: junta vertical desfasada al menos 1/3 del ladrillo; esquinas y encuentros trabados o con anclajes.", "Unión con columnas de hormigón: pelos de hierro o anclajes metálicos cada 2–3 hiladas (o los que pida el plano).", "Altura máxima por jornada: 1,50 m para que el mortero tome.", "Dejar las canaletas de instalaciones previstas o hacerlas después con amoladora, nunca a maza."], "ctrl": ["Plomo ±5 mm por piso", "Planeidad 5 mm en regla de 2 m", "Juntas parejas y llenas", "Anclajes a columnas colocados"], "err": ["Muros sin traba (juntas verticales alineadas)", "Levantar todo un muro alto en un día", "Canaletas a maza que rompen el muro"], "ref": ""}, {"id": "encadenados", "t": "Encadenados y dinteles", "tags": "encadenado dintel viga de borde riostra vanos", "que": "Los encadenados atan los muros; los dinteles toman la carga sobre los vanos. Van según el plano estructural.", "mat": ["Hormigón H-20 o el del plano", "Armadura según plano (típico 4 Ø 8 con estribos Ø 4,2 c/15–20 cm para encadenados)"], "pasos": ["Encadenado inferior y superior continuo en todo el muro portante.", "Dinteles: apoyo mínimo de 20 cm a cada lado del vano (o lo que indique el plano).", "Columnas de encadenado en esquinas, encuentros y cada 4 m de muro libre si el plano lo indica.", "Vibrar o picar bien el hormigón en secciones chicas."], "ctrl": ["Apoyos de dintel ≥ 20 cm", "Encadenados continuos"], "err": ["Dinteles de ladrillo sin armar en vanos de más de 1 m"], "ref": ""}]}, {"id": "sanitaria", "t": "Instalación sanitaria", "ico": "gota", "d": "Agua fría y caliente, desagües cloacales y pluviales.", "s": [{"id": "agua", "t": "Agua fría y caliente", "tags": "agua fría caliente termofusión ppr presión prueba hidráulica colector llaves de paso", "que": "Cañerías de polipropileno por termofusión, trazado prolijo, llaves de paso por ambiente y prueba hidráulica antes de tapar.", "mat": ["Caño y accesorios de polipropileno copolímero random (PP-R) para termofusión, de una misma marca", "Termofusora con boquillas en buen estado, a temperatura (≈260 °C)", "Aislación térmica en agua caliente", "Llaves de paso de buena calidad"], "pasos": ["Trazado por paredes en vertical y horizontal (nunca en diagonal), a la altura indicada; respetar 60 cm de separación de cloaca en paralelo con el agua arriba.", "Termofusión: cortar a 90°, limpiar, calentar caño y accesorio el tiempo que indica el fabricante para cada diámetro, unir sin girar y sostener hasta enfriar.", "Llave de paso general y una por cada baño y cocina.", "Agua caliente aislada y separada de la fría; retorno o recirculación si el proyecto lo indica.", "Prueba hidráulica antes de tapar: con bomba de prueba a la presión que fije el instalador (habitual 1,5 veces la de trabajo, alrededor de 10 kg/cm²) durante 2 horas sin caída; registrar con manómetro y foto.", "Tapar las canaletas recién con la prueba aprobada."], "ctrl": ["Prueba hidráulica aprobada (foto del manómetro)", "Llaves de paso accesibles", "Agua caliente aislada", "Planos conforme a obra con medidas"], "err": ["Mezclar marcas de caño y accesorios", "Termofusionar con boquillas sucias o frías", "Tapar sin prueba"], "ref": "Reglamento de instalaciones sanitarias domiciliarias (guía nacional / prestador local); manual del fabricante."}, {"id": "cloacas", "t": "Desagües cloacales", "tags": "cloaca desagüe pendiente 1:60 1:20 110 cámara de inspección ventilación pileta de patio", "que": "La cloaca funciona por gravedad: pendientes correctas, ventilación y puntos de inspección. Una pendiente mal tomada no se arregla sin romper.", "mat": ["Caño de polipropileno sanitario con junta de doble labio (110, 63, 50, 40 mm)", "Cámaras de inspección de 60 x 60 cm", "Piletas de patio, bocas de acceso y rejillas", "Caño de ventilación hasta los techos"], "pasos": ["Pendientes de la cañería principal de 110 mm: mínima 1:60 (1,7 cm por metro) y máxima 1:20 (5 cm por metro). Habitual 1,5–2%.", "Ramales secundarios (40–63 mm): pendiente ≈1–2%.", "Cámaras de inspección de 60 x 60 cm hasta 1,20 m de profundidad, con revoque impermeable y contratapa; máximo 30 m entre cámaras; la primera a no más de 10 m de la línea municipal.", "Ventilación: el caño de descarga y ventilación sube a los techos; ventilaciones subsidiarias según cálculo.", "Zanja: cama de arena de 10 cm, caño apoyado en toda su longitud y tapada mínima de 40 cm (bajo zonas de tránsito, protegerlo).", "Enchufes: cortar a 90°, biselar, lubricar con el lubricante del fabricante, enchufar hasta el fondo y retirar 1 cm.", "Prueba de estanqueidad con agua (columna de 2 m ≈ 0,2 kg/cm²) durante 2 horas sin pérdidas; repetir a las 24 horas.", "Al pasar por contrapisos o muros, envolver el caño (cartón corrugado) para que se mueva libre."], "ctrl": ["Pendientes medidas en cada tramo (nivel y foto)", "Prueba con agua aprobada", " function tema(){const c=document.documentElement.getAttribute('data-tema')==='claro';if(c)document.documentElement.removeAttribute('data-tema');else document.documentElement.setAttribute('data-tema','claro');lset('manual_tema',c?'oscuro':'claro');try{localStorage.setItem('manual_tema',c?'oscuro':'claro')}catch(e){}pintarTema()}
function pintarTema(){$('#b-tema').innerHTML=svg(document.documentElement.getAttribute('data-tema')==='claro'?'luna':'sol');$('#b-buscar').innerHTML=svg('lupa')}
const SUG=['contrapiso alivianado','pendiente subsuelo','impermeabilización tabiques','compactación','nylon platea','encofrados','niveles','membrana','cloaca pendiente','revoque exterior','porcelanato','puesta a tierra'];
function nav(act){const it=[['','Inicio','inicio'],['capitulos','Capítulos','libro'],['buscar','Buscar','lupa'],['controles','Controles','check'],['guardados','Guardados','marca']];
 $('#nav').innerHTML=it.map(([r,l,i])=>`<button onclick="ir('${r}')" ${act===r?'aria-current="page"':''}><span class="o">${svg(i)}</span><span class="l">${svg(i,true)}</span>${l}</button>`).join('')}
function tarjCap(c){const hechos=c.s.reduce((a,s)=>a+(s.ctrl||[]).filter((x,i)=>CHK[c.id+'/'+s.id+'/'+i]).length,0);
 return `<button class="cap vid" onclick="ir('c/${c.id}')"><div class="ico">${svg(c.ico)}</div><div><b>${esc(c.t)}</b><span>${esc(c.d)}</span><i>${c.s.length} ${c.s.length===1?'tema':'temas'}</i></div></button>`}
function vInicio(){const pr=cap('principios').s[0];
 return `<div class="eti">Así construye Belfast</div><h1>Una sola forma de construir,<br><em>en todas las obras.</em></h1>
 <p class="sub">Este manual es la referencia única de obra: desde el movimiento de suelos hasta la entrega. Si tenés una duda, se consulta acá; si el manual no la cubre, se consulta a Dirección de obra antes de ejecutar.</p>
 <div class="busca vid"><span>${svg('lupa')}</span><input id="q0" placeholder="¿Qué querés consultar? Ej.: contrapiso alivianado" onkeydown="if(event.key==='Enter')ir('buscar/'+encodeURIComponent(this.value))"></div>
 <div class="sug">${SUG.slice(0,8).map(s=>`<button class="chip vid" onclick="ir('buscar/${encodeURIComponent(s)}')">${esc(s)}</button>`).join('')}</div>
 <div class="reglas"><div class="eti">Reglas de oro</div><ol>${pr.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
 <h2>Capítulos</h2><p class="num" style="margin:0 0 12px">${M.length} capítulos · ${total} temas</p>
 <div class="grid">${M.map(tarjCap).join('')}</div>
 <p class="pie">Valores de referencia para vivienda de alta gama en Argentina. El cálculo estructural, los proyectos de instalaciones firmados y las fichas técnicas de los fabricantes siempre prevalecen sobre este manual.</p>`}
function vCaps(){return `<div class="eti">Índice</div><h1>Capítulos</h1><p class="sub">En el orden en que se construye la obra.</p><div class="grid">${M.map(tarjCap).join('')}</div>`}
function vCap(id){const c=cap(id);if(!c)return vInicio();
 return `<button class="volver" onclick="history.length>1?history.back():ir('capitulos')">${svg('atras')} Capítulos</button>
 <div class="eti">Capítulo ${M.indexOf(c)+1}</div><h1>${esc(c.t)}</h1><p class="sub">${esc(c.d)}</p>
 <div class="lista">${c.s.map((s,i)=>`<button class="fila vid" onclick="ir('s/${c.id}/${s.id}')"><div class="n">${i+1}</div><div><b>${esc(s.t)}</b><span>${esc(s.que.length>140?s.que.slice(0,137)+'…':s.que)}</span></div><div class="go">${svg('go')}</div></button>`).join('')}</div>`}
function vSec(cid,sid){const c=cap(cid),s=secc(cid,sid);if(!s)return vCap(cid);const k=cid+'/'+sid,fav=FAV.includes(k);
 const ctrl=(s.ctrl||[]);const hechos=ctrl.filter((x,i)=>CHK[k+'/'+i]).length;const i=c.s.indexOf(s),sig=c.s[i+1],ant=c.s[i-1];
 return `<button class="volver" onclick="ir('c/${c.id}')">${svg('atras')} ${esc(c.t)}</button>
 <div class="eti">${esc(c.t)}</div><h1>${esc(s.t)}</h1>
 <div class="acc"><button class="chip vid" onclick="guardar('${k}')">${fav?'★ Guardado':'☆ Guardar'}</button><button class="chip vid" onclick="window.print()">Imprimir</button><button class="chip vid" onclick="compartir('${k}')">Compartir</button></div>
 <div class="bloque vid"><p class="que" style="margin:0">${esc(s.que)}</p></div>
 ${s.mat&&s.mat.length?`<div class="bloque vid"><h3>${svg('mat')} Materiales y equipos</h3><div class="mat">${s.mat.map(m=>`<span>${esc(m)}</span>`).join('')}</div></div>`:''}
 ${s.pasos&&s.pasos.length?`<div class="bloque vid"><h3>${svg('pasos')} Cómo se hace</h3><ol class="pasos">${s.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>`:''}
 ${ctrl.length?`<div class="bloque vid ctrl"><h3>${svg('check')} Control antes de seguir <span class="prog" id="prog">${hechos} de ${ctrl.length}</span></h3>${ctrl.map((x,j)=>`<label><input type="checkbox" ${CHK[k+'/'+j]?'checked':''} onchange="marcar('${k}',${j},this.checked,${ctrl.length})"><span>${esc(x)}</span></label>`).join('')}</div>`:''}
 ${s.err&&s.err.length?`<div class="bloque mal"><h3>${svg('no')} No se acepta</h3><ul class="err" style="margin:0;padding-left:20px">${s.err.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}
 ${s.ref?`<div class="bloque vid"><h3>${svg('norma')} Normas y referencias</h3><div class="ref">${esc(s.ref)}</div></div>`:''}
 <div class="lista" style="margin-top:6px">${ant?`<button class="fila vid" onclick="ir('s/${c.id}/${ant.id}')"><div class="go" style="margin:0">${svg('atras')}</div><div><span>Anterior</span><b>${esc(ant.t)}</b></div></button>`:''}${sig?`<button class="fila vid" onclick="ir('s/${c.id}/${sig.id}')"><div><span>Siguiente</span><b>${esc(sig.t)}</b></div><div class="go">${svg('go')}</div></button>`:''}</div>`}
function marcar(k,j,v,n){if(v)CHK[k+'/'+j]=1;else delete CHK[k+'/'+j];lset('manual_chk',CHK);let h=0;for(let i=0;i<n;i++)if(CHK[k+'/'+i])h++;const p=$('#prog');if(p)p.textContent=h+' de '+n}
function guardar(k){FAV=FAV.includes(k)?FAV.filter(x=>x!==k):FAV.concat(k);lset('manual_fav',FAV);pintar()}
function compartir(k){const [c,s]=k.split('/');const x=secc(c,s);const url=location.href.split('#')[0]+'#s/'+k;if(navigator.share)navigator.share({title:'Manual Belfast · '+x.t,url}).catch(()=>{});else{try{navigator.clipboard.writeText(url)}catch(e){}alert('Link copiado')}}
function buscar(q){const t=norm(q).split(/\s+/).filter(w=>w.length>1);if(!t.length)return[];const r=[];
 M.forEach(c=>c.s.forEach(s=>{const campos=[[s.t,8],[s.tags,6],[c.t,3],[s.que,2],[(s.mat||[]).join(' '),1],[(s.pasos||[]).join(' '),1],[(s.ctrl||[]).join(' '),1],[(s.err||[]).join(' '),1]];
  let sc=0,ok=true;for(const w of t){let hit=0;for(const [txt,p] of campos){if(norm(txt).includes(w))hit+=p}if(!hit){ok=false;break}sc+=hit}
  if(ok){const todos=[s.que].concat(s.pasos||[],s.ctrl||[],s.err||[],s.mat||[]);let frag=todos.find(x=>t.some(w=>norm(x).includes(w)))||s.que;r.push({c,s,sc,frag})}}));
 return r.sort((a,b)=>b.sc-a.sc)}
function resaltar(txt,q){let h=esc(txt);const t=norm(q).split(/\s+/).filter(w=>w.length>2);const n=norm(h);
 if(!t.length)return h;let out='',i=0;const marcas=[];t.forEach(w=>{let p=0;while((p=n.indexOf(w,p))>-1){marcas.push([p,p+w.length]);p+=w.length}});marcas.sort((a,b)=>a[0]-b[0]);
 for(const [a,b] of marcas){if(a<i)continue;out+=h.slice(i,a)+'<mark>'+h.slice(a,b)+'</mark>';i=b}return out+h.slice(i)}
function vBuscar(q){q=q||'';const r=buscar(q);
 return `<div class="eti">Consulta</div><h1>Buscar en el manual</h1>
 <div class="busca vid"><span>${svg('lupa')}</span><input id="q" value="${esc(q)}" placeholder="Ej.: pendiente de un subsuelo" oninput="clearTimeout(window._t);window._t=setTimeout(()=>{history.replaceState(null,'','#buscar/'+encodeURIComponent(this.value));res(this.value)},160)"></div>
 <div class="sug">${SUG.map(s=>`<button class="chip vid" onclick="ir('buscar/${encodeURIComponent(s)}')">${esc(s)}</button>`).join('')}</div>
 <div id="res" class="lista res">${listaRes(q,r)}</div>`}
function listaRes(q,r){if(!q.trim())return '';if(!r.length)return `<div class="vacio">No encontré nada con “${esc(q)}”. Probá con otra palabra (por ejemplo: contrapiso, membrana, pendiente).<br>Si no está en el manual, consultá a Dirección de obra.</div>`;
 return `<p class="num" style="margin:0">${r.length} resultado${r.length===1?'':'s'}</p>`+r.slice(0,40).map(x=>`<button class="fila vid" onclick="ir('s/${x.c.id}/${x.s.id}')"><div><span style="color:var(--gold);margin:0 0 2px">${esc(x.c.t)}</span><b>${resaltar(x.s.t,q)}</b><span>${resaltar(x.frag.length>190?x.frag.slice(0,187)+'…':x.frag,q)}</span></div><div class="go">${svg('go')}</div></button>`).join('')}
function res(q){const e=$('#res');if(e)e.innerHTML=listaRes(q,buscar(q))}
function vControles(){return `<div class="eti">Calidad</div><h1>Controles por etapa</h1><p class="sub">Lo que se revisa antes de pasar a la tarea siguiente. Las tildes quedan guardadas en este aparato.</p>
 <div class="lista">${M.map(c=>{const tot=c.s.reduce((a,s)=>a+(s.ctrl||[]).length,0);if(!tot)return '';const h=c.s.reduce((a,s)=>a+(s.ctrl||[]).filter((x,i)=>CHK[c.id+'/'+s.id+'/'+i]).length,0);
  return `<button class="fila vid" onclick="ir('c/${c.id}')"><div class="ico" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--gold)">${svg(c.ico)}</div><div><b>${esc(c.t)}</b><span>${h} de ${tot} controles tildados</span></div><div class="go">${svg('go')}</div></button>`}).join('')}</div>
 <div class="acc" style="margin-top:16px"><button class="chip vid" onclick="if(confirm('¿Borrar todas las tildes de este aparato?')){CHK={};lset('manual_chk',CHK);pintar()}">Empezar de cero (nueva obra)</button></div>`}
function vFav(){const l=FAV.map(k=>{const [c,s]=k.split('/');return {c:cap(c),s:secc(c,s)}}).filter(x=>x.s);
 return `<div class="eti">Para tener a mano</div><h1>Guardados</h1>${l.length?`<div class="lista">${l.map(x=>`<button class="fila vid" onclick="ir('s/${x.c.id}/${x.s.id}')"><div><span style="color:var(--gold);margin:0 0 2px">${esc(x.c.t)}</span><b>${esc(x.s.t)}</b></div><div class="go">${svg('go')}</div></button>`).join('')}</div>`:`<div class="vacio">Todavía no guardaste temas. Abrí uno y tocá “☆ Guardar”.</div>`}`}
function pintar(){const h=decodeURIComponent(location.hash.slice(1));const p=h.split('/');let v,act='';
 if(p[0]==='c')v=vCap(p[1]),act='capitulos';else if(p[0]==='s')v=vSec(p[1],p[2]),act='capitulos';else if(p[0]==='buscar')v=vBuscar(p.slice(1).join('/')),act='buscar';
 else if(p[0]==='capitulos')v=vCaps(),act='capitulos';else if(p[0]==='controles')v=vControles(),act='controles';else if(p[0]==='guardados')v=vFav(),act='guardados';else v=vInicio();
 $('#app').innerHTML=v;nav(act);if(p[0]==='buscar'){const i=$('#q');if(i&&!('ontouchstart' in window)){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
let _ultimo='';window.addEventListener('hashchange',()=>{const h=location.hash;const solo=h.startsWith('#buscar')&&_ultimo.startsWith('#buscar')&&document.activeElement&&document.activeElement.id==='q';_ultimo=h;if(!solo){pintar();window.scrollTo(0,0)}});
_ultimo=location.hash;pintarTema();pintar();
</script></body></html>
