éctrica", "ico": "rayo", "d": "Cañerías, cajas, conductores, tablero y puesta a tierra.", "s": [{"id": "canerias", "t": "Cañerías y cajas", "tags": "cañería corrugado caño acero cajas alturas tomas llaves embutido", "que": "La instalación eléctrica la ejecuta un electricista matriculado según la reglamentación AEA. Este capítulo fija el criterio Belfast de obra.", "mat": ["Caño corrugado ignífugo o caño de acero/PVC rígido según proyecto (diámetro mínimo según AEA)", "Cajas rectangulares, octogonales y de paso", "Guía pasacables"], "pasos": ["Proyecto eléctrico firmado por profesional matriculado antes de canalizar.", "Cañerías en trazos verticales y horizontales; nunca en diagonal por los muros. En losas, atadas a la armadura antes de hormigonar.", "Alturas de referencia (confirmar en plano): tomas 30 cm del piso terminado; llaves 1,10 m; tomas sobre mesada 1,20 m; tomas de baño fuera del volumen de la ducha.", "Cajas a plomo y al ras del revoque terminado, alineadas entre sí.", "No compartir cañería entre circuitos de distinta tensión (corrientes débiles, datos y TV van aparte).", "Foto de toda la cañería antes de revocar o cerrar placas."], "ctrl": ["Cajas a nivel y al ras", "Alturas según plano", "Fotos antes de tapar", "Corrientes débiles separadas"], "err": ["Cañerías en diagonal", "Cajas hundidas o torcidas", "Canaletas que cortan columnas o vigas"], "ref": "Reglamentación AEA 90364 (parte 7-770 / 7-771 viviendas).", "reales": ["manual-reales/canaleta-malla.jpg", "manual-reales/canos-piso.jpg"], "malas": ["manual-reales/mal-canaleta-diagonal.jpg", "manual-reales/mal-canaleta-cruza-1.jpg"], "foto": "manual-fotos/electrica-canerias.jpg", "fr": 0}, {"id": "conductores", "t": "Conductores y circuitos", "tags": "conductores cables sección colores fase neutro tierra circuitos", "que": "Cables normalizados, de colores correctos y de la sección que indique el proyecto. Nunca menos de lo reglamentario.", "mat": ["Conductores IRAM NM 247-3 (unipolares) de marca reconocida", "Borneras y conectores normalizados"], "pasos": ["Colores: neutro celeste; protección (tierra) verde-amarillo; fases marrón, negro o rojo.", "Secciones de referencia (las fija el proyecto): circuitos de iluminación 1,5 mm² mínimo; tomacorrientes 2,5 mm² mínimo; conductor de protección acorde al circuito (nunca menor a 2,5 mm²).", "Un circuito por destino según el proyecto (iluminación, tomas generales, tomas especiales, aire acondicionado, etc.).", "Sin empalmes dentro de cañerías; solo en cajas, con borneras.", "Pasar cables con la instalación seca y la cañería limpia."], "ctrl": ["Colores correctos en todo el tendido", "Secciones según proyecto", "Empalmes solo en cajas"], "err": ["Usar el verde-amarillo como fase", "Empalmes con cinta dentro de los caños"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/electrica-conductores.jpg", "fr": 0}, {"id": "tablero", "t": "Tablero y protecciones", "tags": "tablero diferencial disyuntor 30 mA termomagnéticas", "que": "Cada circuito protegido por su termomagnética y la instalación con interruptor diferencial de 30 mA.", "mat": ["Tablero con puerta, barra de tierra y espacio de reserva (≥ 20%)", "Interruptores diferenciales de 30 mA", "Termomagnéticas por circuito según proyecto"], "pasos": ["Ubicar el tablero en lugar accesible, a 1,20–1,60 m del piso, lejos de agua.", "Diferencial de 30 mA protegiendo todos los circuitos de tomas e iluminación.", "Rotular cada termomagnética con su circuito.", "Probar el diferencial con su botón de test y con instrumento.", "Tablero principal y seccionales por planta según proyecto; circuitos de aire acondicionado, caldera, bomba y portón con protección propia.", "Durante la obra, el tablero se protege con nylon y cinta (polvo y revoque) y queda señalizado.", "Cables peinados, con terminales y borneras; nada de empalmes dentro del tablero.", "Esquema unifilar actualizado pegado en la puerta y cargado en NEXO."], "ctrl": ["Tablero rotulado", "Diferencial probado", "Esquema unifilar dentro del tablero", "Unifilar en la puerta", "Tablero protegido durante la obra"], "err": ["Circuitos sin protección", "Tablero sin rótulos ni unifilar"], "ref": "", "reales": ["manual-reales/tablero.jpg"], "malas": [], "foto": "manual-fotos/electrica-tablero.jpg", "fr": 0}, {"id": "pat", "t": "Puesta a tierra", "tags": "puesta a tierra jabalina ohm medición barra de tierra", "que": "La tierra protege a las personas. Se mide y se registra.", "mat": ["Jabalina de acero-cobre IRAM (habitual 1,5 m o más)", "Cámara de inspección de la jabalina", "Conductor de tierra al tablero"], "pasos": ["Hincar la jabalina con cámara de inspección accesible.", "Conectar a la barra de tierra del tablero con conductor verde-amarillo.", "Medir la resistencia con telurímetro: lo exigido por la reglamentación (como máximo 40 Ω con diferencial); en obras Belfast se busca 10 Ω o menos, agregando jabalinas si hace falta.", "Registrar la medición con fecha y firma del matriculado."], "ctrl": ["Medición registrada", "Cámara accesible", "Todas las masas conectadas a tierra"], "err": ["No medir", "Conectar la tierra a la cañería de agua"], "ref": "AEA 90364; protocolo de puesta a tierra (Res. SRT 900/15 en ámbitos laborales).", "reales": [], "malas": [], "foto": "manual-fotos/electrica-pat.jpg", "fr": 0}]}, {"id": "gas", "t": "Instalación de gas", "ico": "llama", "d": "Solo con gasista matriculado y aprobación de la distribuidora.", "s": [{"id": "gasgral", "t": "Criterios de obra para gas", "tags": "gas gasista matriculado ventilaciones epoxi termofusión prueba hermeticidad", "que": "La instalación de gas la proyecta y ejecuta un gasista matriculado, con planos aprobados por la distribuidora. Belfast controla que se respete y que nada la dañe.", "mat": ["Materiales aprobados (caño epoxi con accesorios roscados o sistema de termofusión para gas aprobado)", "Ventilaciones reglamentarias (rejillas y conductos)"], "pasos": ["Planos aprobados antes de canalizar.", "No compartir canaletas con otras instalaciones; respetar separaciones reglamentarias.", "Ventilaciones de ambientes y conductos de evacuación según plano, sin obstruirlas con revestimientos ni cielorrasos.", "Prueba de hermeticidad del gasista antes de tapar; registro con fecha y firma.", "Ningún artefacto se conecta sin habilitación."], "ctrl": ["Planos aprobados en obra", "Prueba de hermeticidad registrada", "Ventilaciones libres"], "err": ["Tapar cañerías sin prueba", "Tapar rejillas de ventilación por estética"], "ref": "Normas NAG-200 (ENARGAS) y reglamento de la distribuidora.", "reales": [], "malas": [], "foto": "manual-fotos/gas-gasgral.jpg", "fr": 0}]}, {"id": "clima", "t": "Climatización y calefacción", "ico": "clima", "d": "Losa radiante, sala de máquinas, aire acondicionado: niveles, espesores y pruebas.", "s": [{"id": "radiante", "t": "Losa radiante: capas, espesores y niveles de piso", "tags": "losa radiante piso radiante calefaccion tubo pert pex aislante malla mortero espesor nivel piso terminado", "que": "La losa radiante se decide en el proyecto, no en obra: suma entre 8 y 10 cm sobre la losa estructural. Si no se reserva esa altura desde el principio, los niveles de piso, umbrales y desagües no cierran.", "mat": ["Aislante: manta o placa de poliestireno de alta densidad (manta de 10 mm en Tubotherm; placas de 20–30 mm en planta baja o sobre locales no calefaccionados)", "Film de polietileno ≥ 60 µ (en planta baja, bajo el aislante contra la humedad; en planta alta, entre aislante y malla)", "Banda perimetral aislante en todos los muros, columnas y marcos (piso flotante)", "Malla tipo Cima 15×15 (o 15×25) para fijar los tubos con precintos", "Tubo PERT o PEX de 16 o 20 mm, de una sola pieza por circuito (sin uniones bajo el piso)", "Mortero de cubrición: 1 cemento : 3 arena (< 4 mm) : 3 canto rodado chico, con el aditivo fluidificante del fabricante", "Colector con caudalímetros, purgadores y llaves por circuito"], "pasos": ["Definir en plano, antes de hormigonar la losa, la altura total del paquete: losa estructural → aislante → film → malla y tubo → mortero → piso. Referencia Belfast: 8 a 10 cm sobre losa hasta piso terminado (confirmar con el instalador según aislante y piso).", "Espesor de mortero sobre el lomo del tubo: mínimo 3,5 a 4 cm (en total ≈ 3 veces el diámetro del tubo). Con más espesor la losa tarda más en calentar; con menos se fisura.", "Losa estructural limpia y nivelada (± 5 mm). Si no, carpeta de regularización antes del aislante.", "Colocar banda perimetral subiendo hasta el nivel de piso terminado; se recorta recién al colocar el zócalo.", "Aislante a tope, sin huecos; film con solapes de 10 cm; malla sobre el film.", "Tubos según plano del instalador: separación 10 a 30 cm (más juntos junto a ventanales y en baños), fijados a la malla cada 50 cm, curvas sin aplastar.", "Juntas de dilatación en paños de más de 40 m² o de lado mayor a 8 m, en puertas y cambios de forma. Ningún circuito cruza una junta; las conexiones que la cruzan llevan vaina de 20 cm a cada lado.", "Primera prueba hidráulica antes de llenar: llenar y purgar, 3 bar; a la hora subir a 3,5 bar; a las 24 h verificar 3 bar durante 1 hora sin pérdidas. Dejar los tubos con agua a 3 bar durante el llenado del mortero.", "Llenar con el mortero del fabricante, sin pisar los tubos (tablones), vibrando o compactando bien alrededor del tubo.", "No pisar 3 días; no encender antes de 21 días; no colocar el piso antes de 30 días.", "Primer encendido gradual: 3 días a 25 °C y después 4 días a la temperatura de diseño. Registrar en NEXO.", "Segunda prueba hidráulica antes de colocar el revestimiento.", "Piso: cerámico, porcelanato o piedra son los mejores. Madera solo apta para radiante, encolada, con humedad de carpeta medida. Temperatura de superficie máx. 27–29 °C en estar, 33 °C en baños."], "ctrl": ["Altura del paquete en plano y en replanteo (nivel 0,00 y nivel de piso terminado marcados en obra)", "Banda perimetral continua", "Foto de cada circuito con su número antes de llenar", "Prueba hidráulica 1 aprobada (manómetro + foto)", "Mortero ≥ 3,5 cm sobre el tubo (medir en 3 puntos por local)", "21 días antes de encender; protocolo de encendido registrado", "Prueba hidráulica 2 antes del piso"], "err": ["Uniones de tubo bajo el piso", "Tubos cruzando juntas sin vaina", "Contrapiso alivianado sobre los tubos", "Encender en seguida para \"secar\" el mortero", "Colocar el piso sin medir humedad", "Clavar o perforar el piso radiante (siempre con plano de tubos a mano)"], "ref": "Manual de instalación del fabricante del sistema radiante (p. ej. Tubotherm/Grupo Dema; REHAU según DIN/UNE-EN 1264). Manda siempre el instalador matriculado y el proyecto térmico.", "reales": ["manual-reales/losa-radiante.jpg"], "malas": [], "foto": "manual-reales/losa-radiante.jpg", "fr": 1}, {"id": "salamaquinas", "t": "Sala de máquinas, caldera y colector", "tags": "sala de maquinas caldera colector radiante termotanque tanque intermediario ventilacion gas equipo", "que": "La caldera y los colectores son el corazón de la calefacción. Se ubican en un lugar accesible, ventilado y con desagüe, nunca encerrados sin acceso.", "mat": ["Caldera (preferentemente de condensación) según cálculo térmico", "Colector por planta, en nicho con tapa a 30–50 cm del piso y centrado respecto de los locales", "Vaso de expansión, válvula de seguridad, purgadores y llaves de corte", "Desagüe de condensado y de válvula de seguridad"], "pasos": ["Ubicación aprobada en plano: espacio de servicio alrededor del equipo según fabricante (habitual 50 cm al frente).", "Caldera a gas: instalación y ventilaciones solo por gasista matriculado y según la distribuidora (ver capítulo Gas). Conducto de evacuación del fabricante, con su pendiente.", "Nicho del colector con espacio para todos los circuitos, rotulados (local y largo de cada uno).", "Desagüe con sifón para condensado y válvula de seguridad; pileta de patio o boca de desagüe en la sala.", "Cañerías de ida y retorno aisladas en todo su recorrido no calefaccionado.", "Tablero o circuito eléctrico exclusivo con protección propia; termostatos por zona cableados antes de cerrar.", "Puesta en marcha por el instalador con planilla de presiones, caudales y temperaturas."], "ctrl": ["Accesos libres al equipo y al colector", "Circuitos rotulados", "Ventilaciones aprobadas por gasista", "Planilla de puesta en marcha en NEXO"], "err": ["Caldera en placard sin ventilación", "Colectores tapados sin acceso", "Válvula de seguridad sin desagüe"], "ref": "Manual de instalación del fabricante del sistema radiante (p. ej. Tubotherm/Grupo Dema; REHAU según DIN/UNE-EN 1264). Manda siempre el instalador matriculado y el proyecto térmico.", "reales": [], "malas": [], "foto": "manual-fotos/clima-salamaquinas.jpg", "fr": 0}, {"id": "aire", "t": "Aire acondicionado: preinstalación y equipos", "tags": "aire acondicionado split cañeria cobre preinstalacion desague condensado vacio nitrogeno unidad exterior soporte", "que": "La preinstalación (caños, desagüe y eléctrico) se hace con la obra gruesa, antes de revocar o cerrar cielorrasos. El equipo se coloca al final, con la obra limpia.", "mat": ["Caño de cobre de refrigeración (diámetros del fabricante del equipo) con aislación de espuma elastomérica en ambos caños", "Desagüe de condensado de PVC o PP ≥ 20 mm con pendiente hacia pileta, embudo o pluvial, con sifón si va a cloaca", "Línea eléctrica exclusiva con su protección (termomagnética y diferencial) y cable de comando", "Ménsulas o base antivibratoria para la unidad exterior; caja de preinstalación en muro"], "pasos": ["Definir en plano posición de unidades interiores (lejos de camas y sillones, sin obstáculos al aire) y exteriores (ventiladas, accesibles para service, sin dar al vecino).", "Pasar caños de cobre con curvas suaves, sin aplastar, con las puntas tapadas (cinta o tapón) para que no entre polvo ni humedad.", "Desagüe de condensado con pendiente continua ≥ 1% (nunca contrapendiente); probar con agua antes de cerrar.", "Cañerías fijadas cada 1 m en recorridos horizontales sobre cielorraso (ver Instalaciones colgadas).", "Prueba de hermeticidad con nitrógeno (presión indicada por el fabricante) y foto del manómetro.", "Al colocar el equipo: vacío con bomba (no \"purgar con el gas del equipo\"), abrir válvulas, verificar carga y presiones.", "Unidad exterior nivelada, con 30 cm libres detrás y a los lados (o lo que pida el manual), fijada con tacos químicos o bulones.", "Registrar marca, modelo, número de serie y ubicación de cada equipo en NEXO."], "ctrl": ["Puntas tapadas hasta la conexión", "Desagüe probado con agua", "Prueba con nitrógeno registrada", "Vacío realizado (foto del vacuómetro)", "Equipos registrados en NEXO"], "err": ["Desagüe con contrapendiente o sin sifón a cloaca", "Caños sin aislación o con aislación rota", "Unidad exterior encerrada sin ventilación", "Conectar sin hacer vacío"], "ref": "Manuales de instalación del fabricante de cada equipo; Reglamento AEA 90364 para la parte eléctrica.", "reales": [], "malas": [], "foto": "manual-fotos/clima-aire.jpg", "fr": 0}]}, {"id": "contrapisos", "t": "Contrapisos y carpetas", "ico": "capas", "d": "Sobre terreno, sobre losa, alivianados, pendientes y juntas.", "s": [{"id": "ctpterreno", "t": "Contrapiso sobre terreno", "tags": "contrapiso sobre terreno film nylon 200 hormigón pobre malla", "que": "El contrapiso sobre terreno necesita base compactada y barrera de humedad. Es el primer escudo contra la humedad del suelo.", "mat": ["Film de polietileno de 200 micrones", "Hormigón pobre H-8 a H-13 (o el de plano), espesor 10–12 cm", "Malla electrosoldada si lo indica el plano"], "pasos": ["Terreno compactado a la cota (ver Rellenos).", "Film de 200 µ con solapes de 20 cm, subiendo en los bordes hasta el nivel del contrapiso y unido a la capa aisladora.", "Juntas perimetrales de 1 cm (poliestireno expandido) contra muros.", "Hormigonar con fajas niveladas con láser; reglear y apisonar.", "Juntas de contracción cada 3–4 m (paños de no más de 16 m²) y en cambios de forma."], "ctrl": ["Film continuo y unido a la capa aisladora", "Espesor ≥ 10 cm", "Nivel según cota (±1 cm)"], "err": ["Contrapiso sin film", "Hormigón sobre terreno flojo"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/contrapisos-ctpterreno.jpg", "fr": 0}, {"id": "alivianado", "t": "Contrapiso alivianado", "tags": "contrapiso alivianado telgopor perlas eps arcilla expandida liviano losa", "que": "Se usa sobre losas cuando hay que dar altura o pendiente sin cargar peso, y como aislación térmica. Siempre lleva carpeta encima.", "mat": ["Isocret (perlas de EPS aditivadas, bolsa de 170 l = 0,20 m³) y cemento — producto Belfast", "Arcilla expandida como alternativa (más resistente, algo más pesada)", "Agua"], "pasos": ["Dosificación Isocret por bolsa de 170 l: 60 kg de cemento y ≈ 30 l de agua (≈ 300 kg/m³), sin arena; seguir lo impreso en la bolsa. Ver también Relleno entre vigas invertidas.", "Espesor mínimo de referencia 5 cm; si tiene que llevar pendientes, se arma con fajas.", "Humedecer la losa y colocar en una sola capa, compactando suavemente (sin apisonar fuerte: se aplasta el EPS).", "Curar 3–7 días húmedo.", "Siempre carpeta cementicia encima (mínimo 3 cm) antes de pisos, porque el alivianado no tiene resistencia superficial.", "No usar en zonas con agua permanente ni en subsuelos con riesgo de filtraciones."], "ctrl": ["Dosificación según ficha técnica", "Carpeta encima", "Pendientes verificadas"], "err": ["Colocar porcelanato directo sobre alivianado", "Agregar arena o agua de más", "Usarlo en subsuelos húmedos"], "ref": "Ficha técnica del fabricante del alivianado.", "reales": [], "malas": [], "foto": "manual-fotos/contrapisos-alivianado.jpg", "fr": 0}, {"id": "invertidas", "t": "Relleno entre vigas invertidas (azotea y losa sobre PB)", "tags": "vigas invertidas relleno cascote isocret perlas eps contrapiso alivianado azotea losa planta baja 20 28 cm peso", "que": "Con vigas invertidas la losa queda abajo y las vigas sobresalen: entre viga y viga quedan cajones de 20 a 28 cm que hay que rellenar hasta el nivel del contrapiso. Ese relleno pesa mucho si se hace mal, así que el material lo aprueba el calculista antes de empezar.", "mat": ["Isocret (perlas de EPS aditivadas): bolsa de 170 l, rinde 0,20 m³ (5 bolsas por m³) — sistema preferido Belfast", "Cemento portland (para Isocret: 60 kg por bolsa de 170 l para densidad 300 kg/m³)", "Cascote limpio de ladrillo u hormigón, sin yeso, madera, plástico ni tierra (solo si el calculista lo aprueba)", "Mortero para carpeta cementicia sobre el relleno", "Caño camisa para pases a través de las vigas (dejados al hormigonar)"], "pasos": ["Antes de hormigonar las vigas: definir con el calculista el material de relleno y dejar los pases (caño camisa) en el punto más bajo de cada cajón, para que el agua que entre al relleno pueda salir y no quede atrapada, y para el paso de desagües.", "Peso de referencia por cada cm de relleno: cascote ≈ 16–19 kg/m²; Isocret a 300 kg/m³ ≈ 3 kg/m². Un relleno de 25 cm pesa ≈ 400–470 kg/m² con cascote y ≈ 75 kg/m² con Isocret (más la carpeta: ≈ 20 kg/m² por cm). El cascote se usa solo con aprobación escrita del calculista.", "Instalaciones dentro del relleno (desagües de azotea, cañerías): colocadas, fijadas y probadas antes de rellenar, con su pendiente.", "Losa limpia y humedecida (sin charcos). En azoteas, barrera de vapor si el proyecto la pide.", "Fajas de nivel (o de pendiente en azoteas) con mortero, cada 1,5–2 m, para dar la altura final.", "Isocret — dosificación por bolsa de 170 l: 60 kg de cemento y ≈ 30 l de agua (densidad ≈ 300 kg/m³). Para más liviano: 50 kg y 25 l (250 kg/m³); para más firme: 70 kg y 35 l (350 kg/m³). Sin arena. Seguir siempre lo impreso en la bolsa.", "Mezclar en hormigonera: primero agua y cemento, después las perlas, hasta que estén todas cubiertas. Se puede bombear.", "Volcar entre las fajas y nivelar con regla sin apisonar (se aplastan las perlas). Admite grandes espesores en una sola colada; espesor mínimo 5 cm por encima de cualquier caño.", "No colocar con lluvia, con menos de 5 °C, riesgo de helada ni más de 35 °C.", "Cascote (si está aprobado): en capas de 10–15 cm, regado y trabado con mortero pobre, compactado, sin huecos ni piezas grandes sueltas; terminar con contrapiso de nivelación.", "Dejar secar (fragüe total ≈ 48 h; más tiempo antes de la carpeta si el espesor es grande) y no transitar con carretillas directo sobre el Isocret: usar tablones.", "Carpeta cementicia encima de mínimo 3 cm (el Isocret no tiene resistencia superficial). En azoteas la carpeta lleva la pendiente final hacia los embudos y después la impermeabilización Protex.", "Junta perimetral contra vigas, muros y parapetos.", "Cómputo de ejemplo: 100 m² × 0,25 m = 25 m³ → 125 bolsas de Isocret y 7.500 kg de cemento (150 bolsas de 50 kg) a 300 kg/m³."], "ctrl": ["Material de relleno aprobado por escrito por el calculista", "Pases de desagote en el punto bajo de cada cajón", "Instalaciones probadas antes de rellenar", "Dosificación de Isocret según bolsa (cemento pesado, no a ojo)", "Carpeta ≥ 3 cm sobre el relleno", "Nivel o pendiente verificada antes de la carpeta"], "err": ["Rellenar con cascote sin aprobación del calculista", "Cajones sin salida para el agua", "Escombro con yeso, madera o tierra", "Porcelanato o membrana directo sobre el Isocret", "Agregar arena o agua de más al Isocret"], "ref": "Ficha técnica Isocret (Tecnisec): dosificaciones por densidad, rendimiento y condiciones de aplicación. Pesos de referencia para cómputo de cargas; manda siempre el cálculo estructural.", "reales": ["manual-reales/terraza-contrapiso.jpg", "manual-reales/terraza-parapeto.jpg"], "malas": [], "foto": "manual-fotos/contrapisos-alivianado.jpg", "fr": 0}, {"id": "pendientes", "t": "Pendientes en baños, terrazas y patios", "tags": "pendiente baño ducha terraza patio rejilla 1% 2%", "que": "Toda superficie mojable lleva pendiente hacia su desagüe. La pendiente se arma en el contrapiso, no en el adhesivo del piso.", "mat": [], "pasos": ["Duchas: 1,5–2% hacia la rejilla (con rejilla lineal, pendiente en una sola dirección).", "Resto del baño y lavadero: 0,5–1% hacia la pileta de patio.", "Terrazas y balcones: 1,5–2% hacia embudos, alejando el agua de las puertas.", "Patios y veredas: 1–2% alejando el agua de la casa.", "Umbral: el piso exterior siempre por lo menos 2 cm más bajo que el interior (o umbral con barrera).", "Verificar con agua antes de la impermeabilización y del piso."], "ctrl": ["Prueba con agua: no queda agua estancada", "Exterior más bajo que interior"], "err": ["Hacer la pendiente con adhesivo", "Terrazas con pendiente hacia la casa"], "ref": "", "reales": ["manual-reales/terraza-contrapiso.jpg"], "malas": [], "foto": "manual-fotos/contrapisos-pendientes.jpg", "fr": 0}, {"id": "carpetas", "t": "Carpetas", "tags": "carpeta cemento arena 1:3 nivelación hidrófuga secado espesor protex 1", "que": "La carpeta deja la superficie plana y firme para el piso. Su planeidad es la del piso final.", "mat": ["Mortero de cemento y arena 1:3 (en locales húmedos y bajo piso sobre terreno, amasado con Protex 1 1:10)", "Fajas de nivel", "Regla de aluminio de 2–3 m"], "pasos": ["Espesor 2–3 cm; sobre alivianado, mínimo 3 cm.", "Fajas con láser cada 1,5–2 m; reglear y fratasar.", "Respetar las juntas del contrapiso y las perimetrales.", "Curar húmedo 3 días.", "Tiempo de secado antes de pisos sensibles (madera, vinílicos): aproximadamente 1 semana por cada cm de espesor, y medir humedad.", "Planeidad: 2 mm bajo regla de 2 m."], "ctrl": ["Planeidad verificada con regla", "Sin sonido hueco (golpear con mango)", "Humedad medida antes de pisos de madera"], "err": ["Carpetas sopladas (huecas)", "Colocar madera sobre carpeta húmeda"], "ref": "", "reales": ["manual-reales/contrapiso-subsuelo-1.jpg"], "malas": [], "foto": "manual-fotos/contrapisos-carpetas.jpg", "fr": 0}, {"id": "juntas", "t": "Juntas de dilatación", "tags": "juntas dilatación contracción perimetral sellador", "que": "Las juntas dejan que el piso se mueva sin fisurarse. Se ubican en plano antes de hacer el contrapiso.", "mat": ["Poliestireno expandido 1 cm para perimetrales", "Sellador elástico (poliuretano) y fondo de junta"], "pasos": ["Junta perimetral en todo encuentro con muros y columnas.", "Juntas de contracción en contrapisos cada 3–4 m; en exteriores, paños más chicos.", "Las juntas del contrapiso se respetan en carpeta y en piso (coincidir con junta del revestimiento).", "Sellar con sellador elástico sobre fondo de junta."], "ctrl": ["Juntas ubicadas según plano", "Perimetrales en todo el borde"], "err": ["Pisos exteriores sin juntas", "Juntas rellenas con pastina rígida"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/contrapisos-juntas.jpg", "fr": 0}]}, {"id": "cubiertas", "t": "Cubiertas, terrazas e impermeabilización", "ico": "techo", "d": "Azoteas, membranas, embudos, babetas y pruebas.", "s": [{"id": "azotea", "t": "Azotea / terraza: el paquete completo", "tags": "azotea terraza barrera de vapor aislación térmica pendiente membrana carpeta protex techos 5000 poliurea", "que": "Una cubierta plana se arma por capas, cada una con su función. Si falta una, falla el conjunto.", "mat": ["Barrera de vapor (pintura asfáltica o film)", "Aislación térmica (poliestireno extruido o expandido de alta densidad, espesor según proyecto)", "Contrapiso con pendiente (alivianado o común)", "Carpeta", "Impermeabilización Protex: Techos 5000 PU (no transitable o tránsito liviano) o Poliurea F + Top Alifático (transitable)", "Bajo piso transitable: Protex Seal 77 Flex bajo carpeta de protección o adhesivo"], "pasos": ["Orden de abajo hacia arriba: losa → barrera de vapor → aislación térmica → contrapiso con pendiente → carpeta → imprimación → membrana → protección.", "Pendiente mínima de referencia 1,5–2% hacia los embudos.", "Media caña en todos los encuentros con muros y parapetos.", "Juntas de dilatación de la cubierta resueltas con fuelle de membrana."], "ctrl": ["Capas en el orden correcto (fotos de cada una)", "Pendiente verificada con agua", "Medias cañas ejecutadas"], "err": ["Membrana directamente sobre aislación de EPS (no es compatible a fuego)", "Terrazas sin pendiente"], "ref": "", "reales": ["manual-reales/terraza-parapeto.jpg", "manual-reales/terraza-contrapiso.jpg"], "malas": [], "foto": "manual-fotos/cubiertas-azotea.jpg", "fr": 0}, {"id": "membrana", "t": "Colocación de membrana asfáltica", "tags": "membrana asfáltica soplete solapes 10 cm imprimación babeta embudo aluminio geotextil protex", "que": "Sistema Belfast: en azoteas usamos membrana líquida Protex (Techos 5000 PU o Poliurea F). La membrana asfáltica queda solo cuando el proyecto la pide expresamente; en ese caso se coloca así.", "mat": ["Imprimación asfáltica (pintura base solvente ≈0,5 l/m² en 2 manos, o emulsión según sustrato)", "Membrana asfáltica 4 mm: con aluminio (no transitable, expuesta), con geotextil (para pintar) o sin terminación (bajo piso)", "Soplete y garrafa, cuchara para sellar solapes"], "pasos": ["Carpeta limpia, seca, sin polvo ni lechada; trabajar entre 10 y 30 °C, sin lluvia ni helada.", "Imprimar toda la superficie, babetas y embudos; dejar secar.", "Primero se impermeabilizan embudos y puntos singulares; después el paño general.", "Rollos perpendiculares a la pendiente, empezando por la parte más baja (los desagües); los solapes a favor de la pendiente.", "Solapes de 8–10 cm laterales y 15 cm en los extremos de rollo, soldados en todo el ancho y sellados con la cuchara.", "Babetas: subir la membrana 20 cm sobre el piso terminado dentro de una canaleta o con perfil de remate, sellada.", "Encuentros piso-pared con doble membrana sobre la media caña.", "Proteger los solapes con pintura aluminizada o la terminación del fabricante; las membranas bajo piso van cubiertas con carpeta de protección."], "ctrl": ["Solapes soldados en todo su ancho (pasar cuchara)", "Babetas ≥ 20 cm y selladas", "Embudos con refuerzo", "Sin bolsas ni arrugas"], "err": ["Soldar solo el borde del solape", "Membrana con aluminio en contacto con mortero (el cemento ataca el aluminio)", "Babetas bajas o sin remate", "Trabajar con la carpeta húmeda"], "ref": "Fichas técnicas del fabricante (imprimación, solapes, temperaturas).", "reales": [], "malas": [], "foto": "manual-fotos/cubiertas-membrana.jpg", "fr": 0}, {"id": "estanqueidad", "t": "Prueba de estanqueidad", "tags": "prueba de estanqueidad inundación 48 horas terraza baño ducha", "que": "Toda impermeabilización se prueba con agua antes de taparla. Es la única forma de saber que funciona.", "mat": [], "pasos": ["Tapar los desagües y llenar con 3–5 cm de agua (sin superar la altura de las babetas).", "Mantener 48–72 horas.", "Revisar el cielorraso y los muros de abajo; marcar el nivel del agua para ver si baja.", "Si hay pérdida: vaciar, secar, reparar y volver a probar.", "Registrar fecha, duración, resultado y fotos en NEXO."], "ctrl": ["48 h mínimo sin pérdidas", "Registro en NEXO"], "err": ["Tapar sin probar", "Probar solo con manguera un rato"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/cubiertas-estanqueidad.jpg", "fr": 0}, {"id": "banos", "t": "Impermeabilización de baños y duchas", "tags": "impermeabilización baño ducha membrana líquida cementicia rejilla lineal protex seal 77 flex", "que": "La ducha es el punto más exigido de la casa. Se impermeabiliza todo el piso del baño y las paredes de la ducha con Protex Seal 77 Flex antes de revestir.", "mat": ["Protex Seal 77 Flex (3 manos, ≈ 3 kg/m²)", "Banda de refuerzo para esquinas, encuentros, rejillas y caños", "Rejilla lineal o central con brida para membrana", "Pegatex Flexible o Impermeable para el revestimiento"], "pasos": ["Contrapiso con pendiente y carpeta firmes, limpios y humedecidos (ver Pendientes).", "Banda de refuerzo en encuentros piso-pared y alrededor de rejillas y caños.", "Protex Seal 77 Flex en 3 manos cruzadas, 6 h entre manos, subiendo 20 cm en todo el baño y hasta 2,00 m dentro de la ducha.", "Prueba de estanqueidad de 48 h antes de colocar el revestimiento.", "Colocar revestimiento con Pegatex Flexible o Impermeable (baja absorción, alta adherencia)."], "ctrl": ["Membrana continua con bandas en esquinas", "Prueba de 48 h aprobada"], "err": ["Ducha impermeabilizada solo en el piso", "Sin refuerzo en la rejilla"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/cubiertas-banos.jpg", "fr": 0}, {"id": "inclinados", "t": "Techos inclinados", "tags": "techo inclinado tejas chapa barrera hidrófuga aislación ventilación", "que": "Se ejecutan según el sistema elegido (tejas, chapa, losa inclinada) con barrera hidrófuga y aislación térmica.", "mat": ["Barrera hidrófuga respirable bajo tejas o chapa", "Aislación térmica según proyecto", "Cenefas, cumbreras y canaletas"], "pasos": ["Pendiente mínima según el fabricante de la cubierta (tejas y chapas tienen mínimos distintos).", "Barrera hidrófuga con solapes a favor del agua.", "Ventilar la cámara bajo la cubierta para evitar condensación.", "Canaletas con pendiente ≥ 0,5% hacia las bajadas."], "ctrl": ["Pendiente según fabricante", "Barrera continua"], "err": ["Pendientes menores a las del fabricante"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/cubiertas-inclinados.jpg", "fr": 0}]}, {"id": "protex", "t": "Impermeabilización con Protex", "ico": "gota", "d": "El sistema Belfast: qué producto Protex va en cada lugar, con dosis, manos y tiempos.", "s": [{"id": "protexguia", "t": "¿Qué producto Protex uso? (tabla rápida)", "tags": "protex tabla elegir producto impermeabilizante cual uso", "que": "En Belfast impermeabilizamos con Protex. Esta tabla dice qué producto va en cada lugar. Si el caso no está acá, se consulta a Dirección de obra antes de comprar.", "mat": ["Hormigón de subsuelos, tanques y cisternas → Xypex Admix C-1000 (cristalizante en la mezcla) o Protex Hidro (hidrófugo de masa)", "Juntas de hormigonado (platea-tabique, losa-tabique) → Protex Hidro-Swell P o Junta PVC (waterstop)", "Tabiques de subsuelo desde adentro o afuera, cisternas, tanques de hormigón → Protex Seal 77 (aguanta presión positiva y negativa)", "Baños, duchas, balcones, Durlock en zonas húmedas, tanques que pueden moverse → Protex Seal 77 Flex", "Tanques, piletas y terrazas sin presión negativa → Protex Flex", "Capa aisladora, azotados y carpetas hidrófugas → Protex 1 (1:10 en el agua de amasado)", "Humedad que sube por muros existentes → Protex Fin (barrera química inyectada)", "Azoteas no transitables o de tránsito liviano → Protex Techos 5000 PU (con Geomanta en zonas críticas)", "Terrazas transitables, cocheras, jardineras → Protex Poliurea F + Protex Top Alifático", "Filtraciones con agua corriendo → Protex Tap (tapón hidráulico)", "Nidos, fisuras y reparación de hormigón → Concretex / Protex Rep; inyecciones: Protex Hydrofoam", "Juntas con movimiento → Protex PU 40 C sobre fondo de junta Protex Pol", "Pegado de revoque sobre Seal 77 → Protex Látex o Superligante; cerámicos → Pegatex Impermeable o Flexible"], "pasos": ["Elegir el producto con esta tabla y registrar la elección en NEXO (obra, lugar, producto, lote).", "Pedir la ficha técnica vigente del lote y dejarla en la carpeta de obra.", "Verificar el vencimiento: los cementicios bicomponentes duran 6 meses en envase cerrado; Protex 1, 3 años.", "Nunca mezclar productos de marcas distintas en un mismo sistema sin consultar."], "ctrl": ["Producto correcto para el lugar", "Ficha técnica en obra", "Lote y vencimiento registrados"], "err": ["Usar pintura asfáltica \"porque había\"", "Agregar agua a un bicomponente", "Comprar otro producto sin consultar"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-protexguia.jpg", "fr": 0}, {"id": "seal77", "t": "Protex Seal 77: cementicio rígido (presión positiva y negativa)", "tags": "seal 77 protex cementicio bicomponente tanque cisterna subsuelo sotano presion negativa", "que": "Impermeabilizante cementicio de dos componentes. Es el que usamos cuando el agua puede empujar desde atrás (presión negativa): subsuelos impermeabilizados desde adentro, cisternas, tanques de hormigón, fosos de ascensor.", "mat": ["Protex Seal 77: kit predosificado (polvo + líquido Seal N° 2); se usa el kit completo, sin fraccionar", "Pinceleta de cerda dura o llana", "Concretex o Protex Tap para reparar antes", "Protex Látex o Superligante si después va revoque"], "pasos": ["Superficie firme, limpia, porosa y húmeda (saturada sin agua superficial). Picar lechadas, desmoldantes y partes flojas.", "Reparar antes: nidos y fisuras con Concretex; filtraciones activas con Protex Tap; pasadores de encofrado sellados.", "Media caña en los encuentros piso-pared con mortero de reparación.", "Mezclar volcando el polvo sobre el líquido de a poco, con mezclador a bajas revoluciones, hasta que no queden grumos. NUNCA agregar agua.", "Usar la mezcla dentro de las 2 horas (a 25 °C).", "Aplicar 3 manos cruzadas (una horizontal, otra vertical), con pinceleta o llana. Consumo ≈ 1 kg/m² por mano (≈ 3 kg/m² en total).", "Esperar mínimo 6 horas entre manos; humedecer levemente antes de cada mano.", "Proteger de lluvia y alta humedad 4 horas. Curar con agua pulverizada.", "Habilitar al servicio a las 72 horas (tanques: lavar antes de llenar).", "Si va revoque encima: puente de adherencia con Protex Látex o Superligante. Si va cerámico: adhesivo de baja absorción y alta adherencia (Pegatex)."], "ctrl": ["3 manos aplicadas (foto de cada mano con fecha)", "Consumo real ≈ 3 kg/m² (bolsas usadas ÷ m²)", "Sin fisuras ni zonas sin cubrir", "Curado registrado"], "err": ["Agregar agua para \"estirar\" la mezcla", "Aplicar sobre superficie seca o con lechada", "Dar 2 manos en vez de 3", "Pintar encima con pintura a solvente"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-seal77.jpg", "fr": 0}, {"id": "seal77flex", "t": "Protex Seal 77 Flex: baños, duchas y balcones", "tags": "seal 77 flex protex flexible baño ducha balcon durlock bañera ceramico", "que": "Versión flexible del Seal 77: acompaña pequeños movimientos del soporte. Es el estándar Belfast para baños, duchas, balcones, lavaderos y placas de yeso en zonas húmedas, debajo del revestimiento.", "mat": ["Protex Seal 77 Flex: kit de 25 kg", "Venda o banda de refuerzo en esquinas, rejillas y caños", "Pegatex Flexible o Impermeable para el cerámico"], "pasos": ["Contrapiso con pendiente y carpeta terminados, firmes, limpios y humedecidos.", "Media caña o banda de refuerzo en todos los encuentros piso-pared y alrededor de rejillas, caños y bridas.", "Mezclar el kit completo sin agregar agua.", "3 manos cruzadas, ≈ 1 kg/m² por mano, mínimo 6 h entre manos.", "Cubrir todo el piso del baño subiendo 20 cm en las paredes; dentro de la ducha subir hasta 2,00 m (o hasta el techo si hay vapor).", "Sobre Durlock: placa verde (resistente a la humedad), juntas tomadas y masilladas antes de impermeabilizar.", "Prueba de estanqueidad de 48 h antes de revestir.", "Revestir con adhesivo de baja absorción y alta adherencia (Pegatex Flexible o Impermeable)."], "ctrl": ["Bandas en encuentros y rejillas (foto)", "Altura en ducha ≥ 2,00 m", "Prueba de 48 h aprobada y registrada"], "err": ["Impermeabilizar solo el piso de la ducha", "Saltear la banda alrededor de la rejilla", "Pegar el cerámico con adhesivo común"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-seal77flex.jpg", "fr": 0}, {"id": "protexflex", "t": "Protex Flex: tanques, piletas y terrazas (sin presión negativa)", "tags": "protex flex tanque pileta piscina terraza sobre ceramica medianera", "que": "Cementicio muy flexible para agua que empuja desde el frente (presión positiva). Apto para agua potable. Se puede aplicar sobre cerámica de terrazas sin levantarla.", "mat": ["Protex Flex: kit de 35 kg (25 kg de polvo + 10 kg de Protex Flex N° 2)", "Concretex o Protex Tap para reparar fisuras antes"], "pasos": ["Superficie firme, sin restos de cal, pintura, aceite o grasa; rugosidad al menos de lija mediana (lavado ácido, neutralizar y enjuagar).", "Reparar fisuras, juntas y roturas con Concretex o Protex Tap.", "Humedecer levemente. Si hace falta imprimar: una mano de Flex N° 2 solo, hasta que quede pegajoso (máx. 24 h).", "Mezclar volcando el polvo sobre el líquido; usar en 30–40 minutos. Sin agua.", "3 manos cruzadas, ≈ 1 kg/m² por mano, mínimo 6 h entre manos.", "Curar rociando con agua 3–4 veces cada 8 h.", "Tanques: esperar 48 h de curado como mínimo antes de llenar."], "ctrl": ["3 manos", "Curado registrado", "48 h antes de llenar"], "err": ["Usarlo en subsuelos con agua desde atrás (no aguanta presión negativa)", "Aplicar a menos de 5 °C o con amenaza de lluvia"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-protexflex.jpg", "fr": 0}, {"id": "protex1", "t": "Protex 1: capa aisladora, azotado y carpetas hidrófugas", "tags": "protex 1 hidrofugo inorganico capa aisladora azotado carpeta hidrofuga 1:10", "que": "Hidrófugo químico inorgánico que se agrega al agua de amasado de los morteros. Es el que va en todas las capas aisladoras, azotados exteriores y carpetas bajo piso de Belfast.", "mat": ["Protex 1 (bidón)", "Cemento portland y arena fina a mediana", "Agua limpia"], "pasos": ["Dilución: 1 parte de Protex 1 en 10 partes de agua (1:10). Con esa agua se amasa el mortero. Descontar la humedad de la arena.", "Mortero: cemento y arena 1:3 para azotados, carpetas y capas aisladoras.", "Capa aisladora horizontal: espesor mínimo 2,5 cm (≈ 0,45 kg/m² de Protex 1), continua, formando cajón.", "Azotado vertical y carpeta hidrófuga: 1 cm de espesor (≈ 0,25 kg/m²).", "Tanques y cisternas con mortero: primera capa 1:2 de 4–6 mm, luego mortero 1:3 de hasta 15 mm.", "Humedecer el soporte antes. Sobre el azotado, salpicado con la mezcla del grueso para que agarre.", "Curar con agua pulverizada 2–3 días. Trabajar entre 5 y 30 °C, sin lluvia ni viento fuerte.", "No pasarse de dosis: el exceso altera el fragüe."], "ctrl": ["Dilución 1:10 medida con recipiente (no \"a ojo\")", "Espesores según uso", "Curado 2–3 días"], "err": ["Echar el hidrófugo directo en la mezcla sin diluir", "Doble dosis \"para que impermeabilice más\"", "Azotado sin curar"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-protex1.jpg", "fr": 0}, {"id": "cristalizante", "t": "Cristalizantes y juntas: hormigón impermeable de origen", "tags": "xypex admix c-1000 concentrado protex hidro hidro-swell junta pvc waterstop cristalizante hormigon", "que": "La mejor impermeabilización de un subsuelo es un hormigón que no deja pasar el agua. Con Xypex el hormigón cierra sus poros con cristales; las juntas se resuelven con Hidro-Swell P o Junta PVC.", "mat": ["Xypex Admix C-1000: cristalizante que se agrega al hormigón en planta (dosis según Protex y la hormigonera)", "Xypex Concentrado: cristalizante en superficie (pinceleta) para hormigón existente", "Protex Hidro: hidrófugo de masa para hormigón", "Protex Hidro-Swell P: perfil hidroexpansivo 2 × 1 cm, rollos de 8 m (1 m por metro de junta)", "Junta PVC O-15/25/32 o V-20 (waterstop) para juntas con más exigencia"], "pasos": ["Definir con Dirección de obra y la hormigonera si el hormigón de subsuelo lleva Xypex Admix o Protex Hidro, y pedirlo en el remito.", "Hidro-Swell P: colocar sobre hormigón de primera etapa seco y limpio, en el centro de la sección.", "Recubrimiento mínimo del perfil: hormigón armado ≥ 10 cm de espesor con 4 cm a cada cara; sin armar ≥ 15 cm con 7 cm.", "Pegarlo con cemento de contacto o Protex PU 40 C para que el segundo hormigonado no lo mueva. Empalmes a tope, sin huecos.", "Si puede mojarse antes de hormigonar (lluvia), pintarlo con lechada de cemento para que no se hinche antes de tiempo.", "Hidro-Swell P NO va en juntas de dilatación ni con movimiento: ahí va Junta PVC o sellador.", "Hormigón existente: Xypex Concentrado sobre superficie saturada, según ficha."], "ctrl": ["Remito de hormigón con aditivo", "Perfil centrado, pegado y continuo (foto antes de hormigonar)", "Empalmes a tope"], "err": ["Colocar el perfil al borde de la pieza", "Dejarlo mojarse días antes del colado", "Usarlo en juntas de dilatación"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": ["manual-reales/junta-hidroexpansiva.jpg"], "malas": [], "foto": "manual-fotos/protex-cristalizante.jpg", "fr": 0}, {"id": "protexfin", "t": "Protex Fin: humedad de cimientos en muros existentes", "tags": "protex fin humedad ascendente cimientos barrera quimica inyeccion muro existente refaccion", "que": "En refacciones, cuando el muro no tiene capa aisladora y la humedad sube del suelo, se hace una barrera química inyectando Protex Fin.", "mat": ["Protex Fin (lata de 5 l)", "Taladro con mecha widia de 13 a 16 mm", "Protex 1 o Protex Seal 77 para el revoque nuevo"], "pasos": ["Picar el revoque hasta 40 cm desde el piso, de los dos lados si se puede.", "Agujeros a 45° hacia abajo, a 10 cm del piso, separados 20 cm, de profundidad 2/3 del espesor del m ags": "protex tap tapon hidraulico filtracion concretex rep hydrofoam inyeccion fisura", "que": "Antes de impermeabilizar hay que cortar el agua que corre y reparar el hormigón. Si no, ningún impermeabilizante adhiere.", "mat": ["Protex Tap: tapón hidráulico de fragüe ultrarrápido", "Concretex / Protex Rep: morteros de reparación", "Protex Hydrofoam: inyección de poliuretano para fisuras con agua", "Protex 270: inyección epoxi para fisuras estructurales (con aprobación del calculista)"], "pasos": ["Abrir la vía de agua en cola de milano (más ancha adentro), mínimo 2 cm.", "Amasar Protex Tap en poca cantidad, formar un tapón y apretarlo con la mano hasta que fragüe (segundos).", "Fisuras con agua: inyectar Hydrofoam con inyectores (packers) según ficha.", "Nidos de abeja y bordes rotos: picar hasta hormigón sano y reparar con Concretex.", "Recién con todo seco de agua corriente, aplicar el sistema (Seal 77, Xypex, etc.)."], "ctrl": ["Sin agua corriendo antes de impermeabilizar", "Reparaciones registradas con foto"], "err": ["Impermeabilizar encima de una filtración activa", "Tapar fisuras estructurales sin consultar"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": [], "malas": [], "foto": "manual-fotos/protex-reparaciones.jpg", "fr": 0}]}, {"id": "revoques", "t": "Revoques", "ico": "llana", "d": "Malla en encuentros, salpicado, fajas, azotado hidrófugo, grueso, fino y yeso.", "s": [{"id": "malla", "t": "Malla soldada en encuentros de mampostería con columnas y vigas", "tags": "malla soldada encuentro mamposteria columna viga fisura revoque canaleta", "que": "Donde el ladrillo se encuentra con el hormigón (columnas, vigas, tabiques) o sobre canaletas de instalaciones, el revoque se fisura si no lleva malla. La malla se coloca antes del salpicado y queda dentro del revoque grueso.", "mat": ["Malla soldada galvanizada de alambre fino (cuadrícula de ≈ 12–25 mm) en rollos o tiras", "Clavos de acero con arandela o tacos con tornillo para fijarla", "Salpicado cementicio (con promotor de adherencia sobre hormigón liso)"], "pasos": ["Colocar después de terminar y probar las instalaciones de esa pared.", "Cortar tiras que cubran el encuentro y pasen al menos 15–20 cm sobre cada material (ladrillo y hormigón). Sobre canaletas, 15 cm a cada lado de la canaleta.", "Fijar la malla separada 3–5 mm del muro (que quede dentro del revoque, no pegada al ladrillo), con fijaciones cada 30–40 cm.", "Tiras continuas en toda la altura del encuentro, de piso a viga; empalmes solapados 10 cm.", "En esquinas de vanos (puertas y ventanas), tira de malla a 45° en cada esquina.", "Sobre la malla, salpicado y después grueso, embebiendo completamente la malla."], "ctrl": ["Malla en todos los encuentros hormigón-ladrillo y sobre canaletas (foto de cada pared)", "Solape ≥ 15 cm a cada lado", "Malla fija y separada del muro", "Esquinas de vanos reforzadas a 45°"], "err": ["Revocar encuentros sin malla", "Malla suelta que se mueve al revocar", "Malla pegada al ladrillo sin revoque detrás"], "ref": "Buena práctica de obra Belfast; prevalecen las indicaciones del proyecto y del fabricante del mortero.", "reales": ["manual-reales/malla-columna-1.jpg", "manual-reales/malla-columna-2.jpg", "manual-reales/malla-columna-3.jpg", "manual-reales/malla-encuentro.jpg", "manual-reales/canaleta-malla.jpg"], "malas": [], "foto": "manual-fotos/revoques-exterior.jpg", "fr": 0}, {"id": "salpicado", "t": "Salpicado hidrófugo (\"con Ceresita\") y fajas", "tags": "salpicado ceresita hidrofugo cajon chicoteo puente de adherencia fajas plomo revoque grueso subsuelo hormigon", "que": "El salpicado hidrófugo (en obra, \"salpicado con Ceresita\") es la capa de agarre e impermeable: un mortero cementicio bien fluido, con hidrófugo, que se tira con fuerza para dejar la superficie rugosa. Sin salpicado el revoque se despega, sobre todo en hormigón; en subsuelos y en el cajón hidrófugo además corta la humedad. Las fajas son las guías a plomo que fijan el espesor y la planeidad del revoque.", "mat": ["Salpicado: cemento y arena gruesa 1:2 o 1:3, muy fluido, con hidrófugo en el agua de amasado (producto Belfast: Protex 1 diluido 1:10; si en obra se usa Ceresita, respetar la dosis de su envase — no mezclar ambos)", "Sobre hormigón liso: promotor de adherencia (Protex Látex o Superligante) en el agua", "Fajas: mortero del grueso con regla y plomada o láser", "Reglas de aluminio de 2–3 m"], "pasos": ["Superficie limpia, sin polvo, desmoldante ni partes flojas; humedecer antes.", "En el cajón hidrófugo y en muros de subsuelo, el salpicado hidrófugo es continuo y se une con la capa aisladora horizontal (sin cortes en esquinas ni vanos).", "Tirar el salpicado con cuchara o máquina, cubriendo toda la superficie de forma pareja y rugosa (no se alisa).", "En hormigón liso (columnas, vigas, tabiques de subsuelo), salpicado siempre con promotor de adherencia.", "En subsuelos, el salpicado se hace sobre la impermeabilización solo si el sistema lo admite (Seal 77: puente con Protex Látex o Superligante).", "Mantener húmedo y dejar que endurezca (mínimo 24 h) antes del grueso.", "Fajas: hacerlas después de colocar las instalaciones eléctricas y sanitarias y las mallas, para que el espesor cubra todo.", "Fajas verticales a plomo cada 1–1,5 m y en todas las aristas, con el espesor final del grueso (1,5–2 cm).", "Verificar las fajas con regla y plomada o láser antes de cargar el grueso entre ellas."], "ctrl": ["Salpicado parejo en toda la superficie", "Promotor de adherencia en hormigón", "Fajas a plomo verificadas", "Cajas eléctricas a la altura del revoque terminado según las fajas"], "err": ["Revocar sobre hormigón liso sin salpicado", "Salpicado seco o muy espeso que no agarra", "Fajas a ojo o separadas más de 1,5 m"], "ref": "Buena práctica de obra Belfast; prevalecen las fichas del fabricante del mortero y del promotor de adherencia.", "reales": ["manual-reales/fajas-1.jpg", "manual-reales/fajas-2.jpg", "manual-reales/canaleta-malla.jpg"], "malas": ["manual-reales/mal-sanitaria-faja.jpg", "manual-reales/mal-picado-revoque.jpg"], "foto": "manual-fotos/revoques-exterior.jpg", "fr": 0}, {"id": "exterior", "t": "Revoque exterior", "tags": "revoque exterior azotado hidrófugo grueso fino fajas mallas protex 1", "que": "Tres capas: azotado hidrófugo (impermeabiliza), grueso (aploma y nivela) y fino o terminación (acabado).", "mat": ["Azotado: cemento y arena 1:3 amasado con agua con Protex 1 (1:10)", "Grueso: cal, cemento y arena (típico 1/4:1:3 o 1/2:1:4) o mortero predosificado", "Fino a la cal o revestimiento plástico/acrílico según proyecto", "Malla de fibra de vidrio en encuentros de materiales y dinteles", "Guardacantos y buñas según diseño"], "pasos": ["Muro limpio, sin salientes ni mortero suelto; humedecer.", "Malla en encuentros hormigón-mampostería y sobre canaletas de instalaciones (20 cm a cada lado).", "Azotado hidrófugo con Protex 1, continuo, de 1 cm, unido a la capa aisladora horizontal; salpicado con la mezcla del grueso y no dejar que seque del todo antes del grueso.", "Fajas verticales a plomo cada 1–1,5 m; grueso de 1,5–2 cm reglado entre fajas y fratasado.", "Fino de 2–3 mm cuando el grueso esté firme y humedecido.", "Curar humedeciendo 2–3 días; no revocar con sol fuerte, viento o helada."], "ctrl": ["Plomo y planeidad 3 mm en regla de 2 m", "Azotado continuo hasta la capa aisladora", "Mallas en encuentros", "Aristas rectas"], "err": ["Revocar sin azotado hidrófugo", "Grueso de más de 2,5 cm de una vez", "Revocar con sol pleno sin humedecer"], "ref": "Fichas técnicas Protex (protexargentina.com). Ante dudas o casos especiales, consultar al Departamento Técnico Protex: +54 11 5263-7770.", "reales": ["manual-reales/malla-encuentro.jpg"], "malas": [], "foto": "manual-fotos/revoques-exterior.jpg", "fr": 0}, {"id": "interior", "t": "Revoque interior y yeso", "tags": "revoque interior grueso fino yeso proyec , "Tapas de inspección en llaves, cajas de paso, unidades de aire y colectores (registrar su ubicación).", "Juntas: masilla, cinta, 2 manos más con secado entre capas (24 h con masilla lista para usar); tornillos y cantoneras con 2 manos. Con luz rasante o pintura satinada, enduido total en 2 manos cruzadas.", "Juntas de control donde lo pida el fabricante (grandes superficies, encuentros con juntas del edificio)."], "ctrl": ["Montantes ≤ 40 cm (medir con cinta, foto)", "Vigas maestras ≤ 1,20 m y velas ≤ 1,00 m", "Refuerzos colocados según plano de iluminación", "Tapas de inspección ubicadas", "Nivel ± 3 mm en 2 m con luz rasante"], "err": ["Velas de alambre", "Colgar luminarias de la placa", "Juntas de placa sin perfil detrás", "Cerrar el cielorraso con instalaciones sin probar"], "ref": "Durlock: construcción del sistema Cielorraso Junta Tomada y detalles técnicos (durlock.com). Ante cargas especiales consultar al Departamento Técnico Durlock.", "reales": [], "malas": [], "foto": "manual-fotos/seco-placas.jpg", "fr": 0}, {"id": "colgadas", "t": "Instalaciones colgadas bajo losa (plomería, electricidad y aire)", "tags": "fijaciones cañerias cielorraso colgadas losa varilla roscada perfil c grampa soporte plomeria electricidad bandeja", "que": "Todo lo que corre sobre el cielorraso se cuelga de la losa con soportes propios, ordenado y con pendiente donde corresponda. El cielorraso no sostiene ninguna cañería.", "mat": ["Varilla roscada galvanizada 1/4\" o 3/8\" con brocas o tacos metálicos a la losa", "Perfil C galvanizado (riel) como travesaño, o grampas tipo omega con tornillo", "Abrazaderas con goma para caños de agua y desagüe", "Bandeja portacables para recorridos eléctricos largos o con muchos circuitos"], "pasos": ["Coordinar en plano el recorrido de cada instalación antes de colgar: desagües (con pendiente) primero, después agua, aire acondicionado y por último electricidad.", "Soportes de referencia (confirmar con el fabricante del caño): desagües de PVC/PP es de fabricar (medidas finales en obra).", "Premarco a plomo, a nivel y en línea con el filo del revoque terminado.", "Alféizares y umbrales con pendiente hacia afuera (≥ 2%) y goterón.", "Sellado perimetral exterior continuo; espuma solo como relleno, nunca como sello final.", "Prueba con manguera de la ventana terminada.", "Proteger perfiles y vidrios con film hasta la limpieza final."], "ctrl": ["Plomo y nivel ±2 mm", "Sellado continuo exterior", "Prueba con agua OK"], "err": ["Espuma sin sellador", "Alféizares sin pendiente", "Abrir y cerrar sin proteger hasta el final de obra"], "ref": "", "reales": [], "malas": [], "foto": "manual-fotos/carpinterias-aberturas.jpg", "fr": 0}]}, {"id": "fuego", "t": "Parrillas y hogares", "ico": "llama", "d": "Parrilla de obra y hogar a leña: proporciones, tiraje, refractario y distancias.", "s": [{"id": "parrilla", "t": "Parrilla de obra", "tags": "parrilla quincho asador campana conducto tiraje refractario fogonero mesada brasero", "que": "Una parrilla que no tira llena de humo el quincho. El tiraje lo dan la campana, la sección y la altura del conducto, no el tamaño de la parrilla.", "mat": ["Ladrillo refractario y mortero refractario en el fondo, laterales y piso del fogón", "Ladrillo común o block para la estructura", "Campana de chapa o de mampostería con su conducto", "Conducto de chapa galvanizada o de acero, o de mampostería revocada lisa por dentro", "Sombrerete en la salida", "Losa o base de hormigón armado bajo el piso del fogón"], "pasos": ["Definir con Dirección de obra el modelo: ancho útil de la parrilla, brasero o fogonero, horno, mesada y bacha.", "Base: losa de hormigón armado sobre la estructura de apoyo; piso del fogón a 80–90 cm del piso (altura de trabajo).", "Fogón revestido con refractario con junta fina de mortero refractario; dejar junta de dilatación entre el refractario y la mampostería común.", "Campana que cubra todo el frente de la parrilla y sobresalga hacia adelante; la boca de la campana a una
