name: Probar API fotos del manual
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://app-demo-ultimo.vercel.app
          curl -s "$B/api/manual-fotos?accion=obras"; echo
          curl -s -X POST "$B/api/manual-fotos" -H "Origin: $B" -H "Content-Type: application/json" -d '{"accion":"obra","id":"oprueba123","obra":{"nombre":"prueba","c":{},"ok":{},"t":1},"borrar":true}'; echo
          curl -s "$B/api/manual-fotos?accion=obras"; echo
