name: Probar API fotos del manual
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://app-demo-ultimo.vercel.app/api/manual-fotos?accion=obras" | jq -c '.obras | to_entries[] | {id:.key, nombre:.value.nombre, borrada:.value.borrada, nexo:.value.nexo, h:([.value.c//{}|keys[]]|length), t:.value.t}'
