// Genera el informe mensual en PDF, con el logo real de NEXO y una explicación fija
// de qué muestra cada número — pensado para mandarlo directo al cliente.
function generarPDFInforme(cliente, etiquetaMes, informe) {
  if (!window.jspdf) { alert("No se pudo cargar el generador de PDF. Probá de nuevo en unos segundos."); return; }
  const doc = new window.jspdf.jsPDF();
  const brass = [176, 137, 79];
  const navy = [15, 27, 45];

  // Encabezado: fondo navy + logo real de NEXO (ya trae el nombre y el lema)
  doc.setFillColor(navy[0], navy[1], navy[2]);
  doc.rect(0, 0, 210, 36, "F");
  const logoAncho = 44, logoAlto = 44 * (415 / 624); // mantiene la proporción real de la imagen
  doc.addImage(NEXO_LOGO_B64, "JPEG", 14, (36 - logoAlto) / 2, logoAncho, logoAlto);

  doc.setTextColor(20, 20, 20);
  doc.setFontSize(16);
  doc.setFont(undefined, "bold");
  doc.text("Informe mensual de uso", 14, 50);
  doc.setFontSize(12);
  doc.setFont(undefined, "normal");
  doc.text(cliente.nombre, 14, 58);
  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text("Período: " + etiquetaMes, 14, 64);
  doc.text("Generado el " + new Date().toLocaleDateString("es-AR"), 14, 69);

  doc.setDrawColor(220, 220, 220);
  doc.line(14, 75, 196, 75);
  doc.setFontSize(9.5);
  doc.setTextColor(90, 90, 90);
  const explicacion = "Este informe resume la actividad real registrada en la plataforma durante el período indicado: cuántas veces se abrió la aplicación, cuánto contenido (fotos y mensajes) se cargó, cuántos errores técnicos se detectaron, y el costo de inteligencia artificial asociado al uso del asistente dentro del sistema. Los datos se toman en vivo desde la base del cliente, sin intervención manual.";
  const lineas = doc.splitTextToSize(explicacion, 182);
  doc.text(lineas, 14, 82);

  let y = 82 + lineas.length * 4.6 + 14;
  const metricas = [
    { label: "Aperturas del mes", val: String(informe.aperturasMes) },
    { label: "Fotos / mensajes subidos", val: String(informe.fotosMes) },
    { label: "Errores del mes", val: String(informe.erroresMes) },
    { label: "Costo de IA del mes", val: "$" + informe.costoMes.toFixed(2) + " USD" },
  ];
  metricas.forEach((m, i) => {
    const filaY = y + i * 16;
    doc.setFillColor(i % 2 === 0 ? 248 : 255, i % 2 === 0 ? 248 : 255, i % 2 === 0 ? 248 : 255);
    doc.rect(14, filaY - 8, 182, 14, "F");
    doc.setFontSize(11);
    doc.setTextColor(60, 60, 60);
    doc.text(m.label, 20, filaY);
    doc.setFontSize(13);
    doc.setFont(undefined, "bold");
    doc.setTextColor(brass[0], brass[1], brass[2]);
    doc.text(m.val, 170, filaY, { align: "right" });
    doc.setFont(undefined, "normal");
  });

  doc.setFontSize(8);
  doc.setTextColor(160, 160, 160);
  doc.text("NEXO Control — informe generado automáticamente, uso interno.", 14, 285);

  doc.save("Informe-NEXO-" + cliente.nombre.replace(/\s+/g, "_") + "-" + etiquetaMes.replace(/\s+/g, "_") + ".pdf");
}

function opcionesDeMes(cantidad) {
  const opciones = [];
  const ahora = new Date();
  for (let i = 0; i < cantidad; i++) {
    const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1);
    const valor = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    const etiqueta = d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
    opciones.push({ valor, etiqueta: etiqueta.charAt(0).toUpperCase() + etiqueta.slice(1) });
  }
  return opciones;
}

function DetalleCliente({ cliente, onVolver, onActualizado }) {
  const [cargando, setCargando] = useState(true);
  const [datos, setDatos] = useState({ instrumentado: false });
  const [mes, setMes] = useState(mesActualISO());
  const [informe, setInforme] = useState(null); // null = cargando informe del mes
  const [cargandoInforme, setCargandoInforme] = useState(false);
  const [editando, setEditando] = useState(false);
  const [form, setForm] = useState({
    nombre: cliente.nombre || "", contacto: cliente.contacto || "", notas: cliente.notas || "",
    supa_url: cliente.supa_url || "", supa_anon_key: cliente.supa_anon_key || "", estado: cliente.estado || "activo",
  });
  const [guardando, setGuardando] = useState(false);

  async function guardarEdicion() {
    setGuardando(true);
    try {
      const r = await fetch(SUPA_URL + "/rest/v1/clientes?id=eq." + cliente.id, {
        method: "PATCH",
        headers: { ...SH(), Prefer: "return=minimal" },
        body: JSON.stringify(form),
      });
      if (!r.ok) {
        const detalle = await r.text().catch(() => "");
        alert("No se pudo guardar (HTTP " + r.status + "):\n" + detalle);
        setGuardando(false);
        return;
      }
      setEditando(false);
      if (onActualizado) onActualizado({ ...cliente, ...form });
    } catch (e) {
      alert("No se pudo guardar: " + e.message);
    }
    setGuardando(false);
  }

  async function eliminarCliente() {
    if (!confirm("¿Eliminar a " + cliente.nombre + " de la lista de clientes? Esto no borra nada de su Supabase, solo el registro acá.")) return;
    try {
      await fetch(SUPA_URL + "/rest/v1/clientes?id=eq." + cliente.id, { method: "DELETE", headers: SH() });
      onVolver();
    } catch (e) {
      alert("No se pudo eliminar: " + e.message);
    }
  }

  useEffect(() => {
    let cancelado = false;
    async function cargar() {
      setCargando(true);
      if (!cliente.supa_url || !cliente.supa_anon_key) {
        setDatos({ instrumentado: false, motivo: "Este cliente todavía no tiene un Supabase configurado." });
        setCargando(false);
        return;
      }
      const headers = { apikey: cliente.supa_anon_key, Authorization: "Bearer " + cliente.supa_anon_key };
      try {
        const [rErrores, rIncidentes, rUso] = await Promise.all([
          fetch(cliente.supa_url + "/rest/v1/app_errores?select=id&order=creado_en.desc&limit=1", { headers }),
          fetch(cliente.supa_url + "/rest/v1/incidentes?estado=eq.open&select=id,app,mensaje,ocurrencias&limit=20", { headers }),
          fetch(cliente.supa_url + "/rest/v1/ai_usage?select=costo_usd&limit=1000", { headers }),
        ]);
        if (!rErrores.ok && !rIncidentes.ok && !rUso.ok) {
          if (!cancelado) setDatos({ instrumentado: false, motivo: "Todavía no tiene las tablas de NEXO instaladas en su Supabase." });
          return;
        }
        const incidentesAbiertos = rIncidentes.ok ? await rIncidentes.json() : [];
        const usoFilas = rUso.ok ? await rUso.json() : [];
        const costoTotal = (usoFilas || []).reduce((a, f) => a + (Number(f.costo_usd) || 0), 0);
        if (!cancelado) setDatos({ instrumentado: true, incidentesAbiertos: incidentesAbiertos || [], costoTotal });
      } catch (e) {
        if (!cancelado) setDatos({ instrumentado: false, motivo: "No se pudo conectar a su Supabase — revisá la URL/clave cargada." });
      } finally {
        if (!cancelado) setCargando(false);
      }
    }
    cargar();
    return () => { cancelado = true; };
  }, [cliente.id]);

  // Informe mensual — aperturas, mensajes/fotos, errores y costo de IA del mes elegido.
  // Usa las mismas convenciones que V+V (bco_storage, claves "apertura:", tabla ai_usage/app_errores),
  // así que funciona apenas el cliente tenga su sistema instrumentado igual.
  useEffect(() => {
    let cancelado = false;
    async function cargarInforme() {
      if (!datos.instrumentado || !cliente.supa_url || !cliente.supa_anon_key) return;
      setCargandoInforme(true);
      const headers = { apikey: cliente.supa_anon_key, Authorization: "Bearer " + cliente.supa_anon_key };
      const [anio, mesNum] = mes.split("-").map(Number);
      const inicioMs = new Date(anio, mesNum - 1, 1).getTime();
      const finMs = new Date(anio, mesNum, 1).getTime();
      const inicioISO = new Date(inicioMs).toISOString();
      const finISO = new Date(finMs).toISOString();

      try {
        const [rAperturas, rMensajes, rUsoMes, rErroresMes] = await Promise.all([
          fetch(
            cliente.supa_url + "/rest/v1/aperturas?select=id&creado_en=gte." + encodeURIComponent(inicioISO) + "&creado_en=lt." + encodeURIComponent(finISO),
            { headers: { ...headers, Prefer: "count=exact", Range: "0-0" } }
          ).catch(() => null),
          fetch(cliente.supa_url + "/rest/v1/bco_storage?key=eq.vv_mensajes&select=value", { headers }).catch(() => null),
          fetch(cliente.supa_url + "/rest/v1/ai_usage?creado_en=gte." + encodeURIComponent(inicioISO) + "&creado_en=lt." + encodeURIComponent(finISO) + "&select=costo_usd", { headers }).catch(() => null),
          fetch(cliente.supa_url + "/rest/v1/app_errores?creado_en=gte." + encodeURIComponent(inicioISO) + "&creado_en=lt." + encodeURIComponent(finISO) + "&select=id", { headers }).catch(() => null),
        ]);

        let aperturasMes = 0;
        if (rAperturas && rAperturas.ok) {
          const cr = rAperturas.headers.get("content-range");
          const totalStr = cr ? cr.split("/")[1] : null;
          aperturasMes = totalStr && totalStr !== "*" ? Number(totalStr) : 0;
        }

        let fotosMes = 0;
        if (rMensajes && rMensajes.ok) {
          const filas = await rMensajes.json();
          if (filas && filas[0] && filas[0].value) {
            try {
              const arr = JSON.parse(filas[0].value);
              (arr || []).forEach(m => {
                if (m && typeof m.ts === "number" && m.ts >= inicioMs && m.ts < finMs) {
                  fotosMes += (m.archivos && m.archivos.length) ? m.archivos.length : 1;
                }
              });
            } catch (e) { }
          }
        }

        const usoFilas = (rUsoMes && rUsoMes.ok) ? await rUsoMes.json() : [];
        const costoMes = (usoFilas || []).reduce((a, f) => a + (Number(f.costo_usd) || 0), 0);

        const erroresFilas = (rErroresMes && rErroresMes.ok) ? await rErroresMes.json() : [];

        if (!cancelado) setInforme({ aperturasMes, fotosMes, costoMes, erroresMes: (erroresFilas || []).length });
      } catch (e) {
        if (!cancelado) setInforme({ error: true });
      } finally {
        if (!cancelado) setCargandoInforme(false);
      }
    }
    cargarInforme();
    return () => { cancelado = true; };
  }, [cliente.id, mes, datos.instrumentado]);

  return h("div", { className: "shell" },
    h("button", {
      onClick: onVolver,
      style: { background: "none", border: "none", color: "var(--brass)", fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 14, display: "flex", alignItems: "center", gap: 4 },
    }, "← Volver a Clientes"),
    !editando
      ? h("div", { className: "hero" },
          h("div", { className: "hero-row" },
            h("div", { style: { flex: 1 } },
              h("div", { className: "hero-title" }, cliente.nombre),
              h("div", { className: "hero-sub" }, cliente.contacto || "Sin contacto cargado")
            ),
            h("span", {
              style: {
                fontSize: 10.5, fontWeight: 700, padding: "4px 10px", borderRadius: 20, textTransform: "uppercase",
                color: cliente.estado === "activo" ? "#2e9e5b" : cliente.estado === "pausado" ? "#c48a1c" : "#6e6e73",
                background: cliente.estado === "activo" ? "rgba(46,158,91,.12)" : cliente.estado === "pausado" ? "rgba(196,138,28,.12)" : "rgba(110,110,115,.12)",
              },
            }, cliente.estado)
          ),
          h("div", { style: { display: "flex", gap: 8, marginTop: 14 } },
            h("button", {
              onClick: () => setEditando(true),
              style: { background: "var(--panel)", border: "1px solid var(--border)", color: "var(--text-dim)", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" },
            }, "Editar"),
            h("button", {
              onClick: eliminarCliente,
              style: { background: "rgba(214,69,59,.1)", border: "1px solid rgba(214,69,59,.35)", color: "#d6453b", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" },
            }, "Eliminar")
          )
        )
      : h("div", { className: "gauge", style: { padding: 16, display: "flex", flexDirection: "column", gap: 8 } },
          h("input", { placeholder: "Nombre", value: form.nombre, onChange: e => setForm({ ...form, nombre: e.target.value }), style: inputStyle }),
          h("input", { placeholder: "Contacto", value: form.contacto, onChange: e => setForm({ ...form, contacto: e.target.value }), style: inputStyle }),
          h("select", {
            value: form.estado, onChange: e => setForm({ ...form, estado: e.target.value }),
            style: inputStyle,
          }, h("option", { value: "activo" }, "Activo"), h("option", { value: "pausado" }, "Pausado"), h("option", { value: "inactivo" }, "Inactivo")),
          h("input", { placeholder: "URL de su Supabase", value: form.supa_url, onChange: e => setForm({ ...form, supa_url: e.target.value }), style: inputStyle }),
          h("input", { placeholder: "Clave anon/publishable", value: form.supa_anon_key, onChange: e => setForm({ ...form, supa_anon_key: e.target.value }), style: inputStyle }),
          h("textarea", { placeholder: "Notas", value: form.notas, onChange: e => setForm({ ...form, notas: e.target.value }), rows: 2, style: { ...inputStyle, resize: "vertical" } }),
          h("div", { style: { display: "flex", gap: 8 } },
            h("button", {
              onClick: guardarEdicion, disabled: guardando,
              style: { flex: 1, background: "var(--brass)", color: "#ffffff", border: "none", borderRadius: 8, padding: "10px", fontWeight: 700, fontSize: 13, cursor: "pointer", opacity: guardando ? .6 : 1 },
            }, guardando ? "Guardando…" : "Guardar cambios"),
            h("button", {
              onClick: () => setEditando(false),
              style: { background: "var(--panel)", border: "1px solid var(--border)", color: "var(--text-dim)", borderRadius: 8, padding: "10px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer" },
            }, "Cancelar")
          )
        ),
    cargando
      ? h("div", { style: { textAlign: "center", color: "var(--text-faint)", fontSize: 13, padding: "40px 0" } }, "Conectando con el sistema de " + cliente.nombre + "…")
      : !datos.instrumentado
        ? h("div", { className: "incidents-empty" }, datos.motivo || "Sin datos disponibles todavía.")
        : h("div", null,
            h("div", { className: "gauge-grid" },
              h("div", { className: "gauge" },
                h("div", { className: "gauge-label" }, "Incidentes abiertos"),
                h("div", { className: "gauge-num" + (datos.incidentesAbiertos.length === 0 ? " zero" : "") }, datos.incidentesAbiertos.length)
              ),
              h("div", { className: "gauge" },
                h("div", { className: "gauge-label" }, "Costo de IA acumulado"),
                h("div", { className: "gauge-num" }, "$" + datos.costoTotal.toFixed(2))
              )
            ),
            datos.incidentesAbiertos.length > 0 && h("div", { style: { marginTop: 14 } },
              h("div", { className: "section-label" }, "Incidentes de " + cliente.nombre),
              h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
                datos.incidentesAbiertos.map(inc =>
                  h("div", { key: inc.id, style: { background: "var(--panel)", border: "1px solid rgba(214,69,59,.35)", borderRadius: 12, padding: "12px 14px" } },
                    h("div", { style: { fontSize: 11, fontWeight: 700, color: "#d6453b" } }, inc.app),
                    h("div", { style: { fontSize: 12.5, color: "var(--text)", marginTop: 3 } }, (inc.mensaje || "").slice(0, 140)),
                    h("div", { style: { fontSize: 10.5, color: "var(--text-faint)", marginTop: 3 } }, inc.ocurrencias + " ocurrencias")
                  )
                )
              )
            )
          ),
    datos.instrumentado && h("div", { style: { marginTop: 20 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 } },
        h("div", { className: "section-label", style: { margin: 0, flex: 1 } }, "Informe mensual de uso"),
        h("select", {
          value: mes, onChange: e => setMes(e.target.value),
          style: { background: "var(--panel)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: 8, padding: "6px 10px", fontSize: 12 },
        }, opcionesDeMes(6).map(o => h("option", { key: o.valor, value: o.valor }, o.etiqueta)))
      ),
      cargandoInforme || !informe
        ? h("div", { style: { textAlign: "center", color: "var(--text-faint)", fontSize: 12.5, padding: "24px 0" } }, "Calculando el informe…")
        : informe.error
          ? h("div", { className: "incidents-empty" }, "No se pudo calcular el informe de este mes.")
          : h("div", null,
              h("div", { className: "gauge-grid" },
                [
                  { label: "Aperturas del mes", val: informe.aperturasMes },
                  { label: "Fotos / mensajes subidos", val: informe.fotosMes },
                  { label: "Errores del mes", val: informe.erroresMes },
                  { label: "Costo de IA del mes", val: "$" + informe.costoMes.toFixed(2) },
                ].map((g, i) =>
                  h("div", { className: "gauge", key: i },
                    h("div", { className: "gauge-label" }, g.label),
                    h("div", { className: "gauge-num" + (g.val === 0 ? " zero" : "") }, g.val)
                  )
                )
              ),
              h("button", {
                onClick: () => generarPDFInforme(cliente, opcionesDeMes(6).find(o => o.valor === mes).etiqueta, informe),
                style: {
                  marginTop: 10, width: "100%", background: "var(--brass)", color: "#ffffff", border: "none",
                  borderRadius: 8, padding: "11px", fontWeight: 700, fontSize: 13, cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                },
              }, "📄 Descargar informe en PDF")
            )
    ),
    cliente.notas && h("div", { style: { marginTop: 18 } },
      h("div", { className: "section-label" }, "Notas"),
      h("div", { style: { fontSize: 12.5, color: "var(--text-dim)", lineHeight: 1.6 } }, cliente.notas)
    )
  );
}

function PantallaClientes() {
  const [clientes, setClientes] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [seleccionado, setSeleccionado] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [form, setForm] = useState({ nombre: "", contacto: "", notas: "", supa_url: "", supa_anon_key: "" });
  const [guardando, setGuardando] = useState(false);
  const [busqueda, setBusqueda] = useState("");

  const cargarClientes = useCallback(async () => {
    setCargando(true);
    try {
      const r = await fetch(SUPA_URL + "/rest/v1/clientes?select=*&order=nombre.asc", { headers: SH() });
      const data = await r.json();
      setClientes(Array.isArray(data) ? data : []);
    } catch (e) { }
    setCargando(false);
  }, []);

  useEffect(() => { cargarClientes(); }, [cargarClientes]);

  async function guardarCliente() {
    if (!form.nombre.trim()) return;
    setGuardando(true);
    try {
      const r = await fetch(SUPA_URL + "/rest/v1/clientes", {
        method: "POST",
        headers: { ...SH(), Prefer: "return=minimal" },
        body: JSON.stringify({ ...form, estado: "activo" }),
      });
      if (!r.ok) {
        const detalle = await r.text().catch(() => "");
        alert("No se pudo guardar el cliente (HTTP " + r.status + "):\n" + detalle);
        setGuardando(false);
        return;
      }
      setForm({ nombre: "", contacto: "", notas: "", supa_url: "", supa_anon_key: "" });
      setMostrarForm(false);
      await cargarClientes();
    } catch (e) {
      alert("No se pudo guardar el cliente: " + e.message);
    }
    setGuardando(false);
  }

  if (seleccionado) return h(DetalleCliente, {
    cliente: seleccionado,
    onVolver: () => setSeleccionado(null),
    onActualizado: (actualizado) => { setSeleccionado(actualizado); cargarClientes(); },
  });

  return h("div", { className: "shell" },
    h("div", { className: "topbar" },
      h("div", { className: "brand" },
        h("div", { className: "brand-mark" }, h("span")),
        h("div", null, h("div", { className: "brand-name" }, "Clientes"), h("div", { className: "brand-sub" }, "Cada empresa que usa NEXO, por separado"))
      ),
      h("button", { className: "btn-refresh", onClick: () => setMostrarForm(v => !v) }, mostrarForm ? "Cancelar" : "+ Agregar cliente")
    ),
    mostrarForm && h("div", { className: "gauge", style: { padding: 16, marginBottom: 16, display: "flex", flexDirection: "column", gap: 8 } },
      h("input", { placeholder: "Nombre de la empresa (ej: Belfast Construction Mgmt)", value: form.nombre, onChange: e => setForm({ ...form, nombre: e.target.value }), style: inputStyle }),
      h("input", { placeholder: "Contacto (email o teléfono)", value: form.contacto, onChange: e => setForm({ ...form, contacto: e.target.value }), style: inputStyle }),
      h("input", { placeholder: "URL de su Supabase (https://xxxx.supabase.co)", value: form.supa_url, onChange: e => setForm({ ...form, supa_url: e.target.value }), style: inputStyle }),
      h("input", { placeholder: "Clave anon/publishable de su Supabase", value: form.supa_anon_key, onChange: e => setForm({ ...form, supa_anon_key: e.target.value }), style: inputStyle }),
      h("textarea", { placeholder: "Notas (plan, fecha de alta, lo que sea útil)", value: form.notas, onChange: e => setForm({ ...form, notas: e.target.value }), rows: 2, style: { ...inputStyle, resize: "vertical" } }),
      h("button", {
        onClick: guardarCliente, disabled: guardando || !form.nombre.trim(),
        style: { background: "var(--brass)", color: "#ffffff", border: "none", borderRadius: 8, padding: "10px", fontWeight: 700, fontSize: 13, cursor: "pointer", opacity: guardando ? .6 : 1 },
      }, guardando ? "Guardando…" : "Guardar cliente")
    ),
    clientes.length > 0 && h("input", {
      placeholder: "🔍 Buscar cliente por nombre…",
      value: busqueda, onChange: e => setBusqueda(e.target.value),
      style: { ...inputStyle, marginBottom: 14 },
    }),
    cargando
      ? h("div", { style: { textAlign: "center", color: "var(--text-faint)", padding: "40px 0" } }, "Cargando…")
      : clientes.length === 0
        ? h("div", { className: "incidents-empty" }, "Todavía no cargaste ningún cliente. V+V es de uso interno — acá van las empresas que usen NEXO/ConstruIA como clientes.")
        : (() => {
            const filtrados = clientes.filter(c => (c.nombre || "").toLowerCase().includes(busqueda.trim().toLowerCase()));
            if (filtrados.length === 0) return h("div", { className: "incidents-empty" }, "Ningún cliente coincide con \"" + busqueda + "\".");
            return h("div", { className: "chip-grid" },
              filtrados.map(c =>
                h("div", {
                  key: c.id, className: "chip", onClick: () => setSeleccionado(c),
                },
                  h("div", { className: "chip-top" },
                    h("div", { className: "chip-name" }, c.nombre),
                    h("span", { className: "chip-led " + (c.estado === "activo" ? "g" : c.estado === "pausado" ? "y" : "r") })
                  ),
                  h("div", { className: "chip-detail" }, c.contacto || "Sin contacto"),
                  h("div", { style: { fontSize: 10, color: "var(--text-faint)", marginTop: 6 } }, c.supa_url ? "Conectado a su Supabase" : "Sin Supabase configurado")
                )
              )
            );
          })()
  );
}

const inputStyle = {
  background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 8, padding: "10px 12px",
  color: "var(--text)", fontSize: 13, fontFamily: "'Inter', sans-serif", width: "100%",
};

function App() {
  const [unlocked, setUnlocked] = useState(() => {
    try { if (localStorage.getItem("nexo_control_ok") === "1") return true; } catch (e) {}
    // Dentro del Centro de Operaciones (que ya pide su propia clave) no se vuelve a pedir.
    try { if (window.self !== window.top && sessionStorage.getItem("nexo_control_embed") === "1") return true; } catch (e) {}
    return false;
  });
  const [pantalla, setPantalla] = useState("resumen"); // "resumen" | "clientes"
  if (!unlocked) return h(Gate, { onUnlock: () => setUnlocked(true) });
  const estiloTab = (activa) => ({
    background: activa ? "linear-gradient(180deg,#3a9bff,#0a6fe0)" : "linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45))",
    color: activa ? "#ffffff" : "#0a6fe0",
    border: "1px solid " + (activa ? "rgba(255,255,255,.4)" : "rgba(255,255,255,.95)"),
    WebkitBackdropFilter: "blur(16px) saturate(1.8)", backdropFilter: "blur(16px) saturate(1.8)",
    boxShadow: activa ? "0 8px 18px rgba(10,111,224,.35), inset 0 1.5px 0 rgba(255,255,255,.55)" : "0 8px 20px rgba(40,70,140,.14), inset 0 1.5px 0 rgba(255,255,255,.95)",
    borderRadius: 980, padding: "9px 20px", fontSize: 13.5, fontWeight: 700, cursor: "pointer",
  });
  const tabs = h("div", { style: { display: "flex", gap: 8 } },
    h("button", { onClick: () => setPantalla("resumen"), style: estiloTab(pantalla === "resumen") }, "Resumen"),
    h("button", { onClick: () => setPantalla("clientes"), style: estiloTab(pantalla === "clientes") }, "Clientes")
  );
  if (pantalla === "resumen") return h(Dashboard, { tabs });
  return h("div", null,
    h("div", { style: { display: "flex", justifyContent: "center", padding: "14px 0 0" } }, tabs),
    h(PantallaClientes)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
