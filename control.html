<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>NEXO Control</title>
<style>
  :root{
    --bg: #f2f2f7;
    --panel: #ffffff;
    --panel-2: #f2f2f7;
    --border: #e5e5ea;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --text-faint: #8e8e93;
    --green: #2e9e5b;
    --amber: #c48a1c;
    --red: #d6453b;
    --brass: #a07c3a;
  }
  *{ box-sizing: border-box; }
  .gauge, .chip, .dial-card, .cost-card, .hero{ box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 10px rgba(0,0,0,.03); }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  #root{ min-height:100vh; }

  /* ---- Gate ---- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      var(--bg);
    padding:24px;
  }
  .gate-box{
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--border); border-radius:20px; padding:32px 28px;
  }
  .gate-eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass); font-weight:700; margin-bottom:10px;
  }
  .gate-title{ font-size:22px; font-weight:800; margin:0 0 6px; letter-spacing:-0.01em; }
  .gate-sub{ font-size:13px; color:var(--text-dim); margin:0 0 22px; line-height:1.5; }
  .gate-input{
    width:100%; background:var(--bg); border:1.5px solid var(--border);
    border-radius:9px; padding:13px 14px; color:var(--text); font-size:15px;
    font-family:ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing:.05em;
  }
  .gate-input:focus{ outline:none; border-color:var(--brass); }
  .gate-btn{
    width:100%; margin-top:12px; padding:13px; border:none; border-radius:9px;
    background:var(--brass); color:#ffffff; font-weight:700; font-size:14px;
    cursor:pointer; letter-spacing:.01em;
  }
  .gate-btn:active{ transform: scale(0.99); }
  .gate-error{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }

  /* ---- Shell ---- */
  .shell{ max-width:1180px; margin:0 auto; padding:16px 14px 50px; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--panel);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
  }
  .brand-mark span{ width:8px; height:8px; border-radius:50%; background:var(--green); }
  .brand-name{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:11px; color:var(--text-faint); letter-spacing:.06em; text-transform:uppercase; }
  .refresh-info{ font-size:11.5px; color:var(--text-faint); }
  .mono.refresh-time{ color:var(--text-dim); }
  .btn-refresh{
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; padding:8px 14px; font-size:12.5px; cursor:pointer; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .btn-refresh:hover{ color:var(--text); border-color:var(--text-faint); }

  /* ---- Hero status ---- */
  .hero{
    border-radius:20px; border:1px solid var(--border); background:var(--panel);
    padding:16px 18px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .hero-row{ display:flex; align-items:center; gap:12px; position:relative; }
  .hero-dot{
    width:11px; height:11px; border-radius:50%; flex-shrink:0;
  }
  .hero-dot.g{ background:var(--green); }
  .hero-dot.y{ background:var(--amber); }
  .hero-dot.r{ background:var(--red); }
  .hero-title{ font-size:16px; font-weight:800; letter-spacing:-0.01em; }
  .hero-sub{ font-size:11.5px; color:var(--text-dim); margin-top:1px; }
  .hero-stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
    gap:0; margin-top:14px; position:relative;
    border-top:1px solid var(--border); padding-top:12px;
  }
  .hero-stat{ padding:0 12px; border-left:1px solid var(--border); }
  .hero-stat:first-child{ border-left:none; padding-left:0; }
  .hero-stat-num{ font-size:17px; font-weight:700; font-family:ui-monospace, 'SF Mono', Menlo, monospace; }
  .hero-stat-label{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  /* ---- Section label ---- */
  .section-label{
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    color:var(--brass); margin:18px 0 8px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--border); }

  /* ---- Chip row (systems) ---- */
  .chip-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .chip{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:11px 12px; cursor:pointer; transition:border-color .15s;
  }
  .chip:hover{ border-color:var(--text-faint); }
  .chip-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .chip-name{ font-size:12px; font-weight:700; }
  .chip-led{ width:8px; height:8px; border-radius:50%; }
  .chip-led.g{ background:var(--green); }
  .chip-led.y{ background:var(--amber); }
  .chip-led.r{ background:var(--red); }
  .chip-detail{ font-size:10.5px; color:var(--text-dim); font-family:ui-monospace, 'SF Mono', Menlo, monospace; }
  .chip-expand{ margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-faint); line-height:1.5; display:none; }
  .chip.open .chip-expand{ display:block; }

  /* ---- Gauge cards (activity) ---- */
  .gauge-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:8px; }
  .gauge{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:11px 12px; position:relative;
  }
  .gauge-label{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  .gauge-num{ font-size:19px; font-weight:700; font-family:ui-monospace, 'SF Mono', Menlo, monospace; line-height:1; }
  .gauge-num.zero{ color: var(--text-faint); }
  .gauge-foot{ font-size:10px; color:var(--text-dim); margin-top:4px; }

  /* ---- Costs ---- */
  .cost-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:14px 16px;
  }
  .cost-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; border-bottom:1px solid var(--border);
  }
  .cost-row:last-of-type{ border-bottom:none; }
  .cost-name{ font-size:12.5px; font-weight:600; }
  .cost-tag{ font-size:9.5px; color:var(--text-faint); margin-top:1px; }
  .cost-amount{ font-size:14px; font-weight:700; font-family:ui-monospace, 'SF Mono', Menlo, monospace; }
  .cost-total{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; padding-top:11px; border-top:1.5px solid var(--brass);
  }
  .cost-total-label{ font-size:11.5px; font-weight:700; color:var(--brass); text-transform:uppercase; letter-spacing:.05em; }
  .cost-total-amount{ font-size:18px; font-weight:800; font-family:ui-monospace, 'SF Mono', Menlo, monospace; color:var(--brass); }
  .cost-note{ font-size:10.5px; color:var(--text-faint); margin-top:10px; line-height:1.5; }

  /* ---- Incidents ---- */
  .incidents-empty{
    background:var(--panel); border:1px dashed var(--border); border-radius:16px;
    padding:20px 16px; text-align:center; color:var(--text-faint); font-size:12px;
  }

  /* ---- Footer ---- */
  .footer{ text-align:center; margin-top:40px; font-size:11px; color:var(--text-faint); }

  @media (max-width:640px){
    .hero-title{ font-size:17px; }
    .hero-stats{ grid-template-columns:repeat(2,1fr); row-gap:16px; }
    .hero-stat{ border-left:none !important; padding-left:0 !important; }
  }
  @keyframes pulso{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(1.3); }
  }


  /* ---- Cabecera del Resumen ---- */
  .topbar-sala{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:12px; margin-bottom:16px;
  }
  .tb-izq{ justify-self:start; }
  .tb-centro{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
  .tb-der{ justify-self:end; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  @media (max-width:760px){
    .topbar-sala{ grid-template-columns:1fr; justify-items:center; }
    .tb-centro{ order:1; } .tb-izq{ order:2; justify-self:center; } .tb-der{ order:3; justify-self:center; align-items:center; }
  }

  /* ---- Instrumentos (relojes) ---- */
  .dial-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .dial-card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .dial-card .gauge-label{ align-self:center; margin-bottom:0; }
  .dial-sub{ font-size:10.5px; color:var(--text-dim); font-family: ui-monospace, 'SF Mono', Menlo, monospace; text-align:center; }

  /* ---- Vidrio líquido sobre fondo blanco ---- */
  html,body{ background:#ffffff; }
  body{
    background:
      radial-gradient(520px 520px at 8% 6%, rgba(110,170,255,.40), rgba(110,170,255,0) 70%),
      radial-gradient(560px 560px at 96% 22%, rgba(255,150,200,.34), rgba(255,150,200,0) 70%),
      radial-gradient(560px 560px at 4% 55%, rgba(110,230,190,.36), rgba(110,230,190,0) 70%),
      radial-gradient(600px 600px at 98% 78%, rgba(170,150,255,.32), rgba(170,150,255,0) 70%),
      radial-gradient(520px 520px at 10% 100%, rgba(255,200,140,.36), rgba(255,200,140,0) 70%),
      #ffffff;
    background-attachment: fixed;
  }
  .hero, .chip, .gauge, .dial-card, .cost-card, .incidents-empty{
    background:linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.34));
    -webkit-backdrop-filter:blur(24px) saturate(1.8); backdrop-filter:blur(24px) saturate(1.8);
    border:1.5px solid rgba(255,255,255,.98);
    box-shadow:0 14px 36px rgba(40,70,140,.12), inset 0 0 0 1px rgba(255,255,255,.55), inset 0 2px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(120,150,210,.14);
  }
  .hero{ border-radius:28px; }
  .dial-card{ border-radius:28px; }
  .chip, .gauge, .cost-card, .incidents-empty{ border-radius:22px; }
  .hero-stats, .hero-stat, .cost-row, .cost-total{ border-color:rgba(60,80,130,.14); }
  .gauge-num{ text-shadow:0 1px 0 #fff, 0 -1px 2px rgba(60,80,130,.18); }
  .hero-stat-num{ text-shadow:0 1px 0 #fff, 0 -1px 2px rgba(60,80,130,.18); }
  .btn-refresh{
    background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.45));
    -webkit-backdrop-filter:blur(16px) saturate(1.8); backdrop-filter:blur(16px) saturate(1.8);
    border:1px solid rgba(255,255,255,.95); color:#0a6fe0; border-radius:980px; padding:9px 18px;
    box-shadow:0 8px 20px rgba(40,70,140,.14), inset 0 1.5px 0 rgba(255,255,255,.95);
  }
  .btn-refresh:hover{ color:#0a6fe0; border-color:#fff; }
  .hero-dot, .chip-led{
    position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:34px; height:34px; border-radius:30%; font-size:34px; overflow:hidden;
    border:1.5px solid rgba(255,255,255,.95);
    -webkit-backdrop-filter:blur(14px) saturate(2); backdrop-filter:blur(14px) saturate(2);
    box-shadow:0 12px 24px var(--orb-sombra,rgba(0,0,0,.25)), 0 1px 2px rgba(0,0,0,.10),
      inset 0 0 0 1px rgba(255,255,255,.55), inset 0 3px 6px rgba(255,255,255,.85), inset 0 -8px 14px var(--orb-int,rgba(0,40,30,.25));
  }
  .hero-dot::before, .chip-led::before{
    content:''; position:absolute; left:0; top:0; right:0; height:52%;
    background:linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.05));
    border-radius:30% 30% 60% 60% / 30% 30% 40% 40%;
  }
  .hero-dot::after, .chip-led::after{
    position:relative; color:#fff; font-weight:800; font-size:.52em; line-height:1;
    text-shadow:0 2px 4px rgba(0,0,0,.35);
  }
  .hero-dot.g, .chip-led.g{ --orb-sombra:rgba(25,160,90,.38); --orb-int:rgba(0,90,40,.40); background:linear-gradient(150deg, rgba(120,240,160,.82), rgba(20,170,85,.88)); }
  .hero-dot.y, .chip-led.y{ --orb-sombra:rgba(230,150,20,.38); --orb-int:rgba(150,80,0,.38); background:linear-gradient(150deg, rgba(255,225,130,.85), rgba(240,160,20,.90)); }
  .hero-dot.r, .chip-led.r{ --orb-sombra:rgba(214,69,59,.38); --orb-int:rgba(130,20,10,.40); background:linear-gradient(150deg, rgba(255,160,150,.85), rgba(220,60,50,.90)); }
  .hero-dot.g::after, .chip-led.g::after{ content:'✓'; }
  .hero-dot.y::after, .chip-led.y::after{ content:'!'; }
  .hero-dot.r::after, .chip-led.r::after{ content:'✕'; }
  .hero-dot{ width:64px; height:64px; font-size:64px; }
  .chip-led{ width:36px; height:36px; font-size:36px; }
  .hero-row{ gap:18px; }
  .hero-title{ font-size:22px; }
</style>
</head>

<script>
const { useState, useEffect, useCallback } = React;
const h = React.createElement;

// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const SUPA_URL = "https://bxhjgxzvayszfqwlwinq.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4aGpneHp2YXlzemZxd2x3aW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTI4NTMsImV4cCI6MjA5ODQyODg1M30.Wq7TbIUc0t3u7vbmi_yU49BlOaWzl9sByySBpV1HcZQ";
const APP_URL = "https://vvconstruccionesultimo.vercel.app";
const AUTH_URL = "https://bxhjgxzvayszfqwlwinq.supabase.co/functions/v1/a-nexo-auth";
const HEALTH_URL = "https://bxhjgxzvayszfqwlwinq.supabase.co/functions/v1/hyper-worker";

const SH = () => ({ "Content-Type": "application/json", apikey: SUPA_ANON, Authorization: "Bearer " + SUPA_ANON });

// Claves reales usadas por la app VVCONSTRUCCIONESULTIMO dentro de bco_storage
const hace = (iso) => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(m)) return "—";
  if (m < 1) return "ahora";
  if (m < 60) return "hace " + m + " min";
  if (m < 1440) return "hace " + Math.floor(m / 60) + " h";
  return "hace " + Math.floor(m / 1440) + " d";
};
const KEYS = ["vv_obras", "vv_personal", "vv_matpedidos", "vv_pedidos", "vv_mensajes", "vv_avance", "vv_certif_sem", "vv_bitacora", "vv_auditoria"];

// Igual que contarRegistrosAgrupados/contarValor, pero solo cuenta los registros
// cuyo campo "ts" (timestamp real, en milisegundos) cae dentro del día de hoy.
// Los registros que no tienen "ts" no se cuentan acá (quedan solo en el total).
function contarHoy(raw, agrupado) {
  if (!raw) return 0;
  try {
    const v = JSON.parse(raw);
    const inicioHoy = new Date(); inicioHoy.setHours(0, 0, 0, 0);
    const inicioMs = inicioHoy.getTime();
    let items = [];
    if (Array.isArray(v)) items = v;
    else if (v && typeof v === "object" && agrupado) items = Object.values(v).flatMap(x => Array.isArray(x) ? x : []);
    return items.filter(it => it && typeof it.ts === "number" && it.ts >= inicioMs).length;
  } catch (e) {
    return 0;
  }
}

function contarValor(raw) {
  if (!raw) return 0;
  try {
    const v = JSON.parse(raw);
    if (Array.isArray(v)) return v.length;
    if (v && typeof v === "object") return Object.keys(v).length;
    return 0;
  } catch (e) {
    return 0;
  }
}

// Para claves guardadas como { obraId: [registro, registro, ...] } — no queremos
// contar cuántas OBRAS tienen datos, sino cuántos REGISTROS hay en total sumando todas.
function contarRegistrosAgrupados(raw) {
  if (!raw) return 0;
  try {
    const v = JSON.parse(raw);
    if (Array.isArray(v)) return v.length;
    if (v && typeof v === "object") {
      return Object.values(v).reduce((acc, lista) => acc + (Array.isArray(lista) ? lista.length : 0), 0);
    }
    return 0;
  } catch (e) {
    return 0;
  }
}

// ════════════════════════════════════════════════════════════
// GATE (contraseña simple, solo para desalentar acceso casual)
// ════════════════════════════════════════════════════════════
function Gate({ onUnlock }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState("");
  const [verificando, setVerificando] = useState(false);

  async function intentar() {
    if (!val || verificando) return;
    setVerificando(true);
    setErr("");
    try {
      const r = await fetch(AUTH_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPA_ANON, Authorization: "Bearer " + SUPA_ANON },
        body: JSON.stringify({ password: val }),
      });
      const data = await r.json();
      if (data && data.ok) {
        try { localStorage.setItem("nexo_control_ok", "1"); } catch (e) {}
        onUnlock();
      } else {
        setErr("Clave incorrecta.");
      }
    } catch (e) {
      setErr("No se pudo verificar — revisá tu conexión.");
    }
    setVerificando(false);
  }

  return h("div", { className: "gate" },
    h("div", { className: "gate-box" },
      h("div", { className: "gate-eyebrow" }, "Acceso restringido"),
      h("h1", { className: "gate-title" }, "NEXO Control"),
      h("p", { className: "gate-sub" }, "Panel interno de monitoreo. No es la demo comercial ni la app operativa — es solo para vos."),
      h("input", {
        className: "gate-input",
        type: "password",
        placeholder: "Clave de acceso",
        value: val,
        onChange: e => setVal(e.target.value),
        onKeyDown: e => { if (e.key === "Enter") intentar(); },
        autoFocus: true
      }),
      h("button", { className: "gate-btn", onClick: intentar, disabled: verificando }, verificando ? "Verificando…" : "Entrar"),
      h("div", { className: "gate-error" }, err)
    )
  );
}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
// GRÁFICOS — SVG a mano, sin librerías externas
// ════════════════════════════════════════════════════════════

// Dona con leyenda — usada para "uso por vista"
function DonutConLeyenda({ data, size }) {
  size = size || 132;
  const r = size / 2 - 15;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  const total = data.reduce((a, d) => a + d.value, 0);
  let acc = 0;
  const segmentos = total === 0 ? null : data.filter(d => d.value > 0).map((d, i) => {
    const len = (d.value / total) * circ;
    const el = h("circle", {
      key: i, cx, cy, r, fill: "none", stroke: d.color, strokeWidth: 15,
      strokeDasharray: len + " " + (circ - len), strokeDashoffset: -acc,
    });
    acc += len;
    return el;
  });
  return h("div", { style: { display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" } },
    h("svg", { width: size, height: size, viewBox: `0 0 ${size} ${size}`, style: { flexShrink: 0 } },
      !segmentos
        ? h("circle", { cx, cy, r, fill: "none", stroke: "var(--border)", strokeWidth: 15 })
        : h("g", { transform: `rotate(-90 ${cx} ${cy})` }, segmentos),
      h("text", { x: cx, y: cy - 3, textAnchor: "middle", fontSize: 20, fontWeight: 700, fill: "var(--text)", fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace" }, total),
      h("text", { x: cx, y: cy + 13, textAnchor: "middle", fontSize: 8.5, fill: "var(--text-faint)", letterSpacing: ".05em" }, "TOTAL")
    ),
    h("div", { style: { display: "flex", flexDirection: "column", gap: 6, flex: 1, minWidth: 110 } },
      data.map((d, i) =>
        h("div", { key: i, style: { display: "flex", alignItems: "center", gap: 7, fontSize: 11.5 } },
          h("span", { style: { width: 9, height: 9, borderRadius: 3, background: d.color, flexShrink: 0 } }),
          h("span", { style: { color: "var(--text-dim)", flex: 1 } }, d.label),
          h("span", { style: { color: "var(--text)", fontWeight: 700, fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace" } }, d.value)
        )
      )
    )
  );
}

// Reloj de 24hs — a qué hora del día se usa más el sistema
function RelojActividad({ porHora, size }) {
  size = size || 260;
  const cx = size / 2, cy = size / 2;
  const rInner = size * 0.2, rOuterMax = size * 0.34;
  const max = Math.max(1, ...porHora);
  const marcas = [];
  for (let hora = 0; hora < 24; hora++) {
    const val = porHora[hora] || 0;
    const largo = rInner + 4 + (val / max) * (rOuterMax - rInner - 4);
    const angle = (hora / 24) * 360 - 90;
    const rad = (angle * Math.PI) / 180;
    const esPico = val === max && val > 0;
    marcas.push(h("line", {
      key: hora,
      x1: cx + rInner * Math.cos(rad), y1: cy + rInner * Math.sin(rad),
      x2: cx + largo * Math.cos(rad), y2: cy + largo * Math.sin(rad),
      stroke: esPico ? "#ff9a2e" : (val > 0 ? "#f2c76e" : "rgba(255,255,255,.22)"),
      strokeWidth: esPico ? 5.4 : 3.6, strokeLinecap: "round",
      filter: esPico ? "url(#relojGlow)" : undefined,
    }));
  }
  const etiquetas = [0, 6, 12, 18].map(hh => {

// Barras — costo de Claude, últimos 7 días
function BarrasCosto7Dias({ data, width }) {
  width = width || 280;
  const alto = 84;
  const max = Math.max(0.01, ...data.map(d => d.monto));
  const anchoBarra = (width / data.length) * 0.5;
  return h("svg", { width: "100%", height: alto + 22, viewBox: `0 0 ${width} ${alto + 22}`, preserveAspectRatio: "xMidYMid meet" },
    h("defs", null, h("linearGradient", { id: "barraVidrio", x1: 0, y1: 0, x2: 0, y2: 1 }, h("stop", { offset: 0, stopColor: "#ffd98a" }), h("stop", { offset: 1, stopColor: "#c8962f" }))),
    data.map((d, i) => {
      const bh = (d.monto / max) * alto;
      const x = i * (width / data.length) + ((width / data.length) - anchoBarra) / 2;
      const y = alto - Math.max(bh, 3);
      const esHoy = i === data.length - 1;
      return h("g", { key: i },
        h("rect", { x, y, width: anchoBarra, height: Math.max(bh, 3), rx: anchoBarra / 2.4, fill: "url(#barraVidrio)", opacity: esHoy ? 1 : .6, stroke: "rgba(255,255,255,.9)", strokeWidth: 1 }),
        h("rect", { x: x + anchoBarra * 0.18, y: y + 1.5, width: anchoBarra * 0.22, height: Math.max(bh - 3, 0), rx: 2, fill: "rgba(255,255,255,.55)" }),
        h("text", { x: x + anchoBarra / 2, y: alto + 14, textAnchor: "middle", fontSize: 10, fill: "var(--text-faint)" }, d.etiqueta)
      );
    })
  );
}

// Sparkline tipo monitor de signos vitales — latencia de los últimos chequeos automáticos
function SparklineLatencia({ historial, width }) {
  width = width || 240;
  const alto = 76;
  if (!historial || historial.length < 2) {
    return h("div", { style: { width: "100%", height: alto, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-faint)", fontSize: 11 } }, "Juntando datos…");
  }
  const valores = historial.map(p => p.ms);
  const max = Math.max(...valores, 50);
  const min = Math.min(...valores, 0);
  const rango = Math.max(1, max - min);
  const puntos = historial.map((p, i) => {
    const x = (i / (historial.length - 1)) * width;
    const y = alto - ((p.ms - min) / rango) * alto * 0.8 - alto * 0.08;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const ultimo = historial[historial.length - 1];
  const ultimoX = width;
  const ultimoY = alto - ((ultimo.ms - min) / rango) * alto * 0.8 - alto * 0.08;
  const color = ultimo.ok ? "#2e9e5b" : "#d6453b";
  return h("svg", { width: "100%", height: alto, viewBox: `0 0 ${width} ${alto}`, preserveAspectRatio: "none" },
    h("polyline", { points: puntos, fill: "none", stroke: color, strokeWidth: 2, strokeLinejoin: "round", strokeLinecap: "round" }),
    h("circle", { cx: ultimoX, cy: ultimoY, r: 3.5, fill: color }),
    h("circle", { cx: ultimoX, cy: ultimoY, r: 7, fill: "none", stroke: color, strokeWidth: 1.5, opacity: .5 })
  );
}

// Gauge tipo velocímetro — señal de conexión general, con aguja y zonas de color
function GaugeSenal({ score, size }) {
  size = size || 148;
  const cx = size / 2, cy = size * 0.6, r = size * 0.42;
  function punto(v) {
    const ang = 180 - (v / 100) * 180;
    const rad = (ang * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }
  function arco(v1, v2, color) {
    const p1 = punto(v1), p2 = punto(v2);
    return h("path", { d: "M " + p1.x + " " + p1.y + " A " + r + " " + r + " 0 0 1 " + p2.x + " " + p2.y, fill: "none", stroke: color, strokeWidth: 11, strokeLinecap: "round" });
  }
  if (score === null) {
    return h("div", { style: { width: size, height: size * 0.62, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-faint)", fontSize: 11 } }, "Juntando datos…");
  }
  const s = Math.max(0, Math.min(100, score));
  const punta = punto(s);
  const color = s >= 75 ? "#2e9e5b" : s >= 40 ? "#c48a1c" : "#d6453b";
  const etiqueta = s >= 75 ? "Excelente" : s >= 40 ? "Inestable" : "Con problemas";
  return h("div", { style: { display: "flex", flexDirection: "column", alignItems: "center" } },
    h("svg", { width: size, height: size * 0.62, viewBox: "0 0 " + size + " " + (size * 0.62) },
      arco(0, 40, "rgba(214,69,59,.3)"),
      arco(40, 75, "rgba(196,138,28,.3)"),
      arco(75, 100, "rgba(46,158,91,.3)"),
      h("line", { x1: cx, y1: cy, x2: punta.x, y2: punta.y, stroke: color, strokeWidth: 3, strokeLinecap: "round" }),
      h("circle", { cx, cy, r: 4.5, fill: color })
    ),
    h("div", { style: { fontSize: 17, fontWeight: 800, fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace", color, marginTop: -4 } }, Math.round(s) + "%"),
    h("div", { style: { fontSize: 10.5, color: "var(--text-dim)" } }, etiqueta)
  );
}

function Dashboard({ tabs }) {
  const [cargando, setCargando] = useState(true);
  const [actividad, setActividad] = useState({ obras: 0, personal: 0, matpedidos: 0, pedidos: 0, mensajes: 0, avance: 0, certificados: 0, bitacora: 0, auditoria: 0 });
  const [actividadHoy, setActividadHoy] = useState({ matpedidos: 0, pedidos: 0, mensajes: 0, avance: 0, certificados: 0, bitacora: 0, auditoria: 0 });
  const [aperturas, setAperturas] = useState({ total: 0, hoy: 0, ultima: null, hoyPorVista: { contratista: 0, cliente: 0, constructora: 0, propietario: 0 }, porVista: { contratista: 0, cliente: 0, constructora: 0, propietario: 0 }, porHora: new Array(24).fill(0) });
  const [estadoApps, setEstadoApps] = useState({ contratista: { errores: 0 }, cliente: { errores: 0 }, constructora: { errores: 0 }, propietario: { errores: 0 } });
  const [costoClaude, setCostoClaude] = useState({ mes: null, hoy: null, porApp: [], ultimos7: [] }); // null = todavía no cargó
  const [incidentes, setIncidentes] = useState([]);
  const [uptime, setUptime] = useState({ pct: null, chequeos: 0, historial: [], senal: null }); // null = todavía no cargó
  const [alertas, setAlertas] = useState([]);
  const [supaOk, setSupaOk] = useState(null); // null = chequeando, true/false
  const [appOk, setAppOk] = useState(null);
  const [salud, setSalud] = useState({ vercel: null, claude: null, resend: null });
  const [ultimaActualizacion, setUltimaActualizacion] = useState(null);
  const [chipAbierto, setChipAbierto] = useState(null);
  const [fallas, setFallas] = useState({ actividad: false, aperturas: false, apps: false, costo: false, incidentes: false, uptime: false, alertas: false });

  const cargarTodo = useCallback(async () => {
    setCargando(true);

    // 1) Chequeo de Supabase: golpeamos el endpoint REST raíz
    try {
      const r = await fetch(SUPA_URL + "/rest/v1/bco_storage?select=key&limit=1", { headers: SH() });
      setSupaOk(r.ok);
    } catch (e) {
      setSupaOk(false);
    }

    // 2) Chequeo real de Vercel, Claude y Resend — todo del lado del servidor,
    // ninguna clave viaja al navegador.
    try {
      const r = await fetch(HEALTH_URL, { headers: { apikey: SUPA_ANON, Authorization: "Bearer " + SUPA_ANON } });
      const data = await r.json();
      setSalud({ vercel: data.vercel, claude: data.claude, resend: data.resend });
      setAppOk(!!(data.vercel && data.vercel.ok));
    } catch (e) {
      setSalud({ vercel: { ok: false, error: "sin respuesta" }, claude: { ok: false, error: "sin respuesta" }, resend: { ok: false, error: "sin respuesta" } });
      setAppOk(false);
    }

    // 3) Traer los datos de actividad desde bco_storage
    try {
      const r = await fetch(
        SUPA_URL + "/rest/v1/bco_storage?key=in.(" + KEYS.join(",") + ")&select=key,value",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const filas = await r.json();
      const mapa = {};
      (filas || []).forEach(f => { mapa[f.key] = f.value; });

      setActividad({
        obras: contarValor(mapa["vv_obras"]),
        personal: contarValor(mapa["vv_personal"]),
        matpedidos: contarValor(mapa["vv_matpedidos"]),
        pedidos: contarValor(mapa["vv_pedidos"]),
        mensajes: contarValor(mapa["vv_mensajes"]),
        avance: contarRegistrosAgrupados(mapa["vv_avance"]),
        certificados: contarRegistrosAgrupados(mapa["vv_certif_sem"]),
        bitacora: contarValor(mapa["vv_bitacora"]),
        auditoria: contarValor(mapa["vv_auditoria"]),
      });

      setActividadHoy({
        matpedidos: contarHoy(mapa["vv_matpedidos"], false),
        pedidos: contarHoy(mapa["vv_pedidos"], false),
        mensajes: contarHoy(mapa["vv_mensajes"], false),
        avance: contarHoy(mapa["vv_avance"], true),
        certificados: contarHoy(mapa["vv_certif_sem"], true),
        bitacora: contarHoy(mapa["vv_bitacora"], false),
        auditoria: contarHoy(mapa["vv_auditoria"], false),
      });
      setFallas(f => ({ ...f, actividad: false }));
    } catch (e) {
      // No mostramos los números viejos como si fueran de ahora — se marca la falla
      // y la sección avisa en vez de mentir con un 0 o un número desactualizado.
      setFallas(f => ({ ...f, actividad: true }));
    }

    // 4) Aperturas de app — tabla liviana propia (no bco_storage). El total y "hoy"
    // se piden como CONTEO puro (Postgres cuenta, no manda filas). El desglose por
    // vista/hora usa una ventana acotada de 30 días, para no traer todo el historial.
    try {
      const inicioHoyISO = new Date(new Date().setHours(0, 0, 0, 0)).toISOString();
      const desde30ISO = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

      const [rTotal, rHoy, rVentana] = await Promise.all([
        fetch(SUPA_URL + "/rest/v1/aperturas?select=id", { headers: { ...SH(), Prefer: "count=exact", Range: "0-0" } }),
        fetch(SUPA_URL + "/rest/v1/aperturas?select=id&creado_en=gte." + encodeURIComponent(inicioHoyISO), { headers: { ...SH(), Prefer: "count=exact", Range: "0-0" } }),
        fetch(SUPA_URL + "/rest/v1/aperturas?select=app,creado_en&creado_en=gte." + encodeURIComponent(desde30ISO) + "&order=creado_en.desc&limit=20000", { headers: SH() }),
      ]);
      // 416 = rango fuera de la tabla (tabla vacía): es un 0 legítimo, no una falla.
      const okRango = (r) => r.ok || r.status === 416;
      if (!okRango(rTotal) || !okRango(rHoy) || !rVentana.ok) throw new Error("HTTP " + rTotal.status + "/" + rHoy.status + "/" + rVentana.status);

      const totalDesdeRango = (r) => {
        const cr = r.headers.get("content-range"); // formato "0-0/1234"
        if (!cr) return 0;
        const total = cr.split("/")[1];
        return total && total !== "*" ? Number(total) : 0;
      };

      const total = totalDesdeRango(rTotal);
      let hoy = totalDesdeRango(rHoy);
      const filasVentana = await rVentana.json();

      const porVista = { contratista: 0, cliente: 0, constructora: 0, propietario: 0 };
      const porHora = new Array(24).fill(0);
      const hoyPorVista = { contratista: 0, cliente: 0, constructora: 0, propietario: 0 };
      const inicioHoyMs = new Date().setHours(0, 0, 0, 0);
      let hoyFilas = 0;
      (filasVentana || []).forEach(f => {
        if (f.app && porVista.hasOwnProperty(f.app)) porVista[f.app]++;
        const fecha = new Date(f.creado_en);
        if (!isNaN(fecha)) {
          porHora[fecha.getHours()]++;
          if (fecha.getTime() >= inicioHoyMs) { hoyFilas++; if (f.app && hoyPorVista.hasOwnProperty(f.app)) hoyPorVista[f.app]++; }
        }
      });
      // El contador "hoy" nunca puede ser menor que las filas de hoy que vemos.
      if (hoyFilas > hoy) hoy = hoyFilas;
      const ultima = filasVentana && filasVentana.length ? filasVentana[0].creado_en : null;

      setAperturas({ total, hoy, ultima, hoyPorVista, porVista, porHora });
      setFallas(f => ({ ...f, aperturas: false }));
    } catch (e) {
      setFallas(f => ({ ...f, aperturas: true }));
    }

    // 5) Traer errores reales reportados por las 4 apps (últimas 24hs)
    try {
      const desde = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const r = await fetch(
        SUPA_URL + "/rest/v1/app_errores?creado_en=gte." + encodeURIComponent(desde) + "&select=app,mensaje,creado_en&order=creado_en.desc&limit=500",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const filas = await r.json();
      const estado = { contratista: { errores: 0 }, cliente: { errores: 0 }, constructora: { errores: 0 }, propietario: { errores: 0 } };
      (filas || []).forEach(f => {
        if (f.app && estado.hasOwnProperty(f.app)) {
          estado[f.app].errores++;
          if (!estado[f.app].ultimo) estado[f.app].ultimo = f.mensaje; // el primero es el más reciente (order desc)
        }
      });
      setEstadoApps(estado);
      setFallas(f => ({ ...f, apps: false }));
    } catch (e) {
      setFallas(f => ({ ...f, apps: true }));
    }

    // 6) Costo real de Claude API — leído directo de ai_usage (tokens × precio real de cada llamada)
    try {
      const ahora = new Date();
      const inicioMes = new Date(Date.UTC(ahora.getUTCFullYear(), ahora.getUTCMonth(), 1)).toISOString();
      const inicioHoy = new Date(Date.UTC(ahora.getUTCFullYear(), ahora.getUTCMonth(), ahora.getUTCDate())).toISOString();
      const r = await fetch(
        SUPA_URL + "/rest/v1/ai_usage?creado_en=gte." + encodeURIComponent(inicioMes) + "&select=app,costo_usd,creado_en&limit=10000",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const filas = await r.json();
      let mes = 0, hoy = 0;
      const porAppMapa = {};
      const porDiaMapa = {};
      (filas || []).forEach(f => {
        const c = Number(f.costo_usd) || 0;
        mes += c;
        if (f.creado_en >= inicioHoy) hoy += c;
        const app = f.app || "sin identificar";
        porAppMapa[app] = (porAppMapa[app] || 0) + c;
        const dia = (f.creado_en || "").slice(0, 10); // "YYYY-MM-DD"
        if (dia) porDiaMapa[dia] = (porDiaMapa[dia] || 0) + c;
      });
      const porApp = Object.entries(porAppMapa).sort((a, b) => b[1] - a[1]).map(([app, monto]) => ({ app, monto }));
      // Últimos 7 días, en orden — con $0 en los días sin uso (para que el gráfico no salte fechas)
      const ultimos7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(Date.now() - i * 86400000);
        const clave = d.toISOString().slice(0, 10);
        ultimos7.push({ dia: clave, etiqueta: d.toLocaleDateString("es-AR", { weekday: "short" }), monto: porDiaMapa[clave] || 0 });
      }
      setCostoClaude({ mes, hoy, porApp, ultimos7 });
      setFallas(f => ({ ...f, costo: false }));
    } catch (e) {
      // Si falla, NO tocamos costoClaude — así el panel sigue mostrando el último
      // valor real conocido en vez de saltar a $0, y la falla queda marcada aparte.
      setFallas(f => ({ ...f, costo: true }));
    }

    // 7) Incidentes — errores agrupados automáticamente por el trigger de Supabase
    try {
      const r = await fetch(
        SUPA_URL + "/rest/v1/incidentes?select=*&order=ultima_vez.desc&limit=100",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      setIncidentes(Array.isArray(data) ? data : []);
      setFallas(f => ({ ...f, incidentes: false }));
    } catch (e) {
      setFallas(f => ({ ...f, incidentes: true }));
    }

    // 8) Uptime real + historial de latencia (últimos chequeos automáticos, cada 10 min)
    try {
      const desde = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const r = await fetch(
        SUPA_URL + "/rest/v1/system_health?creado_en=gte." + encodeURIComponent(desde) +
          "&select=vercel_ok,claude_ok,resend_ok,supabase_ok,vercel_ms,claude_ms,resend_ms,supabase_ms,creado_en&order=creado_en.asc&limit=500",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const filas = await r.json();
      if (Array.isArray(filas) && filas.length > 0) {
        const ok = filas.filter(f => f.vercel_ok && f.claude_ok && f.resend_ok && f.supabase_ok).length;

        // Historial de latencia promedio por chequeo — los últimos 24 (≈ 4hs a 10min c/u)
        const historial = filas.slice(-24).map(f => {
          const ms = [f.vercel_ms, f.claude_ms, f.resend_ms, f.supabase_ms].filter(x => typeof x === "number");
          const prom = ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0;
          const okTodos = !!(f.vercel_ok && f.claude_ok && f.resend_ok && f.supabase_ok);
          return { ms: Math.round(prom), ok: okTodos };
        });

        // Señal de conexión — combina cuántos servicios respondieron bien en el último chequeo
        // con qué tan rápido lo hicieron (más lento = señal más débil, aunque esté "ok")
        const ultimo = filas[filas.length - 1];
        const serviciosOk = [ultimo.vercel_ok, ultimo.claude_ok, ultimo.resend_ok, ultimo.supabase_ok].filter(Boolean).length;
        const msUltimo = [ultimo.vercel_ms, ultimo.claude_ms, ultimo.resend_ms, ultimo.supabase_ms].filter(x => typeof x === "number");
        const promUltimo = msUltimo.length ? msUltimo.reduce((a, b) => a + b, 0) / msUltimo.length : 0;
        const senal = Math.max(0, Math.min(100, (serviciosOk / 4) * 70 + Math.max(0, 1 - promUltimo / 900) * 30));

        setUptime({ pct: (ok / filas.length) * 100, chequeos: filas.length, historial, senal });
      } else {
        setUptime({ pct: null, chequeos: 0, historial: [], senal: null });
      }
      setFallas(f => ({ ...f, uptime: false }));
    } catch (e) {
      setFallas(f => ({ ...f, uptime: true }));
    }

    // 9) Alertas activas — abiertas y cerradas solas por el cron, según las reglas configuradas
    try {
      const r = await fetch(
        SUPA_URL + "/rest/v1/alertas?estado=eq.open&select=*&order=nivel.asc,actualizado_en.desc&limit=50",
        { headers: SH() }
      );
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      setAlertas(Array.isArray(data) ? data : []);
      setFallas(f => ({ ...f, alertas: false }));
    } catch (e) {
      setFallas(f => ({ ...f, alertas: true }));
    }

    setUltimaActualizacion(new Date());
    setCargando(false);
  }, []);

  const marcarResuelto = useCallback(async (id) => {
    try {
      await fetch(SUPA_URL + "/rest/v1/incidentes?id=eq." + id, {
        method: "PATCH",
        headers: { ...SH(), "Prefer": "return=minimal" },
        body: JSON.stringify({ estado: "resolved", resuelto_en: new Date().toISOString() }),
      });
      setIncidentes(prev => prev.map(inc => inc.id === id ? { ...inc, estado: "resolved" } : inc));
    } catch (e) {}
  }, []);

  useEffect(() => { cargarTodo(); }, [cargarTodo]);

  // Costos: Supabase/Vercel son de plan fijo (se cargan a mano), Claude ahora es real (ai_usage)
  const costos = [
    { nombre: "Supabase", tag: "Plan Pro · base de datos y storage", monto: 25, fuente: "manual" },
    { nombre: "Vercel", tag: "Plan Pro · hosting y deploys", monto: 20, fuente: "manual" },
    { nombre: "Claude API", tag: costoClaude.mes === null ? "IA dentro de las apps · cargando…" : "IA dentro de las apps · costo real del mes en curso", monto: costoClaude.mes === null ? 104 : Number(costoClaude.mes.toFixed(2)), fuente: costoClaude.mes === null ? "manual" : "real" },
    { nombre: "Resend", tag: "Envío de mails · plan gratuito", monto: 0, fuente: "gratis" },
    { nombre: "GitHub", tag: "Repositorios · plan gratuito", monto: 0, fuente: "gratis" },
  ];
  const totalCostos = costos.reduce((a, c) => a + c.monto, 0);

  // Semáforo general: si algo crítico está caído, todo pasa a rojo
  let estadoGeneral = "g";
  let estadoTexto = "Todos los sistemas operativos";
  if (supaOk === false) { estadoGeneral = "r"; estadoTexto = "Hay un problema con la base de datos"; }
  else if (appOk === false) { estadoGeneral = "y"; estadoTexto = "No se pudo confirmar el estado de la app"; }
  else if (supaOk === null || appOk === null) { estadoTexto = "Chequeando sistemas…"; }

  const sistemas = [
    {
      nombre: "Base de datos (Supabase)",
      estado: supaOk === null ? "y" : supaOk ? "g" : "r",
      detalle: supaOk === null ? "verificando…" : supaOk ? "responde con normalidad" : "sin respuesta",
      detalleExtra: "Proyecto: vv-construcciones · Plan Pro",
    },
    {
      nombre: "Aplicación (Vercel)",
      estado: salud.vercel === null ? "y" : salud.vercel.ok ? "g" : "r",
      detalle: salud.vercel === null ? "verificando…" : salud.vercel.ok ? `último deploy: ${salud.vercel.estadoDeploy || "—"} · ${salud.vercel.latenciaMs}ms` : (salud.vercel.error || "sin respuesta"),
      detalleExtra: "vvconstruccionesultimo.vercel.app",
    },
    {
      nombre: "IA (Claude API)",
      estado: salud.claude === null ? "y" : salud.claude.ok ? "g" : "r",
      detalle: salud.claude === null ? "verificando…" : salud.claude.ok ? `responde en ${salud.claude.latenciaMs}ms` : (salud.claude.error || "sin respuesta"),
      detalleExtra: "Chequeo real cada vez que actualizás el panel",
    },
    {
      nombre: "Envío de mails (Resend)",
      estado: salud.resend === null ? "y" : salud.resend.ok ? "g" : "r",
      detalle: salud.resend === null ? "verificando…" : salud.resend.ok ? `responde en ${salud.resend.latenciaMs}ms` : (salud.resend.error || "sin respuesta"),
      detalleExtra: "Chequeo real cada vez que actualizás el panel",
    },
  ];

  const latsOk = [salud.vercel, salud.claude, salud.resend].filter(x => x && x.ok && typeof x.latenciaMs === "number").map(x => x.latenciaMs);
  const latenciaProm = latsOk.length ? latsOk.reduce((a, b) => a + b, 0) / latsOk.length : null;

  return h("div", { className: "shell" },
    // Topbar — pestañas a la izquierda, logo al centro, actualizar a la derecha
    h("div", { className: "topbar-sala" },
      h("div", { className: "tb-izq" }, tabs),
      h("div", { className: "tb-centro" },
        h("div", { style: { background: "#000", border: "1px solid #e5e5ea", borderRadius: 20, overflow: "hidden", lineHeight: 0, flexShrink: 0 } },
          h("img", { src: NEXO_LOGO_B64, alt: "NEXO", style: { height: 110, width: "auto", display: "block" } })),
        h("div", { className: "brand-sub", style: { fontSize: 12, letterSpacing: ".1em" } }, "Panel interno")
      ),
      h("div", { className: "tb-der" },
        h("button", { className: "btn-refresh", onClick: cargarTodo, disabled: cargando },
          cargando ? "Actualizando…" : "↻ Actualizar"),
        h("div", { className: "refresh-info" },
          ultimaActualizacion ? h("span", null, "Actualizado ", h("span", { className: "mono refresh-time" }, ultimaActualizacion.toLocaleTimeString("es-AR"))) : "—"
        )
      )
    ),

    // Hero
    h("div", { className: "hero" },
      h("div", { className: "hero-row" },
        h("div", { className: "hero-dot " + estadoGeneral }),
        h("div", null,
          h("div", { className: "hero-title" }, estadoTexto),
          h("div", { className: "hero-sub" }, "Sistema NEXO — obras, contratistas, clientes y propietarios")
        )
      ),
      h("div", { className: "hero-stats" },
        h("div", { className: "hero-stat" },
          h("div", { className: "hero-stat-num mono" }, actividad.obras),
          h("div", { className: "hero-stat-label" }, "Obras")
        ),
        h("div", { className: "hero-stat" },
          h("div", { className: "hero-stat-num mono" }, actividad.personal),
          h("div", { className: "hero-stat-label" }, "Personal / usuarios")
        ),
        h("div", { className: "hero-stat" },
          h("div", { className: "hero-stat-num mono" }, actividad.pedidos + actividad.matpedidos),
          h("div", { className: "hero-stat-label" }, "Pedidos")
        ),
        h("div", { className: "hero-stat" },
          h("div", { className: "hero-stat-num mono" }, "$" + totalCostos),
          h("div", { className: "hero-stat-label" }, "Costo mensual")
        )
      )
    ),

    // Sistemas
    h("div", { className: "section-label" }, "Estado de los sistemas"),
    h("div", { className: "chip-grid" },
      sistemas.map((s, i) =>
        h("div", {
          key: i,
          className: "chip" + (chipAbierto === i ? " open" : ""),
          onClick: () => setChipAbierto(chipAbierto === i ? null : i)
        },
          h("div", { className: "chip-top" },
            h("div", { className: "chip-name" }, s.nombre),
            h("div", { className: "chip-led " + s.estado })
          ),
          h("div", { className: "chip-detail" }, s.detalle),
          h("div", { className: "chip-expand" }, s.detalleExtra)
        )
      )
    ),

    // Estado de las apps — vigía en vivo, avisa sin que nadie tenga que llamar
    h("div", { className: "section-label", style: fallas.apps ? { color: "#d6453b" } : {} }, "Estado de las apps", fallas.apps && h(BadgeFalla)),
    h("div", { className: "gauge-grid" },
      [
        { label: "App Contratista", tag: "contratista" },
        { label: "App Cliente", tag: "cliente" },
        { label: "App Constructora", tag: "constructora" },
        { label: "App Propietario", tag: "propietario" },
      ].map((a, i) => {
        const e = estadoApps[a.tag] || { errores: 0 };
        const ok = e.errores === 0;
        return h("div", { className: "gauge", key: i, style: { border: "1px solid " + (ok ? "rgba(46,158,91,.4)" : "rgba(214,69,59,.5)"), display: "flex", alignItems: "center", gap: 14 } },
          h("div", { className: "hero-dot " + (ok ? "g" : "r"), style: { width: 52, height: 52, fontSize: 52 } }),
          h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { className: "gauge-label" }, a.label),
          h("div", { style: { fontSize: 16, fontWeight: 800, color: ok ? "#1f9d4d" : "#d6453b", marginTop: 2 } },
            ok ? "OK" : (e.errores + (e.errores === 1 ? " error" : " errores"))
          ),
          !ok && e.ultimo && h("div", { style: { fontSize: 10.5, color: "#6e6e73", marginTop: 4, lineHeight: 1.4 } }, e.ultimo.slice(0, 90))
          ));
      })
    ),

    // Instrumentos — relojes con aguja
    h("div", { className: "section-label" }, "Instrumentos", (fallas.uptime || fallas.aperturas) && h(BadgeFalla)),
    h("div", { className: "dial-grid" },
      Dial({
        titulo: "Señal de conexión", valor: uptime.senal, max: 100,
        color: uptime.senal === null ? "#8e8e93" : uptime.senal >= 75 ? "#2e9e5b" : uptime.senal >= 40 ? "#c48a1c" : "#d6453b",
        texto: uptime.senal === null ? "" : Math.round(uptime.senal) + "%",
        pie: uptime.senal === null ? "Juntando datos" : uptime.senal >= 75 ? "Excelente" : uptime.senal >= 40 ? "Inestable" : "Con problemas",
        sub: uptime.pct !== null ? "Uptime 24hs · " + uptime.pct.toFixed(1) + "%" : "",
      }),
      Dial({
        titulo: "Latencia promedio", valor: latenciaProm, max: 2000,
        color: latenciaProm !== null && latenciaProm > 1500 ? "#d6453b" : latenciaProm !== null && latenciaProm > 800 ? "#c48a1c" : "#3b82c4",
        texto: latenciaProm === null ? "" : Math.round(latenciaProm) + "ms", pie: "Escala 0–2000 ms",
        sub: "Vercel · Claude · Resend",
      }),
      Dial({
        titulo: "Aperturas hoy", valor: aperturas.hoy, max: Math.max(10, Math.ceil(aperturas.hoy / 10) * 10),
        color: "#a07c3a", texto: String(aperturas.hoy), pie: "Escala 0–" + Math.max(10, Math.ceil(aperturas.hoy / 10) * 10),
        sub: aperturas.ultima ? "Última · " + hace(aperturas.ultima) : "Sin aperturas todavía",
      }),
      Dial({
        titulo: "Costo del mes", valor: totalCostos, max: Math.max(100, Math.ceil(totalCostos / 50) * 50),
        color: "#c48a1c", texto: "$" + Math.round(totalCostos), pie: "Escala 0–" + Math.max(100, Math.ceil(totalCostos / 50) * 50) + " USD",
        sub: "Supabase + Vercel + Claude",
      })
    ),

    // Alertas activas — lo más urgente va primero, arriba de todo lo demás
    (alertas.length > 0 || fallas.alertas) && h("div", null,
      h("div", { className: "section-label" }, "Alertas activas", fallas.alertas && h(BadgeFalla)),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 8 } },
        alertas.map((a) => {
          const critica = a.nivel === "critical";
          return h("div", {
            key: a.id,
            style: {
              background: critica ? "rgba(214,69,59,.1)" : "rgba(196,138,28,.08)",
              border: "1px solid " + (critica ? "rgba(214,69,59,.4)" : "rgba(196,138,28,.35)"),
              borderRadius: 12, padding: "12px 14px",
            },
          },
            h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
              h("span", { style: { fontSize: 11, fontWeight: 700, color: critica ? "#d6453b" : "#c48a1c" } }, critica ? "🔴 CRÍTICA" : "🟡 ATENCIÓN"),
              h("span", { style: { fontSize: 13, fontWeight: 700, color: "var(--text)" } }, a.titulo)
            ),
            a.detalle && h("div", { style: { fontSize: 12, color: "var(--text-faint)", marginTop: 4 } }, a.detalle)
          );
        })
      )
    ),

    // Actividad de HOY — para que no se pierda en un total que solo crece.
    // Si todo está en 0 acá, hoy no hubo movimiento (aunque el total histórico sea alto).
    h("div", { className: "section-label" }, "Actividad de hoy", fallas.actividad && h(BadgeFalla)),
    h("div", { className: "gauge-grid" },
      [
        { label: "Pedidos de materiales", val: actividadHoy.matpedidos },
        { label: "Pedidos generales", val: actividadHoy.pedidos },
        { label: "Mensajes / fotos", val: actividadHoy.mensajes },
        { label: "Registros de avance", val: actividadHoy.avance },
        { label: "Certificados semanales", val: actividadHoy.certificados },
        { label: "Bitácoras cargadas", val: actividadHoy.bitacora },
        { label: "Auditorías", val: actividadHoy.auditoria },
      ].map((g, i) =>
        h("div", { className: "gauge", key: i },
          h("div", { className: "gauge-label" }, g.label),
          h("div", { className: "gauge-num" + (g.val === 0 ? " zero" : "") }, g.val)
        )
      )
    ),

    // Actividad
    h("div", { className: "section-label" }, "Actividad del sistema", fallas.actividad && h(BadgeFalla)),
    h("div", { className: "gauge-grid" },
      [
        { label: "Obras activas", val: actividad.obras },
        { label: "Personal / usuarios", val: actividad.personal },
        { label: "Pedidos de materiales", val: actividad.matpedidos },
        { label: "Pedidos generales", val: actividad.pedidos },
        { label: "Mensajes / fotos", val: actividad.mensajes },
        { label: "Registros de avance", val: actividad.avance },
        { label: "Certificados semanales", val: actividad.certificados },
        { label: "Bitácoras cargadas", val: actividad.bitacora },
        { label: "Auditorías", val: actividad.auditoria },
      ].map((g, i) =>
        h("div", { className: "gauge", key: i },
          h("div", { className: "gauge-label" }, g.label),
          h("div", { className: "gauge-num" + (g.val === 0 ? " zero" : "") }, g.val)
        )
      )
    ),

    // Uso de la app — dona por vista + reloj de actividad, más entretenido que números sueltos
    h("div", { className: "section-label" }, "Uso de la app", (fallas.aperturas || fallas.uptime) && h(BadgeFalla)),
    h("div", { className: "gauge-grid" },
      [
        { label: "Aperturas totales", val: aperturas.total },
        { label: "Aperturas hoy", val: aperturas.hoy },
        { label: "Última apertura", val: aperturas.ultima ? hace(aperturas.ultima) : "—" },
      ].map((g, i) =>
        h("div", { className: "gauge", key: i },
          h("div", { className: "gauge-label" }, g.label),
          h("div", { className: "gauge-num" + (g.val === 0 || g.val === "—" ? " zero" : ""), style: typeof g.val === "string" ? { fontSize: 20 } : undefined }, g.val)
        )
      )
    ),
    h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10, fontSize: 12, color: "var(--text-faint)" } },
      "Hoy por vista:",
      [["Contratista", "contratista", "#a07c3a"], ["Cliente", "cliente", "#2e9e5b"], ["Constructora", "constructora", "#3b82c4"], ["Propietario", "propietario", "#c4604a"]].map(([n, k, c]) =>
        h("span", { key: k, style: { border: "1px solid " + c, borderRadius: 999, padding: "2px 10px", color: c } }, n + " " + aperturas.hoyPorVista[k])
      )
    ),
    h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 10, marginTop: 10 } },
      h("div", { className: "gauge", style: { padding: "16px" } },
        h("div", { className: "gauge-label", style: { marginBottom: 12 } }, "Uso por vista · aperturas"),
        [["Contratista", "contratista", "#a07c3a"], ["Cliente", "cliente", "#2e9e5b"], ["Constructora", "constructora", "#3b82c4"], ["Propietario", "propietario", "#c4604a"]].map(([n, k, c]) => {
          const maxV = Math.max(1, aperturas.porVista.contratista, aperturas.porVista.cliente, aperturas.porVista.constructora, aperturas.porVista.propietario);
          const v = aperturas.porVista[k];
          return h("div", { key: k, style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 12 } },
            h("div", { style: { width: 92, fontSize: 11, letterSpacing: ".04em", color: c, textTransform: "uppercase" } }, n),
            h("div", { style: { flex: 1, height: 16, borderRadius: 8, background: "linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.8))", border: "1.5px solid rgba(255,255,255,.95)", boxShadow: "inset 0 3px 6px rgba(80,110,170,.25), 0 6px 12px rgba(40,70,140,.08)", overflow: "hidden", position: "relative" } },
              h("div", { style: { width: (v / maxV * 100) + "%", height: "100%", background: "linear-gradient(180deg," + c + "aa," + c + ")", borderRadius: 8, boxShadow: "inset 0 2px 0 rgba(255,255,255,.55)" } })
            ),
            h("div", { style: { width: 34, textAlign: "right", fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace", fontSize: 17, fontWeight: 600, color: c } }, v)
          );
        }),
        h("div", { style: { display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--text-faint)", borderTop: "1px solid #e5e5ea", paddingTop: 8 } },
          h("span", null, "TOTAL (30 días)"),
          h("span", { style: { color: "var(--text)", fontWeight: 600 } }, aperturas.porVista.contratista + aperturas.porVista.cliente + aperturas.porVista.constructora + aperturas.porVista.propietario)
        )
      ),
      h("div", { className: "gauge", style: { padding: "16px", display: "flex", flexDirection: "column", alignItems: "center" } },
        h("div", { className: "gauge-label", style: { marginBottom: 4, alignSelf: "flex-start" } }, "Horario de más actividad"),
        RelojActividad({ porHora: aperturas.porHora, size: 260 })
      )
    ),

    // Costos
    h("div", { className: "section-label" }, "Costo de infraestructura", fallas.costo && h(BadgeFalla)),
    h("div", { className: "cost-card" },
      costos.map((c, i) =>
        h("div", { className: "cost-row", key: i },
          h("div", null,
            h("div", { className: "cost-name" },
              c.nombre,
              " ",
              h("span", { style: { fontSize: 9.5, fontWeight: 700, letterSpacing: .3, padding: "2px 6px", borderRadius: 5, marginLeft: 4, color: c.fuente === "real" ? "#2e9e5b" : c.fuente === "manual" ? "#a07c3a" : "#6e6e73", background: c.fuente === "real" ? "rgba(46,158,91,.12)" : c.fuente === "manual" ? "rgba(160,124,58,.15)" : "rgba(110,110,115,.12)" } }, c.fuente === "real" ? "REAL" : c.fuente === "manual" ? "MANUAL" : "GRATIS")
            ),
            h("div", { className: "cost-tag" }, c.tag)
          ),
          h("div", { className: "cost-amount" }, "$" + c.monto)
        )
      ),
      h("div", { className: "cost-total" },
        h("div", { className: "cost-total-label" }, "Total mensual"),
        h("div", { className: "cost-total-amount" }, "$" + totalCostos.toFixed(2) + " USD")
      ),
      costoClaude.mes !== null && costoClaude.porApp.length > 0 && h("div", { style: { padding: "12px 16px", borderTop: "1px solid rgba(0,0,0,.08)" } },
        h("div", { style: { fontSize: 10.5, fontWeight: 700, color: "#6e6e73", letterSpacing: .3, marginBottom: 8 } }, "CLAUDE API — DESGLOSE POR APP (MES EN CURSO)"),
        costoClaude.porApp.map((p, i) =>
          h("div", { key: i, style: { display: "flex", justifyContent: "space-between", fontSize: 12.5, color: "#3a3a3c", padding: "3px 0" } },
            h("span", null, p.app),
            h("span", null, "$" + p.monto.toFixed(2))
          )
        ),
        costoClaude.hoy !== null && h("div", { style: { fontSize: 11, color: "#6e6e73", marginTop: 8 } }, "Hoy: $" + costoClaude.hoy.toFixed(2))
      ),
      costoClaude.ultimos7.length > 0 && h("div", { style: { padding: "12px 16px", borderTop: "1px solid rgba(0,0,0,.08)" } },
        h("div", { style: { fontSize: 10.5, fontWeight: 700, color: "#6e6e73", letterSpacing: .3, marginBottom: 6 } }, "CLAUDE API — ÚLTIMOS 7 DÍAS"),
        BarrasCosto7Dias({ data: costoClaude.ultimos7, width: 280 })
      ),
      h("div", { className: "cost-note" },
        costoClaude.mes === null
          ? "El costo de Claude API es el consumo del mes en curso, cargado a mano — todavía no está conectado en vivo."
          : "Supabase y Vercel son de plan fijo (se actualizan a mano si cambia el plan). Claude API ahora es costo real, calculado por tokens de cada llamada."
      )
    ),

    // Incidentes
    h("div", { className: "section-label" }, "Historial de incidentes", fallas.incidentes && h(BadgeFalla)),
    incidentes.length === 0
      ? h("div", { className: "incidents-empty" }, "Sin incidentes registrados todavía.")
      : h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
          incidentes.map((inc) => {
            const abierto = inc.estado !== "resolved";
            return h("div", {
              key: inc.id,
              style: {
                background: "linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34))", WebkitBackdropFilter: "blur(24px) saturate(1.8)", backdropFilter: "blur(24px) saturate(1.8)", boxShadow: "0 10px 26px rgba(40,70,140,.10), inset 0 2px 0 rgba(255,255,255,.95)", border: "1px solid " + (abierto ? "rgba(214,69,59,.35)" : "rgba(255,255,255,.92)"),
                borderRadius: 22, padding: "14px 16px", opacity: abierto ? 1 : .55,
              },
            },
              h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 } },
                h("div", { style: { flex: 1 } },
                  h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
                    h("span", { style: { fontSize: 11, fontWeight: 700, color: abierto ? "#d6453b" : "#2e9e5b" } }, abierto ? "⚠ ABIERTO" : "✓ RESUELTO"),
                    h("span", { style: { fontSize: 11, color: "var(--text-faint)", textTransform: "uppercase" } }, inc.app)
                  ),
                  h("div", { style: { fontSize: 13, color: "var(--text)", marginTop: 4, lineHeight: 1.4 } }, (inc.mensaje || "").slice(0, 140)),
                  h("div", { style: { fontSize: 11, color: "var(--text-faint)", marginTop: 6 } },
                    inc.ocurrencias + (inc.ocurrencias === 1 ? " ocurrencia" : " ocurrencias") +
                    " · primera vez " + new Date(inc.primera_vez).toLocaleString("es-AR") +
                    " · última vez " + new Date(inc.ultima_vez).toLocaleString("es-AR")
                  )
                ),
                abierto && h("button", {
                  onClick: () => marcarResuelto(inc.id),
                  style: { background: "rgba(46,158,91,.12)", color: "#2e9e5b", border: "1px solid rgba(46,158,91,.4)", borderRadius: 8, padding: "6px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" },
                }, "Marcar resuelto")
              )
            );
          })
        ),


    h("div", { className: "footer" }, "NEXO Control · uso interno")
  );
}
