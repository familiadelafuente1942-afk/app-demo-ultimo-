<style>
/* Layout: app de una columna tipo celular; barra inferior distinta por rol; hojas deslizantes para detalle y formularios */
:root{
  --bg:#0d0e10; --surface:#16171a; --raise:#1d1f23; --line:#2a2c31; --fg:#ece8e1; --muted:#8f8b84;
  --gold:#b8915a; --gold-soft:rgba(184,145,90,.14);
  --verde:#3fa66b; --amarillo:#e0b43a; --naranja:#e5813a; --rojo:#e2493e; --ok:#5f6b66; --futuro:#3a3d43; --azul:#5b8fd6; --rosa:#9b7cf6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --tech:"Michroma","Barlow Condensed",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-family:var(--tech);letter-spacing:.16em;font-size:12px;text-transform:uppercase;color:var(--gold);font-weight:400}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;min-height:32px}
.who .rol{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-left:6px}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 14px;font-weight:600;text-align:center;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120b}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.full{width:100%}
.btn.wa{background:#1f6f45;border-color:#1f6f45;color:#fff}
.btn.red{background:rgba(226,73,62,.14);border-color:var(--rojo);color:#ffb3ad}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2>*{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.chip.gold{border-color:#5a4a30;color:#e6cfa5}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.c-rojo{background:var(--rojo)} .c-naranja{background:var(--naranja)} .c-amarillo{background:var(--amarillo)} .c-verde{background:var(--verde)} .c-ok{background:var(--ok)} .c-futuro{background:var(--futuro)}
.t-rojo{color:var(--rojo)} .t-naranja{color:var(--naranja)} .t-amarillo{color:var(--amarillo)} .t-verde{color:var(--verde)} .t-ok,.t-futuro{color:var(--muted)} .t-azul{color:var(--azul)}
.status{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;background:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--gold)}
.bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.7}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.irow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.irow:last-child{border-bottom:0}
.irow>span:first-child{min-width:0}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.entry .meta{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.entry.cambio{border-color:rgba(226,73,62,.6);box-shadow:inset 4px 0 0 var(--rojo)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed=true],.seg button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.group-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:6px}
.group-h .muted{font-size:12px}

/* acceso */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:8px 4px}
.login .logo{width:min(300px,78%);height:auto;mix-blend-mode:lighten}
.frase{font-family:var(--tech);font-size:clamp(15px,4.2vw,21px);line-height:1.6;letter-spacing:.06em;text-transform:uppercase;margin-top:12px;color:#efeae2}
.frase-rule{width:56px;height:1px;background:var(--gold);margin-top:6px}
.panels{display:flex;flex-direction:column;gap:12px}
.pcard{position:relative;min-height:190px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background-size:cover;background-position:center;padding:0;text-align:left;display:flex;align-items:flex-end;transition:transform .25s ease,border-color .25s}
.pcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.pshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.94) 0%,rgba(8,8,10,.78) 45%,rgba(8,8,10,.25) 100%)}
.pin{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px 24px;max-width:80%}
.peyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ptitle{font-family:var(--tech);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:#f3efe8;line-height:1.25}
.pdesc{font-size:13.5px;color:#c9c4bb;line-height:1.4}
.pgo{font-size:13px;color:var(--gold);font-weight:600;margin-top:4px}
.ucard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.ucard:hover{border-color:var(--gold)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--raise);border:1px solid #5a4a30;display:flex;align-items:center;justify-content:center;font-family:var(--tech);font-size:13px;color:var(--gold)}

/* estado de situación */
.situ{border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.situ::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde)}
.situ.s-crit::before{background:var(--rojo)} .situ.s-warn::before{background:var(--naranja)}
.situ-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(63,166,107,.15);color:var(--verde)}
.s-crit .pill{background:rgba(226,73,62,.15);color:#ff8f86} .s-warn .pill{background:rgba(229,129,58,.15);color:var(--naranja)}
.situ h1{font-size:28px}
.situ p{color:#c9c4bb;font-size:14px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;position:relative}
.kpi:hover{border-color:var(--gold)}
.kpi b{font-family:var(--display);font-size:24px;line-height:1.1}
.kpi .kl{font-size:12px;color:#c9c4bb;line-height:1.25}
.kpi .ks{font-size:11.5px;color:var(--muted)}
.kpi .kgo{position:absolute;top:8px;right:10px;font-size:12px;color:var(--gold)}
.kpi.k-rojo b{color:var(--rojo)} .kpi.k-verde b{color:var(--verde)} .kpi.k-naranja b{color:var(--naranja)}

/* obras: tira del inicio */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 4px 6px 4px}
.scard{scroll-snap-align:start;flex:0 0 46%;min-width:180px;max-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.scard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.scard .sb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px}
.scard .sn{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.scard .sn b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sn span{font-family:var(--display);font-size:18px;color:var(--gold);font-weight:700}
.scard.locked{opacity:.45}

/* cartera */
.orow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.orow img{width:84px;height:60px;object-fit:cover;border-radius:8px;display:block}
.orow .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.orow .ohd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.orow .ohd b{font-size:15px}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ogrid>span{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.ogrid>span>span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ogrid b{font-size:13.5px;font-weight:600}
.orow.locked{opacity:.5}
.lock{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* ficha de obra */
.ohead{display:flex;flex-direction:column;gap:10px}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:14px;align-self:flex-start}
.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.fact span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 11px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--gold);font-weight:600}

/* avisos */
.aviso{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px 0 0;text-align:left;width:100%;overflow:hidden}
.aviso .stripe{align-self:stretch}
.aviso .txt{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.aviso .t1{font-weight:600;line-height:1.25}
.aviso .t2{font-size:12.5px;color:var(--muted)}
.aviso .when{text-align:right;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.aviso .when b{font-family:var(--display);font-size:18px}
.origen{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}

/* gantt */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gantt{position:relative;font-size:12px}
.grow{display:flex;height:32px;align-items:center;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.glabel{position:sticky;left:0;z-index:2;width:140px;flex:none;padding:0 8px;background:var(--surface);border-right:1px solid var(--line);height:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel.rubro{font-weight:600;color:var(--gold)}
.glabel.added::after{content:"nueva";margin-left:6px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);border:1px solid var(--azul);border-radius:4px;padding:0 3px}
.gtrack{position:relative;height:100%;flex:none}
.gseg{position:absolute;top:12px;height:8px;border-radius:2px}
.gexec{position:absolute;top:9px;height:14px;border-radius:3px;background:var(--fg);opacity:.85}
.gexec.done{background:var(--gold);opacity:.55}
.gbase{position:absolute;top:26px;height:2px;background:var(--azul);opacity:.9}
.ghito{position:absolute;top:10px;width:12px;height:12px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--bg)}
.gman{position:absolute;top:11px;width:10px;height:10px;transform:rotate(45deg);background:var(--azul);border:2px solid var(--bg);z-index:1}
.gsup{position:absolute;top:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--verde);background:var(--bg)}
.gsup.done{background:var(--verde)}
.gcert{position:absolute;top:10px;width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--rosa);background:var(--bg)}
.gcert.done{background:var(--rosa)}
.gtoday{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--rojo);z-index:3;pointer-events:none}
.gmonths{display:flex;height:26px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:14px;height:8px;border-radius:2px;display:inline-block}
.modelbox{background:linear-gradient(160deg,#1b1915,#16171a);border:1px solid #5a4a30;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.params{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.params div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.params span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.params b{font-size:13.5px}

/* editor de cronograma */
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow .en{font-weight:600;font-size:14px}
.erow .ed{font-size:12px;color:var(--muted)}
.estep{display:flex;align-items:center;gap:6px}
.estep button,.edel{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
.estep b{min-width:44px;text-align:center;font-family:var(--display);font-size:17px}
.edel{color:#ff8f86}
.diff{font-size:12px}

/* hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .x{align-self:flex-end;border:0;background:var(--raise);border-radius:999px;width:32px;height:32px}
.tl{position:relative;height:34px}
.tl .seg2{position:absolute;top:8px;height:10px}
.tl .mark{position:absolute;top:2px;height:22px;border-left:2px dashed var(--rojo)}
.tl .lbl{position:absolute;top:22px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center}
.steps button[aria-pressed=true]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.steps small{font-size:10.5px;color:var(--muted)}
.impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.impact button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:10px 6px;font-size:13px}
.impact button[aria-pressed=true]{border-color:var(--rojo);background:rgba(226,73,62,.14);font-weight:600}

/* renders */
.rgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rthumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;background:var(--bg);text-align:left;display:flex;flex-direction:column;color:var(--fg)}

/* Nexo IA */
.ia-head{flex-wrap:wrap}

.hlist{display:flex;flex-direction:column;gap:6px}

/* ================= v12 · portada completa en una sola pantalla, sin scroll ================= */

/* ================= v13 · adjuntos de la IA ================= */
.ia-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.ia-img{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise);display:flex;flex-direction:column;text-align:left;color:var(--fg);cursor:pointer}

.ia-pdf{margin-top:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= v14 · logo de Nexo animado en la portada ================= */
.lg-mark svg{overflow:visible}
.mk-orbit,.mk-core{transform-box:view-box;transform-origin:center}
.mk-orbit{animation:mk-spin 40s linear infinite}
.mk-core{animation:mk-pulse 3.4s ease-in-out infinite}
.mk-orbit circle[fill="url(#gn)"]{animation:mk-tw 3.2s ease-in-out infinite}
.mk-orbit circle:nth-last-child(3n+1){animation-delay:-.8s}.mk-orbit circle:nth-last-child(3n+2){animation-delay:-1.7s}.mk-orbit circle:nth-last-child(3n){animation-delay:-2.5s}
@keyframes mk-spin{to{transform:rotate(360deg)}}
@keyframes mk-pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.16);opacity:1}}
@keyframes mk-tw{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:no-preference){
  .login .lg-word{animation:lg-word .55s cubic-bezier(.2,.8,.2,1) both}
  .login .lg-tag{animation:lg-fade .5s ease-out .3s both}
  .login .frase,.login .frase-rule{animation:lg-fade .6s ease-out .55s both}
  .login .lg-mark{animation:lg-mark 1.4s cubic-bezier(.2,.8,.2,1) .6s both}
  .panels .pcard{animation:lg-up .6s ease-out both}
  .panels .pcard:nth-child(1){animation-delay:.95s}.panels .pcard:nth-child(2){animation-delay:1.05s}.panels .pcard:nth-child(3){animation-delay:1.15s}
}
@keyframes lg-word{from{opacity:0;letter-spacing:.95em;filter:blur(6px)}to{opacity:1;letter-spacing:.42em;filter:blur(0)}}
@keyframes lg-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes lg-mark{from{opacity:0;transform:scale(.55);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ===== DEMO: sin servidor. Todo queda en memoria de esta pestaña ===== */
(function(){
  const J=x=>new Response(JSON.stringify(x),{status:200,headers:{'Content-Type':'application/json'}});
  const AV=[];let n=0;
  const hoy=Date.now(),dia=864e5;
  AV.push({id:'a1',obra:'o1',fecha:hoy-9*dia,sector:'Estructura',txt:'Hormigonado de la losa de planta baja.',resumen:'Se ve la losa terminada y el encofrado ya retirado. Antes solo estaban las columnas.',autor:'Jefatura de obra',fotos:['demo-nexo2/etapa-1.jpg']});
  AV.push({id:'a2',obra:'o1',fecha:hoy-2*dia,sector:'Mampostería',txt:'Levantamos los muros de planta baja.',resumen:'Avanzó el cerramiento: ahora hay muros de ladrillo en el frente, donde antes había solo columnas y losa.',autor:'Jefatura de obra',fotos:['demo-nexo2/etapa-2.jpg']});
  AV.push({id:'a3',obra:'o2',fecha:hoy-4*dia,sector:'Instalaciones',txt:'Pasaron las cañerías de agua y electricidad.',resumen:'Se ven las líneas de instalaciones sobre los muros nuevos. Antes los muros estaban sin cañerías.',autor:'Jefatura de obra',fotos:['demo-nexo2/etapa-3.jpg']});
  const real=window.fetch.bind(window);
  window.fetch=function(u,o){
    const url=typeof u==='string'?u:(u&&u.url)||'';
    if(url.startsWith('/api/nexo2')){
      let b={};try{b=JSON.parse((o&&o.body)||'{}')}catch(e){}
      if(!b.op)return Promise.resolve(J(b.key?{ok:true}:{}));
      if(b.op==='login')return Promise.resolve(J({ok:true}));
      if(b.op==='cods_get')return Promise.resolve(J({dir:'DIR-DEMO',obras:{},seed:false}));
      if(b.op==='cods_set')return Promise.resolve(J({ok:true}));
      if(b.op==='av_list')return Promise.resolve(J({items:AV.filter(x=>x.obra===b.obra).sort((a,c)=>c.fecha-a.fecha)}));
      if(b.op==='av_foto')return Promise.resolve(J({url:b.data}));
      if(b.op==='av_add'){const it={...b.item,id:'d'+(++n),obra:b.obra,resumen:''};AV.push(it);return Promise.resolve(J({ok:true,item:it}))}
      if(b.op==='av_resumen'){const it=AV.find(x=>x.id===b.id);if(it)it.resumen='Con respecto a la foto anterior se nota más avance: la obra muestra trabajos nuevos terminados en el sector indicado. (En el sistema real, la IA compara las dos fotos y lo describe.)';return Promise.resolve(J({ok:true}))}
      if(b.op==='av_del'){const i=AV.findIndex(x=>x.id===b.id);if(i>=0)AV.splice(i,1);return Promise.resolve(J({ok:true}))}
      return Promise.resolve(J({ok:true}));
    }
    if(url.startsWith('/api/tts')||url.startsWith('/api/claude'))return Promise.resolve(new Response('{"error":"demo"}',{status:503,headers:{'Content-Type':'application/json'}}));
    return real(u,o);
  };
})();

function subWork(t,n){let x=t;while(n>0){x-=DAY;if(isWork(x))n--}return x}
function addWork(t,n){let x=t;while(n>0){x+=DAY;if(isWork(x))n--}return x}
function workBetween(a,b){let n=0;for(let x=a+DAY;x<=b;x+=DAY)if(isWork(x))n++;return n}

/* ================= modelo paramétrico ================= */
function nivelesDe(o){return [...(o.subsuelo?['Subsuelo']:[]),...['PB','PA','2° piso'].slice(0,o.plantas)]}
function modeloTxt(o){const n=nivelesDe(o);return `${n.length} ${n.length>1?'losas':'losa'} · ${n.join(' + ')}${o.pileta?' · pileta':''}`}
function modeloFull(o){return `${modeloTxt(o)} · ${o.m2} m² · ${NIVEL[o.nivel].n}`}
function factores(o){const n=nivelesDe(o).length;return{pl:clamp(o.m2/n/150,.7,2.2)**.6,tot:clamp(o.m2/300,.7,3)**.6,nv:NIVEL[o.nivel].f}}
function semanas(r,o){const L=LIB[r],f=factores(o);return Math.max(1,Math.round(L.w*(L.sc==='planta'?f.pl:L.sc==='total'?f.tot:1)*(L.nv?f.nv:1)))}
function plantilla(o){
  const t=[];const add=(r,name,ov=0,par=false,w=null)=>t.push({id:'t'+(++uid),rubro:r,name,weeks:w||semanas(r,o),ov,par});

  add('fund','Fundaciones y platea',.2);
  nivelesDe(o).forEach((n,i)=>{add('mamp','Mampostería '+n,.2);add('losa','Estructura · losa sobre '+n);if(i===0&&o.pileta)add('pileta','Pileta',.8,true)});
  add('cubierta','Cubiertas y techos',.3);add('aisl','Aislaciones e impermeabilizaciones',.6,true);
  add('sanit','Instalación sanitaria',.4);add('elec','Instalación eléctrica',1);add('gas','Instalación de gas',1,true);add('clima','Climatización y calefacción',1,true);add('debiles','Corrientes débiles',.5,true);
  add('carp','Carpinterías · premarcos',.5);add('revoques','Revoques',.3);add('contrapisos','Contrapisos y carpetas',.4);add('cielorrasos','Cielorrasos',.4);add('carp2','Carpinterías · colocación y vidrios',.5,true);
  add('revest','Pisos, zócalos y revestimientos',.3);add('marmol','Marmolería y mesadas',.3,true);add('amobl','Amoblamiento y equipamiento fijo',.4);add('pintura','Pintura',.5);add('artef','Artefactos y griferías',.5,true);add('exter','Obras exteriores y paisajismo',.7,true);
  add('limpieza','Limpieza y entrega');
  return t;
}
function programar(o,tasks){const b=d(o.inicio);let po=0,pw=0;tasks.forEach((t,i)=>{const off=i===0?0:po+pw*(1-(t.ov||0));t.start=nextWork(b+Math.round(off*7)*DAY);t.end=t.start+(t.weeks*7-3)*DAY;if(!t.par){po=off;pw=t.weeks}})}
const setDur=(t,w)=>{t.weeks=Math.max(1,w);t.end=t.start+(t.weeks*7-3)*DAY};
const finDe=tasks=>Math.max(...tasks.map(t=>t.end));
const finObra=o=>finDe(o.tasks);
const finBase=o=>finDe(o.base);
const desvioSem=o=>Math.round((finObra(o)-finBase(o))/(7*DAY));
function avance(o){const tot=o.tasks.reduce((s,t)=>s+t.weeks,0);return Math.round(o.tasks.reduce((s,t)=>s+t.weeks*((t.real?.av)||0)/100,0)/tot*100)}
function avancePlanDe(tasks){const tot=tasks.reduce((s,t)=>s+t.weeks,0);let dn=0;tasks.forEach(t=>{if(TODAY>t.end)dn+=t.weeks;else if(TODAY>=t.start)dn+=t.weeks*(TODAY-t.start)/(t.end-t.start+3*DAY)});return Math.round(dn/tot*100)}
const avancePlan=o=>avancePlanDe(o.base);
const iniciada=o=>o.tasks.some(t=>t.start<=TODAY);
const actual=o=>o.tasks.filter(t=>t.real&&t.real.av<100).sort((a,b)=>a.start-b.start)[0]||o.tasks.filter(t=>t.start<=TODAY).sort((a,b)=>b.start-a.start)[0]||o.tasks[0];
const enCurso=o=>o.tasks.filter(t=>(t.real&&t.real.av<100)||(t.start<=TODAY+7*DAY&&t.end>=TODAY-7*DAY&&!(t.real&&t.real.av>=100)));
const proxima=o=>o.tasks.filter(t=>t.start>TODAY).sort((a,b)=>a.start-b.start)[0];
const etapaDe=o=>iniciada(o)?(ETAPA[actual(o).rubro]||'En obra'):'Por iniciar';
const baseDe=(o,t)=>o.base.find(b=>b.id===t.id);
/* desvío de una tarea: fin conforme a obra (real o proyectado) contra la base del modelo, en días hábiles */

   Un mismo documento se ve en pantalla (HTML) y se descarga como PDF real, generado en el dispositivo. */
const PDFMAP={'–':'-','—':'-','“':'"','”':'"','‘':"'",'’':"'",'…':'...','•':'-','→':'->','≥':'>=','≤':'<=','×':'x'};
const pdfTxt=s=>String(s??'').replace(/[–—“”‘’…•→≥≤×]/g,c=>PDFMAP[c]).replace(/[^\x0a\x20-\x7e\xa0-\xff]/g,'');
function tw(s,size,bold){const a=bold?HW.b:HW.n;let w=0;for(const ch of pdfTxt(s)){const c=ch.charCodeAt(0);w+=(c>=32&&c<=255?a[c-32]:556)}return w*size/1000}
function wrapTxt(s,size,bold,max){const out=[];String(s??'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(word=>{const t=line?line+' '+word:word;if(tw(t,size,bold)<=max)line=t;else{if(line)out.push(line);line=word}});out.push(line)});return out}
const pdfEsc=s=>pdfTxt(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
function b64bytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function toJpeg(url){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const sc=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*sc));c.height=Math.max(1,Math.round(im.naturalHeight*sc));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res({bytes:b64bytes(c.toDataURL('image/jpeg',.82).split(',')[1]),w:c.width,h:c.height})}catch(e){res(null)}};im.onerror=()=>res(null);im.src=url})}

class PdfDoc{
  constructor(){this.W=595;this.H=842;this.M=46;this.pages=[];this.imgs=[];this.newPage()}
  newPage(){this.c=[];this.pages.push(this.c);this.y=this.M}
  rgb(h){const n=parseInt(h.slice(1),16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ')}
  text(x,y,s,size=10,bold=false,col='#1d1d1f'){this.c.push(`BT /${bold?'F2':'F1'} ${size} Tf ${this.rgb(col)} rg ${x.toFixed(1)} ${(this.H-y-size*.8).toFixed(1)} Td (${pdfEsc(s)}) Tj ET`)}
  textC(y,s,size,bold,col,sp=0){const w=tw(s,size,bold)+sp*(pdfTxt(s).length-1);this.c.push(`BT /${bold?'F2':'F1'} ${size} Tf ${sp} Tc ${this.rgb(col)} rg ${((this.W-w)/2).toFixed(1)} ${(this.H-y-size*.8).toFixed(1)} Td (${pdfEsc(s)}) Tj 0 Tc ET`)}
  rect(x,y,w,h,fill,stroke){if(fill)this.c.push(`${this.rgb(fill)} rg ${x.toFixed(1)} ${(this.H-y-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);if(stroke)this.c.push(`${this.rgb(stroke)} RG 0.6 w ${x.toFixed(1)} ${(this.H-y-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re S`)}
  line(x1,y1,x2,y2,col='#d9d4ca',w=.6){this.c.push(`${this.rgb(col)} RG ${w} w ${x1.toFixed(1)} ${(this.H-y1).toFixed(1)} m ${x2.toFixed(1)} ${(this.H-y2).toFixed(1)} l S`)}
  image(img,x,y,w,h){this.imgs.push(img);const n=this.imgs.length;this.c.push(`q ${w.toFixed(1)} 0 0 ${h.toFixed(1)} ${x.toFixed(1)} ${(this.H-y-h).toFixed(1)} cm /Im${n} Do Q`)}
  build(){
    const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
    const push=x=>{const b=typeof x==='string'?Uint8Array.from(x,ch=>ch.charCodeAt(0)&255):x;chunks.push(b);len+=b.length};
    const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body.forEach(push);push('\nendobj\n')};
    push('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
    const nImg=this.imgs.length,first=5+nImg,kids=this.pages.map((_,i)=>`${first+i*2} 0 R`).join(' ');
    obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
    obj(2,[`<< /Type /Pages /Kids [${kids}] /Count ${this.pages.length} >>`]);
    obj(3,['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
    obj(4,['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>']);
    this.imgs.forEach((im,i)=>obj(5+i,[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream']));
    const xo=nImg?`/XObject << ${this.imgs.map((_,i)=>`/Im${i+1} ${5+i} 0 R`).join(' ')} >>`:'';
    this.pages.forEach((c,i)=>{const s=c.join('\n');obj(first+i*2,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xo} >> /Contents ${first+i*2+1} 0 R >>`]);obj(first+i*2+1,[`<< /Length ${s.length} >>\nstream\n`,s,'\nendstream'])});
    const total=first+this.pages.length*2;const xref=len;
    push(`xref\n0 ${total}\n0000000000 65535 f \n`+Array.from({length:total-1},(_,i)=>String(offs[i+1]).padStart(10,'0')+' 00000 n \n').join(''));
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks,{type:'application/pdf'});
  }
}

/* --- estructura común de un documento ---
   doc = {titulo, sub, obra, num, fecha, campos:[[label,valor]], intro, secciones:[{h, tabla:{cols,w,rows}} | {h, lista} | {h, texto} | {h, fotos}], resultado, conclusion, firmas:[[nombre,cargo]]} */
const GOLD='#a8834e',INK='#1d1d1f',GREY='#7a756d',LINE='#d9d4ca';
async function docPDF(doc){
  const P=new PdfDoc(),L=P.M,R=P.W-P.M,CW=R-L,bottom=P.H-P.M-24;
  const ensure=h=>{if(P.y+h>bottom){P.newPage()}};
  P.textC(P.y,doc.titulo.toUpperCase(),17,true,INK);P.y+=24;
  P.textC(P.y,doc.sub.toUpperCase(),8,true,GOLD,2.2);P.y+=22;

  P.text(L,P.y,'Obra: ',9,false,GREY);P.text(L+tw('Obra: ',9),P.y,doc.obra,9,true);
  const nt='N°: '+doc.num;P.text((P.W-tw(nt,9,true))/2,P.y,nt,9,true);
  const ft='Fecha: '+doc.fecha;P.text(R-tw(ft,9,true),P.y,ft,9,true);P.y+=16;
  P.line(L,P.y,R,P.y,LINE);P.y+=14;
  for(let i=0;i<doc.campos.length;i+=2){const pair=doc.campos.slice(i,i+2);const cw=(CW-12)/2;const hh=Math.max(...pair.map(([,v])=>wrapTxt(v||'—',10,true,cw-20).length))*13+26;ensure(hh+8);pair.forEach(([k,v],j)=>{const x=L+j*(cw+12);P.rect(x,P.y,cw,hh,'#faf8f4',LINE);P.text(x+10,P.y+8,k.toUpperCase(),7,false,GREY);wrapTxt(v||'—',10,true,cw-20).forEach((ln,n)=>P.text(x+10,P.y+20+n*13,ln,10,true))});P.y+=hh+8}
  if(doc.intro){const ls=wrapTxt(doc.intro,9.5,false,CW-28);const hh=ls.length*13+18;ensure(hh+10);P.rect(L,P.y,CW,hh,'#fbf6ec');P.rect(L,P.y,3,hh,GOLD);ls.forEach((ln,n)=>P.text(L+16,P.y+10+n*13,ln,9.5));P.y+=hh+14}
  const head=h=>{ensure(40);P.y+=6;P.rect(L,P.y,3,12,GOLD);P.text(L+10,P.y+1,h.toUpperCase(),9,true,INK);P.y+=22};
  const imgs=await Promise.all(doc.secciones.flatMap(s=>s.fotos||[]).map(id=>FILES[id]?toJpeg(FILES[id].url):Promise.resolve(null)));let ii=0;
  for(const s of doc.secciones){
    if(s.tabla){head(s.h);const w=s.tabla.w,xs=w.reduce((a,v,i)=>(a.push((a[i-1]??L)+(i?w[i-1]*CW:0)),a),[]);
      const hdr=()=>{P.rect(L,P.y,CW,18,'#f1ede5');s.tabla.cols.forEach((c,i)=>P.text(xs[i]+6,P.y+5,c.toUpperCase(),7,true,GREY));P.y+=20};hdr();
      s.tabla.rows.forEach(row=>{const cells=row.map((v,i)=>wrapTxt(v,8.5,false,w[i]*CW-12));const hh=Math.max(...cells.map(c=>c.length))*11.5+10;if(P.y+hh>bottom){P.newPage();hdr()}cells.forEach((c,i)=>c.forEach((ln,n)=>{const b=/^(Descripción|Posible solución|Recomendación)/.test(ln);P.text(xs[i]+6,P.y+5+n*11.5,ln,8.5,b)}));P.y+=hh;P.line(L,P.y,R,P.y,LINE)});P.y+=8}
    if(s.lista){head(s.h);s.lista.forEach((it,n)=>{const ls=wrapTxt((n+1)+'. '+it,9,false,CW-14);ensure(ls.length*12+4);ls.forEach(ln=>{P.text(L+8,P.y,ln,9);P.y+=12});P.y+=4})}
    if(s.texto!=null){head(s.h);wrapTxt(s.texto||'—',9.5,false,CW).forEach(ln=>{ensure(13);P.text(L,P.y,ln,9.5);P.y+=13});P.y+=6}
    if(s.fotos){head(s.h);const cw=(CW-16)/3;s.fotos.forEach((id,n)=>{const im=imgs[ii++];if(!im)return;const h=cw*im.h/im.w;if(n%3===0)ensure(Math.min(h,170)+10);const x=L+(n%3)*(cw+8);const hh=Math.min(h,170),ww=hh*im.w/im.h;P.image(im,x,P.y,ww,hh);if(n%3===2||n===s.fotos.length-1)P.y+=hh+10});if(!s.fotos.length){P.text(L,P.y,'Sin fotos adjuntas.',9,false,GREY);P.y+=14}}
  }
  if(doc.resultado){ensure(30);P.y+=6;P.text(L,P.y,'RESULTADO: ',10,true,INK);P.text(L+tw('RESULTADO: ',10,true),P.y,doc.resultado.toUpperCase(),10,true,doc.resultado==='Conforme'?'#2f7d50':doc.resultado==='No conforme'?'#b5372d':'#a0611f');P.y+=22}
  if(doc.conclusion){head('Conclusión');wrapTxt(doc.conclusion,9.5,false,CW).forEach(ln=>{ensure(13);P.text(L,P.y,ln,9.5);P.y+=13});P.y+=6}
  if(doc.firmas){ensure(70);P.y+=34;const cw=(CW-40)/2;doc.firmas.forEach(([n,c],j)=>{const x=L+j*(cw+40);P.line(x,P.y,x+cw,P.y,'#9a948a');P.text(x+(cw-tw(n||' ',8.5,true))/2,P.y+6,n||' ',8.5,true);P.text(x+(cw-tw(c,8,false))/2,P.y+18,c,8,false,GREY)});P.y+=36}

  return P.build();

function novedades(){
  const ns=misNotifs().filter(n=>!n.leido);if(!ns.length)return'';
  return `<section class="sec novs"><div class="sec-head"><h2>Novedades <span class="badge inl">${ns.length}</span></h2><button class="btn sm ghost" data-act="leerTodo">Marcar como leídas</button></div><div class="list">${ns.slice(0,6).map(n=>`<button class="nov" data-act="abrirNotif" data-id="${n.id}"><span class="ndot"></span><span><b>${esc(n.txt)}</b><span class="muted small">${n.obra?esc(n.obra.nombre)+' · ':''}${n.fecha===TODAY?'hoy':fmt(n.fecha)}</span></span><span class="go">›</span></button>`).join('')}</div></section>`;
}

/* ================= estado de situación ================= */
function situacion(){
  const r=ROLE(),obras=misObras();let lvl='ok',h='',p='';
  if(r==='direccion'||r==='jefe'){
    const cs=cardsDe(obras),ro=cs.filter(x=>color(x)==='rojo'),na=cs.filter(x=>['naranja','amarillo'].includes(color(x)));
    lvl=ro.length?'crit':na.length?'warn':'ok';
    h=ro.length?`${plural(ro.length,'tarjeta vencida','tarjetas vencidas')} y ${na.length} por vencer`:na.length?`${plural(na.length,'tarjeta','tarjetas')} por vencer, ninguna vencida`:'Todas las tarjetas están en plazo';
    const conRo=[...new Set(ro.map(x=>x.obra.nombre))];
    p=r==='direccion'?`En las ${obras.length} obras activas de ${ORG}. ${conRo.length?`Las vencidas están en ${conRo.join(', ')}: tareas que arrancan o ya arrancaron sin todo lo que necesitan.`:'Ninguna tarea está frenada.'}`
      :`En ${obras.map(o=>o.nombre).join(' y ')}. ${ro.length?'Empezá por las vencidas: la tarea que las necesita ya arrancó o está por arrancar.':'Revisá lo que vence esta semana.'}`;
  }else if(r==='estudio'){
    const cs=cardsDe(obras).filter(c=>c.tipo==='doc'&&itemsEstudio(c).some(i=>!iDone(i)&&!nuevoResp(i)));
    const ro=cs.filter(x=>color(x)==='rojo'),sem=cs.filter(x=>!['rojo','futuro'].includes(color(x))&&workBetween(TODAY,timing(x).limit)<=5);
    lvl=ro.length?'crit':sem.length?'warn':'ok';
    h=ro.length?`${plural(ro.length,'tarjeta vencida','tarjetas vencidas')}${sem.length?` y ${sem.length} que vencen esta semana`:''}`:sem.length?`${plural(sem.length,'tarjeta vence','tarjetas vencen')} esta semana`:'Todas sus entregas están en plazo';
    p=`En ${plural(obras.length,'obra','obras')} con ${CONSTRUCTORAS.find(c=>c.id===S.cons).n}. Cada tarjeta reúne los planos y definiciones que necesita una tarea.`;
  }else if(r==='auditor'){
    const ag=agendaAud(obras,7),rev=ag.filter(a=>a.tipo==='rev').length,sup=ag.filter(a=>a.tipo==='sup').length,cert=agendaAud(obras,30).filter(a=>a.tipo==='cert').length;
    lvl=rev||sup?'warn':'ok';
    h=[rev?plural(rev,'documento por revisar','documentos por revisar'):'',sup?plural(sup,'supervisión esta semana','supervisiones esta semana'):''].filter(Boolean).join(' y ')||'Sin pendientes esta semana';
    p=`${plural(cert,'certificado de finalidad de etapa','certificados de finalidad de etapa')} en los próximos 30 días. Auditás ${plural(obras.length,'obra','obras')}.`;
  }
  return `<section class="situ s-${lvl}"><div class="situ-top"><span class="eyebrow">Estado de situación · ${fmtLargo(TODAY)}</span><span class="pill">${lvl==='crit'?'Requiere atención':lvl==='warn'?'Atención':'En orden'}</span></div><h1>${h}</h1><p>${p}</p></section>`;
}

/* ================= indicadores ================= */
function pctATiempo(cs){const r=cs.filter(c=>TODAY>timing(c).limit||cDone(c));const ok=r.filter(c=>cDone(c)&&!cLate(c)).length;return{ok,n:r.length,venc:r.filter(c=>!cDone(c)).length,pct:r.length?Math.round(ok/r.length*100):0}}
const paraPedir=()=>cardsDe(misObras()).filter(c=>['verde','amarillo','naranja'].includes(color(c))).sort((a,b)=>timing(a).limit-timing(b).limit);
function proxInicio(){const c=misObras().flatMap(o=>o.tasks.filter(t=>t.start>TODAY).map(t=>({o,t}))).sort((a,b)=>a.t.start-b.t.start)[0];if(!c)return null;c.cards=c.o.cards.filter(x=>x.task===c.t);c.falt=c.cards.filter(x=>!cDone(x)).length;return c}
const estCards=()=>cardsDe(misObras()).filter(c=>c.tipo==='doc'&&itemsEstudio(c).length);
const estPend=()=>estCards().filter(c=>itemsEstudio(c).some(i=>!iDone(i)&&!nuevoResp(i)));
function margenEstudio(){let m=0,l=0;estCards().filter(c=>cDone(c)).forEach(c=>{const k=timing(c).limit,f=doneFecha(c);if(!f)return;if(f<=k)m+=workBetween(f,k);else l+=workBetween(k,f)});return{m,l}}
const listRows=rows=>rows.length?`<div class="card">${rows.map(([a,b,c])=>`<div class="irow"><span>${a}</span><b class="${c||''}">${b}</b></div>`).join('')}</div>`:'<p class="muted">No hay datos para mostrar.</p>';
/* impacto económico estimado: lo que se ahorra llegando a tiempo y lo que se pierde esperando */
const DIAS_EVITADOS=1.5;
function econ(obras){return obras.map(o=>{const cs=o.cards.filter(enCronograma);const ok=cs.filter(c=>cDone(c)&&!cLate(c)).length;const dia=o.dot*o.jornal*.5;
  const ahorro=ok*DIAS_EVITADOS*dia,perdida=o.cards.reduce((s,c)=>s+costoEst(c),0),riesgo=o.cards.filter(c=>['naranja','amarillo'].includes(color(c))).length*5*dia;return{o,ok,ahorro,perdida,riesgo,dia}})}
const KPI={
  costo:{t:'Costo de la espera',calc:()=>{const cs=cardsDe(misObras()).filter(c=>costoEst(c)>0),tot=cs.reduce((s,c)=>s+costoEst(c),0);return{v:moneyK(tot),l:'pérdida estimada por esperas hoy',s:`${plural(cs.length,'tarjeta frena','tarjetas frenan')} tareas`,c:tot?'rojo':'verde'}},
    det:()=>`<p>Cada tarjeta vencida frena a la cuadrilla. Si la jefatura informó cómo está esperando, se usa ese dato; si no, se estima a media marcha.</p><p class="formula">días hábiles en rojo × personas en obra × jornal × (100% parada · 50% a medias o sin informar)</p>${listRows(cardsDe(misObras()).filter(c=>costoEst(c)>0).map(c=>[`${esc(c.obra.nombre)} · ${esc(titulo(c))}<br><span class="muted small">${diasRojo(c)} d × ${dotacion(c.obra)} personas × ${money(c.obra.jornal)} × ${c.impacto?FACT[c.impacto]*100+'%':'50% (estimado)'}</span>${c.impactoTxt?`<br><span class="small">"${esc(c.impactoTxt)}"</span>`:''}`,money(costoEst(c)),'t-rojo']))}`},
  desvio:{t:'Plazo de las obras',calc:()=>{const os=misObras().filter(o=>desvioSem(o)>0);return{v:`${os.length} de ${misObras().length}`,l:'obras que terminan después de su base',s:os.length?`hasta +${Math.max(...os.map(desvioSem))} semanas`:'todas en plazo',c:os.length?'naranja':'verde'}},
    det:()=>`<p>Compara la entrega prevista según el cronograma conforme a obra con la entrega de la base que fijó la Dirección.</p>${listRows(misObras().map(o=>[`${esc(o.nombre)}<br><span class="muted small">avance real ${avance(o)}% · según la base ${avancePlan(o)}%</span>`,desvioSem(o)>0?`+${desvioSem(o)} sem · ${fmt(finObra(o))}`:`en plazo · ${fmt(finObra(o))}`,desvioSem(o)>0?'t-naranja':'t-verde']))}`},
  atiempo:{t:'Definiciones a tiempo',calc:()=>{const r=pctATiempo(cardsDe(misObras()).filter(c=>c.tipo==='doc'));return{v:r.n?r.pct+'%':'—',l:'de las tarjetas de planos y definiciones se completaron antes del rojo',s:`${r.ok} de ${r.n}`,c:r.pct>=80?'verde':r.pct>=60?'naranja':'rojo'}},
    det:()=>`<p>De las tarjetas de planos y definiciones que ya debían estar completas, cuántas se completaron antes de su fecha límite.</p>${listRows(misObras().map(o=>{const r=pctATiempo(o.cards.filter(c=>c.tipo==='doc'));return[esc(o.nombre),r.n?`${r.pct}% · ${r.ok}/${r.n}`:'sin datos',r.pct>=80?'t-verde':r.pct>=60?'t-naranja':'t-rojo']}))}`},
  vencidos:{t:'Tarjetas vencidas',calc:()=>{const cs=cardsDe(misObras()).filter(c=>color(c)==='rojo');return{v:cs.length,l:'tarjetas vencidas',s:`${cs.reduce((s,c)=>s+c.items.filter(i=>!iDone(i)).length,0)} ítems sin resolver`,c:cs.length?'rojo':'verde'}},
    det:()=>`<p>Tarjetas que pasaron su fecha límite (3 días hábiles antes de que arranque la tarea) con ítems sin resolver.</p><div class="list">${cardsDe(misObras()).filter(c=>color(c)==='rojo').map(c=>cardHTML(c)).join('')||'<p class="muted">Ninguna.</p>'}</div>`},
  pedir:{t:'Para resolver esta semana',calc:()=>{const cs=paraPedir();return{v:cs.length,l:'tarjetas con la ventana abierta',s:'todavía con ítems pendientes',c:cs.length?'naranja':'verde'}},
    det:()=>`<p>Tarjetas cuya ventana ya abrió según el cronograma y que tienen ítems pendientes. Resolverlas ahora evita que lleguen al rojo.</p><div class="list">${paraPedir().map(c=>cardHTML(c)).join('')||'<p class="muted">Ninguna.</p>'}</div>`},
  proximo:{t:'Próximo inicio de tarea',calc:()=>{const n=proxInicio();return n?{v:fmt(n.t.start),l:`arranca ${n.t.name}`,s:`${n.o.nombre} · ${n.falt} ${n.falt===1?'tarjeta incompleta':'tarjetas incompletas'}`,c:n.falt?'naranja':'verde'}:{v:'—',l:'sin tareas próximas',s:''}},
    det:()=>{const n=proxInicio();return n?`<p>${esc(n.t.name)} arranca el ${fmtLargo(n.t.start)} en ${esc(n.o.nombre)}. Para arrancar sin frenar necesita:</p><div class="list">${n.cards.map(c=>cardHTML(c,false)).join('')}</div>`:'<p>No hay tareas próximas.</p>'}},
  sup:{t:'Próxima supervisión',calc:()=>{const s=agendaAud(misObras(),60).find(a=>a.tipo==='sup');return s?{v:fmt(s.f),l:'próxima supervisión de obra',s:s.o.nombre,c:''}:{v:'—',l:'sin supervisiones',s:''}},
    det:()=>`<p>Supervisiones quincenales de las obras que auditás. Tocá una para cargar el acta.</p>${agendaHTML(agendaAud(misObras(),30).filter(a=>a.tipo==='sup'))}`},
  rev:{t:'Documentos por revisar',calc:()=>{const n=agendaAud(misObras(),365).filter(a=>a.tipo==='rev').length;return{v:n,l:'planos esperando revisión',s:'de los estudios o cargados por la jefatura',c:n?'azul':'verde'}},
    det:()=>`<p>Cada plano que sube un estudio, o que la jefatura carga desde WhatsApp, queda "en revisión" hasta que lo aprobás u observás.</p>${DOCS.filter(x=>misObras().includes(x.obra)&&x.estado==='en revisión').map(x=>`<div class="card"><div class="top"><span><b>${esc(x.nombre)}</b><br><span class="muted small">${esc(x.obra.nombre)} · ${esc(x.por)} · rev ${x.ver} · ${fmt(x.fecha)}</span></span><span class="status t-azul">en revisión</span></div><div class="row2">${fileBtns({docId:x.id})}<button class="btn sm gold" data-act="nuevoAud" data-t="rev" data-o="${x.obra.id}" data-doc="${x.id}">Revisar</button></div></div>`).join('')||'<p class="muted">No hay planos por revisar.</p>'}`},
  cert:{t:'Certificados de etapa',calc:()=>{const c=agendaAud(misObras(),30).filter(a=>a.tipo==='cert');return{v:c.length,l:'certificaciones en los próximos 30 días',s:'etapas terminadas o por hormigonar',c:c.length?'rosa':'verde'}},
    det:()=>`<p>Puntos de control atados al cronograma: hormigonados, fin de mampostería, pileta e instalaciones antes de revocar.</p>${agendaHTML(agendaAud(misObras(),30).filter(a=>a.tipo==='cert'))}`},
  est_atiempo:{t:'Entregas a tiempo',calc:()=>{const r=pctATiempo(estCards());return{v:r.n?r.pct+'%':'—',l:'de sus tarjetas se completaron antes del rojo',s:r.pct>=50?'la obra avanza gracias a sus entregas':'cada entrega a tiempo suma',c:r.pct>=50?'gold':'naranja'}},
    det:()=>`<p>De las tarjetas de planos y definiciones que ya debían estar completas, cuántas llegaron antes de la fecha límite de cada obra.</p>${listRows(misObras().map(o=>{const r=pctATiempo(o.cards.filter(c=>c.tipo==='doc'));return[esc(o.nombre),r.n?`${r.pct}% · ${r.ok}/${r.n}`:'sin datos',r.pct>=80?'t-verde':'t-gold']}))}`},
  est_margen:{t:'Días de margen que dieron',calc:()=>{const m=margenEstudio();return{v:`+${m.m} d`,l:'de margen ganado para las obras',s:'entregas antes de la fecha límite',c:'verde'}},
    det:()=>{const m=margenEstudio();return`<p>Cada día hábil que entregan antes de la fecha límite es margen para que la cuadrilla no frene: la obra termina antes, el propietario está conforme y el estudio libera a su equipo antes.</p>${listRows([['Días de margen por entregas anticipadas',`+${m.m} días`,'t-verde'],['Días de demora por entregas tarde',`${m.l} días`,'t-naranja']])}`}},
  est_venc:{t:'Para entregar',calc:()=>{const cs=estPend(),ro=cs.filter(c=>color(c)==='rojo').length;return{v:cs.length,l:'tarjetas con planos o definiciones pendientes',s:ro?`${ro} ya vencidas`:'ninguna vencida',c:ro?'rojo':'verde'}},
    det:()=>`<p>Tarjetas de planos y definiciones con ítems a cargo del estudio, ordenadas por fecha límite.</p><div class="list">${estPend().sort((a,b)=>ORDEN[color(a)]-ORDEN[color(b)]).map(c=>cardHTML(c)).join('')}</div>`}
};
const KPIS_ROL={direccion:['costo','desvio','atiempo'],jefe:['vencidos','pedir','proximo'],auditor:['sup','rev','cert'],estudio:['est_atiempo','est_margen','est_venc']};
function kpis(){return `<div class="kpis">${(KPIS_ROL[ROLE()]||[]).map(id=>{const k=KPI[id].calc();return `<button class="kpi k-${k.c||''}" data-act="kpi" data-k="${id}" aria-label="${esc(KPI[id].t)}: ver detalle"><span class="kgo">ver ›</span><b>${k.v}</b><span class="kl">${k.l}</span>${k.s?`<span class="ks">${k.s}</span>`:''}</button>`}).join('')}</div>`}
function econPanel(obras){const E2=econ(obras),A=E2.reduce((s,x)=>s+x.ahorro,0),Pd=E2.reduce((s,x)=>s+x.perdida,0),R=E2.reduce((s,x)=>s+x.riesgo,0),mx=Math.max(1,...E2.map(x=>Math.max(x.ahorro,x.perdida)));
  return `<section class="sec"><div class="sec-head"><h2>Impacto económico</h2><button class="btn sm ghost" data-act="econ">Cómo se calcula</button></div><div class="econ"><div class="eg"><span>Ahorro por llegar a tiempo</span><b>+${moneyK(A)}</b><small>${E2.reduce((s,x)=>s+x.ok,0)} tarjetas completas antes del rojo</small></div><div class="er"><span>Pérdida por esperas</span><b>−${moneyK(Pd)}</b><small>tarjetas vencidas hoy</small></div><div class="eo"><span>En riesgo · próximos 15 días</span><b>${moneyK(R)}</b><small>si las urgentes llegan tarde</small></div></div>
  <div class="card">${E2.map(x=>`<div class="dvb"><span>${esc(x.o.nombre)}</span><span class="dv-l"><i style="width:${x.perdida/mx*100}%"></i></span><span class="dv-r"><i style="width:${x.ahorro/mx*100}%"></i></span></div>`).join('')}<div class="dvb leg"><span></span><span class="t-rojo">pérdida</span><span class="t-verde">ahorro</span></div></div></section>`}

/* ================= agenda (auditoría) ================= */
const ATIPO={sup:['Supervisión de obra','a-sup'],rev:['Revisión de documentación','a-rev'],cert:['Certificado de finalidad de etapa','a-cert']};
function agendaHTML(items){
  if(!items.length)return'<p class="muted">Nada agendado en este período.</p>';
  let out='',wk=null;
  items.forEach(a=>{const w=lunesDe(a.f);if(w!==wk){wk=w;out+=`<div class="awk">${w<=TODAY&&TODAY<w+7*DAY?'Esta semana':'Semana del '+fmt(w)}</div>`}
    const x=new Date(a.f),dd=workBetween(TODAY,a.f),act=a.act;
    out+=`<button class="aitem ${ATIPO[a.tipo][1]}" data-act="${act.a}" ${Object.entries(act).filter(([k])=>k!=='a').map(([k,v])=>`data-${k}="${v}"`).join(' ')}><span class="adate"><span>${DIAC[x.getUTCDay()]}</span><b>${x.getUTCDate()}</b><span>${MES[x.getUTCMonth()]}</span></span><span class="abody"><b>${ATIPO[a.tipo][0]} · ${esc(a.o.nombre)}</b><span>Motivo: ${esc(a.motivo)}</span></span><span class="atag">${a.f<=TODAY?'hoy':dd===1?'mañana':'en '+dd+' d'}</span></button>`});
  return `<div class="agenda">${out}</div>`;
}

/* ================= inicio ================= */
function vInicio(){
  const r=ROLE(),obras=misObras();
  if(r==='auditor')return `${situacion()}${novedades()}${kpis()}<section class="sec"><div class="sec-head"><h2>Agenda de los próximos 30 días</h2><span class="legend-a"><i class="a-sup"></i>Supervisión <i class="a-rev"></i>Revisión <i class="a-cert"></i>Certificado</span></div>${agendaHTML(agendaAud(obras,30))}</section>`;
  if(r==='estudio'){
    const inv=INVITES.filter(i=>i.rol==='estudio'&&i.para===S.u.name&&i.estado==='pendiente'&&i.obra.constructora===S.cons);
    const cs=estPend().sort((a,b)=>ORDEN[color(a)]-ORDEN[color(b)]||timing(a).limit-timing(b).limit).slice(0,5);
    const ad=ADIC.filter(a=>puedeVer(a.obra)&&adicEstado(a)[0]==='Espera autorización');const m=margenEstudio(),r2=pctATiempo(estCards());
    return `${inv.map(i=>`<section class="invite"><span class="eyebrow">Invitación de ${esc(CONSTRUCTORAS.find(c=>c.id===i.obra.constructora).n)}</span><h2>${esc(i.obra.nombre)}</h2><p class="small">Te invitan como estudio y dirección de obra. Al aceptar, la obra aparece en tu panel con sus tarjetas, planos y cronograma.</p><div class="row2"><button class="btn gold" data-act="aceptarInv" data-id="${i.id}">Aceptar invitación</button></div></section>`).join('')}${situacion()}${novedades()}${kpis()}
    <div class="gana"><span class="eyebrow" style="color:var(--gold)">Lo que gana el estudio</span><p>Con sus entregas, las obras sumaron <b>${m.m} días de margen</b>${r2.n?` y el <b>${r2.pct}%</b> de las tarjetas llegó a tiempo`:''}. Menos consultas repetidas, menos adicionales que justificar y propietarios conformes.</p></div>
    <section class="sec"><div class="sec-head"><h2>Sus obras</h2><span class="muted small">${obras.length} con ${esc(CONSTRUCTORAS.find(c=>c.id===S.cons).n)}</span></div>${obrasStrip(obras)}</section>
    <section class="sec"><div class="sec-head"><h2>Lo que necesitan las obras</h2><button class="btn sm ghost" data-act="tab" data-t="pedidos">Ver todas</button></div><div class="list">${cs.map(c=>cardHTML(c)).join('')||'<p class="muted">No hay entregas pendientes.</p>'}</div></section>
    ${ad.length?`<section class="sec"><h2>Adicionales para autorizar</h2><div class="list">${ad.map(adicCard).join('')}</div></section>`:''}
    ${vIA()}`;
  }
  const av=cardsDe(obras).filter(c=>['rojo','naranja','amarillo'].includes(color(c))||cNuevos(c)).sort((a,b)=>(cNuevos(b)>0)-(cNuevos(a)>0)||ORDEN[color(a)]-ORDEN[color(b)]||timing(a).limit-timing(b).limit);
  return `${situacion()}${novedades()}${kpis()}${r==='direccion'?econPanel(obras):''}<section class="sec"><div class="sec-head"><h2>${r==='direccion'?'Obras en curso':'Tus obras'}</h2><button class="btn sm ghost" data-act="tab" data-t="obras">${r==='direccion'?'Ver cartera':'Ver obras'}</button></div>${obrasStrip(obras)}</section>
  ${vIA()}
  <section class="sec"><div class="sec-head"><h2>Tarjetas que requieren atención</h2><span class="muted small">de más urgente a menos</span></div><div class="list">${av.slice(0,8).map(c=>cardHTML(c)).join('')||'<p class="muted">Sin avisos.</p>'}</div>${av.length>8?`<button class="btn ghost full" data-act="tab" data-t="pedidos">Ver las ${av.length}</button>`:''}</section>`;
}

/* ================= obras ================= */
function audBoxes(o){const s=o.sup.find(x=>x.estado==='programada'),rv=DOCS.filter(x=>x.obra===o&&x.estado==='en revisión').length,c=o.cert.filter(x=>certEstado(x)==='pendiente').sort((a,b)=>certFecha(a)-certFecha(b))[0];
  return `<span class="ogrid aud"><span class="a-sup"><span>Supervisión</span><b>${s?fmt(s.fecha):'—'}</b></span><span class="a-rev"><span>Revisión de doc.</span><b class="${rv?'t-azul':''}">${rv?plural(rv,'plano','planos'):'Al día'}</b></span><span class="a-cert"><span>Certificación</span><b class="${c?'t-rosa':''}">${c?fmt(certFecha(c)):'—'}</b></span></span>`}
function orow(o){
  const ok=puedeVer(o),dv=desvioSem(o),ro=o.cards.filter(c=>color(c)==='rojo').length,docs=o.cards.filter(c=>c.tipo==='doc'),lis=docs.filter(cDone).length,r=ROLE();

/* ================= ficha de obra ================= */

  const r=ROLE(),est=r==='estudio',aud=r==='auditor',a=actual(o),n=proxima(o);
  const tabs=est?[['crono','Cronograma'],['sol','Tarjetas'],['docs','Planos'],['avances','Avances'],['adic','Adicionales'],['audit','Auditoría']]:aud?[['asup','Supervisiones'],['arev','Revisión de doc.'],['acert','Certificación'],['crono','Cronograma'],['docs','Planos'],['avances','Avances']]:[['crono','Cronograma'],['docs','Planos'],['informes','Informes'],['avances','Avances'],['adic','Adicionales'],['audit','Auditoría'],['equipo','Equipo']];
  if(!tabs.find(t=>t[0]===S.otab))S.otab=tabs[0][0];
  const cs=est?o.cards.filter(c=>c.tipo==='doc'):o.cards;const falt=cs.filter(c=>!cDone(c)&&color(c)!=='futuro').length,res=cs.filter(cDone).length,nuevos=o.cards.filter(cNuevos).length;
  const dv=desvioSem(o);
  const body={crono:tabCrono,sol:tabSol,docs:tabDocs,informes:tabInformes,avances:tabAvances,adic:tabAdic,audit:tabAudit,equipo:tabEquipo,asup:o=>audPanel(o,'sup'),arev:o=>audPanel(o,'rev'),acert:o=>audPanel(o,'cert')}[S.otab](o);
  const facts=aud?'':`<div class="facts"><div class="fact"><span>Ahora</span><b>${iniciada(o)?esc(a.name):'Por iniciar'}</b></div><div class="fact"><span>Próxima tarea</span><b>${n?esc(n.name)+' · '+fmt(n.start):'Entrega'}</b></div><div class="fact"><span>${est?'Entrega contractual':'Entrega prevista'}</span><b class="${!est&&dv>0?'t-naranja':''}">${fmt(est?finContractual(o):finObra(o))}</b><small>${est?'según el cronograma presentado':dv>0?`${plural(dv,'semana','semanas')} después de la base`:'igual que la base'}</small></div><div class="fact"><span>${esDir()?'Pérdida por esperas':est?'Para entregar':'Tarjetas vencidas'}</span><b class="${esDir()?'t-rojo':''}">${esDir()?money(o.cards.reduce((s,c)=>s+costoEst(c),0)):est?falt:o.cards.filter(c=>color(c)==='rojo').length}</b></div></div>`;

  <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end"><div><span class="eyebrow">${esc(o.ubic)}</span><h1>${esc(o.nombre)}</h1></div><span class="bigpct">${avance(o)}%</span></div>
  <div class="bar"><i style="width:${avance(o)}%"></i><s style="left:${avancePlan(o)}%"></s></div><span class="muted small">Avance real ${avance(o)}% · según la base debería ir ${avancePlan(o)}% · etapa: ${esc(etapaDe(o))}</span>
  <div class="dots"><span class="chip gold">${modeloFull(o)}</span>${aud?'':`<span class="chip">${jefeTxt(o)}</span>`}<span class="chip">Estudio: ${esc(o.estudio)}</span></div>
  ${facts}

function tabSol(o){

/* --- planos y documentación --- */
const CATS=['Generales','Estructura','Arquitectura','Instalaciones','Carpinterías','Terminaciones','Exteriores'];
const DOC_EST={vigente:'t-verde','en revisión':'t-azul','con observaciones':'t-rojo',reemplazado:'t-ok'};
function docRow(x){const hist=DOCS.filter(y=>y.obra===x.obra&&y.nombre===x.nombre&&y.estado==='reemplazado').length;const nv=x.nuevo&&['jefe','auditor'].includes(ROLE());
  return `<div class="docrow ${nv?'nuevo':''}"><span class="dl"><span class="dn">${nv?'<span class="tag t-gold">Nuevo</span> ':''}${esc(x.nombre)}</span><span class="dm">rev ${x.ver} · ${esc(x.por)} · ${fmt(x.fecha)}${hist?` · ${hist} ${hist===1?'versión anterior':'versiones anteriores'}`:''}</span>${x.obs?`<span class="small t-rojo">${esc(x.obs)}</span>`:''}<span class="fbtns">${fileBtns({docId:x.id})}${ROLE()==='auditor'&&x.estado==='en revisión'?`<button class="btn sm gold" data-act="nuevoAud" data-t="rev" data-o="${x.obra.id}" data-doc="${x.id}">Revisar</button>`:''}</span></span><span class="status ${DOC_EST[x.estado]}">${x.estado}</span></div>`}
function tabDocs(o){
  const r=ROLE(),puede=r==='estudio'||puedePedir(o);
  const docs=DOCS.filter(x=>x.obra===o&&x.estado!=='reemplazado');
  return `${puede?`<button class="btn gold" data-act="subir" data-o="${o.id}">${r==='estudio'?'Subir documento o nueva versión':'Cargar plano recibido por fuera de la app'}</button>`:''}
  <div class="infobox">Una sola versión vigente por plano. Cada versión nueva llega a la vez a la jefatura y a la auditoría, queda "en revisión" y pasa a vigente cuando la auditoría la aprueba.</div>
  ${CATS.map(c=>{const l=docs.filter(x=>x.cat===c);if(!l.length)return'';return `<div class="card"><div class="top"><h3>${c}</h3><span class="muted small">${plural(l.length,'documento','documentos')}</span></div>${l.map(docRow).join('')}</div>`}).join('')||'<p class="muted">Sin documentos.</p>'}`;
}
function tabInformes(o){
  const own=puedePedir(o),lun=lunesDe(TODAY),esta=o.informes.find(i=>i.desde===lun);

  <div class="list">${o.informes.slice().reverse().map(i=>`<div class="entry row"><span><b>Informe N° ${i.n} · semana del ${fmt(i.desde)}</b><span class="muted small">Avance ${i.av}% · ${i.trab} días trabajados · ${i.lluvia} de lluvia · ${plural(i.fotos.length,'foto','fotos')}</span></span><span class="fbtns"><button class="btn sm" data-act="verInforme" data-id="${i.id}">Ver</button><button class="btn sm ghost" data-act="pdfInforme" data-id="${i.id}">PDF</button></span></div>`).join('')||'<p class="muted">Todavía no hay informes guardados.</p>'}</div>`;
}
function adicCard(x){const[e,c]=adicEstado(x);return `<button class="card" data-act="adic" data-id="${x.id}"><span class="top"><b>${esc(x.obra.nombre)} · Adicional N° ${x.n}</b><span class="status ${c}">${e}</span></span><span class="muted small">${esc(x.sector)} · ${esc(x.txt)}</span>${verCostos()||ROLE()==='estudio'?`<span class="mono">${x.total?money(x.total):'Sin cotizar'}</span>`:''}</button>`}
function tabAdic(o){const ad=ADIC.filter(x=>x.obra===o);return `<div class="list">${ad.map(adicCard).join('')||'<p class="muted">Sin adicionales.</p>'}</div><p class="note">Los requisitos los verifica la app. Mientras falte uno, el adicional queda bloqueado. ${puedePedir(o)?'Se inicia desde un hecho tipo "Cambio" del Registro.':''}</p>`}

/* --- auditoría: resumen para jefatura, dirección y estudio --- */

const CAMPOVAL={};
function audRow(a){return `<div class="docrow ${a.nuevo&&ROLE()==='jefe'?'nuevo':''}"><span class="dl"><span class="dn"><i class="adot ${ATIPO[a.tipo][1]}"></i>${esc(AUD_TIPO[a.tipo].corto)} · ${a.num}</span><span class="dm">${fmt(a.fecha)} · ${esc(a.tipo==='sup'?a.data.periodo:a.tipo==='rev'?a.data.docs.map(x=>x.nombre).join(', ')||'Archivos':a.data.etapa)}${a.data.obs?.length?' · '+plural(a.data.obs.length,'observación','observaciones'):''}</span><span class="fbtns"><button class="btn sm" data-act="verAud" data-id="${a.id}">Ver</button><button class="btn sm ghost" data-act="pdfAud" data-id="${a.id}">PDF</button>${ROLE()==='auditor'?`<button class="btn sm ghost" data-act="editAud" data-id="${a.id}">Editar</button>`:''}</span></span><span class="status ${a.resultado==='Conforme'?'t-verde':a.resultado==='No conforme'?'t-rojo':'t-amarillo'}">${a.resultado==='Conforme con observaciones'?'con obs.':a.resultado}</span></div>`}

/* panel de auditoría dentro de cada obra (auditor) */
function audPanel(o,t){
  const lst=AUD.filter(a=>a.tipo===t&&a.obra===o).sort((a,b)=>b.fecha-a.fecha);
  const nuevo={sup:'+ Nueva supervisión',rev:'+ Nueva revisión',cert:'+ Nuevo certificado'}[t];
  let pend='';
  if(t==='rev'){const ds=DOCS.filter(x=>x.obra===o&&x.estado==='en revisión');pend=ds.map(x=>`<div class="docrow ${x.nuevo?'nuevo':''}"><span class="dl"><span class="dn">${esc(x.nombre)}</span><span class="dm">${esc(x.por)} · rev ${x.ver} · ${fmt(x.fecha)}</span><span class="fbtns">${fileBtns({docId:x.id})}<button class="btn sm gold" data-act="nuevoAud" data-t="rev" data-o="${o.id}" data-doc="${x.id}">Revisar</button></span></span></div>`).join('')}
  if(t==='cert')pend=o.cert.filter(c=>certEstado(c)==='pendiente').map(c=>`<div class="irow"><span>${esc(c.etapa)}<br><span class="muted small">previsto ${fmt(certFecha(c))}</span></span><button class="btn sm gold" data-act="nuevoAud" data-t="cert" data-o="${o.id}" data-c="${c.id}">Certificar</button></div>`).join('');
  if(t==='sup')pend=o.sup.filter(s=>s.estado==='programada'&&s.fecha-TODAY<=14*DAY).map(s=>`<div class="irow"><span>${fmtLargo(s.fecha)}<br><span class="muted small">visita periódica</span></span><button class="btn sm gold" data-act="nuevoAud" data-t="sup" data-o="${o.id}" data-s="${s.id}">Cargar acta</button></div>`).join('');
  return `<button class="btn gold full" data-act="nuevoAud" data-t="${t}" data-o="${o.id}">${nuevo}</button>${pend?`<div class="card pend"><span class="eyebrow">Pendientes</span>${pend}</div>`:''}<div class="card"><div class="top"><h3>Emitidos</h3><span class="muted small">${lst.length}</span></div>${lst.map(audRow).join('')||'<p class="muted">Todavía no hay registros de este tipo.</p>'}</div>`;
}

/* ================= pedidos: tarjetas por tarea ================= */
function selectObras(obras,val,act){return `<label class="f">Obra<select data-chg="${act}" id="sel-${act}"><option value="todas">${obras.length>1?'Todas mis obras':'Mi obra'}</option>${obras.map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o.nombre)}</option>`).join('')}</select></label>`}
const FILTROS=[['activos','Abiertas'],['nuevos','Con respuestas'],['rojo','Vencidas'],['naranja','Urgentes'],['amarillo','Pedir ya'],['verde','Ventana abierta'],['futuro','Próximas'],['ok','Completas']];
const fOk=(c,k)=>k==='activos'?!['futuro','ok'].includes(color(c)):k==='nuevos'?cNuevos(c)>0:k==='todos'?true:color(c)===k;
const cuentaF=(cs,k)=>cs.filter(c=>fOk(c,k)).length;
function filtrosColor(cs){return `<div class="filters wrap">${FILTROS.filter(([k])=>k!=='nuevos'||cuentaF(cs,'nuevos')).map(([k,l])=>`<button data-act="filtro" data-f="${k}" aria-pressed="${S.filtro===k}">${!['activos','nuevos'].includes(k)?`<span class="dot c-${k}"></span>`:k==='nuevos'?'<span class="dot c-gold"></span>':''}${l} <span class="muted">${cuentaF(cs,k)}</span></button>`).join('')}</div>`}
function porTarea(cs,showObra){const g=new Map();cs.sort((a,b)=>a.task.start-b.task.start||CARD_ORD.indexOf(a.tipo)-CARD_ORD.indexOf(b.tipo)).forEach(c=>{const k=c.obra.id+c.task.id;if(!g.has(k))g.set(k,{o:c.obra,t:c.task,cs:[]});g.get(k).cs.push(c)});
  return [...g.values()].sort((a,b)=>Math.min(...a.cs.map(c=>ORDEN[color(c)]))-Math.min(...b.cs.map(c=>ORDEN[color(c)]))||a.t.start-b.t.start).map(x=>tareaBlock(x.o,x.t,x.cs,showObra)).join('')}
function vPedidos(){
  const r=ROLE(),obras=misObras(),sel=obras.find(o=>o.id===S.obraF)||null;

    return `<section class="sec"><h1>Tarjetas de las obras</h1><p class="muted">Una tarjeta por tarea con los planos y definiciones que necesita. Respondé cada ítem adjuntando el archivo: le llega a la jefatura y, si es un plano, también a la auditoría.</p>${selectObras(obras,S.obraF,'obraF')}${filtrosColor(cs)}<div class="list">${cs.filter(c=>fOk(c,S.filtro)).sort((a,b)=>ORDEN[color(a)]-ORDEN[color(b)]||timing(a).limit-timing(b).limit).map(c=>cardHTML(c,!sel)).join('')||'<p class="muted">No hay tarjetas en este estado.</p>'}</div></section>`;
  }
  let cs=cardsDe(sel?[sel]:obras);if(S.tipoF!=='Todas')cs=cs.filter(c=>S.tipoF==='ope'?['ope','ser'].includes(c.tipo):c.tipo===S.tipoF);
  const tile=(k,cls,l)=>`<button class="kpi ${cls}" data-act="filtro" data-f="${k}" aria-pressed="${S.filtro===k}"><b>${cuentaF(cs,k)}</b><span class="kl">${l}</span></button>`;

/* ================= desempeño (dirección) ================= */
function metricas(){return obrasOrg().map(o=>{
  const intern=o.cards.filter(c=>c.tipo!=='doc'),r=pctATiempo(intern);
  const ts=o.tasks.filter(t=>t.real&&(t.real.fin||t.real.av>=15));
  const rend=ts.length?Math.round(ts.reduce((s,t)=>{const b=baseDe(o,t);if(!b)return s+1;const pd=b.end-b.start+3*DAY;return s+(t.real.fin?pd/(t.real.fin-t.real.ini+3*DAY):clamp(t.real.av/100/((TODAY-t.real.ini)/pd),.3,1.5))},0)/ts.length*100):null;
  const s=AUD.filter(a=>a.obra===o&&a.tipo==='sup');const llego=pctATiempo(o.cards.filter(c=>c.tipo==='doc'));const ec=econ([o])[0];
  return{o,ok:r.ok,tarde:r.n-r.ok,n:r.n,pct:r.pct,ev:r.n<6,dv:desvioSem(o),rend,conf:s.length?Math.round(s.filter(x=>x.resultado==='Conforme').length/s.length*100):null,llego,ec}}).sort((a,b)=>(a.ev-b.ev)||(b.pct-a.pct))}
const semC=v=>v===null?'':v>=80?'verde':v>=60?'naranja':'rojo';
function equiposMet(){const m={};obrasOrg().forEach(o=>o.tasks.filter(t=>t.real&&t.real.fin).forEach(t=>{const b=baseDe(o,t);if(!b)return;const e=m[t.equipo]||(m[t.equipo]={n:0,r:0,obras:new Set()});e.n++;e.r+=(b.end-b.start+3*DAY)/(t.real.fin-t.real.ini+3*DAY);e.obras.add(o.nombre)}));return Object.entries(m).map(([k,v])=>({k,n:v.n,rend:Math.round(v.r/v.n*100),obras:[...v.obras]})).sort((a,b)=>b.rend-a.rend)}
function vDesempeno(){
  const m=metricas(),rk=m.filter(x=>!x.ev),eq=equiposMet(),obj=85,eqPct=Math.round(rk.reduce((s,x)=>s+x.ok,0)/Math.max(1,rk.reduce((s,x)=>s+x.n,0))*100);
  return `<section class="sec"><span class="eyebrow">Dirección</span><h1>Desempeño de las obras</h1><p class="muted">Tres preguntas por obra, cada una con su color: verde va bien (80% o más), naranja a mejorar (60 a 79%), rojo crítico (menos de 60%).</p></section>
  <div class="card how"><div><b>1 · ¿La jefatura llegó a tiempo?</b><span class="muted small">Tarjetas internas (materiales, condiciones y servicios) completas antes de la fecha límite. Es lo que depende del jefe de obra.</span></div><div><b>2 · ¿Rinde el equipo?</b><span class="muted small">Duración de la base contra duración real de las tareas. 100% = rinde lo planificado.</span></div><div><b>3 · ¿Llega en plazo?</b><span class="muted small">Entrega prevista contra la entrega de la base.</span></div></div>
  <div class="card"><span class="eyebrow">Objetivo del equipo · trimestre</span><div class="hbar"><span>Tarjetas internas a tiempo, todas las obras</span><span class="tr"><i style="width:${eqPct}%;background:var(--${semC(eqPct)})"></i><s style="left:${obj}%"></s></span><b class="mono">${eqPct}%</b></div><span class="muted small">Meta ${obj}%. Si el equipo completo la alcanza, hay premio para todos.</span></div>
  <div class="rank">${m.map(x=>{const pos=x.ev?'—':rk.indexOf(x)+1;return `<div class="rcard ${pos===1?'top1':''}"><div class="rhead"><span style="display:flex;gap:10px;align-items:center"><span class="rpos">${pos}</span><span><b>${esc(x.o.nombre)}</b><br><span class="muted small">Jefatura: ${esc(x.o.jefe)} · ${esc(etapaDe(x.o))}</span></span></span>${pos===1?'<span class="status t-amarillo">Mejor del período</span>':x.ev?'<span class="status t-ok">En evaluación</span>':''}</div>
  <div class="m3"><div class="k-${semC(x.n?x.pct:null)}"><span>Jefatura a tiempo</span><b>${x.n?x.pct+'%':'—'}</b><small>${x.ok} de ${x.n} tarjetas</small></div><div class="k-${semC(x.rend===null?null:Math.min(100,x.rend))}"><span>Rinde el equipo</span><b>${x.rend===null?'—':x.rend+'%'}</b><small>${x.rend===null?'sin tareas medidas':x.rend>=105?'más rápido que la base':x.rend>=95?'rinde lo planificado':'más lento que la base'}</small></div><div class="k-${x.dv>1?'rojo':x.dv>0?'naranja':'verde'}"><span>Llega en plazo</span><b>${x.dv>0?'+'+x.dv+' sem':'Sí'}</b><small>entrega ${fmt(finObra(x.o))}</small></div></div>
  <div class="cards" aria-label="${x.ok} a tiempo y ${x.tarde} tarde">${'<i class="g"></i>'.repeat(Math.min(40,x.ok))}${'<i class="r"></i>'.repeat(Math.min(40,x.tarde))}</div><span class="muted small">Cada cuadrado es una tarjeta interna: verde si se completó a tiempo, rojo si no.</span>
  <div class="rmet"><div><span>Estudio a tiempo</span><b>${x.llego.n?x.llego.pct+'%':'—'}</b></div><div><span>Ahorro / pérdida</span><b><span class="t-verde">+${moneyK(x.ec.ahorro)}</span> <span class="t-rojo">−${moneyK(x.ec.perdida)}</span></b></div><div><span>Supervisiones conformes</span><b>${x.conf===null?'—':x.conf+'%'}</b></div></div></div>`}).join('')}</div>
  <section class="sec"><h2>Rendimiento por equipo</h2><p class="muted small">Sale del cronograma conforme a obra: cuánto tardó cada equipo contra la base, en todas las obras donde trabajó.</p><div class="card">${eq.map(e=>`<div class="hbar"><span>${esc(e.k)}<br><span class="muted small">${plural(e.n,'tarea','tareas')} · ${esc(e.obras.join(', '))}</span></span><span class="tr"><i style="width:${clamp(e.rend,0,120)/1.2}%;background:var(--${e.rend>=100?'verde':e.rend>=90?'amarillo':e.rend>=80?'naranja':'rojo'})"></i></span><b class="mono">${e.rend}%</b></div>`).join('')||'<p class="muted">Todavía no hay tareas terminadas.</p>'}</div></section>`;
}

/* ================= cronograma =================
   Base: la fija la Dirección (sale del modelo de obra). La jefatura la ve con candado.
   Conforme a obra: lo que pasó y lo que se prevé; lo edita la jefatura (y la Dirección).
   Contractual: la base con margen, es lo que ven el estudio y el propietario. */
const CAPAS=[['hitos','Hitos'],['pedidos','Tarjetas y semáforo'],['base','Comparar con la base'],['audit','Auditorías']];
function tabCrono(o){
  const r=ROLE(),est=r==='estudio';

  const base=S.ver==='base',dv=desvioSem(o),C=S.capas;const canEdit=base?esDir():(puedeEditar(o)||esDir());

  if(C.base&&!base)leg.push('<span><i class="sw sw-base"></i>base</span>');

  return `<div class="seg"><button data-act="ver" data-m="obra" aria-pressed="${!base}">Conforme a obra</button><button data-act="ver" data-m="base" aria-pressed="${base}">${esDir()?'':LOCKSVG+' '}Base</button>${canEdit?`<button data-act="editar" data-m="${base?'base':'obra'}" style="margin-left:auto">Editar ${base?'la base':''}</button>`:base?`<span class="lockmsg">${LOCKSVG} La base la define la Dirección</span>`:''}</div>
  <div class="capas"><span class="eyebrow">Capas</span>${CAPAS.filter(([k])=>!(base&&['pedidos','base'].includes(k))).map(([k,l])=>`<button data-act="capa" data-k="${k}" aria-pressed="${!!C[k]}">${l}</button>`).join('')}</div>
  <p class="small ${!base&&dv>0?'t-naranja':'muted'}">${base?'Cronograma de referencia de la obra. Con él se mide el desvío.':dv>0?`Hoy la entrega se prevé ${plural(dv,'semana','semanas')} después de la base (${fmt(finBase(o))} → ${fmt(finObra(o))}).`:'Hoy la entrega se prevé igual que la base.'} Tocá una barra para ver la tarea y sus tarjetas.</p>
  <div class="legend">${leg.join('')}</div>
  ${gantt(o,base?o.base:o.tasks,{...C,pedidos:C.pedidos&&!base,base:C.base&&!base,obra:!base})}
  ${base?'':desvios(o)}
  ${modelBox(o)}`;

function gantt(o,tasks,C){
  const W=22,LBL=150,all=[...o.tasks,...o.base,...tasks],start=Math.min(...all.map(t=>t.start))-(C.pedidos?9:2)*7*DAY,end=Math.max(...all.map(t=>t.end))+3*7*DAY;
  const weeks=Math.ceil((end-start)/(7*DAY)),x=t=>(t-start)/(7*DAY)*W,width=weeks*W;
  let months='',m=new Date(start);m=Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+1,1);
  while(m<end){months+=`<span class="gm" style="left:${x(m)}px">${MES[new Date(m).getUTCMonth()]}${new Date(m).getUTCMonth()===0?' '+new Date(m).getUTCFullYear():''}</span>`;const q=new Date(m);m=Date.UTC(q.getUTCFullYear(),q.getUTCMonth()+1,1)}
  const baseIds=new Set(o.base.map(t=>t.id));
  const hit=C.hitos?`<div class="grow ghit"><div class="glabel rubro">Hitos</div><div class="gtrack" style="width:${width}px">${hitosObra(o).map(h=>`<button class="ghito" data-act="hito" data-o="${o.id}" data-n="${esc(h.name)}" data-t="${h.t}" title="${esc(h.name)} · ${fmt(h.t)}" style="left:${x(h.t)-7}px" aria-label="${esc(h.name)} ${fmt(h.t)}"></button>`).join('')}</div></div>`:'';
  const rows=tasks.map(tp=>{
    const t=o.tasks.find(q=>q.id===tp.id)||tp;let segs='';
    if(C.pedidos){const cs=o.cards.filter(c=>c.task===t&&enCronograma(c)),pend=cs.filter(c=>!cDone(c));
      if(cs.length&&!pend.length){segs+=`<span class="gok" style="left:${x(timing(cs[0]).limit)-5}px" title="Tarjetas completas"></span>`}
      else if(pend.length){const ref=pend.reduce((a,b)=>timing(b).open<timing(a).open?b:a);const k=timing(ref);
        segs+=`<span class="gseg c-verde" style="left:${x(k.open)}px;width:${x(k.amar)-x(k.open)}px"></span><span class="gseg c-amarillo" style="left:${x(k.amar)}px;width:${x(k.nar)-x(k.amar)}px"></span><span class="gseg c-naranja" style="left:${x(k.nar)}px;width:${x(k.limit)-x(k.nar)}px"></span>`;
        if(pend.some(c=>color(c)==='rojo'))segs+=`<span class="gseg c-rojo" style="left:${x(k.limit)}px;width:${Math.max(4,x(Math.min(t.start,TODAY))-x(k.limit))}px"></span>`;
        segs+=`<span class="gwarn c-${pend.reduce((a,c)=>ORDEN[color(c)]<ORDEN[a]?color(c):a,'futuro')}" style="left:${Math.max(0,x(k.limit)-20)}px" title="${plural(pend.length,'tarjeta incompleta','tarjetas incompletas')}">${pend.length}</span>`}}
    const av=C.obra&&t.real?t.real.av:0,b=C.base?baseDe(o,t):null;const dvc=C.obra?semDesvio(desvioTarea(o,t)):'';
    const bar=`<button class="gbar ${C.obra?'':'gb-base'} ${av>=100?'done':''} ${C.obra&&dvc&&dvc!=='verde'&&t.real?'d-'+dvc:''}" data-act="tarea" data-o="${o.id}" data-id="${t.id}" style="left:${x(tp.start)}px;width:${Math.max(6,x(tp.end+3*DAY)-x(tp.start)-2)}px" aria-label="${esc(t.name)}: ${fmt(tp.start)} a ${fmt(tp.end)}${C.obra?', avance '+av+'%':''}"><i style="width:${av}%"></i></button>`;
    return `<div class="grow ${C.pedidos?'tall':''}"><button class="glabel ${baseIds.has(t.id)?'':'added'}" data-act="tarea" data-o="${o.id}" data-id="${t.id}" title="${esc(t.name)}">${esc(t.name)}</button><div class="gtrack" style="width:${width}px">${segs}${b?`<span class="gbase" style="left:${x(b.start)}px;width:${x(b.end+3*DAY)-x(b.start)}px"></span>`:''}${bar}</div></div>`}).join('');
  const aud=C.audit?`<div class="grow"><div class="glabel rubro">Auditorías</div><div class="gtrack" style="width:${width}px">${o.sup.map(s=>`<span class="gsup ${s.estado==='realizada'?'done':''}" title="Supervisión · ${fmt(s.fecha)}" style="left:${x(s.fecha)-6}px"></span>`).join('')}${o.cert.map(c=>`<span class="gcert ${c.estado==='certificada'?'done':''}" title="Certificado · ${esc(c.etapa)} · ${fmt(certFecha(c))}" style="left:${x(certFecha(c))-6}px"></span>`).join('')}</div></div>`:'';
  const vlines=C.audit?o.sup.map(s=>`<span class="gvl sup" style="left:${LBL+x(s.fecha)}px"></span>`).join('')+o.cert.map(c=>`<span class="gvl cert" style="left:${LBL+x(certFecha(c))}px"></span>`).join(''):'';
  return `<div class="gwrap" id="gwrap" data-scroll="${Math.max(0,x(TODAY)-200)}"><div class="gantt" style="width:${width+LBL}px"><div class="gmonths"><div class="glabel">Tarea</div><div class="gtrack" style="width:${width}px">${months}</div></div>${hit}${rows}${aud}${vlines}<span class="gtoday" style="left:${LBL+x(TODAY)}px"><b>hoy</b></span></div></div>`;
}
/* desvío de cada tarea: base contra conforme a obra, con el semáforo */
function desvios(o){
  const ts=o.tasks.filter(t=>t.real);if(!ts.length)return'';
  const tarde=ts.filter(t=>(desvioTarea(o,t)||0)>2);
  const causas={};tarde.forEach(t=>{if(t.real.causa)causas[t.real.causa]=(causas[t.real.causa]||0)+1});const top=Object.entries(causas).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="card"><div class="top"><h3>¿Cuánto se desvió cada tarea?</h3></div><p class="small soft">Días hábiles de diferencia entre lo que fijaba la base y lo que pasó en obra. ${tarde.length?`${plural(tarde.length,'tarea viene','tareas vienen')} con más de 2 días.${top?` Causa más repetida: ${top[0].toLowerCase()}.`:''}`:'Todas dentro de los 2 días.'}</p>
  <div class="legend"><span><i class="sw c-verde"></i>hasta 2 d</span><span><i class="sw c-amarillo"></i>3 a 5 d</span><span><i class="sw c-naranja"></i>6 a 10 d</span><span><i class="sw c-rojo"></i>más de 10 d</span></div>

function cambiarModelo(o,p){

  const nb=plantilla(o);programar(o,nb);const nt=[];
  nb.forEach(b=>{const m=old.find(t=>t.name===b.name);if(m){b.id=m.id;if(!m.real){m.start=b.start;m.end=b.end;m.weeks=b.weeks}nt.push(m)}else{const t={...b,equipo:`${EQUIPO[b.rubro]} A`};nt.push(t);cardsDeTarea(o,t)}});
  old.filter(t=>t.real&&!nt.includes(t)).forEach(t=>nt.push(t));
  const keep=new Set(nt);o.cards=o.cards.filter(c=>keep.has(c.task));o.cert=o.cert.filter(c=>keep.has(c.task));
  nt.forEach(t=>{if(!o.cert.some(c=>c.task===t)){if(t.rubro==='losa')o.cert.push({id:'k'+(++uid),task:t,etapa:'Hormigonado de '+t.name.replace('Losa sobre','losa sobre'),estado:''});if(t.rubro==='pileta')o.cert.push({id:'k'+(++uid),task:t,etapa:'Estructura de pileta',estado:''})}});
  const pend=nt.filter(t=>!t.real&&t.start<TODAY);if(pend.length){const nm=nextWork(lunesDe(TODAY)+7*DAY),delta=nm-Math.min(...pend.map(t=>t.start));nt.filter(t=>!t.real).forEach(t=>{t.start=nextWork(t.start+delta);t.end=t.start+(t.weeks*7-3)*DAY})}
  o.cards.forEach(c=>{if(!c.enviada&&TODAY>=timing(c).open)c.enviada=timing(c).open});
  o.base=nb;o.tasks=nt.sort((a,b)=>a.start-b.start)}
