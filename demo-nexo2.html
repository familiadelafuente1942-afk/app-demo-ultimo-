/* --- una tarjeta: el título es el rubro de la tarea (como en el cronograma) --- */
function cardHTML(c,showObra=true,mini=false){
  const col=color(c),k=timing(c),nv=cNuevos(c)&&['jefe','direccion'].includes(ROLE());const est=ROLE()==='estudio';
  const p=cProg(c),pe=est?{n:itemsEstudio(c).length,k:itemsEstudio(c).filter(iDone).length}:p;
  let when='';
  if(col==='rojo')when=`<b class="t-rojo">${diasRojo(c)} d</b><span class="muted">en rojo</span>`;
  else if(col==='futuro')when=`<span class="muted">abre</span><b>${fmt(k.open)}</b>`;
  else if(col==='ok')when=`<b class="t-verde">✓</b><span class="muted">completa</span>`;
  else when=`<b class="t-${col}">${workBetween(TODAY,k.limit)} d</b><span class="muted">al rojo</span>`;
  const cst=verCostos()?costo(c):0;const ic=nv?'gold':col==='futuro'?'ok':col;
  const title=mini?CARD[c.tipo].n:c.task.name;
  const sub=mini?'':`<span class="t2 sub"><b>${CARD[c.tipo].n}</b>${showObra?' · '+esc(c.obra.nombre):''} · arranca ${fmt(c.task.start)}${cst?' · <span class="t-rojo">'+money(cst)+'</span>':''}</span>`;
  return `<button class="tcard ${nv?'nuevo':''} ${mini?'mini':''}" data-act="card" data-id="${c.id}"><span class="stripe ${nv?'c-gold':'c-'+col}"></span><span class="tc-ico t-${ic}" title="${CARD[c.tipo].n}">${cico(c.tipo,mini?16:20)}</span><span class="txt"><span class="tag t-${nv?'gold':col}">${nv?`${plural(cNuevos(c),'respuesta nueva','respuestas nuevas')} · revisar`:NOMBRE[col]}</span><span class="t1">${esc(title)}</span>${sub}<span class="prog"><i style="width:${pe.n?Math.round(pe.k/pe.n*100):100}%" class="c-${col==='ok'?'verde':col==='futuro'?'ok':col}"></i></span><span class="t2">${pe.k} de ${pe.n} ${c.tipo==='doc'?'definidos':c.tipo==='mat'?'en obra':'listos'}</span></span><span class="when">${when}</span></button>`;
}
function tareaBlock(o,t,cards,showObra){return `<div class="tblock"><div class="tb-h"><span class="tb-t"><b>${esc(t.name)}</b><span class="muted small">${showObra?esc(o.nombre)+' · ':''}arranca ${fmt(t.start)}</span></span><button class="btn sm ghost" data-act="tarea" data-o="${o.id}" data-id="${t.id}">Ver tarea</button></div><div class="tb-cards">${cards.map(c=>cardHTML(c,false,true)).join('')}</div></div>`}

/* --- aviso principal: corto y destacado; el detalle se abre al tocarlo --- */
function avisoData(){
  const r=ROLE(),obras=misObras();let lvl='ok',h='',p='',list='';
  if(r==='direccion'||r==='jefe'){
    const cs=cardsDe(obras),ro=cs.filter(x=>color(x)==='rojo'),na=cs.filter(x=>['naranja','amarillo'].includes(color(x)));
    lvl=ro.length?'crit':na.length?'warn':'ok';
    h=ro.length?`${plural(ro.length,'tarjeta vencida','tarjetas vencidas')} y ${na.length} por vencer`:na.length?`${plural(na.length,'tarjeta','tarjetas')} por vencer`:'Todas las tarjetas están en plazo';
    const conRo=[...new Set(ro.map(x=>x.obra.nombre))];
    p=r==='direccion'?`En las ${obras.length} obras activas de ${ORG}. ${conRo.length?`Las vencidas están en ${yJoin(conRo)}: son tareas que arrancan o ya arrancaron sin todo lo que necesitan. El costo de esa espera se ve en Impacto económico.`:'Ninguna tarea está frenada.'}`
      :`En ${yJoin(obras.map(o=>o.nombre))}. ${ro.length?'Empezá por las vencidas: la tarea que las necesita ya arrancó o está por arrancar. Después seguí con las que vencen esta semana.':'Revisá lo que vence esta semana.'} Cada tarjeta se completa ítem por ítem; cuando todos están resueltos queda en verde.`;
    list=`${ro.length?`<span class="eyebrow">Vencidas</span><div class="list">${ro.sort((a,b)=>diasRojo(b)-diasRojo(a)).map(c=>cardHTML(c)).join('')}</div>`:''}${na.length?`<span class="eyebrow">Por vencer</span><div class="list">${na.sort((a,b)=>timing(a).limit-timing(b).limit).map(c=>cardHTML(c)).join('')}</div>`:''}`;
  }else if(r==='estudio'){
    const cs=cardsDe(obras).filter(c=>c.tipo==='doc'&&itemsEstudio(c).some(i=>!iDone(i)&&!nuevoResp(i)));
    const ro=cs.filter(x=>color(x)==='rojo'),sem=cs.filter(x=>!['rojo','futuro'].includes(color(x))&&workBetween(TODAY,timing(x).limit)<=5);
    lvl=ro.length?'crit':sem.length?'warn':'ok';
    h=ro.length?`${plural(ro.length,'entrega vencida','entregas vencidas')}${sem.length?` y ${sem.length} esta semana`:''}`:sem.length?`${plural(sem.length,'entrega vence','entregas vencen')} esta semana`:'Todas sus entregas están en plazo';
    p=`En ${plural(obras.length,'obra','obras')} con ${CONSTRUCTORAS.find(c=>c.id===S.cons).n}. Cada tarjeta reúne los planos y definiciones que necesita una tarea. Al subir un plano en su carpeta o responder un ítem, le llega a la jefatura y, si es un plano, a la auditoría.`;
    list=`${ro.length?`<span class="eyebrow">Vencidas</span><div class="list">${ro.map(c=>cardHTML(c)).join('')}</div>`:''}${sem.length?`<span class="eyebrow">Vencen esta semana</span><div class="list">${sem.map(c=>cardHTML(c)).join('')}</div>`:''}`;
  }else if(r==='auditor'){
    const ag=agendaAud(obras,7),rev=ag.filter(a=>a.tipo==='rev').length,sup=ag.filter(a=>a.tipo==='sup').length,cert=agendaAud(obras,30).filter(a=>a.tipo==='cert').length;
    lvl=rev||sup?'warn':'ok';
    h=[rev?plural(rev,'documento por revisar','documentos por revisar'):'',sup?plural(sup,'supervisión esta semana','supervisiones esta semana'):''].filter(Boolean).join(' y ')||'Sin pendientes esta semana';
    p=`Auditás ${plural(obras.length,'obra','obras')}. Además hay ${plural(cert,'certificado de finalidad de etapa','certificados de finalidad de etapa')} en los próximos 30 días. Cada plano que sube el estudio o carga la jefatura queda "subido" hasta que lo aprobás u observás.`;
    list=agendaHTML(ag);
  }
  return{lvl,h,p,list};
}
function situacion(){const a=avisoData();if(!a.h)return'';
  return `<button class="aviso2 a-${a.lvl}" data-act="aviso" aria-label="${esc(a.h)}: ver detalle"><span class="av-ico">${BELL}</span><span class="av-t"><span class="av-e">Aviso · ${fmtLargo(TODAY)}</span><b>${esc(a.h)}</b></span><span class="av-go">${a.lvl==='crit'?'<span class="av-pill">Requiere atención</span>':''}<span>Ver ›</span></span></button>`}

/* --- inicio --- */
function margenProm(){let m=0,n=0;estCards().filter(c=>cDone(c)).forEach(c=>{const k=timing(c).limit,f=doneFecha(c);if(!f)return;if(f<=k){n++;m+=workBetween(f,k)}});return{d:n?Math.round(m/n*10)/10:0,n}}
function newsEstudio(){const m=margenProm(),r2=pctATiempo(estCards());return `<div class="news"><span class="news-ico">★</span><p>${r2.n?`El <b>${r2.pct}%</b> de sus entregas llegó a tiempo, `:'Sus entregas a tiempo llegaron '}en promedio <b>${m.d.toLocaleString('es-AR')} días hábiles antes</b> de que la obra las necesitara.</p></div>`}
KPI.est_margen.calc=()=>{const m=margenProm();return{v:`${m.d>0?'+':''}${m.d.toLocaleString('es-AR')} d`,l:'de anticipación promedio en las entregas a tiempo',s:`${plural(m.n,'tarjeta','tarjetas')} antes de su fecha límite`,c:m.d>0?'verde':'naranja'}};
function adicPend(){return ADIC.filter(a=>puedeVer(a.obra)&&adicEstado(a)[0]!=='Autorizado')}
function vInicio(){
  const r=ROLE(),obras=misObras();
  if(r==='auditor')return `${situacion()}${vIA()}${novedades()}${kpis()}<section class="sec"><div class="sec-head"><h2>Agenda de los próximos 30 días</h2><span class="legend-a"><i class="a-sup"></i>Supervisión <i class="a-rev"></i>Revisión <i class="a-cert"></i>Certificado</span></div>${agendaHTML(agendaAud(obras,30))}</section>`;
  if(r==='estudio'){
    const inv=INVITES.filter(i=>i.rol==='estudio'&&i.para===S.u.name&&i.estado==='pendiente'&&i.obra.constructora===S.cons);
    const cs=estPend().filter(c=>color(c)!=='futuro');const ad=ADIC.filter(a=>puedeVer(a.obra)&&adicEstado(a)[0]==='Espera autorización');
    return `${inv.map(i=>`<section class="invite"><span class="eyebrow">Invitación de ${esc(CONSTRUCTORAS.find(c=>c.id===i.obra.constructora).n)}</span><h2>${esc(i.obra.nombre)}</h2><p class="small">Te invitan como estudio y dirección de obra. Al aceptar, la obra aparece en tu panel con sus tarjetas, carpetas de planos y cronograma.</p><div class="row2"><button class="btn gold" data-act="aceptarInv" data-id="${i.id}">Aceptar invitación</button></div></section>`).join('')}${situacion()}${newsEstudio()}${vIA()}
    <section class="sec"><div class="sec-head"><h2>Lo que necesitan las obras</h2><button class="btn sm ghost" data-act="tab" data-t="pedidos">Ver todas</button></div><p class="muted small">Por tarea, como en el cronograma. Tocá una tarjeta para responder cada ítem.</p><div class="list">${porTarea(cs,true,6)||'<p class="muted">No hay entregas pendientes.</p>'}</div></section>
    ${novedades()}${kpis()}
    <section class="sec"><div class="sec-head"><h2>Sus obras</h2><span class="muted small">${obras.length} con ${esc(CONSTRUCTORAS.find(c=>c.id===S.cons).n)}</span></div>${obrasStrip(obras)}</section>
    ${ad.length?`<section class="sec"><h2>Adicionales para autorizar</h2><div class="list">${ad.map(adicCard).join('')}</div></section>`:''}`;
  }
  const av=cardsDe(obras).filter(c=>['rojo','naranja','amarillo'].includes(color(c))||cNuevos(c)).sort((a,b)=>(cNuevos(b)>0)-(cNuevos(a)>0)||ORDEN[color(a)]-ORDEN[color(b)]||timing(a).limit-timing(b).limit);
  const ad=r==='direccion'?adicPend():[];
  return `${situacion()}${vIA()}${novedades()}${kpis()}${r==='direccion'?econPanel(obras):''}
  ${ad.length?`<section class="sec"><div class="sec-head"><h2>Adicionales en curso</h2><span class="muted small">${ad.length} sin autorizar</span></div><div class="list">${ad.map(adicCard).join('')}</div></section>`:''}
  <section class="sec"><div class="sec-head"><h2>${r==='direccion'?'Obras en curso':'Tus obras'}</h2><button class="btn sm ghost" data-act="tab" data-t="obras">${r==='direccion'?'Ver cartera':'Ver obras'}</button></div>${obrasStrip(obras)}</section>
  <section class="sec"><div class="sec-head"><h2>Tarjetas que requieren atención</h2><span class="muted small">de más urgente a menos</span></div><div class="list">${av.slice(0,8).map(c=>cardHTML(c)).join('')||'<p class="muted">Sin avisos.</p>'}</div>${av.length>8?`<button class="btn ghost full" data-act="tab" data-t="pedidos">Ver las ${av.length}</button>`:''}</section>`;
}
function porTarea(cs,showObra,max){const g=new Map();cs.slice().sort((a,b)=>a.task.start-b.task.start||CARD_ORD.indexOf(a.tipo)-CARD_ORD.indexOf(b.tipo)).forEach(c=>{const k=c.obra.id+c.task.id;if(!g.has(k))g.set(k,{o:c.obra,t:c.task,cs:[]});g.get(k).cs.push(c)});
  let gs=[...g.values()].sort((a,b)=>Math.min(...a.cs.map(c=>ORDEN[color(c)]))-Math.min(...b.cs.map(c=>ORDEN[color(c)]))||a.t.start-b.t.start);if(max)gs=gs.slice(0,max);
  return gs.map(x=>tareaBlock(x.o,x.t,x.cs,showObra)).join('')}
function vPedidos(){
  const r=ROLE(),obras=misObras(),sel=obras.find(o=>o.id===S.obraF)||null;
  if(r==='estudio'){
    const cs=cardsDe(sel?[sel]:obras).filter(c=>c.tipo==='doc'&&itemsEstudio(c).length);
    return `<section class="sec"><h1>Tarjetas de las obras</h1><p class="muted">Una tarjeta por tarea con los planos y definiciones que necesita. Respondé cada ítem con el archivo, o subí el plano en su carpeta de Documentos: es lo mismo y queda vinculado.</p>${selectObras(obras,S.obraF,'obraF')}${filtrosColor(cs)}<div class="list">${porTarea(cs.filter(c=>fOk(c,S.filtro)),!sel)||'<p class="muted">No hay tarjetas en este estado.</p>'}</div></section>`;
  }
  let cs=cardsDe(sel?[sel]:obras);if(S.tipoF!=='Todas')cs=cs.filter(c=>S.tipoF==='ope'?['ope','ser'].includes(c.tipo):c.tipo===S.tipoF);
  const tile=(k,cls,l)=>`<button class="kpi ${cls}" data-act="filtro" data-f="${k}" aria-pressed="${S.filtro===k}"><b>${cuentaF(cs,k)}</b><span class="kl">${l}</span></button>`;
  const vis=cs.filter(c=>fOk(c,S.filtro));
  return `<section class="sec"><div class="sec-head"><h1>Pedidos</h1>${r==='jefe'?'<button class="btn gold sm" data-act="nuevoItem">+ Agregar ítem</button>':''}</div>
  <p class="muted small">${r==='direccion'?'Vista de control. Las tarjetas salen del modelo de cada obra y las completa la jefatura.':'Agrupadas por tarea, con el mismo nombre que en el cronograma. Cada ícono dice de qué es la tarjeta: hoja = planos y definiciones, caja = materiales, casa = condiciones.'}</p>
  ${selectObras(obras,S.obraF,'obraF')}
  <div class="kpis k3 tiles">${tile('activos','k-rojo','abiertas')}${tile('ok','k-verde','completas')}${tile('todos','','en total')}</div>
  <div class="filters wrap">${[['Todas','Todas'],['doc','Planos y definiciones'],['mat','Materiales'],['ope','Condiciones y servicios']].map(([k,l])=>`<button data-act="tipoF" data-f="${k}" aria-pressed="${S.tipoF===k}">${k!=='Todas'?cico(k==='ope'?'ope':k,14):''}${l}</button>`).join('')}</div>
  ${filtrosColor(cs)}<div class="list">${porTarea(vis,!sel)||'<p class="muted">No hay tarjetas en este estado.</p>'}</div></section>`;
}

/* --- planos por rubro: misma lista para jefatura, auditoría y estudio --- */
function folderStats(o,f){const ss=o.planos.filter(s=>s.folder===f),st=ss.map(slotEstado);const c=k=>st.filter(x=>x===k).length;return{ss,n:ss.length,vig:c('vigente'),sub:c('subido'),obs:c('con observaciones'),falta:c('falta'),nuevos:ss.filter(s=>slotCur(s)?.nuevo).length}}
function foldersDe(o){return FOLDERS.filter(([k])=>o.planos.some(s=>s.folder===k)||DOCS.some(x=>x.obra===o&&x.cat===k&&!x.slot&&x.estado!=='reemplazado'))}
function rubroBtn(o,k,n,act){const s=folderStats(o,k),ex=DOCS.filter(x=>x.obra===o&&x.cat===k&&!x.slot&&x.estado!=='reemplazado').length;const pct=s.n?Math.round(s.vig/s.n*100):100;const nv=s.nuevos&&['jefe','auditor'].includes(ROLE());
  return `<button class="rubro ${nv?'nuevo':''}" ${act}><span class="rb-ico">${FOLDSVG(24)}</span><span class="rb-t"><b>${esc(n)}</b><span class="muted small">${s.n?`${s.vig} de ${s.n} vigentes`:''}${s.sub?` · <span class="t-gold">${s.sub} subido${s.sub>1?'s':''}</span>`:''}${s.obs?` · <span class="t-rojo">${s.obs} observado${s.obs>1?'s':''}</span>`:''}${ex?`${s.n?' · ':''}${plural(ex,'archivo más','archivos más')}`:''}</span>${s.n?`<span class="prog"><i class="c-${pct===100?'verde':'gold'}" style="width:${pct}%"></i></span>`:''}</span><span class="go">${nv?'<span class="tag t-gold">Nuevo</span>':''}›</span></button>`}
function tabDocs(o){
  const r=ROLE();
  const txt=r==='jefe'?'Un rubro por tarjeta, con todos los planos que necesita. Si un plano te llegó por WhatsApp o mail, cargalo vos: queda subido, le llega a la auditoría y actualiza la tarjeta de esa tarea.':r==='auditor'?'Los mismos rubros que ve la jefatura. Los planos subidos esperan tu revisión: al aprobarlos pasan a vigentes.':r==='estudio'?'Las mismas carpetas que en Documentos. Subí cada plano en su lugar de la lista.':'Planos de la obra por rubro, con su estado.';
  return `<div class="infobox">${txt}</div><div class="rubros">${foldersDe(o).map(([k,n])=>rubroBtn(o,k,n,`data-act="rubroPlanos" data-o="${o.id}" data-f="${k}"`)).join('')}</div>`;
}
function slotRow(s){const r=ROLE(),cur=slotCur(s),st=slotEstado(s),[lab,cls]=SLOT_TXT[st];const hist=slotDocs(s).filter(x=>x.estado==='reemplazado').length;const ts=slotTareas(s);const nv=cur&&cur.nuevo&&['jefe','auditor'].includes(r);
  const up=(r==='estudio'||puedePedir(s.obra))?`<label class="btn sm ${st==='falta'?'gold':''}" for="sf-${s.id}" style="cursor:pointer">${st==='falta'?(r==='estudio'?'Subir plano':'Cargar recibido por fuera'):(r==='estudio'?'Subir nueva versión':'Cargar nueva versión')}</label><input id="sf-${s.id}" type="file" data-chg="slotFile" data-s="${s.id}" data-o="${s.obra.id}" hidden>`:'';
  return `<div class="slot st-${st.replace(' ','-')} ${nv?'nuevo':''}"><div class="sl-h"><span class="sl-n">${nv?'<span class="tag t-gold">Nuevo</span> ':''}${esc(s.nombre)}</span><span class="status ${cls}">${lab}</span></div>
  <span class="dm">${cur?`rev ${cur.ver} · ${esc(cur.por)} · ${fmt(cur.fecha)}${hist?` · ${plural(hist,'versión anterior','versiones anteriores')}`:''}`:'Todavía no se subió'}${ts.length?` · para ${esc(ts[0].name)} (${fmt(ts[0].start)})`:''}</span>${cur&&cur.obs?`<span class="small t-rojo">${esc(cur.obs)}</span>`:''}
  <span class="fbtns">${cur?fileBtns({docId:cur.id}):''}${r==='auditor'&&st==='subido'?`<button class="btn sm gold" data-act="nuevoAud" data-t="rev" data-o="${s.obra.id}" data-doc="${cur.id}">Revisar</button>`:''}${up}</span></div>`}
function folderBody(o,f){const ss=o.planos.filter(s=>s.folder===f),ex=DOCS.filter(x=>x.obra===o&&x.cat===f&&!x.slot&&x.estado!=='reemplazado');const can=ROLE()==='estudio'||puedePedir(o);
  return `<div class="slots">${ss.map(slotRow).join('')}</div>${ex.length?`<div class="card"><div class="top"><h3>Otros archivos de la carpeta</h3><span class="muted small">${ex.length}</span></div>${ex.map(docRow).join('')}</div>`:''}
  ${can?`<div class="row2"><label class="btn ghost" for="fx-${f}" style="cursor:pointer">+ Agregar PDF o archivo a esta carpeta</label><input id="fx-${f}" type="file" multiple data-chg="folderFile" data-o="${o.id}" data-f="${f}" hidden><button class="btn ghost" data-act="nuevoSlot" data-o="${o.id}" data-f="${f}">+ Sumar un plano a la lista</button></div>`:''}`}
function sheetRubro(oid,f){const o=findO(oid);const s=folderStats(o,f);
  openSheet(`<span class="eyebrow">${esc(o.nombre)} · planos</span><h2>${esc(FNAME[f])}</h2><p class="muted small">${s.n?`${s.vig} de ${s.n} vigentes${s.sub?` · ${s.sub} subidos esperando revisión`:''}${s.falta?` · ${s.falta} sin subir`:''}.`:''} Cada plano nuevo le llega a la vez a la jefatura y a la auditoría.</p>${folderBody(o,f)}`,FNAME[f])}

/* --- documentos del estudio: carpetas por rubro con la lista de planos que necesita la obra --- */
function vDocs(){
  const obras=misObras(),D=S.drive,o=obras.find(x=>x.id===D.obra),cat=D.cat;
  const back=o?`<button class="back2" data-act="drive" data-o="${cat?o.id:''}" data-c="">${BACKSVG} ${cat?esc(o.nombre):'Todas las obras'}</button>`:'';
  const crumbs=`<div class="crumbs"><button data-act="drive" data-o="" data-c="">Documentos</button>${o?`<span>›</span><button data-act="drive" data-o="${o.id}" data-c="">${esc(o.nombre)}</button>`:''}${o&&cat?`<span>›</span><b>${esc(cat==='aud'?'Certificados de auditoría':FNAME[cat])}</b>`:''}</div>`;
  const folder=(l,act,sub)=>`<button class="folder" ${act}>${FOLDSVG(28)}<span><b>${esc(l)}</b><span class="muted small">${sub}</span></span><span class="go">›</span></button>`;
  let body='';
  if(!o)body=`<div class="folders">${obras.map(x=>{const n=x.planos.length,v=x.planos.filter(s=>slotEstado(s)==='vigente').length,f=x.planos.filter(s=>slotEstado(s)==='falta').length;return folder(x.nombre,`data-act="drive" data-o="${x.id}" data-c=""`,`${v} de ${n} planos vigentes${f?` · <span class="t-naranja">${f} por subir</span>`:''}`)}).join('')}</div>`;
  else if(!cat)body=`<p class="muted small">Una carpeta por rubro con la lista de planos que necesita la obra. Subí cada uno en su lugar: le llega a la jefatura y a la auditoría y completa la tarjeta de esa tarea.</p><div class="rubros">${foldersDe(o).map(([k,n])=>rubroBtn(o,k,n,`data-act="drive" data-o="${o.id}" data-c="${k}"`)).join('')}${folder('Certificados de auditoría',`data-act="drive" data-o="${o.id}" data-c="aud"`,plural(AUD.filter(a=>a.obra===o&&a.tipo==='cert').length,'certificado','certificados'))}</div>`;
  else if(cat==='aud')body=`<div class="card">${AUD.filter(a=>a.obra===o&&a.tipo==='cert').map(audRow).join('')||'<span class="muted small">Todavía no hay certificados.</span>'}</div>`;
  else body=folderBody(o,cat);
  return `<section class="sec"><h1>Documentación</h1>${back}${crumbs}${body}</section>`;
}

/* --- registro diario: se puede editar y eliminar; queda marcado --- */

Respondé SOLO con los datos en JSON que siguen, que son los de su obra. No hables de costos, de otras obras, de proveedores ni de problemas internos. Si algo no está en los datos, decí que lo puede consultar con su estudio.

const _iaLocal=iaLocal;

  if(r==='cliente'){const o=COBRA();if(n.includes('visita')){const s=o.sup.find(x=>x.estado==='programada');return s?`La próxima visita de la auditoría técnica es el ${fmtLargo(s.fecha)}.`:'No hay visitas programadas.'}

/* línea de tiempo de la tarjeta: etiquetas arriba y abajo, sin pisarse con la barra */
function tlCard(c){
  const k=timing(c),df=doneFecha(c);
  const pts=[k.open,c.task.start,TODAY,c.enviada,df].filter(Boolean);
  const lo=Math.min(...pts)-4*DAY,hi=Math.max(...pts)+6*DAY,P=t=>(t-lo)/(hi-lo)*100,X=t=>P(t).toFixed(2)+'%',Wd=(a,b)=>(Math.max(0,b-a)/(hi-lo)*100).toFixed(2)+'%';
  const up=[],dn=[];if(c.enviada)up.push([c.enviada,(c.tipo==='doc'?'enviada al estudio ':'abierta ')+fmt(c.enviada),'var(--azul)']);up.push([k.limit,'límite '+fmt(k.limit),'var(--rojo)']);dn.push([TODAY,'hoy '+fmt(TODAY),'var(--fg)']);dn.push([c.task.start,'arranca '+fmt(c.task.start),'var(--muted)']);if(df)dn.push([df,'completa '+fmt(df),'var(--verde)']);
  const lab=(arr,cls)=>{arr.sort((a,b)=>a[0]-b[0]);let last=-99;return arr.map(([t,l,col])=>{let p=P(t);const al=p<14?'l':p>86?'r':'c';const lane=p-last<22?1:0;last=lane?last:p;return `<span class="tl-l ${cls} a-${al} ln${lane}" style="left:${p.toFixed(2)}%;color:${col}">${l}</span>`}).join('')};

const CAPAS6=[['obra','Conforme a obra'],['base','Base'],['hitos','Hitos'],['pedidos','Tarjetas y semáforo'],['audit','Auditorías']];

function gantt(o,C){
  const W=34,LBL=178;
  const main=C.contractual?contractual(o):C.obra?o.tasks:o.base;
  const all=[...main,...(C.base?o.base:[]),...(C.obra?o.tasks:[])];
  const start=lunesDe(Math.min(...all.map(t=>t.start))-(C.pedidos?9:1)*7*DAY),end=Math.max(...all.map(t=>t.end))+3*7*DAY;
  const weeks=Math.ceil((end-start)/(7*DAY)),x=t=>(t-start)/(7*DAY)*W,width=weeks*W;
  let months='',quin='',days='',grid='';
  for(let m=Date.UTC(new Date(start).getUTCFullYear(),new Date(start).getUTCMonth(),1);m<end;){const q=new Date(m),nm=Date.UTC(q.getUTCFullYear(),q.getUTCMonth()+1,1),q16=Date.UTC(q.getUTCFullYear(),q.getUTCMonth(),16);
    const a=Math.max(m,start);if(nm>start)months+=`<span class="gm" style="left:${x(a)}px;width:${x(Math.min(nm,end))-x(a)}px">${MESL[q.getUTCMonth()]}${q.getUTCMonth()===0||m<=start?' '+q.getUTCFullYear():''}</span>`;
    [[m,'1ª quincena'],[q16,'2ª quincena']].forEach(([s,l],i)=>{const e=i?nm:q16;if(e<=start||s>=end)return;const a2=Math.max(s,start);quin+=`<span class="gq" style="left:${x(a2)}px;width:${x(Math.min(e,end))-x(a2)}px">${l}</span>`;if(s>start)grid+=`<span class="gvq" style="left:${LBL+x(s)}px"></span>`});m=nm}
  for(let w=start;w<end;w+=7*DAY){const dd=new Date(w).getUTCDate();days+=`<span class="gd" style="left:${x(w)}px">${dd}</span>`}
  let lastL=-1e9;const hl=h=>{const n=h.name.replace('Hormigonado de ','H° ').replace('Obra cerrada: techos terminados','Techos').replace('Pisos y revestimientos terminados','Pisos').replace('Instalaciones probadas','Inst. probadas').replace('Inicio de instalaciones','Inicio inst.');const px=x(h.t)+8;if(px<lastL+6)return'';lastL=px+n.length*5.6;return `<span class="ghl" style="left:${px}px">${esc(n)}</span>`};
  const hit=C.hitos?`<div class="grow ghit"><div class="glabel rubro">Hitos</div><div class="gtrack" style="width:${width}px">${hitosObra(o).map(h=>`<button class="ghito" data-act="hito" data-o="${o.id}" data-n="${esc(h.name)}" data-t="${h.t}" title="${esc(h.name)} · ${fmt(h.t)}" style="left:${x(h.t)-7}px" aria-label="${esc(h.name)} ${fmt(h.t)}"></button>${hl(h)}`).join('')}</div></div>`:'';
  const baseIds=new Set(o.base.map(t=>t.id));
  const rows=main.map(tp=>{
    const t=C.contractual?tp:(o.tasks.find(q=>q.id===tp.id)||tp);let segs='';
    if(C.pedidos&&C.obra){const cs=o.cards.filter(c=>c.task===t&&enCronograma(c)),pend=cs.filter(c=>!cDone(c));
      if(cs.length&&!pend.length){segs+=`<span class="gok" style="left:${x(timing(cs[0]).limit)-5}px" title="Tarjetas completas"></span>`}
      else if(pend.length){const ref=pend.reduce((a,b)=>timing(b).open<timing(a).open?b:a);const k=timing(ref);
        segs+=`<span class="gseg c-verde" style="left:${x(k.open)}px;width:${x(k.amar)-x(k.open)}px"></span><span class="gseg c-amarillo" style="left:${x(k.amar)}px;width:${x(k.nar)-x(k.amar)}px"></span><span class="gseg c-naranja" style="left:${x(k.nar)}px;width:${x(k.limit)-x(k.nar)}px"></span>`;
        if(pend.some(c=>color(c)==='rojo'))segs+=`<span class="gseg c-rojo" style="left:${x(k.limit)}px;width:${Math.max(4,x(Math.min(t.start,TODAY))-x(k.limit))}px"></span>`;
        segs+=`<span class="gwarn c-${pend.reduce((a,c)=>ORDEN[color(c)]<ORDEN[a]?color(c):a,'futuro')}" style="left:${Math.max(0,x(k.limit)-20)}px" title="${plural(pend.length,'tarjeta incompleta','tarjetas incompletas')}">${pend.length}</span>`}}
    const isObra=C.obra&&!C.contractual,av=isObra&&t.real?t.real.av:0,dvc=isObra?semDesvio(desvioTarea(o,t)):'';
    const b=C.base&&C.obra?baseDe(o,t):null;
    const bar=`<button class="gbar ${isObra||C.contractual?'':'gb-base'} ${av>=100?'done':''} ${isObra&&dvc&&dvc!=='verde'&&t.real?'d-'+dvc:''}" data-act="tarea" data-o="${o.id}" data-id="${t.id}" style="left:${x(tp.start)}px;width:${Math.max(6,x(tp.end+3*DAY)-x(tp.start)-2)}px" title="${esc(t.name)} · ${fmt(tp.start)} → ${fmt(tp.end)}" aria-label="${esc(t.name)}: ${fmt(tp.start)} a ${fmt(tp.end)}${isObra?', avance '+av+'%':''}"><i style="width:${av}%"></i></button>`;
    return `<div class="grow ${C.pedidos&&C.obra?'tall':''} ${b?'cmpb':''}"><button class="glabel ${baseIds.has(t.id)?'':'added'}" data-act="tarea" data-o="${o.id}" data-id="${t.id}" title="${esc(t.name)}"><span class="gl-n">${esc(t.name)}</span><span class="gl-d">${fmt(tp.start)} → ${fmt(tp.end)}</span></button><div class="gtrack" style="width:${width}px">${segs}${b?`<span class="gbase2" style="left:${x(b.start)}px;width:${x(b.end+3*DAY)-x(b.start)}px" title="Base · ${fmt(b.start)} → ${fmt(b.end)}"></span>`:''}${bar}</div></div>`}).join('');
  const aud=C.audit?`<div class="grow"><div class="glabel rubro">Auditorías</div><div class="gtrack" style="width:${width}px">${o.sup.map(s=>`<span class="gsup ${s.estado==='realizada'?'done':''}" title="Supervisión · ${fmt(s.fecha)}" style="left:${x(s.fecha)-6}px"></span>`).join('')}${o.cert.map(c=>`<span class="gcert ${c.estado==='certificada'?'done':''}" title="Certificado · ${esc(c.etapa)} · ${fmt(certFecha(c))}" style="left:${x(certFecha(c))-6}px"></span>`).join('')}</div></div>`:'';
  const vlines=C.audit?o.sup.map(s=>`<span class="gvl sup" style="left:${LBL+x(s.fecha)}px"></span>`).join('')+o.cert.map(c=>`<span class="gvl cert" style="left:${LBL+x(certFecha(c))}px"></span>`).join(''):'';
  return `<div class="gwrap" id="gwrap" data-scroll="${Math.max(0,x(TODAY)-220)}"><div class="gantt g6" style="width:${width+LBL}px;--W:${W}px;--LBL:${LBL}px">

  <div class="gdays"><div class="glabel muted">Día (lunes)</div><div class="gtrack" style="width:${width}px">${days}</div></div>
  ${grid}${hit}${rows}${aud}${vlines}<span class="gtoday" style="left:${LBL+x(TODAY)}px"><b>hoy ${new Date(TODAY).getUTCDate()}/${new Date(TODAY).getUTCMonth()+1}</b></span></div></div>`;
}

/* actualiza las filas sin redibujar la hoja: el campo que se está editando no pierde el foco */
function refreshEditor(){const o=findO(EOID);if(!o)return;const L=EMODO==='base'?o.base:o.tasks;const a=document.activeElement;
  L.forEach(t=>{const s=$('#ed-s-'+t.id),w=$('#ed-w-'+t.id),r=$('#ed-r-'+t.id);if(s&&s!==a)s.value=iso(t.start);if(w&&w!==a)w.value=t.weeks;if(r)r.textContent=` · termina ${fmt(t.end)}${t.real&&t.real.av>=100?' · terminada':t.real?' · en curso':''}`});
  const dv=desvioSem(o),el=$('#ed-diff');if(el){el.className='diff '+(dv>0?'t-naranja':'muted');el.textContent=`Entrega base ${fmt(finBase(o))} · entrega prevista ${fmt(finObra(o))}${dv?` (${dv>0?'+':''}${dv} sem)`:''}`}}
const syncReal=t=>{if(t.real){t.real.ini=t.start;if(t.real.fin)t.real.fin=t.end}};
function moverTarea(L,t,newStart,casc=ECASC){const delta=newStart-t.start;if(!delta)return;const old=t.start;if(casc)L.forEach(x=>{if(x!==t&&x.start>=old){x.start=nextWork(x.start+delta);x.end=x.start+(x.weeks*7-3)*DAY;syncReal(x)}});t.start=newStart;t.end=t.start+(t.weeks*7-3)*DAY;syncReal(t);L.sort((a,b)=>a.start-b.start)}
function durTarea(L,t,w,casc=ECASC){const dw=w-t.weeks;if(!dw)return;const oldEnd=t.end;setDur(t,w);syncReal(t);if(casc)L.forEach(x=>{if(x!==t&&x.start>oldEnd-3*DAY){x.start=nextWork(x.start+dw*7*DAY);x.end=x.start+(x.weeks*7-3)*DAY;syncReal(x)}})}
const okFecha=v=>{if(!v)return null;const y=+v.slice(0,4);return y>=2024&&y<=2032?nextWork(d(v)):null};
CHG.eStart=(v,el)=>{const o=findO(EOID),L=EMODO==='base'?o.base:o.tasks,t=L.find(x=>x.id===el.dataset.id);const f=okFecha(v);if(!f||!t)return;moverTarea(L,t,f);draw();refreshEditor()};
CHG.eWeeks=(v,el)=>{const o=findO(EOID),L=EMODO==='base'?o.base:o.tasks,t=L.find(x=>x.id===el.dataset.id);if(!t)return;durTarea(L,t,clamp(+v||1,1,40));draw();refreshEditor()};

/* ================= sincronización compartida (Supabase): lo que cambia la dirección se guarda en la nube y llega a todos los dispositivos ================= */
{
const API='/api/nexo2';
const MAP={nexo2_obras_cfg:'cfg'};
const VACIO='{"mod":{},"nuevas":[]}';
const rawSet=Storage.prototype.setItem,rawGet=Storage.prototype.getItem;
const lget=k=>{try{return rawGet.call(localStorage,k)}catch(e){return null}};
const lset=(k,v)=>{try{rawSet.call(localStorage,k,v)}catch(e){}};
let listo=false;const sucio=new Set();const tim={};
async function subir(k){
  const v=lget(k);if(v==null||v===VACIO)return;
  const t=Date.now();
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:MAP[k],t,v})});
    if(r.ok){lset('nexo2_sync_t_'+k,String(t));sucio.delete(k)}}catch(e){}
}
Storage.prototype.setItem=function(k,v){
  if(this===localStorage&&MAP[k]){const antes=lget(k);rawSet.call(this,k,v);if(antes!==v){sucio.add(k);if(listo){clearTimeout(tim[k]);tim[k]=setTimeout(()=>subir(k),700)}}return}
  return rawSet.call(this,k,v);
};
async function bajar(){
  let cambio=false;
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(r.ok){
      const rows=await r.json();
      for(const k of Object.keys(MAP)){
        const d=rows[MAP[k]];
        if(!d)continue;
        const lt=+lget('nexo2_sync_t_'+k)||0;
        if(d.t>lt){
          if(d.v!==lget(k)){rawSet.call(localStorage,k,d.v);cambio=true}
          lset('nexo2_sync_t_'+k,String(d.t));sucio.delete(k);
        }
      }
    }
  }catch(e){}
  listo=true;
  if(cambio){
    const ocupado=document.querySelector('#layer .sheet,input:focus,textarea:focus');
    if(!ocupado)location.reload();
  }
  sucio.forEach(k=>subir(k));
}
bajar();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')bajar()});
