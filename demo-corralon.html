<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Demo corralón</title>
<style>
:root{
  --navy:#0F1B2D; --gold:#B0894F; --mut:#5B6B7F; --line:#C9D2DE; --bg:#f4f4f6; --card:#fff;
  --red:#B91C1C; --redbg:#fbe9e9; --amb:#B45309; --ambbg:#fdf0e1; --green:#16A34A; --greenbg:#e3f4ea; --blue:#1d4f8c; --bluebg:#e6eef8;
}
html,body{margin:0;padding:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--navy);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.35}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.band{background:var(--navy);color:#9fb0c5;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold);white-space:nowrap;overflow:hidden}
.band span:last-child{letter-spacing:.02em;text-transform:none;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.head{background:#fff;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--mut);font-size:14px}
.demo{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);background:var(--ambbg);padding:3px 8px;border-radius:99px}
main{padding:14px 16px 110px}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.sec:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.obra{font-weight:800;font-size:17px}
.id{color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#eef1f5;color:var(--mut)}
.chip.red{background:var(--redbg);color:var(--red)} .chip.amb{background:var(--ambbg);color:var(--amb)} .chip.green{background:var(--greenbg);color:var(--green)} .chip.blue{background:var(--bluebg);color:var(--blue)}
ul.items{margin:8px 0 4px;padding:0;list-style:none}
ul.items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
ul.items li:last-child{border-bottom:0}
ul.items .q{font-weight:700;white-space:nowrap}
.adj{color:var(--amb);font-size:12px;font-weight:700}
.steps{display:flex;align-items:center;margin:12px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;width:56px;text-align:center}
.step i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block}
.step.done i{background:var(--green);border-color:var(--green)}
.step.now i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,137,79,.22)}
.step em{font-style:normal;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.1}
.step.now em{color:var(--navy)}
.bar{flex:1;height:2px;background:var(--line);margin-bottom:16px}
.bar.done{background:var(--green)}
.trace{background:#f7f8fa;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.trace b{font-weight:800}
.trace .t{color:var(--mut)}
.trace div+div{margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,select{font:inherit}
.btn{border:0;border-radius:10px;padding:0 14px;min-height:44px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;flex:1 1 auto}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#eef1f5;color:var(--navy)}
.btn.warn{background:var(--redbg);color:var(--red)}
.btn.small{min-height:36px;font-size:13px;flex:0 0 auto}
select,input[type=number]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--navy)}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.cost{color:var(--red);font-weight:800}
.big{font-size:32px;font-weight:900;color:var(--red);letter-spacing:-.02em;margin:4px 0 2px}
.card.alert{border-left:5px solid #ef4444}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:900}
.kpi span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rbar{height:10px;border-radius:99px;background:#eef1f5;overflow:hidden;margin:6px 0 2px}
.rbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.line2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.note{color:var(--mut);font-size:13px}
.how{background:#f7f8fa;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.link{background:none;border:0;color:var(--blue);font-weight:800;padding:6px 0;cursor:pointer;min-height:32px}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}
nav button{background:none;border:0;border-top:3px solid transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;position:relative;min-height:58px}
nav button.on{color:var(--navy);border-top-color:var(--gold)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:#ef4444;color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.shade{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:19px}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin:16px 6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var HOY='2026-10-12';
var JORNAL_INI=70000;
var IMP={corralon:'Corralón',contratista:'Contratista',jefe:'Jefe de obra'};
var IMPLONG={corralon:'Corralón (stock, preparación o despacho)',contratista:'Contratista · Martín Sosa',jefe:'Jefe de obra · Diego Paz'};
var ESTADOS={nuevo:'Recién llegado',preparando:'En preparación',expedicion:'En expedición',camino:'En camino',entregado:'Entregado'};
var STEPIDX={nuevo:1,preparando:1,expedicion:2,camino:3,entregado:4};
var STEPNAMES=['Pedido','Corralón','Expedición','En camino','Entregado'];
var clk=10*60+20;
function stamp(){clk+=7;return '12/10 '+('0'+Math.floor(clk/60)).slice(-2)+':'+('0'+(clk%60)).slice(-2)}
function dnum(s){var a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function bizDiff(from,to){var n=0,t=dnum(from),end=dnum(to);while(t<end){t+=864e5;var w=new Date(t).getUTCDay();if(w!==0&&w!==6)n++}return n}
function fmt(s){var a=s.split('-');return a[2]+'/'+a[1]}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' $'}

var S={tab:'corralon',jornal:JORNAL_INI,open:{},how:{},sheet:null,sel:{},pedidos:[
 {id:'P-014',obra:'Los Álamos 100',nota:'losa PB+1',
  items:[{n:'Hierro del 12',q:'40 barras'},{n:'Cemento',q:'40 bolsas',orig:'30 bolsas'}],
  pidio:{n:'Martín Sosa',r:'Contratista',t:'11/10 16:40'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'11/10 17:05'},
  pedida:'2026-10-12',comprometida:'2026-10-12',estado:'preparando',personas:7,prod:30,incidentes:[],
  log:[['11/10 16:40','Martín Sosa (contratista)','Hizo el pedido'],['11/10 17:05','Diego Paz (jefe de obra)','Ajustó el cemento de 30 a 40 bolsas y lo pasó al corralón'],['12/10 07:50','Corralón','Confirmó entrega para hoy 12/10']]},
 {id:'P-016',obra:'Av. del Sol 2450',nota:'Colocación de revestimientos, planta alta',
  items:[{n:'Adhesivo cementicio',q:'40 bolsas'},{n:'Cal hidratada',q:'20 bolsas'}],
  pidio:{n:'Hugo Ríos',r:'Contratista',t:'12/10 09:55'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'12/10 10:10'},
  pedida:'2026-10-14',comprometida:'2026-10-14',estado:'nuevo',personas:4,prod:50,incidentes:[],
  log:[['12/10 09:55','Hugo Ríos (contratista)','Hizo el pedido'],['12/10 10:10','Diego Paz (jefe de obra)','Lo revisó y lo pasó tal cual al corralón']]},
 {id:'P-017',obra:'Los Álamos 100',nota:'Desagües de planta baja',
  items:[{n:'Caño PVC 110',q:'30 tiras'},{n:'Codos y uniones',q:'1 caja'}],
  pidio:{n:'Martín Sosa',r:'Contratista',t:'06/10 14:20'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'06/10 14:45'},
  pedida:'2026-10-08',comprometida:'2026-10-08',estado:'expedicion',personas:3,prod:0,incidentes:[],
  log:[['06/10 14:20','Martín Sosa (contratista)','Hizo el pedido'],['06/10 14:45','Diego Paz (jefe de obra)','Lo pasó al corralón'],['06/10 15:30','Corralón','Confirmó entrega para el 08/10'],['08/10 08:00','Sistema','Pasó la fecha comprometida y todavía no salió'],['09/10 17:00','Corralón','Pasó a expedición, falta camión disponible']]},
 {id:'P-015',obra:'Lote 14 · Los Cedros',nota:'Contrapiso y carpeta',
  items:[{n:'Arena gruesa',q:'6 m³'},{n:'Piedra partida',q:'4 m³'}],
  pidio:{n:'Martín Sosa',r:'Contratista',t:'09/10 11:00'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'09/10 11:20'},
  pedida:'2026-10-12',comprometida:'2026-10-12',estado:'camino',camion:'Camión 2 · Omar',personas:5,prod:0,incidentes:[],
  log:[['09/10 11:00','Martín Sosa (contratista)','Hizo el pedido'],['09/10 11:20','Diego Paz (jefe de obra)','Lo pasó al corralón'],['09/10 12:00','Corralón','Confirmó entrega para hoy 12/10'],['12/10 08:40','Expedición','Salió con Camión 2 · Omar']]},
 {id:'P-013',obra:'Los Álamos 100',nota:'Losa PB+1',
  items:[{n:'Hormigón H21',q:'6 m³'}],
  pidio:{n:'Martín Sosa',r:'Contratista',t:'05/10 15:10'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'05/10 15:40'},
  pedida:'2026-10-07',comprometida:'2026-10-07',estado:'entregado',entregada:'2026-10-09',personas:7,prod:30,
  incidentes:[{tipo:'Entrega tarde',imp:'corralon',dias:2,det:'No salió de planta en la fecha comprometida'}],
  log:[['05/10 15:10','Martín Sosa (contratista)','Hizo el pedido'],['05/10 15:40','Diego Paz (jefe de obra)','Lo pasó al corralón'],['05/10 16:05','Corralón','Confirmó entrega para el 07/10'],['07/10 08:00','Sistema','Pasó la fecha comprometida y no llegó'],['09/10 11:20','Martín Sosa (contratista)','Recibió en obra con 2 días de demora · remito con foto']]},
 {id:'P-012',obra:'Av. del Sol 2450',nota:'Mampostería planta baja',
  items:[{n:'Ladrillo hueco 12',q:'600 u'}],
  pidio:{n:'Hugo Ríos',r:'Contratista',t:'06/10 09:00'},paso:{n:'Diego Paz',r:'Jefe de obra',t:'06/10 09:15'},
  pedida:'2026-10-08',comprometida:'2026-10-08',estado:'entregado',entregada:'2026-10-09',personas:4,prod:0,
  incidentes:[{tipo:'Pedido errado',imp:'contratista',dias:1,det:'Se pidió ladrillo de 12 y el plano pedía de 18'}],
  log:[['06/10 09:00','Hugo Ríos (contratista)','Hizo el pedido: ladrillo hueco de 12'],['06/10 09:15','Diego Paz (jefe de obra)','Lo pasó tal cual al corralón'],['08/10 10:30','Obra','Rechazó la entrega: el plano pedía ladrillo de 18'],['09/10 09:40','Hugo Ríos (contratista)','Recibió el ladrillo correcto · remito con foto']]}
]};

function late(p){ // días hábiles de atraso corriendo, solo si no está entregado
  if(p.estado==='entregado')return 0;
  return Math.max(0,bizDiff(p.comprometida,HOY));
}
function costoDia(p){return S.jornal*p.personas*(1-p.prod/100)}
function costoInc(p,i){return costoDia(p)*i.dias}
function allInc(){ // incidentes confirmados + atrasos corriendo
  var out=[];
  S.pedidos.forEach(function(p){
    p.incidentes.forEach(function(i){out.push({p:p,tipo:i.tipo,imp:i.imp,dias:i.dias,det:i.det,costo:costoInc(p,i),corriendo:false})});
    var l=late(p);
    if(l>0)out.push({p:p,tipo:'Entrega atrasada (sigue corriendo)',imp:'corralon',dias:l,det:'Pasó la fecha comprometida ('+fmt(p.comprometida)+') y no llegó',costo:costoDia(p)*l,corriendo:true});
  });
  return out;
}
function cnt(est){return S.pedidos.filter(function(p){return est.indexOf(p.estado)>-1}).length}

function ico(n){
  var paths={
    corralon:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    exp:'<path d="M1 6h13v10H1z"/><path d="M14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
    gen:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'};
  return '<svg viewBox="0 0 24 24">'+paths[n]+'</svg>';
}

function stepper(p){
  var idx=STEPIDX[p.estado],h='<div class="steps">';
  for(var i=0;i<STEPNAMES.length;i++){
    var cls=i<idx?'done':(i===idx&&p.estado!=='entregado'?'now':(p.estado==='entregado'&&i===idx?'done':''));
    h+='<div class="step '+cls+'"><i></i><em>'+STEPNAMES[i]+'</em></div>';
    if(i<STEPNAMES.length-1)h+='<div class="bar'+(i<idx?' done':'')+'"></div>';
  }
  return h+'</div>';
}

function itemsHTML(p){
  return '<ul class="items">'+p.items.map(function(it){
    return '<li><span>'+it.n+(it.orig?'<br><span class="adj">El contratista pidió '+it.orig+'; el jefe de obra lo ajustó</span>':'')+'</span><span class="q">'+it.q+'</span></li>';
  }).join('')+'</ul>';
}

function traceHTML(p){
  var h='<div class="trace"><div><b>Cómo se hizo el pedido</b></div>';
  h+='<div>Pidió <b>'+p.pidio.n+'</b> · '+p.pidio.r+' <span class="t">· '+p.pidio.t+'</span></div>';
  h+='<div>Lo pasó <b>'+p.paso.n+'</b> · '+p.paso.r+' <span class="t">· '+p.paso.t+'</span></div>';
  if(p.nota)h+='<div class="t">Para: '+p.nota+'</div>';
  h+='</div>';
  var open=S.open[p.id];
  h+='<button class="link" data-act="hist" data-id="'+p.id+'">'+(open?'Ocultar historial':'Ver historial completo')+'</button>';
  if(open){
    h+='<div class="trace">'+p.log.map(function(l){return '<div><span class="t">'+l[0]+'</span> · <b>'+l[1]+'</b><br>'+l[2]+'</div>'}).join('')+'</div>';
  }
  return h;
}

function badges(p){
  var l=late(p),h='<div class="chips"><span class="chip '+(p.estado==='entregado'?'green':'blue')+'">'+ESTADOS[p.estado]+'</span>';
  if(p.estado!=='entregado'){
    if(l>0)h+='<span class="chip red">Atrasado '+l+' d hábiles</span>';
    else if(p.comprometida===HOY)h+='<span class="chip amb">Entrega hoy</span>';
    else h+='<span class="chip">Entrega '+fmt(p.comprometida)+'</span>';
  }
  return h+'</div>';
}

function dateOptions(sel){
  var days=['2026-10-12','2026-10-13','2026-10-14','2026-10-15','2026-10-16'],h='';
  days.forEach(function(d){h+='<option value="'+d+'"'+(d===sel?' selected':'')+'>'+fmt(d)+(d===HOY?' (hoy)':'')+'</option>'});
  return h;
}

function card(p,mode){
  var h='<div class="card'+(late(p)>0?' alert':'')+'"><div class="row"><div class="obra">'+p.obra+'</div><div class="id">'+p.id+'</div></div>';
  h+=badges(p)+itemsHTML(p)+stepper(p);
  if(late(p)>0)h+='<div class="note" style="margin-top:6px">El atraso ya cuesta <span class="cost">'+money(costoDia(p)*late(p))+'</span> a la obra ('+p.personas+' personas afectadas).</div>';
  h+=traceHTML(p);
  h+='<div class="btns">';
  if(p.estado==='nuevo'){
    var v=S.sel['f'+p.id]||p.pedida;
    h+='<div style="flex:1 1 100%"><label>Entrega comprometida (pedida: '+fmt(p.pedida)+')</label><select data-sel="f'+p.id+'">'+dateOptions(v)+'</select></div>';
    h+='<button class="btn gold" data-act="confirmar" data-id="'+p.id+'">Confirmar pedido</button>';
  }else if(p.estado==='preparando'){
    h+='<button class="btn gold" data-act="expedicion" data-id="'+p.id+'">Pasar a expedición</button>';
  }else if(p.estado==='expedicion'){
    var c=S.sel['c'+p.id]||'Camión 1 · Raúl';
    h+='<div style="flex:1 1 100%"><label>Camión y chofer</label><select data-sel="c'+p.id+'">'+['Camión 1 · Raúl','Camión 2 · Omar','Camioneta · Lucas'].map(function(x){return '<option'+(x===c?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div>';
    h+='<button class="btn gold" data-act="despachar" data-id="'+p.id+'">Despachar</button>';
  }else if(p.estado==='camino'){
    h+='<div class="note" style="flex:1 1 100%">'+(p.camion||'')+' · salió de expedición</div>';
    h+='<button class="btn gold" data-act="entregar" data-id="'+p.id+'">Entregado en obra</button>';
  }
  if(p.estado!=='entregado')h+='<button class="btn warn" data-act="problema" data-id="'+p.id+'">Avisar problema</button>';
  return h+'</div></div>';
}

function viewCorralon(){
  var l=S.pedidos.filter(function(p){return p.estado==='nuevo'||p.estado==='preparando'});
  var h='<div class="sec">Pedidos que llegan desde la obra</div>';
  if(!l.length)h+='<div class="empty">No hay pedidos para preparar.</div>';
  l.forEach(function(p){h+=card(p)});
  h+='<div class="foot">Cada pedido llega con quién lo hizo y quién lo pasó. No se guardan precios ni pagos.</div>';
  return h;
}
function viewExp(){
  var l=S.pedidos.filter(function(p){return p.estado==='expedicion'||p.estado==='camino'});
  var h='<div class="sec">Para despachar y en camino</div>';
  if(!l.length)h+='<div class="empty">No hay pedidos en expedición.</div>';
  l.forEach(function(p){h+=card(p)});
  h+='<div class="foot">Al marcar “Entregado en obra” queda el remito con foto y quién lo recibió.</div>';
  return h;
}

function viewGeneral(){
  var inc=allInc(),total=inc.reduce(function(a,i){return a+i.costo},0);
  var run=inc.filter(function(i){return i.corriendo}).length;
  var enCurso=S.pedidos.filter(function(p){return p.estado!=='entregado'}).length;
  var aTiempo=S.pedidos.filter(function(p){return p.estado==='entregado'&&!p.incidentes.length}).length;
  var conAtraso=new Set(inc.map(function(i){return i.p.id})).size;
  var h='<div class="kpis"><div class="kpi"><b>'+enCurso+'</b><span>En curso</span></div><div class="kpi"><b>'+aTiempo+'</b><span>A tiempo</span></div><div class="kpi"><b style="color:var(--red)">'+conAtraso+'</b><span>Con atraso</span></div></div>';
  h+='<div class="card alert"><div class="sec" style="margin:0">Lo que cuestan los atrasos de materiales</div><div class="big">'+money(total)+'</div><div class="note">'+inc.length+' casos'+(run?' · '+run+' con el costo todavía corriendo':'')+'. Cada uno entra solo a Gestión de obra con la causa “Materiales · Provisión”.</div></div>';

  h+='<div class="sec">Quién generó el costo</div><div class="card">';
  ['corralon','contratista','jefe'].forEach(function(k){
    var sub=inc.filter(function(i){return i.imp===k}),sum=sub.reduce(function(a,i){return a+i.costo},0);
    h+='<div style="margin-bottom:10px"><div class="line2"><b>'+IMP[k]+'</b><span class="cost">'+money(sum)+'</span></div><div class="rbar"><i style="width:'+(total?Math.round(sum/total*100):0)+'%"></i></div><div class="note">'+sub.length+(sub.length===1?' caso':' casos')+(k==='contratista'?' · pedidos mal hechos':'')+'</div></div>';
  });
  h+='</div>';

  h+='<div class="sec">Por obra</div><div class="card">';
  var obras={};inc.forEach(function(i){obras[i.p.obra]=(obras[i.p.obra]||0)+i.costo});
  S.pedidos.forEach(function(p){if(!(p.obra in obras))obras[p.obra]=0});
  Object.keys(obras).forEach(function(o,ix,arr){
    h+='<div class="line2" style="padding:7px 0;'+(ix<arr.length-1?'border-bottom:1px dashed var(--line)':'')+'"><b>'+o+'</b><span class="'+(obras[o]?'cost':'note')+'">'+(obras[o]?money(obras[o]):'sin atrasos')+'</span></div>';
  });
  h+='</div>';

  h+='<div class="sec">Casos de atraso</div>';
  inc.forEach(function(i,ix){
    var k='h'+ix,p=i.p;
    h+='<div class="card"><div class="row"><div><div class="obra" style="font-size:16px">'+i.tipo+'</div><div class="note">'+p.obra+' · '+p.id+' · imputable a <b>'+IMP[i.imp]+'</b></div></div><div class="cost" style="white-space:nowrap">'+money(i.costo)+'</div></div>';
    h+='<div class="note" style="margin-top:6px">'+i.det+' · '+i.dias+' d hábiles</div>';
    h+='<button class="link" data-act="how" data-k="'+k+'">'+(S.how[k]?'Ocultar el cálculo':'Ver cómo se calcula')+'</button>';
    if(S.how[k])h+='<div class="how">'+p.personas+' personas afectadas × '+i.dias+(i.dias===1?' día':' días')+' × '+money(S.jornal)+' por persona por día'+(p.prod?' × '+(100-p.prod)+'% (trabajaron al '+p.prod+'% de productividad)':'')+' = <b class="cost">'+money(i.costo)+'</b></div>';
    h+='<div style="margin-top:2px"><button class="link" data-act="hist" data-id="'+p.id+'">'+(S.open[p.id]?'Ocultar historial del pedido':'Ver historial del pedido')+'</button></div>';
    if(S.open[p.id])h+='<div class="trace">'+p.log.map(function(l){return '<div><span class="t">'+l[0]+'</span> · <b>'+l[1]+'</b><br>'+l[2]+'</div>'}).join('')+'</div>';
    h+='</div>';
  });
  if(!inc.length)h+='<div class="empty">Todavía no hay atrasos.</div>';

  h+='<div class="sec">Ajustes del cálculo</div><div class="card"><label style="margin-top:0">Costo de una persona por día (ejemplo)</label><input type="number" inputmode="numeric" min="0" step="1000" value="'+S.jornal+'" data-act="jornal"><div class="note" style="margin-top:6px">Es el mismo parámetro que usa Gestión de obra. Se ajusta una vez y vale para todo.</div></div>';
  h+='<div class="foot">NEXO no guarda precios de materiales ni pagos. Solo mide cuánto cuesta que un pedido llegue tarde o mal hecho.</div>';
  return h;
}

function sheetHTML(p){
  var t=S.sel.tp||'Falta de stock',imp=S.sel.imp||'corralon',d=S.sel.dias||'1';
  var tipos=['Falta de stock','Pedido incompleto','Pedido errado'];
  var h='<div class="shade" data-act="cerrar"><div class="sheet" data-stop="1"><h2>Avisar un problema</h2><div class="note">'+p.obra+' · '+p.id+'. Queda en el historial y entra a Gestión de obra.</div>';
  h+='<label>Qué pasó</label><select data-sel="tp">'+tipos.map(function(x){return '<option'+(x===t?' selected':'')+'>'+x+'</option>'}).join('')+'</select>';
  h+='<label>Quién lo generó</label><select data-sel="imp">'+Object.keys(IMPLONG).map(function(k){return '<option value="'+k+'"'+(k===imp?' selected':'')+'>'+IMPLONG[k]+'</option>'}).join('')+'</select>';
  h+='<label>Días hábiles de atraso</label><select data-sel="dias">'+[1,2,3,4,5].map(function(n){return '<option'+(String(n)===d?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';
  h+='<div class="note" style="margin-top:10px">Costo estimado: <b class="cost">'+money(costoDia(p)*(+d))+'</b> ('+p.personas+' personas afectadas).</div>';
  h+='<div class="btns"><button class="btn ghost" data-act="cerrar">Cancelar</button><button class="btn" data-act="guardarprob" data-id="'+p.id+'">Guardar aviso</button></div></div></div>';
  return h;
}

var TITLES={corralon:['Corralón','Pedidos que llegan desde la obra'],exp:['Expedición','Despacho y entrega en obra'],gen:['General','Seguimiento y costo de los atrasos']};
function render(){
  var t=TITLES[S.tab],body=S.tab==='corralon'?viewCorralon():S.tab==='exp'?viewExp():viewGeneral();
  var nc=cnt(['nuevo','preparando']),ne=cnt(['expedicion','camino']);
  var h='<div class="band"><span>NEXO · Proveedores</span><span>Corralón Norte · Buenos Aires</span></div>';
  h+='<div class="head"><h1>'+t[0]+'</h1><p>'+t[1]+'</p><span class="demo">Demo · datos de ejemplo</span></div><main>'+body+'</main>';
  h+='<nav>'+[['corralon','Corralón','corralon',nc],['exp','Expedición','exp',ne],['gen','General','gen',0]].map(function(x){
    return '<button class="'+(S.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+ico(x[2])+x[1]+(x[3]?'<span class="badge">'+x[3]+'</span>':'')+'</button>';
  }).join('')+'</nav>';
  if(S.sheet)h+=sheetHTML(S.sheet);
  var y=window.scrollY;
  document.getElementById('app').innerHTML=h;
  window.scrollTo(0,y);
}
function find(id){return S.pedidos.filter(function(p){return p.id===id})[0]}
function log(p,who,txt){p.log.push([stamp(),who,txt])}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  if(e.target.closest('[data-stop]')&&el.dataset.act==='cerrar'&&el.classList.contains('shade'))return;
  var a=el.dataset.act,p=el.dataset.id?find(el.dataset.id):null;
  if(a==='jornal')return;
  if(a==='tab'){S.tab=el.dataset.t;window.scrollTo(0,0)}
  else if(a==='hist'){S.open[p.id]=!S.open[p.id]}
  else if(a==='how'){S.how[el.dataset.k]=!S.how[el.dataset.k]}
  else if(a==='confirmar'){var f=S.sel['f'+p.id]||p.pedida;p.comprometida=f;p.estado='preparando';log(p,'Corralón','Confirmó entrega para el '+fmt(f))}
  else if(a==='expedicion'){p.estado='expedicion';log(p,'Corralón','Preparado y pasado a expedición')}
  else if(a==='despachar'){var c=S.sel['c'+p.id]||'Camión 1 · Raúl';p.camion=c;p.estado='camino';log(p,'Expedición','Salió con '+c)}
  else if(a==='entregar'){
    var l=late(p);p.estado='entregado';p.entregada=HOY;
    if(l>0)p.incidentes.push({tipo:'Entrega tarde',imp:'corralon',dias:l,det:'Llegó '+l+(l===1?' día hábil':' días hábiles')+' después de lo comprometido'});
    log(p,p.pidio.n+' (contratista)','Recibió en obra'+(l>0?' con '+l+' d de demora':' a tiempo')+' · remito con foto');
  }
  else if(a==='problema'){S.sheet=p;S.sel.tp='Falta de stock';S.sel.imp='corralon';S.sel.dias='1'}
  else if(a==='cerrar'){if(e.target.closest('.sheet')&&!el.classList.contains('btn'))return;S.sheet=null}
  else if(a==='guardarprob'){
    var d=+S.sel.dias||1,imp=S.sel.imp||'corralon';
    p.incidentes.push({tipo:S.sel.tp||'Falta de stock',imp:imp,dias:d,det:'Avisado desde el corralón'});
    log(p,'Corralón','Avisó: '+(S.sel.tp||'Falta de stock')+' · imputable a '+IMP[imp]+' · +'+d+' d hábiles');
    S.sheet=null;
  }
  render();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sel){S.sel[t.dataset.sel]=t.value;if(S.sheet&&['tp','imp','dias'].indexOf(t.dataset.sel)>-1)render()}
  else if(t.dataset&&t.dataset.act==='jornal'){var v=parseInt(t.value,10);if(v>=0)S.jornal=v;render()}
});
render();
})();
</script>
</body>
</html>
