<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Demo corralón</title>
<style>
:root{
  --navy:#0F1B2D; --gold:#B0894F; --mut:#5B6B7F; --line:#C9D2DE; --bg:#f4f4f6; --card:#fff;
  --red:#B91C1C; --redbg:#fbe9e9; --amb:#B45309; --ambbg:#fdf0e1; --green:#16A34A; --greenbg:#e3f4ea; --blue:#1d4f8c; --bluebg:#e6eef8;
}
html,body{margin:0;padding:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--navy);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.35}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.band{background:var(--navy);color:#9fb0c5;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold);white-space:nowrap;overflow:hidden}
.band span:last-child{letter-spacing:.02em;text-transform:none;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.head{background:#fff;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:22px;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--mut);font-size:14px}
.demo{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amb);background:var(--ambbg);padding:3px 8px;border-radius:99px}
main{padding:14px 16px 110px}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.sec:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.obra{font-weight:800;font-size:17px}
.id{color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#eef1f5;color:var(--mut)}
.chip.red{background:var(--redbg);color:var(--red)} .chip.amb{background:var(--ambbg);color:var(--amb)} .chip.green{background:var(--greenbg);color:var(--green)} .chip.blue{background:var(--bluebg);color:var(--blue)}
ul.items{margin:6px 0 2px;padding:0;list-style:none}
ul.items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
ul.items li:last-child{border-bottom:0}
ul.items .q{font-weight:700;white-space:nowrap}
.mini{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
.ent{border:1px solid #e3e8ef;border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#f7f8fa}
.ent.camino,.ent.expedicion{border-left-color:var(--gold)}
.ent.entregada{border-left-color:var(--green)}
.ent.late{border-left-color:#ef4444}
.ent .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ent .tt b{font-size:14.5px}
.pill{display:inline-block;background:#eef1f5;border-radius:8px;padding:3px 8px;font-size:13px;margin:6px 6px 0 0}
.pill b{font-weight:800}
.steps{display:flex;align-items:center;margin:10px 0 2px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;width:64px;text-align:center}
.step i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);display:block}
.step.done i{background:var(--green);border-color:var(--green)}
.step.now i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,137,79,.22)}
.step em{font-style:normal;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.1}
.step.now em{color:var(--navy)}
.bar{flex:1;height:2px;background:var(--line);margin-bottom:16px}
.bar.done{background:var(--green)}
.trace{background:#f7f8fa;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.trace b{font-weight:800}
.trace .t{color:var(--mut)}
.trace div+div{margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,select{font:inherit}
.btn{border:0;border-radius:10px;padding:0 14px;min-height:44px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff;flex:1 1 auto}
.btn.gold{background:var(--gold)}
.btn.ghost{background:#eef1f5;color:var(--navy)}
.btn.warn{background:var(--redbg);color:var(--red)}
.btn.small{min-height:38px;font-size:13.5px;flex:0 0 auto;margin-top:8px}
select,input[type=number]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--navy)}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.cost{color:var(--red);font-weight:800}
.big{font-size:32px;font-weight:900;color:var(--red);letter-spacing:-.02em;margin:4px 0 2px}
.card.alert{border-left:5px solid #ef4444}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:900}
.kpi span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rbar{height:10px;border-radius:99px;background:#eef1f5;overflow:hidden;margin:6px 0 2px}
.rbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.rbar.g i{background:var(--green)}
.line2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.note{color:var(--mut);font-size:13px}
.how{background:#f7f8fa;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.link{background:none;border:0;color:var(--blue);font-weight:800;padding:6px 0;cursor:pointer;min-height:32px}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dots span{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:#eef1f5;color:var(--mut)}
.dots span.entregada{background:var(--greenbg);color:var(--green)}
.dots span.camino,.dots span.expedicion{background:var(--ambbg);color:var(--amb)}
.dots span.bad{background:var(--redbg);color:var(--red)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}
nav button{background:none;border:0;border-top:3px solid transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;position:relative;min-height:58px}
nav button.on{color:var(--navy);border-top-color:var(--gold)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:#ef4444;color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.shade{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:19px}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin:16px 6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var HOY='2026-10-12';
var JORNAL_INI=70000;
var IMP={corralon:'Corralón',jefe:'Jefe de obra'};
var IMPLONG={corralon:'Corralón (stock, preparación o despacho)',jefe:'Jefe de obra (cómo se armó el pedido)'};
var EST={pendiente:'Por confirmar',preparando:'En preparación',expedicion:'En expedición',camino:'En camino',entregada:'Entregada'};
var EIDX={pendiente:0,preparando:0,expedicion:1,camino:2,entregada:3};
var ESTEP=['Preparación','Expedición','En camino','Entregada'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
var clk=10*60+20;
function stamp(){clk+=7;return '12/10 '+('0'+Math.floor(clk/60)).slice(-2)+':'+('0'+(clk%60)).slice(-2)}
function dnum(s){var a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function bizDiff(from,to){var n=0,t=dnum(from),end=dnum(to);while(t<end){t+=864e5;var w=new Date(t).getUTCDay();if(w!==0&&w!==6)n++}return n}
function fmt(s){var a=s.split('-');return a[2]+'/'+a[1]}
function fdia(s){return DIAS[new Date(dnum(s)).getUTCDay()]+' '+fmt(s)}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' $'}
function E(k,fecha,q,estado,x){var o={k:k,fecha:fecha,q:q,estado:estado};for(var i in (x||{}))o[i]=x[i];return o}

var S={tab:'corralon',jornal:JORNAL_INI,open:{},how:{},sheet:null,sel:{},pedidos:[
 {id:'P-018',obra:'Av. del Sol 2450',nota:'Mampostería planta alta',confirmado:false,
  items:[{n:'Ladrillo hueco',u:'pallets',t:8},{n:'Cemento',u:'pallets',t:4},{n:'Arena',u:'pallets',t:4}],
  jefe:{n:'Diego Paz',t:'12/10 10:10'},personas:4,prod:50,incidentes:[],
  entregas:[E(1,'2026-10-14',[4,2,2],'pendiente'),E(2,'2026-10-16',[4,2,2],'pendiente')],
  log:[['12/10 10:10','Diego Paz (jefe de obra)','Hizo el pedido con entrega en 2 partes iguales: 4 de ladrillo, 2 de cemento y 2 de arena en cada una']]},
 {id:'P-014',obra:'Los Álamos 100',nota:'Mampostería y contrapiso, planta baja',confirmado:true,
  items:[{n:'Cemento',u:'pallets',t:10},{n:'Ladrillo hueco',u:'pallets',t:10},{n:'Arena',u:'pallets',t:10}],
  jefe:{n:'Diego Paz',t:'11/10 17:05'},personas:7,prod:30,incidentes:[],
  entregas:[E(1,'2026-10-12',[2,2,2],'camino',{camion:'Camión 2 · Omar'}),E(2,'2026-10-13',[3,3,3],'preparando'),E(3,'2026-10-14',[3,3,3],'preparando'),E(4,'2026-10-15',[2,2,2],'preparando')],
  log:[['11/10 17:05','Diego Paz (jefe de obra)','Hizo el pedido con entrega en 4 partes, cada una con cemento, ladrillo y arena juntos'],['11/10 17:40','Corralón','Confirmó el plan de entrega'],['12/10 08:40','Expedición','Entrega 1 salió con Camión 2 · Omar']]},
 {id:'P-017',obra:'Los Álamos 100',nota:'Desagües de planta baja',confirmado:true,
  items:[{n:'Caño PVC 110',u:'tiras',t:30},{n:'Codos y uniones',u:'caja',t:1}],
  jefe:{n:'Diego Paz',t:'06/10 14:45'},personas:3,prod:0,incidentes:[],
  entregas:[E(1,'2026-10-08',[30,1],'expedicion')],
  log:[['06/10 14:45','Diego Paz (jefe de obra)','Hizo el pedido con una sola entrega'],['06/10 15:30','Corralón','Confirmó entrega para el 08/10'],['08/10 08:00','Sistema','Pasó la fecha comprometida y todavía no salió'],['09/10 17:00','Corralón','Pasó a expedición, falta camión disponible']]},
 {id:'P-013',obra:'Los Álamos 100',nota:'Losa PB+1',confirmado:true,
  items:[{n:'Hormigón H21',u:'m³',t:6}],
  jefe:{n:'Diego Paz',t:'05/10 15:40'},personas:7,prod:30,
  incidentes:[{k:1,tipo:'Entrega tarde',imp:'corralon',dias:2,det:'No salió de planta en la fecha comprometida'}],
  entregas:[E(1,'2026-10-07',[6],'entregada',{entregadaEl:'2026-10-09'})],
  log:[['05/10 15:40','Diego Paz (jefe de obra)','Hizo el pedido con una sola entrega'],['05/10 16:05','Corralón','Confirmó entrega para el 07/10'],['07/10 08:00','Sistema','Pasó la fecha comprometida y no llegó'],['09/10 11:20','Diego Paz (jefe de obra)','Recibió en obra con 2 días de demora · remito con foto']]},
 {id:'P-012',obra:'Av. del Sol 2450',nota:'Mampostería planta baja',confirmado:true,
  items:[{n:'Ladrillo hueco de 12',u:'unidades',t:600}],
  jefe:{n:'Diego Paz',t:'06/10 09:15'},personas:4,prod:0,
  incidentes:[{k:1,tipo:'Pedido errado',imp:'jefe',dias:1,det:'Se pidió ladrillo de 12 y el plano pedía de 18'}],
  entregas:[E(1,'2026-10-08',[600],'entregada',{entregadaEl:'2026-10-09'})],
  log:[['06/10 09:15','Diego Paz (jefe de obra)','Hizo el pedido: ladrillo hueco de 12'],['08/10 10:30','Obra','Rechazó la entrega: el plano pedía ladrillo de 18'],['09/10 09:40','Diego Paz (jefe de obra)','Recibió el ladrillo correcto · remito con foto']]},
 {id:'P-011',obra:'Lote 14 · Los Cedros',nota:'Mampostería de cierre',confirmado:true,
  items:[{n:'Ladrillo hueco',u:'pallets',t:4},{n:'Cemento',u:'pallets',t:2},{n:'Arena',u:'pallets',t:2}],
  jefe:{n:'Diego Paz',t:'05/10 12:00'},personas:5,prod:0,
  incidentes:[{k:1,tipo:'Entrega incompleta',imp:'corralon',dias:1,det:'Llegó con ladrillo y cemento, pero sin arena: la obra no pudo avanzar'}],
  entregas:[E(1,'2026-10-06',[2,1,1],'entregada',{entregadaEl:'2026-10-06',faltante:'Arena'}),E(2,'2026-10-08',[2,1,1],'entregada',{entregadaEl:'2026-10-08'})],
  log:[['05/10 12:00','Diego Paz (jefe de obra)','Hizo el pedido con entrega en 2 partes iguales'],['06/10 10:00','Diego Paz (jefe de obra)','Recibió la entrega 1 sin arena: no se pudo avanzar con el muro'],['08/10 09:30','Diego Paz (jefe de obra)','Recibió la entrega 2 completa · remito con foto']]}
]};

function late(e){return e.estado==='entregada'?0:Math.max(0,bizDiff(e.fecha,HOY))}
function costoDia(p){return S.jornal*p.personas*(1-p.prod/100)}
function allInc(){
  var out=[];
  S.pedidos.forEach(function(p){
    p.incidentes.forEach(function(i){out.push({p:p,k:i.k,tipo:i.tipo,imp:i.imp,dias:i.dias,det:i.det,costo:costoDia(p)*i.dias,corriendo:false})});
    p.entregas.forEach(function(e){var l=late(e);
      if(l>0)out.push({p:p,k:e.k,tipo:'Entrega '+e.k+' atrasada (sigue corriendo)',imp:'corralon',dias:l,det:'Pasó la fecha comprometida ('+fmt(e.fecha)+') y no llegó',costo:costoDia(p)*l,corriendo:true});
    });
  });
  return out;
}
function enCorralon(){return S.pedidos.filter(function(p){return !p.confirmado||p.entregas.some(function(e){return e.estado==='preparando'})})}
function enExp(){var o=[];S.pedidos.forEach(function(p){p.entregas.forEach(function(e){if(e.estado==='expedicion'||e.estado==='camino')o.push({p:p,e:e})})});return o}

function ico(n){
  var paths={
    corralon:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
    exp:'<path d="M1 6h13v10H1z"/><path d="M14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
    gen:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'};
  return '<svg viewBox="0 0 24 24">'+paths[n]+'</svg>';
}
function stepper(e){
  var idx=EIDX[e.estado],h='<div class="steps">';
  for(var i=0;i<ESTEP.length;i++){
    var cls=(e.estado==='entregada'||i<idx)?'done':(i===idx?'now':'');
    h+='<div class="step '+cls+'"><i></i><em>'+ESTEP[i]+'</em></div>';
    if(i<ESTEP.length-1)h+='<div class="bar'+((e.estado==='entregada'||i<idx)?' done':'')+'"></div>';
  }
  return h+'</div>';
}
function pills(p,e){
  return p.items.map(function(it,i){return '<span class="pill">'+it.n+' <b>'+e.q[i]+' '+it.u+'</b></span>'}).join('');
}
function entChips(e){
  var l=late(e),h='<span class="chip '+(e.estado==='entregada'?'green':(e.estado==='pendiente'?'':'blue'))+'">'+EST[e.estado]+'</span>';
  if(e.estado!=='entregada'){
    if(l>0)h+=' <span class="chip red">Atrasada '+l+' d hábiles</span>';
    else if(e.fecha===HOY)h+=' <span class="chip amb">Hoy</span>';
  }
  return h;
}
function histHTML(p){
  var open=S.open[p.id],h='<button class="link" data-act="hist" data-id="'+p.id+'">'+(open?'Ocultar historial':'Ver historial del pedido')+'</button>';
  if(open)h+='<div class="trace">'+p.log.map(function(l){return '<div><span class="t">'+l[0]+'</span> · <b>'+l[1]+'</b><br>'+l[2]+'</div>'}).join('')+'</div>';
  return h;
}

function cardCorralon(p){
  var n=p.entregas.length;
  var h='<div class="card"><div class="row"><div class="obra">'+p.obra+'</div><div class="id">'+p.id+'</div></div>';
  h+='<div class="chips"><span class="chip '+(p.confirmado?'blue':'amb')+'">'+(p.confirmado?'Plan confirmado':'Plan por confirmar')+'</span><span class="chip">'+n+(n===1?' entrega':' entregas')+'</span></div>';
  h+='<div class="note">Pidió <b>'+p.jefe.n+'</b> · Jefe de obra · '+p.jefe.t+'<br>Para: '+p.nota+'</div>';
  h+='<div class="mini">Pedido completo</div><ul class="items">'+p.items.map(function(it){return '<li><span>'+it.n+'</span><span class="q">'+it.t+' '+it.u+'</span></li>'}).join('')+'</ul>';
  h+='<div class="mini">Cómo tiene que salir la entrega</div>';
  if(n>1)h+='<div class="note">Cada entrega sale armada con lo que la obra usa junto. Si falta un producto, esa parte no sirve para avanzar.</div>';
  p.entregas.forEach(function(e){
    h+='<div class="ent '+e.estado+(late(e)>0?' late':'')+'"><div class="tt"><b>Entrega '+e.k+' de '+n+' · '+fdia(e.fecha)+'</b><span>'+entChips(e)+'</span></div>'+pills(p,e);
    if(p.confirmado&&e.estado==='preparando')h+='<div><button class="btn small gold" data-act="exp" data-id="'+p.id+'" data-k="'+e.k+'">Pasar a expedición</button></div>';
    h+='</div>';
  });
  h+=histHTML(p);
  h+='<div class="btns">';
  if(!p.confirmado)h+='<button class="btn gold" data-act="confirmar" data-id="'+p.id+'">Confirmar plan de entrega</button>';
  h+='<button class="btn warn" data-act="problema" data-id="'+p.id+'">Avisar problema</button></div></div>';
  return h;
}
function cardExp(x){
  var p=x.p,e=x.e,n=p.entregas.length;
  var h='<div class="card'+(late(e)>0?' alert':'')+'"><div class="row"><div class="obra">'+p.obra+'</div><div class="id">'+p.id+'</div></div>';
  h+='<div class="chips"><span class="chip">Entrega '+e.k+' de '+n+'</span><span class="chip">Programada '+fdia(e.fecha)+'</span>'+entChips(e)+'</div>';
  h+='<div>'+pills(p,e)+'</div>'+stepper(e);
  if(late(e)>0)h+='<div class="note" style="margin-top:6px">El atraso ya cuesta <span class="cost">'+money(costoDia(p)*late(e))+'</span> a la obra ('+p.personas+' personas afectadas).</div>';
  h+=histHTML(p);
  h+='<div class="btns">';
  if(e.estado==='expedicion'){
    var c=S.sel['c'+p.id+e.k]||'Camión 1 · Raúl';
    h+='<div style="flex:1 1 100%"><label>Camión y chofer</label><select data-sel="c'+p.id+e.k+'">'+['Camión 1 · Raúl','Camión 2 · Omar','Camioneta · Lucas'].map(function(o){return '<option'+(o===c?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>';
    h+='<button class="btn gold" data-act="despachar" data-id="'+p.id+'" data-k="'+e.k+'">Despachar</button>';
  }else{
    h+='<div class="note" style="flex:1 1 100%">'+(e.camion||'')+' · la obra confirma cómo llegó</div>';
    h+='<button class="btn gold" data-act="completa" data-id="'+p.id+'" data-k="'+e.k+'">Llegó completa</button><button class="btn warn" data-act="incompleta" data-id="'+p.id+'" data-k="'+e.k+'">Llegó incompleta</button>';
  }
  return h+'</div></div>';
}

function viewCorralon(){
  var l=enCorralon(),h='<div class="sec">Pedidos del jefe de obra</div>';
  if(!l.length)h+='<div class="empty">No hay pedidos para preparar.</div>';
  l.forEach(function(p){h+=cardCorralon(p)});
  h+='<div class="foot">El pedido lo hace el jefe de obra, después de hablarlo con el contratista. Al corralón le llega ya cerrado, con el plan de entrega. No se guardan precios ni pagos.</div>';
  return h;
}
function viewExp(){
  var l=enExp(),h='<div class="sec">Entregas para despachar y en camino</div>';
  if(!l.length)h+='<div class="empty">No hay entregas en expedición.</div>';
  l.forEach(function(x){h+=cardExp(x)});
  h+='<div class="foot">Al recibir, el jefe de obra confirma si la entrega llegó completa. Si faltó un producto, queda como atraso con su costo.</div>';
  return h;
}

function viewGeneral(){
  var inc=allInc(),total=inc.reduce(function(a,i){return a+i.costo},0);
  var run=inc.filter(function(i){return i.corriendo}).length;
  var curso=0,ok=0;
  S.pedidos.forEach(function(p){p.entregas.forEach(function(e){
    if(e.estado!=='entregada')curso++;
    else if(!p.incidentes.some(function(i){return i.k===e.k}))ok++;
  })});
  var prob={};inc.forEach(function(i){prob[i.p.id+':'+i.k]=1});
  var h='<div class="kpis"><div class="kpi"><b>'+curso+'</b><span>Entregas en curso</span></div><div class="kpi"><b>'+ok+'</b><span>Llegaron bien</span></div><div class="kpi"><b style="color:var(--red)">'+Object.keys(prob).length+'</b><span>Con problema</span></div></div>';
  h+='<div class="card alert"><div class="sec" style="margin:0">Lo que cuestan los atrasos de materiales</div><div class="big">'+money(total)+'</div><div class="note">'+inc.length+' casos'+(run?' · '+run+' con el costo todavía corriendo':'')+'. Cada uno entra solo a Gestión de obra con la causa “Materiales · Provisión”.</div></div>';

  h+='<div class="sec">Quién generó el costo</div><div class="card">';
  ['corralon','jefe'].forEach(function(k){
    var sub=inc.filter(function(i){return i.imp===k}),sum=sub.reduce(function(a,i){return a+i.costo},0);
    h+='<div style="margin-bottom:10px"><div class="line2"><b>'+IMP[k]+'</b><span class="cost">'+money(sum)+'</span></div><div class="rbar"><i style="width:'+(total?Math.round(sum/total*100):0)+'%"></i></div><div class="note">'+sub.length+(sub.length===1?' caso':' casos')+(k==='jefe'?' · pedidos mal armados':' · entregas tarde, faltantes o incompletas')+'</div></div>';
  });
  h+='</div>';

  h+='<div class="sec">Avance de cada pedido</div>';
  S.pedidos.forEach(function(p){
    var d=p.entregas.filter(function(e){return e.estado==='entregada'}).length,n=p.entregas.length;
    h+='<div class="card"><div class="row"><div class="obra" style="font-size:16px">'+p.obra+'</div><div class="id">'+p.id+'</div></div><div class="note">'+p.items.map(function(it){return it.n}).join(' · ')+'</div>';
    h+='<div class="rbar g"><i style="width:'+Math.round(d/n*100)+'%"></i></div><div class="note">'+d+' de '+n+(n===1?' entrega recibida':' entregas recibidas')+'</div><div class="dots">';
    p.entregas.forEach(function(e){
      var bad=late(e)>0||p.incidentes.some(function(i){return i.k===e.k});
      h+='<span class="'+(bad?'bad':e.estado)+'">E'+e.k+' · '+fdia(e.fecha)+'</span>';
    });
    h+='</div></div>';
  });

  h+='<div class="sec">Por obra</div><div class="card">';
  var obras={};inc.forEach(function(i){obras[i.p.obra]=(obras[i.p.obra]||0)+i.costo});
  S.pedidos.forEach(function(p){if(!(p.obra in obras))obras[p.obra]=0});
  Object.keys(obras).forEach(function(o,ix,arr){
    h+='<div class="line2" style="padding:7px 0;'+(ix<arr.length-1?'border-bottom:1px dashed var(--line)':'')+'"><b>'+o+'</b><span class="'+(obras[o]?'cost':'note')+'">'+(obras[o]?money(obras[o]):'sin atrasos')+'</span></div>';
  });
  h+='</div>';

  h+='<div class="sec">Casos de atraso</div>';
  inc.forEach(function(i,ix){
    var k='h'+ix,p=i.p;
    h+='<div class="card"><div class="row"><div><div class="obra" style="font-size:16px">'+i.tipo+'</div><div class="note">'+p.obra+' · '+p.id+(i.k?' · entrega '+i.k:'')+' · imputable a <b>'+IMP[i.imp]+'</b></div></div><div class="cost" style="white-space:nowrap">'+money(i.costo)+'</div></div>';
    h+='<div class="note" style="margin-top:6px">'+i.det+' · '+i.dias+' d hábiles</div>';
    h+='<button class="link" data-act="how" data-k="'+k+'">'+(S.how[k]?'Ocultar el cálculo':'Ver cómo se calcula')+'</button>';
    if(S.how[k])h+='<div class="how">'+p.personas+' personas afectadas × '+i.dias+(i.dias===1?' día':' días')+' × '+money(S.jornal)+' por persona por día'+(p.prod?' × '+(100-p.prod)+'% (trabajaron al '+p.prod+'% de productividad)':'')+' = <b class="cost">'+money(i.costo)+'</b></div>';
    h+='<div>'+histHTML(p)+'</div></div>';
  });
  if(!inc.length)h+='<div class="empty">Todavía no hay atrasos.</div>';

  h+='<div class="sec">Ajustes del cálculo</div><div class="card"><label style="margin-top:0">Costo de una persona por día (ejemplo)</label><input type="number" inputmode="numeric" min="0" step="1000" value="'+S.jornal+'" data-act="jornal"><div class="note" style="margin-top:6px">Es el mismo parámetro que usa Gestión de obra. Se ajusta una vez y vale para todo.</div></div>';
  h+='<div class="foot">NEXO no guarda precios de materiales ni pagos. Solo mide cuánto cuesta que un pedido llegue tarde, incompleto o mal armado.</div>';
  return h;
}

function sheetHTML(){
  var sh=S.sheet,p=sh.p,h='<div class="shade" data-act="cerrar"><div class="sheet">';
  if(sh.type==='prob'){
    var t=S.sel.tp||'Falta de stock',imp=S.sel.imp||'corralon',d=S.sel.dias||'1';
    h+='<h2>Avisar un problema</h2><div class="note">'+p.obra+' · '+p.id+'. Queda en el historial y entra a Gestión de obra.</div>';
    h+='<label>Qué pasó</label><select data-sel="tp">'+['Falta de stock','No puedo cumplir el plan de entrega','Pedido incompleto o errado'].map(function(x){return '<option'+(x===t?' selected':'')+'>'+x+'</option>'}).join('')+'</select>';
    h+='<label>Quién lo generó</label><select data-sel="imp">'+Object.keys(IMPLONG).map(function(k){return '<option value="'+k+'"'+(k===imp?' selected':'')+'>'+IMPLONG[k]+'</option>'}).join('')+'</select>';
    h+='<label>Días hábiles de atraso</label><select data-sel="dias">'+[1,2,3,4,5].map(function(n){return '<option'+(String(n)===d?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';
    h+='<div class="note" style="margin-top:10px">Costo estimado: <b class="cost">'+money(costoDia(p)*(+d))+'</b> ('+p.personas+' personas afectadas).</div>';
    h+='<div class="btns"><button class="btn ghost" data-act="cerrar">Cancelar</button><button class="btn" data-act="guardarprob" data-id="'+p.id+'">Guardar aviso</button></div>';
  }else{
    var f=S.sel.fal||p.items[0].n,dd=S.sel.dfal||'1';
    h+='<h2>Llegó incompleta</h2><div class="note">'+p.obra+' · '+p.id+' · entrega '+sh.k+'. Si falta un producto, la obra no puede avanzar con esa parte.</div>';
    h+='<label>Qué faltó</label><select data-sel="fal">'+p.items.map(function(it){return '<option'+(it.n===f?' selected':'')+'>'+it.n+'</option>'}).join('')+'</select>';
    h+='<label>Días hábiles sin poder avanzar</label><select data-sel="dfal">'+[1,2,3].map(function(n){return '<option'+(String(n)===dd?' selected':'')+'>'+n+'</option>'}).join('')+'</select>';
    h+='<div class="note" style="margin-top:10px">Costo estimado: <b class="cost">'+money(costoDia(p)*(+dd))+'</b> ('+p.personas+' personas afectadas).</div>';
    h+='<div class="btns"><button class="btn ghost" data-act="cerrar">Cancelar</button><button class="btn" data-act="guardarfalt" data-id="'+p.id+'" data-k="'+sh.k+'">Guardar</button></div>';
  }
  return h+'</div></div>';
}

var TITLES={corralon:['Corralón','Pedidos que llegan del jefe de obra'],exp:['Expedición','Despacho y entrega en obra'],gen:['General','Seguimiento y costo de los atrasos']};
function render(){
  var t=TITLES[S.tab],body=S.tab==='corralon'?viewCorralon():S.tab==='exp'?viewExp():viewGeneral();
  var nc=enCorralon().length,ne=enExp().length;
  var h='<div class="band"><span>NEXO · Proveedores</span><span>Corralón Norte · Buenos Aires</span></div>';
  h+='<div class="head"><h1>'+t[0]+'</h1><p>'+t[1]+'</p><span class="demo">Demo · datos de ejemplo</span></div><main>'+body+'</main>';
  h+='<nav>'+[['corralon','Corralón','corralon',nc],['exp','Expedición','exp',ne],['gen','General','gen',0]].map(function(x){
    return '<button class="'+(S.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+ico(x[2])+x[1]+(x[3]?'<span class="badge">'+x[3]+'</span>':'')+'</button>';
  }).join('')+'</nav>';
  if(S.sheet)h+=sheetHTML();
  var y=window.scrollY;
  document.getElementById('app').innerHTML=h;
  window.scrollTo(0,y);
}
function find(id){return S.pedidos.filter(function(p){return p.id===id})[0]}
function ent(p,k){return p.entregas.filter(function(e){return e.k===k})[0]}
function log(p,who,txt){p.log.push([stamp(),who,txt])}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,p=el.dataset.id?find(el.dataset.id):null,k=el.dataset.k?+el.dataset.k:0,en=p&&k?ent(p,k):null;
  if(a==='jornal')return;
  if(a==='cerrar'&&el.classList.contains('shade')&&e.target.closest('.sheet'))return;
  if(a==='tab'){S.tab=el.dataset.t;window.scrollTo(0,0)}
  else if(a==='hist'){S.open[p.id]=!S.open[p.id]}
  else if(a==='how'){S.how[el.dataset.k]=!S.how[el.dataset.k]}
  else if(a==='confirmar'){p.confirmado=true;p.entregas.forEach(function(x){if(x.estado==='pendiente')x.estado='preparando'});log(p,'Corralón','Confirmó el plan de entrega: '+p.entregas.length+(p.entregas.length===1?' entrega':' entregas'))}
  else if(a==='exp'){en.estado='expedicion';log(p,'Corralón','Entrega '+k+' preparada y pasada a expedición')}
  else if(a==='despachar'){var c=S.sel['c'+p.id+k]||'Camión 1 · Raúl';en.camion=c;en.estado='camino';log(p,'Expedición','Entrega '+k+' salió con '+c)}
  else if(a==='completa'){
    var l=late(en);en.estado='entregada';en.entregadaEl=HOY;
    if(l>0)p.incidentes.push({k:k,tipo:'Entrega tarde',imp:'corralon',dias:l,det:'La entrega '+k+' llegó '+l+(l===1?' día hábil':' días hábiles')+' después de lo comprometido'});
    log(p,p.jefe.n+' (jefe de obra)','Recibió la entrega '+k+' completa'+(l>0?' con '+l+' d de demora':' a tiempo')+' · remito con foto');
  }
  else if(a==='incompleta'){S.sheet={type:'falt',p:p,k:k};S.sel.fal=p.items[0].n;S.sel.dfal='1'}
  else if(a==='guardarfalt'){
    var l2=late(en),f=S.sel.fal||p.items[0].n,d2=+S.sel.dfal||1;
    if(l2>0)p.incidentes.push({k:k,tipo:'Entrega tarde',imp:'corralon',dias:l2,det:'La entrega '+k+' llegó '+l2+(l2===1?' día hábil':' días hábiles')+' después de lo comprometido'});
    p.incidentes.push({k:k,tipo:'Entrega incompleta',imp:'corralon',dias:d2,det:'Llegó sin '+f.toLowerCase()+': la obra no pudo avanzar con esa parte'});
    en.estado='entregada';en.entregadaEl=HOY;en.faltante=f;
    log(p,p.jefe.n+' (jefe de obra)','Recibió la entrega '+k+' sin '+f.toLowerCase()+' · +'+d2+' d hábiles sin avanzar');
    S.sheet=null;
  }
  else if(a==='problema'){S.sheet={type:'prob',p:p};S.sel.tp='Falta de stock';S.sel.imp='corralon';S.sel.dias='1'}
  else if(a==='cerrar'){S.sheet=null}
  else if(a==='guardarprob'){
    var d=+S.sel.dias||1,imp=S.sel.imp||'corralon';
    p.incidentes.push({k:0,tipo:S.sel.tp||'Falta de stock',imp:imp,dias:d,det:'Avisado desde el corralón'});
    log(p,'Corralón','Avisó: '+(S.sel.tp||'Falta de stock')+' · imputable a '+IMP[imp]+' · +'+d+' d hábiles');
    S.sheet=null;
  }
  render();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sel){S.sel[t.dataset.sel]=t.value;if(S.sheet&&['tp','imp','dias','fal','dfal'].indexOf(t.dataset.sel)>-1)render()}
  else if(t.dataset&&t.dataset.act==='jornal'){var v=parseInt(t.value,10);if(v>=0)S.jornal=v;render()}
});
render();
})();
</script>
</body>
</html>
