<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo corralón</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Sistema visual de las apps NEXO (contratista / propietario / estudio): fondo #0d0d0f, tarjetas #111214, borde #232227, texto #F2F0EB, dorado #B0894F, títulos en Fraunces.
   Celular: barra inferior y una columna. iPad y PC: riel lateral y tarjetas en varias columnas. */
:root{color-scheme:dark;
  --bg:#0d0d0f; --card:#111214; --card2:#17181b; --line:#232227; --line2:#2e2d33; --ink:#F2F0EB;
  --mut:rgba(242,240,235,.62); --mut2:rgba(242,240,235,.42);
  --gold:#B0894F; --amb:#E0A458; --green:#5fa77f; --red:#E5604F; --blue:#4f93d1;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
}
html,body{margin:0;padding:0;background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.4}
#app{min-height:100vh;background:var(--bg)}
.shell{min-height:100vh;max-width:560px;margin:0 auto}
.content{min-width:0}
.hero{padding:18px 20px 20px;background:radial-gradient(120% 90% at 50% 0%,rgba(176,137,79,.14) 0%,rgba(0,0,0,0) 70%)}
.mono{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:24px;color:var(--gold);flex:0 0 auto}
.eyebrow{margin-top:26px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{margin:6px 0 4px;font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.1;letter-spacing:-.005em}
.hero p{margin:0;color:var(--mut);font-size:13px}
.demo{display:inline-block;margin-top:12px;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--amb);border:1px solid rgba(224,164,88,.4);padding:3px 8px;border-radius:6px}
.demo.ok{color:var(--green);border-color:rgba(95,167,127,.45)}
main{padding:0 20px 120px}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:22px 0 10px}
.sec:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;min-width:0}
.card.alert{border-color:rgba(229,96,79,.55);background:linear-gradient(rgba(229,96,79,.07),rgba(229,96,79,.07)),var(--card)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.obra{font-weight:700;font-size:15.5px}
.id{color:var(--mut2);font-size:11px;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;background:var(--line2)}
.tag.blue{background:var(--blue)} .tag.gold{background:var(--gold)} .tag.green{background:var(--green)} .tag.red{background:var(--red)}
.tag.amber{background:rgba(224,164,88,.16);color:var(--amb)}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
ul.items{margin:4px 0 0;padding:0;list-style:none}
ul.items li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ul.items li:last-child{border-bottom:0}
ul.items .q{font-weight:700;white-space:nowrap}
.mini{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:16px 0 4px}
.ent{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:8px}
.ent.camino,.ent.expedicion{border-left-color:var(--gold)}
.ent.entregada{border-left-color:var(--green)}
.ent.late{border-left-color:var(--red)}
.ent .tt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ent .tt b{font-size:13.5px}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;margin:6px 6px 0 0;color:var(--mut)}
.pill b{font-weight:800;color:var(--ink)}
.steps{display:flex;align-items:center;margin:10px 0 2px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;width:64px;text-align:center}
.step i{width:13px;height:13px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);display:block}
.step.done i{background:var(--green);border-color:var(--green)}
.step.now i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,137,79,.22)}
.step em{font-style:normal;font-size:10px;color:var(--mut2);font-weight:700;line-height:1.1}
.step.now em{color:var(--ink)}
.bar{flex:1;height:2px;background:var(--line2);margin-bottom:16px}
.bar.done{background:var(--green)}
.trace{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.trace b{font-weight:700}
.trace .t{color:var(--mut2)}
.trace div+div{margin-top:5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button,select,input{font:inherit}
.btn{border:0;border-radius:12px;padding:0 14px;min-height:44px;font-weight:700;font-size:13.5px;cursor:pointer;background:var(--gold);color:#fff;flex:1 1 auto}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:rgba(229,96,79,.12);color:var(--red);border:1px solid rgba(229,96,79,.4)}
.btn.small{min-height:38px;font-size:13px;flex:0 0 auto;margin-top:8px}
select,input[type=number]{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);padding:0 12px;color:var(--ink)}
label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);margin:14px 0 6px}
.cost{color:var(--red);font-weight:800}
.big{font-family:var(--serif);font-size:36px;font-weight:600;color:var(--red);letter-spacing:-.01em;margin:6px 0 2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1}
.kpi span{font-size:10px;color:var(--mut2);font-weight:700;letter-spacing:.4px;margin-top:2px;display:block}
.rbar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.rbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.rbar.g i{background:var(--gold)}
.line2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.note{color:var(--mut);font-size:12.5px}
.how{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.link{background:none;border:0;color:var(--gold);font-weight:700;font-size:12.5px;padding:6px 0;cursor:pointer;min-height:32px}
.empty{color:var(--mut2);text-align:center;padding:26px 10px;border:1px dashed var(--line2);border-radius:16px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dots span{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.dots span.entregada{color:var(--green);border-color:rgba(95,167,127,.45)}
.dots span.camino,.dots span.expedicion{color:var(--amb);border-color:rgba(224,164,88,.45)}
.dots span.bad{color:var(--red);border-color:rgba(229,96,79,.5)}
.err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:10px}
.okk{color:var(--green);font-weight:700}
.pln{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pln .full{grid-column:1/-1}
.pln .qrow{display:flex;align-items:center;gap:8px}
.pln .qrow span{flex:1 1 auto;font-size:13px;min-width:0}
.pln .qrow input{width:84px;flex:0 0 84px;min-height:40px}
.pln .qrow em{font-style:normal;color:var(--mut2);font-size:11px;width:44px;flex:0 0 44px}
.grid,.two{display:block}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav .brand{display:none}
nav button{background:none;border:0;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--mut);cursor:pointer;position:relative;min-height:56px}
nav button.on{color:var(--gold);font-weight:800}
nav button.on:before{content:'';position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--gold)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 20px 24px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-family:var(--serif);font-weight:600;font-size:22px}
.foot{color:var(--mut2);font-size:12px;text-align:center;margin:18px 6px 0}

/* iPad y PC */
@media (min-width:768px){
  .shell{max-width:none;margin:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
  nav{position:sticky;top:0;left:auto;bottom:auto;transform:none;width:auto;max-width:none;height:100vh;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:24px 14px;align-self:start}
  nav .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 24px}
  nav .brand b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.15}
  nav .brand small{color:var(--mut2);font-size:11px}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px;border-radius:12px;min-height:46px;border:1px solid transparent}
  nav button.on{background:var(--card2);border-color:var(--line)}
  nav button.on:before{top:11px;bottom:11px;left:-1px;right:auto;width:3px;height:auto;border-radius:3px}
  nav svg{width:20px;height:20px}
  .badge{position:static;margin-left:auto}
  .hero{padding:32px 40px 22px}
  .hero .mono{display:none}
  .eyebrow{margin-top:0}
  .hero h1{font-size:36px}
  .hero p{font-size:14px}
  main{padding:0 40px 64px;max-width:1320px}
  .sec{margin:26px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;align-items:start}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
  .grid>.card,.two>.card{margin-bottom:0}
  .kpis{gap:14px;margin-bottom:16px}
  .kpi{padding:18px 10px}
  .kpi b{font-size:34px}
  .kpi span{font-size:11px}
  .shade{align-items:center;padding:24px}
  .sheet{border-radius:20px;border-bottom:1px solid var(--line);max-width:620px}
  .foot{text-align:left;margin:22px 0 0}
  .pln{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1280px){
  .shell{grid-template-columns:260px minmax(0,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
// true: lee las obras, pedidos y costos de las otras apps (mismo navegador).
// false: modo demo, con datos de ejemplo.
const USAR_APPS=true;
const KEY='vv_corralon';

/* ───────── datos de ejemplo (los mismos que traen las otras apps) ───────── */
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
const HOY=hoyISO();
const SEED={
  obras:[{id:'o1',nombre:'Los Álamos 100'},{id:'o2',nombre:'Av. del Sol 2450'},{id:'o3',nombre:'Lote 14 · Los Cedros'}],
  mat:[{id:'m1',tipo:'material',obra_id:'o1',items:[{nombre:'Hierro del 12',cantidad:'40',unidad:'barras',detalle:''},{nombre:'Cemento',cantidad:'30',unidad:'bolsas',detalle:''}],nota:'Para losa PB+1',solicitante:'Martín Sosa',fecha:HOY}],
  personal:[{id:'p1',nombre:'Martín Sosa',rol:'Capataz',empresa:'Constructora Meridian',obra_id:'o1'}],
  cfg:{empresa:'Constructora Meridian',clienteNombre:'Estudio Vega'},
  gestion:{costoPersona:60000,dotacion:7,fijosVV:45000,ggBelfast:30000,manual:[{id:'r1',tipo:'Retraso',obra_id:'o1',descripcion:'Falta de hormigón para la losa de PB+1',demoraDias:3,personas:7,productividad:70,causa:'Materiales',causas:['Materiales'],imputables:['Proveedor'],fechaSolic:'2026-10-07'}]}
};

/* ───────── lectura de las otras apps ───────── */
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function leer(k){let v=ls(k);if(v==null)v=ls('demo_nube__'+k);if(v==null)return null;try{return JSON.parse(v)}catch(e){return null}}
const CLAVES=['vv_obras','vv_matpedidos','vv_personal','vv_cfg','vv_gestion'];
let D=null,ST={ps:{}},snap='';
function huella(){return CLAVES.map(k=>(ls(k)||'')+'|'+(ls('demo_nube__'+k)||'')).join('~')+'~'+(ls(KEY)||'')}
function cargar(){
  const o=USAR_APPS?leer('vv_obras'):null;
  const real=!!(o&&o.length);
  const g=USAR_APPS?leer('vv_gestion'):null;
  D={
    real:real,
    obras:real?o:SEED.obras,
    mat:real?(leer('vv_matpedidos')||[]):SEED.mat,
    personal:real?(leer('vv_personal')||[]):SEED.personal,
    cfg:real?(leer('vv_cfg')||SEED.cfg):SEED.cfg,
    gestion:real?Object.assign({},SEED.gestion,g||{},{manual:(g&&g.manual)||[]}):SEED.gestion,
    gestionReal:!!(real&&g&&Array.isArray(g.manual))
  };
  if(USAR_APPS){try{const s=JSON.parse(ls(KEY)||'null');if(s&&s.ps)ST=s}catch(e){}}
  snap=huella();
}
function guardar(){if(USAR_APPS)lsSet(KEY,JSON.stringify(ST))}

/* ───────── fechas y dinero ───────── */
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function dnum(s){const a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function iso(t){const d=new Date(t);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2)}
function bizDiff(from,to){let n=0,t=dnum(from);const end=dnum(to);while(t<end){t+=864e5;const w=new Date(t).getUTCDay();if(w!==0&&w!==6)n++}return n}
function esHabil(s){const w=new Date(dnum(s)).getUTCDay();return w!==0&&w!==6}
function proxHabil(s){let t=dnum(s);do{t+=864e5}while(!esHabil(iso(t)));return iso(t)}
function fmt(s){const a=s.split('-');return a[2]+'/'+a[1]}
function fdia(s){return DIAS[new Date(dnum(s)).getUTCDay()]+' '+fmt(s)}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' $'}
function stamp(){const d=new Date();return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function opcionesFecha(sel){
  let h='',t=dnum(HOY),n=0;
  while(n<16){const s=iso(t);if(esHabil(s)){h+='<option value="'+s+'"'+(s===sel?' selected':'')+'>'+fdia(s)+(s===HOY?' (hoy)':'')+'</option>';n++}t+=864e5}
  return h;
}

/* ───────── costo del atraso: la misma cuenta que Gestión de obra ───────── */
function nombres(){return{emp:String(D.cfg.empresa||'Constructora').replace(/^Constructora\s+/i,''),cli:D.cfg.clienteNombre||'Cliente'}}
function costo(d,P,prod){const g=D.gestion;const a=P*(g.costoPersona||0)*d*(1-(prod||0)/100)+(g.fijosVV||0)*d;const b=(g.ggBelfast||0)*d;return{a:a,b:b,t:a+b}}
function dotacion(){return D.gestion.dotacion||5}

/* ───────── pedidos ───────── */
function obraDe(id){return D.obras.find(o=>o.id===id)}
function rolDe(n){const p=D.personal.find(x=>x.nombre===n);return p&&p.rol?p.rol:''}
function pedidos(){
  return D.mat.filter(m=>(!m.tipo||m.tipo==='material')&&m.items&&m.items.length).map(m=>{
    const id='M-'+m.id,ob=obraDe(m.obra_id);
    const items=m.items.map(it=>{const t=parseFloat(String(it.cantidad).replace(',','.'));return{n:it.nombre,u:it.unidad||'',t:isFinite(t)&&t>0?t:1}});
    const st=ST.ps[id]||null;
    return{id:id,obra:ob?ob.nombre:'Obra',obraId:m.obra_id,nota:m.nota||'',jefe:m.solicitante||'Jefe de obra',rol:rolDe(m.solicitante),fecha:m.fecha||'',items:items,st:st,plan:st?st.plan:[],ts:m.ts||0};
  }).sort((a,b)=>b.ts-a.ts);
}
function late(e){return e.estado==='entregada'?0:Math.max(0,bizDiff(e.fecha,HOY))}
const EST={pendiente:'Por confirmar',preparando:'En preparación',expedicion:'En expedición',camino:'En camino',entregada:'Entregada'};
const ECLS={pendiente:'amber',preparando:'blue',expedicion:'gold',camino:'gold',entregada:'green'};
const EIDX={pendiente:0,preparando:0,expedicion:1,camino:2,entregada:3};
const ESTEP=['Preparación','Expedición','En camino','Entregada'];
const IMPL={corralon:'Proveedor',jefe:'Constructora'};
const IMPLONG={corralon:'Corralón (stock, preparación o despacho)',jefe:'Jefe de obra (cómo se armó el pedido)'};

function aGestion(p,inc){
  if(!D.gestionReal)return null;
  try{
    const g=leer('vv_gestion');if(!g||!Array.isArray(g.manual))return null;
    const id='cor_'+Date.now();
    g.manual.push({id:id,tipo:'Retraso',obra_id:p.obraId,etapa:'',descripcion:inc.tipo+' · '+p.id+(inc.k?' · entrega '+inc.k:'')+': '+inc.det,demoraDias:inc.dias,personas:inc.P,productividad:inc.prod,debiaDias:0,demoroDias:inc.dias,fechaSolic:HOY,plazo:0,fechaReal:'',causas:['Materiales'],causa:'Materiales',causaDetalle:'',categoriaDesvio:'Provisión',imputables:[IMPL[inc.imp]],afectadas:[],afectadasDetalle:'',diasClima:0,nota:'',fotosInicio:[],videos:[],fotosFin:[],portada:false,ts:Date.now(),origen:'corralon',pedidoId:p.id,entrega:inc.k||0});
    const s=JSON.stringify(g),t=String(Date.now());
    lsSet('vv_gestion',s);lsSet('demo_nube__vv_gestion',s);lsSet('vv_gestion__ts',t);lsSet('demo_nube__vv_gestion__ts',t);
    return id;
  }catch(e){return null}
}
function nuevoInc(p,inc){inc.gid=aGestion(p,inc);p.st.inc.push(inc);guardar()}
function log(p,who,txt){p.st.log.push([stamp(),who,txt]);guardar()}

/* ───────── casos de atraso (Gestión + los de esta app) ───────── */
function casos(){
  const out=[],g=D.gestion;
  (g.manual||[]).forEach(r=>{
    if(!((r.causas||[]).indexOf('Materiales')>-1||r.causa==='Materiales'))return;
    const ob=obraDe(r.obra_id),d=+r.demoraDias||0,P=+r.personas||0,pr=+r.productividad||0;
    out.push({src:'Gestión de obra',titulo:r.descripcion||'Retraso por materiales',obra:ob?ob.nombre:'',imp:(r.imputables&&r.imputables[0])||'Sin asignar',dias:d,P:P,prod:pr,c:costo(d,P,pr),run:false,pid:r.pedidoId||null});
  });
  pedidos().forEach(p=>{
    if(!p.st)return;
    p.st.inc.forEach(i=>{if(i.gid&&D.gestionReal)return;out.push({src:'Esta app',titulo:i.tipo+' · '+p.id+(i.k?' · entrega '+i.k:''),obra:p.obra,imp:IMPL[i.imp],dias:i.dias,P:i.P,prod:i.prod,c:costo(i.dias,i.P,i.prod),run:false,pid:p.id,det:i.det})});

  });
  return out;
}

function partir(t,n){
  const q=[];
  if(Number.isInteger(t)){const b=Math.floor(t/n),r=t-b*n;for(let i=0;i<n;i++)q.push(b+(i<r?1:0))}
  else{let s=0;for(let i=0;i<n-1;i++){const v=Math.round(t/n*10)/10;q.push(v);s+=v}q.push(Math.round((t-s)*100)/100)}
  return q;
}
function iniciarPlan(p,n){
  const cols=p.items.map(it=>partir(it.t,n));
  const q=[];for(let e=0;e<n;e++)q.push(p.items.map((it,i)=>cols[i][e]));
  const f=[];let d=esHabil(HOY)?HOY:proxHabil(HOY);if(d===HOY)d=proxHabil(HOY);
  for(let e=0;e<n;e++){f.push(d);d=proxHabil(d)}
  S.sheet={type:'plan',id:p.id,n:n,q:q,f:f,err:''};
}

}

/* ───────── dibujo ───────── */
const TITLES={corralon:['Pedidos de la obra','Cada pedido llega con su plan de entrega'],exp:['Expedición','Despacho y entrega en obra'],gen:['General','Seguimiento y costo de los atrasos']};
function render(){
  const t=TITLES[S.tab],nm=nombres(),body=S.tab==='corralon'?viewCorralon():S.tab==='exp'?viewExp():viewGeneral();
  const nc=sinPlan().length+enCorralon().length,ne=enExp().length;
  const sub=t[1]+' · '+(D.cfg.empresa||'Constructora');
  let h='<div class="shell"><nav><div class="brand"><div class="mono">C</div><div><b>Corralón Norte</b><small>NEXO · Proveedores</small></div></div>';
  h+=[['corralon','Corralón','corralon',nc],['exp','Expedición','exp',ne],['gen','General','gen',0]].map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+ico(x[2])+'<span>'+x[1]+'</span>'+(x[3]?'<span class="badge">'+x[3]+'</span>':'')+'</button>').join('')+'</nav>';
  h+='<div class="content"><div class="hero"><div class="mono">C</div><div class="eyebrow">Corralón Norte</div><h1>'+t[0]+'</h1><p>'+sub+'</p>'+(D.real?'<span class="demo ok">Datos de las apps</span>':'<span class="demo">Demo · datos de ejemplo</span>')+'</div><main>'+body+'</main></div></div>';
  if(S.sheet)h+=sheetHTML();
  const y=window.scrollY;
  document.getElementById('app').innerHTML=h;
  window.scrollTo(0,y);
}
function find(id){return pedidos().find(p=>p.id===id)}

document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act,p=el.dataset.id?find(el.dataset.id):null,k=el.dataset.k?+el.dataset.k:0,en=p&&k?p.plan.find(x=>x.k===k):null;
  if(a==='cerrar'&&el.classList.contains('shade')&&ev.target.closest('.sheet'))return;
  if(a==='tab'){S.tab=el.dataset.t;window.scrollTo(0,0)}
  else if(a==='hist'){S.open[el.dataset.id]=!S.open[el.dataset.id]}
  else if(a==='how'){S.how[el.dataset.k]=!S.how[el.dataset.k]}
  else if(a==='plan'){iniciarPlan(p,2)}
  else if(a==='repartir'){iniciarPlan(p,S.sheet.n);}
  else if(a==='guardarplan'){
    const sh=S.sheet,sm=sumas(p,sh);
    const mal=p.items.filter((it,i)=>Math.abs(sm[i]-it.t)>=0.001);
    if(mal.length){sh.err='El reparto no coincide con el pedido: revisá '+mal.map(i=>i.n).join(', ')+'.'}
    else{
      const plan=sh.q.map((r,e)=>({k:e+1,fecha:sh.f[e],q:r.map(Number),estado:'pendiente'}));
      ST.ps[p.id]={plan:plan,confirmado:false,log:[],inc:[]};
      const np=find(p.id);
      log(np,p.jefe+(p.rol?' ('+p.rol+')':' (jefe de obra)'),'Pasó el pedido al corralón con entrega en '+plan.length+(plan.length===1?' parte':' partes')+': '+plan.map(e=>'E'+e.k+' '+fmt(e.fecha)).join(', '));
      S.sheet=null;S.open[p.id]=false;
    }
  }
  else if(a==='confirmar'){p.plan.forEach(x=>{if(x.estado==='pendiente')x.estado='preparando'});p.st.confirmado=true;log(p,'Corralón','Confirmó el plan de entrega: '+p.plan.length+(p.plan.length===1?' entrega':' entregas'))}
  else if(a==='exp'){en.estado='expedicion';log(p,'Corralón','Entrega '+k+' preparada y pasada a expedición')}
  else if(a==='despachar'){const c=S.sel['c'+p.id+k]||'Camión 1 · Raúl';en.camion=c;en.estado='camino';log(p,'Expedición','Entrega '+k+' salió con '+c)}
  else if(a==='completa'){
    const l=late(en);en.estado='entregada';en.entregadaEl=HOY;
    if(l>0)nuevoInc(p,{k:k,tipo:'Entrega tarde',imp:'corralon',dias:l,P:dotacion(),prod:0,det:'La entrega '+k+' llegó '+l+(l===1?' día hábil':' días hábiles')+' después de lo comprometido'});
    log(p,p.jefe+' ('+(p.rol||'jefe de obra')+')','Recibió la entrega '+k+' completa'+(l>0?' con '+l+' d de demora':' a tiempo')+' · remito con foto');
  }
  else if(a==='incompleta'){S.sheet={type:'falt',id:p.id,k:k};S.sel.fal=p.items[0].n;S.sel.dfal='1';delete S.sel.P;delete S.sel.prod}
  else if(a==='guardarfalt'){
    const l=late(en),f=S.sel.fal||p.items[0].n,d=+S.sel.dfal||1,P=S.sel.P!=null?+S.sel.P:dotacion(),pr=S.sel.prod!=null?+S.sel.prod:0;
    if(l>0)nuevoInc(p,{k:k,tipo:'Entrega tarde',imp:'corralon',dias:l,P:dotacion(),prod:0,det:'La entrega '+k+' llegó '+l+(l===1?' día hábil':' días hábiles')+' después de lo comprometido'});
    nuevoInc(p,{k:k,tipo:'Entrega incompleta',imp:'corralon',dias:d,P:P,prod:pr,det:'Llegó sin '+f.toLowerCase()+': la obra no pudo avanzar con esa parte'});
    en.estado='entregada';en.entregadaEl=HOY;en.faltante=f;
    log(p,p.jefe+' ('+(p.rol||'jefe de obra')+')','Recibió la entrega '+k+' sin '+f.toLowerCase()+' · +'+d+' d hábiles sin avanzar');
    S.sheet=null;
  }
  else if(a==='problema'){S.sheet={type:'prob',id:p.id};S.sel.tp='Falta de stock';S.sel.imp='corralon';S.sel.dias='1';delete S.sel.P;delete S.sel.prod}
  else if(a==='guardarprob'){
    const d=+S.sel.dias||1,imp=S.sel.imp||'corralon',P=S.sel.P!=null?+S.sel.P:dotacion(),pr=S.sel.prod!=null?+S.sel.prod:0,tp=S.sel.tp||'Falta de stock';
    nuevoInc(p,{k:0,tipo:tp,imp:imp,dias:d,P:P,prod:pr,det:'Avisado desde el corralón'});
    log(p,'Corralón','Avisó: '+tp+' · imputable a '+IMPL[imp]+' · +'+d+' d hábiles');
    S.sheet=null;
  }
  else if(a==='cerrar'){S.sheet=null}
  guardar();
  render();
});
document.addEventListener('change',function(ev){
  const t=ev.target;if(!t.dataset)return;
  if(t.dataset.sel){
    S.sel[t.dataset.sel]=t.value;
    if(t.dataset.sel==='pn'){const p=find(S.sheet.id);iniciarPlan(p,+t.value);render()}
    else if(S.sheet)render();
  }else if(t.dataset.q){const a=t.dataset.q.split(':');S.sheet.q[+a[0]][+a[1]]=parseFloat(t.value)||0;S.sheet.err='';render()}
  else if(t.dataset.fd!=null&&t.dataset.fd!==''){S.sheet.f[+t.dataset.fd]=t.value}
});

/* ───────── se actualiza sola cuando cambian las otras apps ───────── */
function refrescar(){
  if(huella()===snap)return;
  if(S.sheet)return;
  cargar();render();
}
window.addEventListener('storage',refrescar);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refrescar()});
window.addEventListener('focus',refrescar);
setInterval(refrescar,4000);

cargar();
render();
// Si las otras apps todavía no cargaron sus datos en este navegador, las abre en segundo plano para traerlos.
if(USAR_APPS&&!D.real){
  let n=0;
  ['demo-principal.html','demo-contratista.html'].forEach(function(u){
    const f=document.createElement('iframe');
    f.src=u;f.style.cssText='position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none';f.setAttribute('aria-hidden','true');
    document.body.appendChild(f);
  });
  const t=setInterval(function(){n++;cargar();if(D.real&&D.mat.length||n>20){clearInterval(t);cargar();render();document.querySelectorAll('iframe').forEach(function(f){f.remove()})}else if(D.real){render()}},1000);
}
})();
</script>
