  <div class="ib"><button class="ibtn vid" onclick="ir('buscar')" aria-label="Buscar" id="b-buscar"></button><button class="ibtn vid" onclick="tema()" aria-label="Claro u oscuro" id="b-tema"></button></div>

<script>
let OBRA={};
const API_F='/api/manual-fotos';
window.addEventListener('DOMContentLoaded',()=>fetch(API_F+'?accion=lista',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.fotos){OBRA=d.fotos;pintar()}}).catch(()=>{}));
function bloqueObra(k,s){const ob=OBRA[k]||[];const re=(s.reales||[]).map(u=>({u,fija:1}));const todas=ob.concat(re);
 return `<div class="bloque vid obra">${todas.length?`<h3>${svg('mat')} Fotos de obra Belfast <span class="prog">${todas.length}</span></h3>`:''}
 ${todas.length?`<div class="tira">${todas.map(f=>`<div class="tf"><img src="${f.u}" loading="lazy" onclick="verFoto('${f.u}')" alt="">${f.fija?'':`<button class="tx" title="Quitar" onclick="borrarFoto('${k}','${f.path}')">×</button>`}${f.nota?`<small>${esc(f.nota)}</small>`:''}</div>`).join('')}</div>`:''}
 <label class="chip vid subir"><input type="file" accept="image/*" multiple hidden onchange="subirFotos('${k}',this)">＋ Cargar foto de obra</label>
 <span class="estado" id="est-f"></span></div>`}
function achicar(file){return new Promise((ok,mal)=>{const img=new Image();img.onload=()=>{const m=1600,e=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*e);c.height=Math.round(img.height*e);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);ok(c.toDataURL('image/jpeg',.82))};img.onerror=()=>mal(new Error('No se pudo leer la foto'));img.src=URL.createObjectURL(file)})}
async function subirFotos(k,inp){const fs=[...inp.files];if(!fs.length)return;const est=document.getElementById('est-f');
 const nota=prompt('Obra o comentario (opcional):','')||'';
 for(let i=0;i<fs.length;i++){est.textContent='Subiendo '+(i+1)+' de '+fs.length+'…';
  try{const img=await achicar(fs[i]);const r=await fetch(API_F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'subir',k,img,nota})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');OBRA[k]=d.fotos}
  catch(e){est.textContent='No se pudo subir: '+e.message;return}}
 const y=window.scrollY;pintar();window.scrollTo(0,y);const e2=document.getElementById('est-f');if(e2)e2.textContent='Listo, foto cargada.'}
async function borrarFoto(k,path){if(!confirm('¿Quitar esta foto del manual?'))return;
 try{const r=await fetch(API_F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'borrar',k,path})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');if(d.fotos.length)OBRA[k]=d.fotos;else delete OBRA[k];const y=window.scrollY;pintar();window.scrollTo(0,y)}catch(e){alert('No se pudo quitar: '+e.message)}}
</script>

function buscar(q){const t=norm(q).split(/\s+/).filter(w=>w.length>1);if(!t.length)return[];const r=[];
 M.forEach(c=>c.s.forEach(s=>{const campos=[[s.t,8],[s.tags,6],[c.t,3],[s.que,2],[(s.mat||[]).join(' '),1],[(s.pasos||[]).join(' '),1],[(s.ctrl||[]).join(' '),1],[(s.err||[]).join(' '),1]];
  let sc=0,ok=true;for(const w of t){let hit=0;for(const [txt,p] of campos){if(norm(txt).includes(w))hit+=p}if(!hit){ok=false;break}sc+=hit}
  if(ok){const todos=[s.que].concat(s.pasos||[],s.ctrl||[],s.err||[],s.mat||[]);let frag=todos.find(x=>t.some(w=>norm(x).includes(w)))||s.que;r.push({c,s,sc,frag})}}));
 return r.sort((a,b)=>b.sc-a.sc)}
function resaltar(txt,q){let h=esc(txt);const t=norm(q).split(/\s+/).filter(w=>w.length>2);const n=norm(h);
 if(!t.length)return h;let out='',i=0;const marcas=[];t.forEach(w=>{let p=0;while((p=n.indexOf(w,p))>-1){marcas.push([p,p+w.length]);p+=w.length}});marcas.sort((a,b)=>a[0]-b[0]);
 for(const [a,b] of marcas){if(a<i)continue;out+=h.slice(i,a)+'<mark>'+h.slice(a,b)+'</mark>';i=b}return out+h.slice(i)}
